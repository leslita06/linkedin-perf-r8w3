s du BTP.\n\n🦅Plus intuitive. \n⏩️Plus fluide. \n👷‍♂️Plus proche du terrain.\n\n🦾Des outils IA développés en Côte d’Ivoire, au service de celles et ceux qui bâtissent chaque jour.\n\nLa construction entre dans une nouvelle ère.\n\n👉 Rejoignez le mouvement et découvrez notre site.\n#BTP #Construction #CotedIvoire #Innovation #TechAfrica \n\nhttps://blok.africa/","pid":"7421880921189945344","chars":461,"hashtags":5,"mentions":1,"link":true,"question":false,"lang":"FR","theme":"Non classé"},{"date":"2026-01-30","month":"2026-01","weekday":"Vendredi","hour":11,"reactions":34,"comments":0,"reposts":0,"eng":34,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_btp-cotedivoire-infrastructure-activity-7422969332781088768-YlTb?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"La Côte d’Ivoire accélère. Les grands chantiers se multiplient.🏗 Chez BLOK, nous facilitons l’accès à des matériaux conformes et un approvisionnement fiable pour celles et ceux qui","text":"La Côte d’Ivoire accélère. Les grands chantiers se multiplient.🏗\n\nChez BLOK, nous facilitons l’accès à des matériaux conformes et un approvisionnement fiable pour celles et ceux qui construisent le pays, chaque jour.\n\nhttps://blok.africa/\n\nConstruire mieux. Construire durable.\n#BTP #CotedIvoire #Infrastructure #Construction #RSE #Ville #Durable","pid":"7422969332781088768","chars":346,"hashtags":7,"mentions":1,"link":true,"question":false,"lang":"FR","theme":"Clients & terrain"},{"date":"2026-03-08","month":"2026-03","weekday":"Dimanche","hour":16,"reactions":19,"comments":0,"reposts":0,"eng":19,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_aujourdhui-nous-c%C3%A9l%C3%A9brons-lajourn%C3%A9e-internationale-activity-7436442092022718464-yd_z?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Aujourd’hui, nous célébrons la Journée Internationale des Droits des Femmes. Dans le secteur du bâtiment et de la construction en Afrique, les femmes sont de plus en plus nombreuse","text":"Aujourd’hui, nous célébrons la Journée Internationale des Droits des Femmes.\n\nDans le secteur du bâtiment et de la construction en Afrique, les femmes sont de plus en plus nombreuses à prendre leur place : sur les chantiers, dans les bureaux d’études, dans les quincailleries, dans la gestion de projets ou l’entrepreneuriat.\n\nChez BLOK, nous croyons profondément que le développement du secteur de la construction en Afrique passera aussi par l’inclusion, la compétence et le leadership des femmes.\n\nChaque jour, des femmes contribuent à bâtir les villes de demain.\nÀ toutes celles qui construisent, dirigent, innovent et inspirent :\nmerci et bravo. Zahatia Fatoumata Ouattara Helena Fatime Abdourhamane Laura G. DUMONT Charlène Bérénice YAPI\n\nBonne Journée Internationale des Droits des Femmes.\n\n🌍 www.blok.africa\n📩 info@blok.africa","pid":"7436442092022718464","chars":834,"hashtags":0,"mentions":5,"link":false,"question":false,"lang":"FR","theme":"Clients & terrain"},{"date":"2026-03-20","month":"2026-03","weekday":"Vendredi","hour":15,"reactions":24,"comments":0,"reposts":0,"eng":24,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_eidmubarak-blok-btp-activity-7440777318287101952-To0d?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🌙 Eid Mubarak de la part de BLOK Nous vous souhaitons paix, santé et prospérité à l’occasion de la fin du Ramadan.🙏🏽 Continuons à bâtir un écosystème du BTP plus structuré, transpa","text":"🌙 Eid Mubarak de la part de BLOK \n\nNous vous souhaitons paix, santé et prospérité à l’occasion de la fin du Ramadan.🙏🏽\n\nContinuons à bâtir un écosystème du BTP plus structuré, transparent et performant en Afrique.\n\n#EidMubarak #BLOK #BTP #Africa","pid":"7440777318287101952","chars":245,"hashtags":4,"mentions":1,"link":false,"question":false,"lang":"FR","theme":"Non classé"},{"date":"2026-05-08","month":"2026-05","weekday":"Vendredi","hour":11,"reactions":75,"comments":3,"reposts":3,"eng":81,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_we-are-proud-to-be-among-the-15-startups-activity-7458478337754136578-9h54?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"We are proud to be among the 15 startups across Africa selected by @Novagarage Africa 🌍 A strong signal for our team BLOK and our partner Mstudio! Kudos to our Co-founder and COO W","text":"We are proud to be among the 15 startups across Africa selected by @Novagarage Africa 🌍 \n\nA strong signal for our team BLOK and our partner Mstudio!\n\nKudos to our Co-founder and COO Waly K. N'Diaye 🤩 \n\nAnd a reminder that bold ideas from Africa deserve a global stage.\n\nNext stop: Nairobi for @AfricaForward 🇰🇪 \n\nExcited to connect with builders, investors, and leaders shaping the future of the continent 🔥 \n\nIf you are in Nairobi on May 11 & 12, let's connect 🙏","pid":"7458478337754136578","chars":463,"hashtags":0,"mentions":2,"link":false,"question":false,"lang":"EN","theme":"Recrutement"},{"date":"2026-06-16","month":"2026-06","weekday":"Mardi","hour":12,"reactions":22,"comments":0,"reposts":1,"eng":23,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_bloktechnology-btp-construction-activity-7472630327488741377-nG7N?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Un fournisseur peut faire gagner... ou perdre plusieurs semaines à un chantier.⏱️ Les écarts de prix sont visibles. Les retards, les ruptures de stock ou les produits non conformes","text":"Un fournisseur peut faire gagner... ou perdre plusieurs semaines à un chantier.⏱️\n\nLes écarts de prix sont visibles. Les retards, les ruptures de stock ou les produits non conformes le sont souvent beaucoup plus tard.\n\nDans le BTP, le choix d'un fournisseur ne se résume donc pas à comparer des tarifs. C'est une décision qui peut avoir un impact direct sur les délais, les coûts et la réussite d'un projet.\n\nParmi les critères à prendre en compte :\n\n✔️ La transparence des prix et des conditions commerciales\n✔️ La conformité aux normes et certifications en vigueur\n✔️ La capacité à proposer plusieurs offres adaptées aux besoins du projet\n✔️ La disponibilité des produits et la maîtrise des délais de livraison\n✔️ La solidité financière du fournisseur pour garantir sa pérennité\n✔️ Sa capacité à gérer une montée en charge sur des projets d'envergure\n✔️ Les références et retours d'expérience sur des projets similaires\n\nCes bonnes pratiques permettent de limiter les risques et d'avancer avec davantage de sérénité, quelle que soit la taille du chantier.\n\nChez BLOK TECHNOLOGY, nous sélectionnons nos partenaires selon ces critères afin d'accompagner les professionnels avec des fournisseurs fiables et qualifiés.\n\n🌍 Découvrez notre catalogue : http://www.blok.africa\n\n💬 Et vous, quel est selon vous le critère le plus important dans le choix d'un fournisseur chantier ?\n\n#bloktechnology #btp #construction #chantier #materiauxdeconstruction #fournisseurs #cotedivoire #abidjan","pid":"7472630327488741377","chars":1480,"hashtags":8,"mentions":1,"link":true,"question":true,"lang":"FR","theme":"Clients & terrain"},{"date":"2026-06-17","month":"2026-06","weekday":"Mercredi","hour":8,"reactions":43,"comments":3,"reposts":0,"eng":46,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_portraitcollaborateur-bloktechnology-teamblok-activity-7472921070140989441-JIA7?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Portrait Collaborateur | À la rencontre de notre équipe Aujourd'hui, nous découvrons Zahatia Fatoumata Ouattara Customer Success Manager chez BLOK Technology. 📅 Je suis chez BLOK d","text":"Portrait Collaborateur | À la rencontre de notre équipe\n\nAujourd'hui, nous découvrons Zahatia Fatoumata Ouattara Customer Success Manager chez BLOK Technology.\n\n📅 Je suis chez BLOK depuis...\n 1 an et 8 mois.\n\n🎯 En quelques mots, quel est ton rôle chez BLOK Technology ?\n\n En tant que Customer Success Manager, j'accompagne nos clients dans leur expérience avec la plateforme afin qu'ils tirent pleinement profit des produits et services proposés par BLOK TECHNOLOGY.\n\n🚀 Quelle est la mission ou le projet qui t'a le plus marqué depuis ton arrivée ? \n\nDepuis mon arrivée, j'ai eu l'opportunité d'intervenir sur de nombreux sujets : relation client, comptabilité, suivi logistique... L'un des moments qui m'a le plus marquée a été de recevoir les félicitations de mes responsables à l'issue d'un audit interne pour la qualité et la rigueur du travail réalisé sur le suivi des comptes clients et fournisseurs.\n\n😄 Si tes collègues devaient te décrire en 3 mots, lesquels choisiraient-ils ?\n Travailleuse, disponible et maternelle.\n\n🧡 Quel mot représente le mieux BLOK TECHNOLOGY selon toi ?\n\nInnovation. Parce que BLOK TECHNOLOGY repense les méthodes d'approvisionnement dans le secteur de la construction grâce à des solutions digitales adaptées aux réalités du marché.\n\n#portraitcollaborateur #bloktechnology #teamblok #customersuccess #btp #construction #innovation #afrique","pid":"7472921070140989441","chars":1373,"hashtags":8,"mentions":4,"link":false,"question":true,"lang":"FR","theme":"Équipe & coulisses"},{"date":"2026-06-18","month":"2026-06","weekday":"Jeudi","hour":8,"reactions":17,"comments":0,"reposts":2,"eng":19,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_btp-construction-approvisionnement-activity-7473283430022193152-ziGQ?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🏗️ Un chantier peut mobiliser des centaines de références, mais une seule rupture d'approvisionnement peut suffire à ralentir tout un projet. ⏳ Retards de livraison, indisponibilit","text":"🏗️ Un chantier peut mobiliser des centaines de références, mais une seule rupture d'approvisionnement peut suffire à ralentir tout un projet.\n\n⏳ Retards de livraison, indisponibilité de certains produits, multiplication des fournisseurs à coordonner : les équipes travaux, techniques et achats doivent quotidiennement composer avec ces contraintes.\n\n📦 Plus un projet mobilise de corps de métier, plus la coordination des achats et des approvisionnements devient stratégique pour respecter les délais, maîtriser les coûts et garantir la qualité d'exécution.\n\n🚀 Dans ce contexte, disposer d'un accès rapide à des fournisseurs fiables et à des catégories de produits adaptées devient un véritable levier de performance.\n\nC'est pour répondre à ces réalités terrain que BLOK TECHNOLOGY référence aujourd'hui 12 grandes catégories essentielles aux professionnels de la construction :\n\n🌍 https://www.blok.africa\n\n🤝 Nous souhaitons faciliter l'accès à des fournisseurs fiables afin d'aider les acteurs du secteur à gagner du temps, sécuriser leurs approvisionnements et avancer plus sereinement sur leurs projets.\n\n💬 Selon vous, quelle catégorie génère aujourd'hui le plus de défis en matière d'approvisionnement sur vos projets ?\n\n#btp #construction #approvisionnement #achats #gestiondechantier #travauxpublics #cotedivoire #bloktechnology","pid":"7473283430022193152","chars":1333,"hashtags":8,"mentions":1,"link":true,"question":true,"lang":"FR","theme":"Clients & terrain"},{"date":"2026-06-19","month":"2026-06","weekday":"Vendredi","hour":8,"reactions":21,"comments":0,"reposts":0,"eng":21,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_bloktechnology-builtexpo-btp-activity-7473645753031282688-tmkT?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Être au plus près du terrain, c'est aussi être au rendez-vous des grands événements du secteur. 🤝 Les équipes commerciales de BLOK TECHNOLOGY étaient présentes au salon Build Expo,","text":"Être au plus près du terrain, c'est aussi être au rendez-vous des grands événements du secteur.\n\n🤝 Les équipes commerciales de BLOK TECHNOLOGY étaient présentes au salon Build Expo, qui s'est tenu à Abidjan du 9 au 11 juin 2026.\n\n📍 Au programme :\n\n✔️ Découverte des dernières innovations du secteur\n🤝 Rencontres avec les acteurs de la construction et de l'industrie\n💬 Échanges avec nos partenaires et clients\n📈 Veille sur les tendances qui façonnent le marché de demain\n\n🚀 Ces moments sont précieux pour mieux comprendre les enjeux des professionnels et continuer à développer des solutions adaptées aux réalités du terrain.\n\n👏 Cheick Mouhamad Traore & Antoine FAURE-GOMIS\n\n💬 Quel est le prochain salon professionnel ou événement du secteur auquel vous participerez ?\n\n#bloktechnology #builtexpo #btp #salon #construction #cotedivoire #infrastructure","pid":"7473645753031282688","chars":850,"hashtags":7,"mentions":4,"link":false,"question":true,"lang":"FR","theme":"Événements"},{"date":"2026-06-23","month":"2026-06","weekday":"Mardi","hour":8,"reactions":18,"comments":0,"reposts":0,"eng":18,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_btp-construction-marketplace-activity-7475095333035769856-9RBg?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🏗️ Le plus difficile dans une marketplace BTP n'est pas la technologie. 🤝 C'est la confiance. - Identifier les bons fournisseurs. - Vérifier la qualité des informations. - Comprend","text":"🏗️ Le plus difficile dans une marketplace BTP n'est pas la technologie.\n\n🤝 C'est la confiance.\n\n- Identifier les bons fournisseurs.\n- Vérifier la qualité des informations.\n- Comprendre les réalités du terrain.\n- Suivre l'évolution des besoins des professionnels.\n- Et créer des connexions pertinentes entre les acteurs du secteur.\n\nCar dans la construction, chaque projet est unique.\n\n📦 Les contraintes d'approvisionnement, les délais, les spécificités techniques ou encore les exigences de qualité varient d'un chantier à l'autre.\n\n💻 Une plateforme peut faciliter la recherche.\n\nMais seule une bonne compréhension du marché permet d'apporter une réelle valeur aux professionnels.\n\nC'est ce que nous découvrons chaque jour en construisant BLOK TECHNOLOGY.\n\nAu-delà de la technologie, nous travaillons à mieux comprendre les enjeux des entreprises de construction afin de leur faire gagner du temps dans la recherche de fournisseurs et de solutions adaptées à leurs projets.\n\n🎯 Une ambition simple : Faciliter l'accès aux bons partenaires pour permettre aux professionnels de se concentrer sur ce qu'ils font le mieux : construire.\n\nhttps://www.blok.africa\n\n💬 Selon vous, quel est aujourd'hui le principal défi dans la recherche de fournisseurs ou de produits pour vos projets ?\n\n#btp #construction #marketplace #digitalisation #innovation #approvisionnement #cotedivoire #bloktechnology","pid":"7475095333035769856","chars":1386,"hashtags":8,"mentions":1,"link":true,"question":true,"lang":"FR","theme":"Clients & terrain"},{"date":"2026-06-24","month":"2026-06","weekday":"Mercredi","hour":12,"reactions":38,"comments":1,"reposts":0,"eng":39,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_vivatech-vivatech2026-innovation-activity-7475518149250068480-qIEd?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚀 Trust the Future. C'est probablement ce que nous retiendrons de cette semaine à VivaTech 2026.Pendant quelques jours, Paris est devenu le point de rencontre de celles et ceux qui","text":"🚀 Trust the Future.\n\nC'est probablement ce que nous retiendrons de cette semaine à VivaTech 2026.Pendant quelques jours, Paris est devenu le point de rencontre de celles et ceux qui imaginent, construisent et déploient les innovations de demain. \n\nIntelligence artificielle, nouvelles technologies, entrepreneuriat, transformation des industries : les échanges ont confirmé une chose.\n\n🌍 L'innovation n'a pas de frontière.\n\nChez BLOK TECHNOLOGY, nous sommes convaincus que la technologie peut contribuer à résoudre des problématiques très concrètes, notamment dans le secteur de la construction.\n\nC'est cette vision que nous avons eu la fierté de porter à VivaTech aux côtés des startups du pavillon Côte d'Ivoire.\n\n🇨🇮 Représenter l'écosystème ivoirien sur une scène internationale comme VivaTech est une formidable opportunité de mettre en lumière le dynamisme de la tech africaine et les solutions qui émergent sur le continent.\n\n🙏 Merci à Orange Cote d'Ivoire pour leur confiance et leur accompagnement.\n\nCette semaine nous a confortés dans une conviction :\n\nL'Afrique n'est pas seulement le marché de demain.\n\nElle participe déjà à construire les solutions d'aujourd'hui.\n\n🚀 Le meilleur reste à venir.\n\n#vivatech #vivatech2026 #innovation #tech #intelligenceartificielle #startup #afrique #cotedivoire #orangefab #bloktechnology","pid":"7475518149250068480","chars":1332,"hashtags":10,"mentions":5,"link":false,"question":false,"lang":"FR","theme":"Non classé"},{"date":"2026-06-26","month":"2026-06","weekday":"Vendredi","hour":8,"reactions":21,"comments":0,"reposts":1,"eng":22,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_bloktechnology-orangefab-innovation-activity-7476190132988207106-xfnX?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚀 Retour sur la Journée Orange Fab International de la semaine dernière. Un moment riche en échanges aux côtés des startups lauréates du programme Orange Fab International et des a","text":"🚀 Retour sur la Journée Orange Fab International de la semaine dernière.\n\nUn moment riche en échanges aux côtés des startups lauréates du programme Orange Fab International et des acteurs qui contribuent chaque jour à faire avancer l'innovation en Afrique.\n\n🇨🇮 La Côte d'Ivoire était représentée par plusieurs startups lauréates engagées dans la transformation de leur secteur, notamment Graya, Umed eHealth Center, Afrisends, Jèko et BLOK TECHNOLOGY.\nCes rencontres sont toujours l'occasion de partager des expériences, confronter des idées et s'inspirer des initiatives qui façonnent l'économie de demain.\n\nChez BLOK TECHNOLOGY, nous continuons à développer des solutions qui simplifient l'accès aux fournisseurs, matériaux et équipements pour les professionnels du BTP.\n\n🙏 Merci aux équipes Orange Fab pour leur accompagnement et l'organisation de cette belle journée.\n\n🤝 Ensemble, nous contribuons à construire l'Afrique de demain.\n\n#bloktechnology #orangefab #innovation #cotedivoire #construction #btp #startupafrica #digitalisation","pid":"7476190132988207106","chars":1038,"hashtags":8,"mentions":9,"link":false,"question":false,"lang":"FR","theme":"Levée & partenariats"},{"date":"2026-06-30","month":"2026-06","weekday":"Mardi","hour":8,"reactions":13,"comments":0,"reposts":1,"eng":14,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_btp-construction-achats-activity-7477632112922177536-OZ5H?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Un fournisseur moins cher peut parfois entraîner : ✔️ Des retards de livraison ✔️ Des ruptures d'approvisionnement ✔️ Des produits non conformes aux exigences du projet ✔️ Des coût","text":"Un fournisseur moins cher peut parfois entraîner :\n\n✔️ Des retards de livraison\n✔️ Des ruptures d'approvisionnement\n✔️ Des produits non conformes aux exigences du projet\n✔️ Des coûts supplémentaires de transport ou de remplacement\n✔️ Une mobilisation plus longue des équipes et des équipements\n\nAu final, quelques économies réalisées à l'achat peuvent rapidement générer des coûts bien plus importants sur l'ensemble du projet.\n\nC'est pourquoi les acteurs les plus performants ne cherchent pas uniquement le prix le plus bas.Ils recherchent le meilleur équilibre entre coût, qualité, disponibilité et fiabilité.\n\nDans le BTP, le moins cher peut parfois coûter plus cher.\nLe véritable enjeu est de mesurer le coût global d'une décision d'achat, et non uniquement son prix d'acquisition.\n\nChez BLOK TECHNOLOGY, nous accompagnons les professionnels dans l'identification de fournisseurs fiables afin de sécuriser leurs approvisionnements et leurs délais d'exécution.\n\n💬 Selon vous, quel est aujourd'hui le coût caché le plus fréquent sur un chantier : les retards, la qualité des produits ou les ruptures d'approvisionnement ?\n\n#btp #construction #achats #approvisionnement #supplychain #gestiondeprojet #cotedivoire #bloktechnology","pid":"7477632112922177536","chars":1229,"hashtags":8,"mentions":1,"link":false,"question":true,"lang":"FR","theme":"Produit & offre"},{"date":"2026-07-02","month":"2026-07","weekday":"Jeudi","hour":8,"reactions":10,"comments":0,"reposts":0,"eng":10,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_btp-construction-digitalisation-activity-7478356993552990208-livU?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Quand on parle de digitalisation du secteur de la construction, on pense souvent à la technologie ou à l'intelligence artificielle. Pourtant, la réalité est bien plus complexe. L'I","text":"Quand on parle de digitalisation du secteur de la construction, on pense souvent à la technologie ou à l'intelligence artificielle.\n\nPourtant, la réalité est bien plus complexe.\n\nL'IA et les outils numériques viennent en complément de l'expertise métier. Ils permettent d'analyser, structurer et exploiter l'information plus efficacement, mais ils ne remplacent pas la connaissance du terrain.\n\nLe défi n'est pas seulement de développer une plateforme innovante.\nLe véritable enjeu est de référencer les bons fournisseurs, structurer les données, comprendre les besoins des professionnels et garantir la qualité des mises en relation.\n\nDans le BTP, chaque projet a ses spécificités :\n✔️ Des besoins techniques différents\n✔️ Des contraintes de délais\n✔️ Des exigences de qualité\n✔️ Des problématiques d'approvisionnement\n✔️ Des fournisseurs aux expertises variées\n\nConstruire une marketplace moderne dédiée au secteur demande donc bien plus qu'un simple développement informatique.\n\nL'intelligence artificielle permet d'analyser et de structurer l'information à grande échelle. Mais sans expertise métier et sans compréhension des réalités terrain, aucune technologie ne peut identifier les bons partenaires ou répondre aux enjeux spécifiques d'un chantier.\n\nChez BLOK TECHNOLOGY, nous combinons expertise terrain, innovation digitale et intelligence artificielle pour simplifier l'approvisionnement des professionnels de la construction et leur faire gagner du temps dans leurs achats.\n\n💬 Selon vous, quel est aujourd'hui le principal défi dans la recherche de fournisseurs ou de produits pour vos projets ?\n\n#btp #construction #digitalisation #ia #innovation #transformationdigitale #achats #approvisionnement #marketplace  #cotedivoire #bloktechnology","pid":"7478356993552990208","chars":1753,"hashtags":11,"mentions":1,"link":false,"question":true,"lang":"FR","theme":"Clients & terrain"},{"date":"2026-07-02","month":"2026-07","weekday":"Jeudi","hour":9,"reactions":12,"comments":0,"reposts":0,"eng":12,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_daezveloppeurfrontend-portraitcollaborateur-activity-7478379454063419392-9wxq?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"👥 Portrait Collaborateur | À la rencontre de notre équipe Aujourd'hui, nous découvrons Ange-Emmanuel Kouassi, Développeur Frontend chez BLOK TECHNOLOGY. 💼 En quelques mots, quel es","text":"👥 Portrait Collaborateur | À la rencontre de notre équipe\n\nAujourd'hui, nous découvrons Ange-Emmanuel Kouassi, Développeur Frontend chez BLOK TECHNOLOGY.\n\n💼 En quelques mots, quel est ton rôle chez BLOK TECHNOLOGY ?\n\nJ'assure le développement et la maintenance du site web ainsi que du panneau d'administration. Mon objectif est de créer des interfaces performantes, intuitives et adaptées aux besoins des utilisateurs tout en garantissant une expérience fluide et efficace.\n\n🚀 Quelle est la mission ou le projet qui t'a le plus marqué depuis ton arrivée ?\n\nLe projet qui m'a le plus marqué est l'implémentation d'une fonctionnalité de Deep Linking. C'était un sujet nouveau pour moi qui m'a permis de sortir de ma zone de confort, d'acquérir de nouvelles compétences techniques et de mieux comprendre les interactions entre les environnements web et mobile. Un défi stimulant et particulièrement enrichissant.\n\n✨ Si tes collègues devaient te décrire en 3 mots, lesquels choisiraient-ils ?\n🤝 Accessible\n🔥 Engagé\n👥 Collaboratif\n\n💡 Quel mot représente le mieux BLOK Technology selon toi ?\n🚀 Innovation\n\nChez BLOK TECHNOLOGY, l'innovation est au cœur de notre démarche. \n\nElle nous pousse à explorer de nouvelles solutions, à relever des défis techniques et à créer des outils toujours plus performants pour accompagner les acteurs du BTP.\n\n🙏 Merci à Ange-Emmanuel Kouassi pour ce partage et pour son implication au sein de l'équipe.\n\n#développeurfrontend #portraitcollaborateur #bloktechnology #teamblok #frontenddeveloper #btp #construction #innovation #afrique","pid":"7478379454063419392","chars":1560,"hashtags":9,"mentions":5,"link":false,"question":false,"lang":"FR","theme":"Équipe & coulisses"},{"date":"2026-07-03","month":"2026-07","weekday":"Vendredi","hour":16,"reactions":64,"comments":0,"reposts":1,"eng":65,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_abidjan-villedurable-construction-activity-7478854064353652736-Gysz?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🤝 Les meilleures idées naissent souvent d'une simple conversation. Hier soir, BLOK TECHNOLOGY a eu le plaisir d'accueillir l'afterwork du Club Abidjan Ville Durable au Mstudio. Cet","text":"🤝 Les meilleures idées naissent souvent d'une simple conversation.\n\nHier soir, BLOK TECHNOLOGY a eu le plaisir d'accueillir l'afterwork du Club Abidjan Ville Durable au Mstudio.\n\nCette soirée a réuni des entrepreneurs, experts et décideurs engagés autour d'une ambition commune : échanger sur les enjeux de la ville durable, de l'innovation et du développement de nos territoires.\n\n🌱 Le Club Abidjan Ville Durable rassemble des acteurs publics et privés engagés pour imaginer des villes plus durables et favoriser les échanges autour des grands enjeux urbains.\n\nChez BLOK TECHNOLOGY, nous sommes convaincus que les défis de la construction et de l'aménagement urbain se relèvent collectivement. Les rencontres, les échanges et les partenariats sont essentiels pour faire émerger des solutions innovantes et durables.\n\n👏 Un grand merci au Club Abidjan Ville Durable, à Marie-Emmanuella KADJO-WOGNIN  et Cornélia POGUY-MAGINEAUD pour leur confiance et leur engagement, ainsi qu'à l'ensemble des participants pour la qualité des échanges. \n\n✨ Nous sommes heureux d'avoir contribué à ce moment de partage et espérons poursuivre ces discussions à travers de futures collaborations.\n\n🚀 Au plaisir de construire ensemble les projets de demain.\n\n#abidjan #villedurable #construction #btp #innovation #digitalisation #networking #cotedivoire #bloktechnology","pid":"7478854064353652736","chars":1348,"hashtags":9,"mentions":8,"link":false,"question":false,"lang":"FR","theme":"Levée & partenariats"},{"date":"2026-07-07","month":"2026-07","weekday":"Mardi","hour":8,"reactions":23,"comments":0,"reposts":0,"eng":23,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_btp-construction-cotedivoire-activity-7480168893244796928-GnjS?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🏗️ Avec la multiplication des projets de construction et d'infrastructures en Côte d'Ivoire, certaines catégories de produits restent incontournables : 🧱 ✔️ Ciment et matériaux de ","text":"🏗️ Avec la multiplication des projets de construction et d'infrastructures en Côte d'Ivoire, certaines catégories de produits restent incontournables :\n\n🧱 ✔️ Ciment et matériaux de gros œuvre\n 🔩 ✔️ Fer à béton et produits métalliques\n ⚡ ✔️ Équipements électriques\n 🚿 ✔️ Plomberie et sanitaires\n 🦺 ✔️ Équipements de protection et de sécurité\n 🎨 ✔️ Revêtements et finitions\n\nMais au-delà des matériaux, le véritable défi est souvent de trouver le bon fournisseur, au bon moment.\n\n📦 Délais de livraison, disponibilité, qualité des produits et fiabilité sont aujourd'hui des critères tout aussi importants que le prix.\n\nChez BLOK TECHNOLOGY, nous référençons plusieurs catégories de produits et de fournisseurs afin de faciliter les recherches et les approvisionnements des professionnels du BTP.\n\n🌐 https://www.blok.africa\n\n💬 Selon vous, quels sont aujourd'hui les matériaux ou équipements les plus difficiles à trouver ou à approvisionner sur vos projets ?\n\n#btp #construction #cotedivoire #infrastructure #materiauxdeconstruction #approvisionnement #fournisseurs #innovation #digitalisation #bloktechnology","pid":"7480168893244796928","chars":1105,"hashtags":10,"mentions":1,"link":true,"question":true,"lang":"FR","theme":"Produit & offre"},{"date":"2026-07-09","month":"2026-07","weekday":"Jeudi","hour":8,"reactions":75,"comments":2,"reposts":0,"eng":77,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_bloktechnology-cultureentreprise-marqueemployeur-activity-7480893648344231936-bYIB?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"👥 Nos collaborateurs passent souvent plus de temps au travail qu'à la maison. Il nous semblait donc naturel de les associer à cette nouvelle étape de l'histoire de BLOK TECHNOLOGY.","text":"👥 Nos collaborateurs passent souvent plus de temps au travail qu'à la maison.\n\nIl nous semblait donc naturel de les associer à cette nouvelle étape de l'histoire de BLOK TECHNOLOGY.\n\n📈 L'équipe grandit, évolue et se transforme. En quelques années, nous sommes passés de 2 à près de 24 collaborateurs.\n\nAvec cette croissance, notre vision, notre organisation et nos ambitions ont évolué. Nous avions déjà des valeurs, mais nous souhaitons aujourd'hui construire des valeurs qui reflètent pleinement notre réalité, nos équipes et le futur que nous voulons bâtir ensemble.\n\n🎯 Notre objectif n'est pas simplement d'afficher quelques mots sur un mur ou dans une présentation.\n\nNous voulons renforcer le sentiment d'appartenance et construire un environnement où chacun trouve sa place et peut contribuer à l'aventure BLOK TECHNOLOGY.\n\n🤝 C'est dans cette dynamique que nous avons organisé notre premier séminaire d'équipe en extérieur.\n\nAu programme :\n ✔️ Brainstorming collectif\n 🏃‍♂️ Activités sportives\n 💬 Moments d'échange\n 🎉 Convivialité et cohésion\n\nCette démarche nous permettra notamment de :\n✔️ Renforcer notre culture d'entreprise\n 👥 Mieux comprendre les attentes de nos collaborateurs\n 🌱 Attirer de nouveaux talents\n 🏢 Construire un environnement de travail sain et durable\n\nParce que les meilleurs ambassadeurs de BLOK TECHNOLOGY sont nos collaborateurs, cette réflexion se veut avant tout participative.\n\n🙏 Merci à Vincent Gentil pour son accompagnement dans cette démarche.\n\n🚀 Rendez-vous très bientôt pour découvrir la suite de cette aventure et les enseignements de ce premier atelier.\n\n#bloktechnology #cultureentreprise #marqueemployeur #teamwork #rh #management #cohesion #innovation #cotedivoire #startup #btp","pid":"7480893648344231936","chars":1723,"hashtags":11,"mentions":4,"link":false,"question":false,"lang":"FR","theme":"Clients & terrain"},{"date":"2026-07-14","month":"2026-07","weekday":"Mardi","hour":8,"reactions":7,"comments":0,"reposts":0,"eng":7,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_btp-construction-achats-activity-7482705477059936257-7bKw?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🏗️ Un matériau ne devient pas un problème le jour de sa livraison. Il le devient parfois plusieurs mois plus tard. 📉 Quand les performances ne sont pas au rendez-vous. 🔄 Quand les ","text":"🏗️ Un matériau ne devient pas un problème le jour de sa livraison.\n\nIl le devient parfois plusieurs mois plus tard.\n\n📉 Quand les performances ne sont pas au rendez-vous.\n🔄 Quand les remplacements se multiplient.\n💸 Quand la maintenance coûte plus cher que prévu.\n\nDans le secteur de la construction, les décisions d'achat ont souvent des conséquences qui dépassent largement le budget initial.\n\n💡 Le matériau le moins cher n'est pas toujours le plus économique.\n📦 Le plus disponible n'est pas toujours le plus adapté.\n🎯 Et le plus connu n'est pas forcément le plus pertinent pour votre projet.\n\nLes entreprises les plus performantes évaluent aujourd'hui leurs achats avec une vision plus globale :\n\n✅ Qualité\n✅ Durabilité\n✅ Disponibilité\n✅ Coût sur le long terme\n\n🤝 C'est aussi pour cette raison que la sélection des fournisseurs et des matériaux reste un enjeu stratégique tout au long d'un projet.\n\n🏢 Car construire, ce n'est pas seulement livrer un projet.\n⏳ C'est aussi garantir sa performance dans le temps.\n\nUne approche qui prend de plus en plus d'importance dans les stratégies achats du secteur.\n\n💬 Et vous, avez-vous déjà vu un choix de matériau impacter un projet plusieurs mois après sa livraison ?\n\n#btp #construction #achats #approvisionnement #matériauxdeconstruction #gestiondeprojet #immobilier #fournisseurs #bloktechnology","pid":"7482705477059936257","chars":1340,"hashtags":9,"mentions":0,"link":false,"question":true,"lang":"FR","theme":"Produit & offre"},{"date":"2026-07-16","month":"2026-07","weekday":"Jeudi","hour":9,"reactions":85,"comments":0,"reposts":3,"eng":88,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_bloktechnology-teamblok-portraitcollaborateur-activity-7483448027379277824-Mlh1?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"👥 Portrait Collaborateur | À la rencontre de nos collaborateurs Aujourd'hui, nous vous présentons Josée Dorcas Tchoman, Développeuse Junior Full Stack chez BLOK TECHNOLOGY. 💼 En qu","text":"👥 Portrait Collaborateur | À la rencontre de nos collaborateurs\n\nAujourd'hui, nous vous présentons Josée Dorcas Tchoman, Développeuse Junior Full Stack chez BLOK TECHNOLOGY.\n\n💼 En quelques mots, quel est ton rôle chez BLOK Technology ?\n\nJe contribue au développement des solutions digitales de BLOK TECHNOLOGY en participant à la conception, à l'amélioration et à l'optimisation de nos plateformes, afin de proposer une expérience toujours plus performante à nos utilisateurs.\n\n🚀 Quelle est la mission ou le projet qui t'a le plus marqué depuis ton arrivée ?\n\nCe qui m'a le plus marqué, c'est la découverte de nouvelles technologies et la possibilité de les mettre en pratique sur des projets concrets. Cette expérience m'a permis de mieux comprendre le fonctionnement global d'une solution digitale et de développer mes compétences au quotidien.\n\n✨ Si tes collègues devaient te décrire en trois mots ?\n\n😊 Gentille\n✨ Spontanée\n🤫 Discrète\n\n💡 Quel mot représente le mieux BLOK TECHNOLOGY selon toi ?\n\n🤝 Engagement. Chez BLOK TECHNOLOGY, l'engagement se traduit par la volonté de chacun de contribuer activement aux projets de l'entreprise. C'est cette implication collective qui nous permet d'innover, de progresser ensemble et d'accompagner au mieux nos clients et partenaires.\n\nMerci à Josée pour ce partage et pour son engagement au sein de l'équipe.\n\n#bloktechnology #teamblok #portraitcollaborateur #developpementweb #fullstack #innovation #startup #abidjan","pid":"7483448027379277824","chars":1460,"hashtags":8,"mentions":5,"link":false,"question":false,"lang":"FR","theme":"Clients & terrain"},{"date":"2026-07-21","month":"2026-07","weekday":"Mardi","hour":11,"reactions":8,"comments":0,"reposts":0,"eng":8,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_bloktechnology-btp-construction-activity-7485289871348191233-KptW?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"📦 Le produit n'est pas toujours le problème. 🏗️ Sa disponibilité, oui. Dans le BTP, les professionnels savent généralement ce dont ils ont besoin pour réaliser leurs projets. Le vé","text":"📦 Le produit n'est pas toujours le problème.\n\n🏗️ Sa disponibilité, oui.\n\nDans le BTP, les professionnels savent généralement ce dont ils ont besoin pour réaliser leurs projets.\nLe véritable défi est souvent ailleurs :\n\n✔️ Trouver le bon fournisseur\n✔️ Obtenir le produit dans les délais\n✔️ Comparer les offres disponibles\n✔️ Sécuriser l'approvisionnement du chantier\n\nCar un produit indisponible, une livraison retardée ou une rupture de stock peuvent rapidement avoir des conséquences importantes sur l'avancement d'un projet.\n\nTemps perdu, délais rallongés, coûts supplémentaires, équipes immobilisées : les impacts sont souvent bien plus importants qu'il n'y paraît.\n\nC'est pourquoi l'accès à une information fiable et à un réseau de fournisseurs qualifiés est devenu un enjeu majeur pour les professionnels de la construction.\n\nChez BLOK TECHNOLOGY, notre ambition est de simplifier la recherche de fournisseurs et de permettre aux entreprises du BTP de gagner du temps dans leurs achats et leurs approvisionnements.\n\n  👉 https://www.blok.africa\n\n💬 Quel est aujourd'hui le produit ou la catégorie de produits la plus difficile à trouver rapidement pour vos projets ?\n\n#bloktechnology #btp #construction #approvisionnement #fournisseurs #marketplacebtp #infrastructure #cotedivoire","pid":"7485289871348191233","chars":1284,"hashtags":8,"mentions":1,"link":true,"question":true,"lang":"FR","theme":"Produit & offre"},{"date":"2026-07-23","month":"2026-07","weekday":"Jeudi","hour":8,"reactions":25,"comments":0,"reposts":0,"eng":25,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_bloktechnology-stage-jeunestalents-activity-7485966946178424833-MjSM?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"👋 Bienvenue à Antoine FAURE-GOMIS chez BLOK TECHNOLOGY ! Actuellement étudiant à emlyon business school, Antoine a rejoint nos équipes pour un stage de deux mois afin de découvrir ","text":"👋 Bienvenue à Antoine FAURE-GOMIS chez BLOK TECHNOLOGY !\n\nActuellement étudiant à emlyon business school, Antoine a rejoint nos équipes pour un stage de deux mois afin de découvrir le quotidien d'une startup en pleine croissance et les réalités du secteur du BTP.\n\nDès ses premières semaines, il a eu l'occasion de participer à plusieurs missions aux côtés de nos équipes :\n\n✅ Accompagnement des Business Developers sur le terrain\n✅ Découverte de la relation client et du parcours d'achat\n✅ Participation aux activités administratives et comptables\n✅ Support au service Marketing\n\nAu-delà des missions, ce stage est aussi l'occasion de découvrir un nouvel environnement, de comprendre les enjeux d'une jeune entreprise en développement et d'acquérir une expérience concrète au contact des professionnels du secteur.\n\nChez BLOK TECHNOLOGY, nous croyons beaucoup à la transmission et à l'apprentissage par l'expérience. \n\nAccueillir de jeunes talents, leur donner des responsabilités et les confronter aux réalités du terrain fait partie de notre manière de grandir.\n\nNous sommes ravis d'accueillir Antoine dans l'aventure BLOK et lui souhaitons une excellente expérience à nos côtés. 🚀\n\n#bloktechnology #stage #jeunestalents #startup #btp #abidjan #teamblok","pid":"7485966946178424833","chars":1256,"hashtags":7,"mentions":4,"link":false,"question":false,"lang":"FR","theme":"Équipe & coulisses"},{"date":"2026-07-29","month":"2026-07","weekday":"Mercredi","hour":11,"reactions":10,"comments":0,"reposts":0,"eng":10,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_bloktechnology-btp-construction-activity-7488187981611044865-qwyk?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"💧 Un bâtiment bien construit, c'est aussi un bâtiment bien protégé. Toitures, terrasses, fondations, murs enterrés ou façades : l'étanchéité joue un rôle essentiel dans la durabili","text":"💧 Un bâtiment bien construit, c'est aussi un bâtiment bien protégé.\n\nToitures, terrasses, fondations, murs enterrés ou façades : l'étanchéité joue un rôle essentiel dans la durabilité d'un ouvrage.\n\nUne infiltration d'eau peut rapidement entraîner des dégradations importantes, des coûts supplémentaires et des retards sur un chantier.\n\nPourtant, trouver les bons produits et les bons fournisseurs n'est pas toujours simple.\n\nChez BLOK TECHNOLOGY, nous facilitons l'accès à une large gamme de solutions d'étanchéité auprès de fournisseurs qualifiés :\n\n✔️ Membranes d'étanchéité\n✔️ Produits d'imperméabilisation\n✔️ Revêtements et protections\n✔️ Solutions pour toitures et terrasses\n✔️ Accessoires et consommables spécialisés\n\nNotre objectif : permettre aux professionnels du BTP de gagner du temps, de comparer plusieurs offres et de sécuriser leurs approvisionnements.\n\n🌍 Découvrez la catégorie Étanchéité sur BLOK : https://www.blok.africa\n\n💬 Selon vous, quel est le principal défi lorsqu'il s'agit de choisir une solution d'étanchéité pour un projet ?\n\n#bloktechnology #btp #construction #etancheite #chantier #materiauxdeconstruction #cotedivoire #abidjan","pid":"7488187981611044865","chars":1158,"hashtags":8,"mentions":1,"link":true,"question":true,"lang":"FR","theme":"Clients & terrain"},{"date":"2026-08-04","month":"2026-08","weekday":"Mardi","hour":9,"reactions":9,"comments":0,"reposts":1,"eng":10,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_bloktechnology-btp-construction-activity-7490342031437942784-n1rX?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🏗️ Digitaliser le BTP en Afrique : pourquoi maintenant ? 🚧 Les chantiers avancent de plus en plus vite. Les outils utilisés pour gérer les achats, les approvisionnements et les éch","text":"🏗️ Digitaliser le BTP en Afrique : pourquoi maintenant ?\n\n🚧 Les chantiers avancent de plus en plus vite. Les outils utilisés pour gérer les achats, les approvisionnements et les échanges ne suivent pas toujours le même rythme.\n\n📞 Trouver un fournisseur, demander plusieurs devis, comparer les offres, suivre les commandes, relancer les interlocuteurs...\n\nPour de nombreux professionnels du BTP, ces tâches occupent encore plusieurs heures chaque semaine.\n\n🎯 Pourtant, leur priorité reste la même : faire avancer les chantiers, respecter les délais et maîtriser les coûts.\n\nC'est là que le numérique peut faire la différence.\n\n📱 La digitalisation ne remplace pas l'expertise terrain. Elle permet aux professionnels de gagner du temps, d'accéder plus rapidement à l'information et de prendre de meilleures décisions.\n\nAujourd'hui, les entreprises qui adoptent ces outils bénéficient notamment :\n\n✔️ D'un accès plus rapide aux fournisseurs et aux produits\n✔️ D'une meilleure visibilité sur leurs achats\n✔️ D'une communication plus fluide entre les équipes\n✔️ D'un meilleur suivi des projets et des approvisionnements\n✔️ D'un gain de temps sur les tâches administratives\n\n🌍 En Afrique, la croissance du secteur de la construction représente une opportunité unique pour construire un écosystème plus connecté, plus efficace et plus performant.\n\n🤝 Chez BLOK TECHNOLOGY, nous sommes convaincus que la transformation du secteur passera avant tout par des solutions simples, adaptées aux réalités du terrain et créatrices de valeur pour les professionnels.\n\n💬 Selon vous, quel est aujourd'hui le principal frein à la digitalisation du BTP en Afrique ?\n\n#bloktechnology #btp #construction #digitalisation #innovation #cotedivoire #afrique #abidjan","pid":"7490342031437942784","chars":1737,"hashtags":8,"mentions":1,"link":false,"question":true,"lang":"FR","theme":"Produit & offre"},{"date":"2026-08-06","month":"2026-08","weekday":"Jeudi","hour":9,"reactions":10,"comments":0,"reposts":0,"eng":10,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_bloktechnology-btp-construction-activity-7491066818837520384-XFH9?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚧 On entend souvent que les retards de chantier sont liés aux travaux. Dans la réalité, les problèmes commencent souvent bien avant. 📦 Un matériau qui n'arrive pas à temps. 📐 Un ch","text":"🚧 On entend souvent que les retards de chantier sont liés aux travaux.\n\nDans la réalité, les problèmes commencent souvent bien avant.\n\n📦 Un matériau qui n'arrive pas à temps.\n📐 Un changement demandé en cours de route.\n📞 Une information qui n'a pas été transmise à la bonne personne.\n\nPetit à petit, le planning se décale.\n\nChez BLOK TECHNOLOGY, lorsque nous échangeons avec des conducteurs de travaux ou des acheteurs, les mêmes difficultés reviennent régulièrement.\n\n📦 Le sujet des approvisionnements arrive souvent en tête. Une livraison retardée ou un produit indisponible peut rapidement bloquer plusieurs équipes.\n\n📐 Autre situation fréquente : les modifications demandées alors que le chantier est déjà lancé. Même lorsqu'elles semblent mineures, elles ont souvent un impact sur l'organisation prévue.\n\n🤝 Enfin, la coordination reste un défi. Entre les fournisseurs, les sous-traitants et les différents intervenants, une information manquante ou transmise trop tard peut entraîner des pertes de temps importantes.\n\n🏗️ La réussite d'un chantier ne dépend pas uniquement de ce qui se passe sur le terrain. Une grande partie se joue dans l'anticipation et l'organisation.\n\n💬 Selon vous, quelle est aujourd'hui la principale cause de retard sur les chantiers en Côte d'Ivoire ?\n\n#bloktechnology #btp #construction #chantier #approvisionnement #cotedivoire #materiauxdeconstruction #abidjan\n\n*Source visuel : CoST – Infrastructure Transparency Initiative (analyse de 480 projets d'infrastructure, dont 35 % en Afrique).","pid":"7491066818837520384","chars":1521,"hashtags":8,"mentions":1,"link":false,"question":true,"lang":"FR","theme":"Clients & terrain"},{"date":"2026-08-11","month":"2026-08","weekday":"Mardi","hour":9,"reactions":11,"comments":0,"reposts":0,"eng":11,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_bloktechnology-btp-construction-activity-7492878758970937344-OCJr?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🏗️ Le futur du BTP africain sera hybride : terrain + digital 📱 Le digital progresse dans le BTP. Pourtant, une grande partie des achats se gère encore par téléphone, WhatsApp ou Ex","text":"🏗️ Le futur du BTP africain sera hybride : terrain + digital\n\n📱 Le digital progresse dans le BTP. Pourtant, une grande partie des achats se gère encore par téléphone, WhatsApp ou Excel.\n\nEt ce n'est pas forcément un problème.\n\n👷 Le terrain a ses habitudes, ses contraintes et ses méthodes de travail.\nMais les attentes évoluent.\n\nLes entreprises veulent comparer plus rapidement les offres, suivre leurs commandes plus facilement et accéder à l'information sans multiplier les appels et les relances.\n\n💡 Ce que nous observons chez BLOK, c'est que les professionnels ne cherchent pas à remplacer leur façon de travailler.\n\nIls cherchent avant tout à gagner du temps.\n\n📲 Le digital ne remplacera pas l'expertise terrain.\n🤝 Il viendra la compléter.\n\n🚀 C'est probablement là que se joue l'avenir du BTP en Afrique : combiner l'expérience des équipes sur le terrain avec des outils capables de simplifier les achats, les approvisionnements et le suivi des projets.\n\n🧱 Chez BLOK TECHNOLOGY, c'est cette vision qui guide le développement de nos solutions au quotidien.\n\n💬 Selon vous, quelle tâche du quotidien gagnerait le plus à être simplifiée grâce au digital dans le secteur du BTP ?\n\n#bloktechnology #btp #construction #digitalisation #innovation #afrique #cotedivoire #abidjan","pid":"7492878758970937344","chars":1275,"hashtags":8,"mentions":1,"link":false,"question":true,"lang":"FR","theme":"Clients & terrain"},{"date":"2026-08-13","month":"2026-08","weekday":"Jeudi","hour":10,"reactions":10,"comments":0,"reposts":0,"eng":10,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_bloktechnology-btp-construction-activity-7493607400386564098-wbqh?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🪵 Le bois reste l’un des matériaux les plus utilisés sur les chantiers. Pourtant, c’est aussi l’un de ceux qui demandent le plus de vigilance. 🏗️ Un mauvais choix peut rapidement a","text":"🪵 Le bois reste l’un des matériaux les plus utilisés sur les chantiers. \n\nPourtant, c’est aussi l’un de ceux qui demandent le plus de vigilance.\n\n🏗️ Un mauvais choix peut rapidement avoir des conséquences : retards, remplacements, surcoûts ou problèmes de qualité.\n\nChaque projet a ses propres besoins.\n\n📦 Bois de coffrage, charpente, contreplaqué, panneaux, menuiserie… tous n’ont pas le même usage ni les mêmes exigences.\n\nLe choix ne doit pas non plus reposer uniquement sur le prix et la disponibilité.\n\n🌳 La provenance du bois, sa traçabilité et les conditions dans lesquelles il a été exploité sont également importantes. \n\nPrivilégier, lorsque cela est possible, des fournisseurs capables de renseigner l’origine de leurs produits contribue à une gestion plus responsable des ressources forestières.\n\nCela permet aussi de limiter les pertes, d’utiliser le matériau adapté à chaque besoin et d’éviter des remplacements inutiles.\n\n🎯 Pour les équipes, le défi est donc de trouver un bois adapté au chantier, disponible dans les délais, proposé par un fournisseur fiable et issu d’une filière plus respectueuse de l’environnement.\n\n🤝 Chez BLOK TECHNOLOGY, nous permettons aux professionnels du BTP de comparer plusieurs fournisseurs et de trouver plus facilement les matériaux adaptés à leurs projets, dont une large sélection de produits en bois.\n\n🚀 Parce qu’un chantier avance mieux lorsque les bons matériaux arrivent au bon moment, avec les bonnes informations.\n\n💬 Et vous, lorsque vous choisissez votre bois, prenez-vous également en compte sa provenance et son impact environnemental ?\n\n#bloktechnology #btp #construction #bois #materiaux #approvisionnement #environnement #forets #cotedivoire #afrique","pid":"7493607400386564098","chars":1711,"hashtags":10,"mentions":1,"link":false,"question":true,"lang":"FR","theme":"Clients & terrain"},{"date":"2026-08-18","month":"2026-08","weekday":"Mardi","hour":8,"reactions":19,"comments":0,"reposts":0,"eng":19,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_bloktechnology-btp-construction-activity-7495392829066776577-DM6F?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🎬 À la rencontre de Abdelkarim Bouhaddou, Directeur de Travaux chez SOTASERV CONSTRUCTION. Lors de notre visite du chantier Faubourg, un projet composé de quatre bâtiments R+5, un ","text":"🎬 À la rencontre de Abdelkarim Bouhaddou, Directeur de Travaux chez SOTASERV CONSTRUCTION.\n\nLors de notre visite du chantier Faubourg, un projet composé de quatre bâtiments R+5, un sujet est revenu très rapidement dans la discussion : les approvisionnements.\n\n📦 « Si nous ne sommes pas approvisionnés en matériel et en fournitures, nous ne pouvons tout simplement pas avancer.»\n\nUne phrase simple, mais qui résume une réalité bien connue sur les chantiers.\n\n🏢 Derrière chaque bâtiment livré, il y a des mois de coordination, de suivi des équipes, de gestion des imprévus et d’anticipation.\n\n☀️ Chaque matin, Karim démarre sa journée par un point avec les responsables des différents chantiers afin de suivre l’avancement des travaux, d’identifier les éventuels blocages et de définir les priorités.\n\n🎯 Pour lui, la qualité la plus importante dans ce métier est la rigueur.\nSur un chantier, les imprévus sont nombreux. Il faut savoir s’adapter rapidement tout en gardant le cap sur les objectifs du projet.\n\n🏗️ Sa plus grande satisfaction ?\n\nVoir le chantier évoluer étape après étape jusqu’à sa livraison finale et constater concrètement le résultat du travail accompli par l’ensemble des équipes.\n\n🚀 Il est également convaincu que les nouvelles technologies auront un rôle croissant à jouer dans les métiers du BTP, à condition qu’elles répondent à des besoins réels sur le terrain.\n\n🤝 Merci à Abdelkarim Bouhaddou et aux équipes de SOTASERV CONSTRUCTION pour leur accueil et le partage de leur expérience.\n\n📸 Dans ce carrousel, découvrez l’évolution du chantier Faubourg ainsi que les équipes qui contribuent chaque jour à sa réalisation.\n\n💬 Selon vous, quelle est aujourd’hui la qualité la plus importante pour réussir dans les métiers du btp ?\n\n#bloktechnology #btp #construction #chantier #travaux #cotedivoire #abidjan #sotaserv","pid":"7495392829066776577","chars":1834,"hashtags":8,"mentions":4,"link":false,"question":true,"lang":"FR","theme":"Produit & offre"},{"date":"2026-08-20","month":"2026-08","weekday":"Jeudi","hour":8,"reactions":124,"comments":5,"reposts":4,"eng":133,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_bloktechnology-diasporaconnect-mstudio-activity-7496121352534396929-pLHt?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"👤 𝑷𝒐𝒓𝒕𝒓𝒂𝒊𝒕 𝑪𝒐𝒍𝒍𝒂𝒃𝒐𝒓𝒂𝒕𝒆𝒖𝒓 | À 𝒍𝒂 𝒓𝒆𝒏𝒄𝒐𝒏𝒕𝒓𝒆 𝒅𝒆 Sourayat ISSA Aujourd’hui, nous vous présentons Sourayat ISSA, Contrôleuse de gestion chez BLOK TECHNOLOGY. Elle a rejoint notre équipe","text":"👤 𝑷𝒐𝒓𝒕𝒓𝒂𝒊𝒕 𝑪𝒐𝒍𝒍𝒂𝒃𝒐𝒓𝒂𝒕𝒆𝒖𝒓 | À 𝒍𝒂 𝒓𝒆𝒏𝒄𝒐𝒏𝒕𝒓𝒆 𝒅𝒆 Sourayat ISSA\n\nAujourd’hui, nous vous présentons Sourayat ISSA, Contrôleuse de gestion chez BLOK TECHNOLOGY.\n\nElle a rejoint notre équipe grâce à Diaspora Connect, un programme porté par la Fondation Mstudio, qui permet à des talents de la diaspora africaine de mettre leurs compétences au service d’entreprises installées en Côte d’Ivoire.\n\n🌍 𝗣𝗲𝘂𝘅-𝘁𝘂 𝗻𝗼𝘂𝘀 𝗽𝗮𝗿𝗹𝗲𝗿 𝗱𝗲 𝘁𝗼𝗻 𝗽𝗮𝗿𝗰𝗼𝘂𝗿𝘀 𝗲𝘁 𝗱𝗲 𝘁𝗼𝗻 𝗲𝗻𝘃𝗶𝗲 𝗱𝗲 𝘃𝗶𝘃𝗿𝗲 𝘂𝗻𝗲 𝗲𝘅𝗽é𝗿𝗶𝗲𝗻𝗰𝗲 𝗽𝗿𝗼𝗳𝗲𝘀𝘀𝗶𝗼𝗻𝗻𝗲𝗹𝗹𝗲 𝗲𝗻 𝗖ô𝘁𝗲 𝗱’𝗜𝘃𝗼𝗶𝗿𝗲 ?\n\nJ’ai découvert le contrôle de gestion lors de ma première alternance et j’ai tout de suite apprécié la combinaison entre l’analyse financière et l’environnement international.\nMes expériences m’ont menée à travailler en France, aux Comores, en Irlande et aujourd’hui en Côte d’Ivoire. Après plusieurs années dans de grands groupes, je souhaitais rejoindre une entreprise où je pourrais avoir un impact concret, sur un projet porteur de sens et sur le continent où je suis née.\n\n🚀 𝗣𝗼𝘂𝗿𝗾𝘂𝗼𝗶 𝗮𝘀-𝘁𝘂 𝗰𝗵𝗼𝗶𝘀𝗶 𝗱𝗲 𝗿𝗲𝗷𝗼𝗶𝗻𝗱𝗿𝗲 𝗕𝗟𝗢𝗞 𝗧𝗘𝗖𝗛𝗡𝗢𝗟𝗢𝗚𝗬 ?\n\nJ’ai choisi BLOK pour son ambition et son potentiel. L’entreprise évolue dans le BTP, un secteur en pleine croissance en Côte d’Ivoire, et propose une solution innovante qui répond à un besoin réel.\nRejoindre une startup en pleine structuration représentait aussi un nouveau défi et l’occasion de contribuer directement à son développement.\n\n📊 𝗤𝘂𝗲𝗹 𝗲𝘀𝘁 𝘁𝗼𝗻 𝗿ô𝗹𝗲 𝗮𝗰𝘁𝘂𝗲𝗹𝗹𝗲𝗺𝗲𝗻𝘁 ?\n\nMon rôle consiste à mettre en place les outils et les processus nécessaires pour structurer la fonction finance : suivi des transactions, tableaux de bord, procédures et contrôle des données financières.\nJe travaille notamment sur la réconciliation et la consolidation des comptes clients afin de fiabiliser les données, d’identifier les créances en attente et de mettre en place un suivi durable.\n\n💡 𝗤𝘂𝗲𝗹 𝗽𝗿𝗲𝗺𝗶𝗲𝗿 𝗲𝗻𝘀𝗲𝗶𝗴𝗻𝗲𝗺𝗲𝗻𝘁 𝗿𝗲𝘁𝗶𝗲𝗻𝘀-𝘁𝘂 𝗱𝗲 𝘁𝗼𝗻 𝗲𝘅𝗽é𝗿𝗶𝗲𝗻𝗰𝗲 ?\n\nDans une startup, il faut savoir définir ses priorités tout en restant solidaire de son équipe. Tout évolue rapidement et chaque décision peut avoir un impact sur le développement de l’entreprise.\n\nCette expérience m’apprend à garder mon calme, à prendre du recul et à rester agile face aux imprévus.\n\nGrâce à son expertise, Sourayat contribue à améliorer le suivi de nos activités et à accompagner la structuration de BLOK TECHNOLOGY.\n\nMerci à elle pour son implication au sein de l’équipe. 🤝\n\n#bloktechnology #diasporaconnect #mstudio #startup #finance #btp #cotedivoire","pid":"7496121352534396929","chars":2444,"hashtags":7,"mentions":6,"link":false,"question":false,"lang":"FR","theme":"Équipe & coulisses"},{"date":"2026-08-26","month":"2026-08","weekday":"Mercredi","hour":9,"reactions":10,"comments":0,"reposts":0,"eng":10,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_bloktechnology-btp-construction-activity-7498307012754317312-Ezdj?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚧 « 𝐋𝐞 𝐜𝐚𝐦𝐢𝐨𝐧 𝐧'𝐞𝐬𝐭 𝐩𝐚𝐬 𝐚𝐫𝐫𝐢𝐯é. » Sur un chantier, cette simple phrase peut avoir des conséquences bien plus importantes qu'il n'y paraît Des équipes qui attendent. Des tâches repo","text":"🚧 « 𝐋𝐞 𝐜𝐚𝐦𝐢𝐨𝐧 𝐧'𝐞𝐬𝐭 𝐩𝐚𝐬 𝐚𝐫𝐫𝐢𝐯é. »\n\nSur un chantier, cette simple phrase peut avoir des conséquences bien plus importantes qu'il n'y paraît\n\nDes équipes qui attendent. Des tâches reportées. Des délais qui s'allongent.\nEt parfois des coûts supplémentaires qui auraient pu être évités.\n\nLes ruptures de stock font partie des imprévus les plus redoutés dans le BTP.\n\nPour limiter les risques, quelques réflexes peuvent faire la différence :\n\n✔️ Anticiper les besoins dès la préparation du chantier\n✔️ Identifier plusieurs fournisseurs pour les matériaux stratégiques\n✔️ Suivre régulièrement les commandes en cours\n✔️ Prévoir une marge de sécurité sur les produits critiques\n✔️ Maintenir un contact régulier avec les fournisseurs\n\nAu-delà du prix, un bon approvisionnement est souvent ce qui permet à un chantier d'avancer sans interruption.\n\nChez BLOK TECHNOLOGY, nous aidons les professionnels à identifier rapidement des fournisseurs qualifiés et à comparer plusieurs offres pour sécuriser leurs approvisionnements.\n\n🌍 Découvrez notre catalogue : https://www.blok.africa\n\n💬 Quel est le matériau ou produit qui vous a déjà causé le plus de retard sur un chantier ?\n\n#bloktechnology #btp #construction #chantier #approvisionnement #materiauxdeconstruction #cotedivoire #abidjan","pid":"7498307012754317312","chars":1273,"hashtags":8,"mentions":1,"link":true,"question":true,"lang":"FR","theme":"Produit & offre"},{"date":"2026-08-28","month":"2026-08","weekday":"Vendredi","hour":9,"reactions":41,"comments":0,"reposts":1,"eng":42,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_bloktechnology-teamblok-businessdevelopment-activity-7499028080624123904-8ZMw?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"👤 À la rencontre de Laura G. DUMONT, Business Developer chez BLOK TECHNOLOGY ! 💼 𝐄𝐧 𝐪𝐮𝐞𝐥𝐪𝐮𝐞𝐬 𝐦𝐨𝐭𝐬, 𝐪𝐮𝐞𝐥 𝐞𝐬𝐭 𝐭𝐨𝐧 𝐫ô𝐥𝐞 𝐜𝐡𝐞𝐳 𝐁𝐋𝐎𝐊 ? Mon rôle ? Dénicher de nouveaux marchés, nouer des ","text":"👤 À la rencontre de Laura G. DUMONT, Business Developer chez BLOK TECHNOLOGY !\n\n💼 𝐄𝐧 𝐪𝐮𝐞𝐥𝐪𝐮𝐞𝐬 𝐦𝐨𝐭𝐬, 𝐪𝐮𝐞𝐥 𝐞𝐬𝐭 𝐭𝐨𝐧 𝐫ô𝐥𝐞 𝐜𝐡𝐞𝐳 𝐁𝐋𝐎𝐊 ?\n\nMon rôle ? Dénicher de nouveaux marchés, nouer des partenariats stratégiques et faire grandir le chiffre d'affaires de BLOK. C'est un poste qui allie vision stratégique et action de terrain, entre réflexion à long terme et énergie du quotidien. \n\n🚀 𝐐𝐮𝐞𝐥𝐥𝐞 𝐞𝐬𝐭 𝐥𝐚 𝐦𝐢𝐬𝐬𝐢𝐨𝐧 𝐪𝐮𝐢 𝐭'𝐚 𝐥𝐞 𝐩𝐥𝐮𝐬 𝐦𝐚𝐫𝐪𝐮é𝐞 𝐝𝐞𝐩𝐮𝐢𝐬 𝐭𝐨𝐧 𝐚𝐫𝐫𝐢𝐯é𝐞 ?\n\nCe qui m'a le plus marquée, c'est d'avoir pu m'impliquer à plusieurs niveaux dès mon arrivée. BLOK étant une startup, tout le département était à construire : recrutement de l'équipe sales, structuration des process, création d'un CRM… Un vrai défi entrepreneurial !\n\nEt par-dessus tout, il y a le challenge de convaincre de grandes entreprises d'adopter notre modèle, alors qu'elles avaient déjà leurs propres processus d'achat et travaillaient souvent directement avec nos fournisseurs.\n\n✨ 𝐒𝐢 𝐭𝐞𝐬 𝐜𝐨𝐥𝐥è𝐠𝐮𝐞𝐬 𝐝𝐞𝐯𝐚𝐢𝐞𝐧𝐭 𝐭𝐞 𝐝é𝐜𝐫𝐢𝐫𝐞 𝐞𝐧 𝟑 𝐦𝐨𝐭𝐬 ?\n\nImpliquée • Réactive • Dynamique\n\n📱𝐐𝐮𝐞𝐥 𝐦𝐨𝐭 𝐫𝐞𝐩𝐫é𝐬𝐞𝐧𝐭𝐞 𝐥𝐞 𝐦𝐢𝐞𝐮𝐱 𝐁𝐋𝐎𝐊 𝐓𝐞𝐜𝐡𝐧𝐨𝐥𝐨𝐠𝐲 𝐬𝐞𝐥𝐨𝐧 𝐭𝐨𝐢 ?\n\nDigitalisation. Parce que BLOK vient moderniser le processus d'achat de matériaux de construction en s'appuyant sur les outils actuels, notamment l'intelligence artificielle, pour transformer un marché encore très traditionnel. \n\n👏 Merci Laura G. DUMONT pour ton énergie, ton implication et ta contribution au développement de BLOK Technology !\n\n#bloktechnology #teamblok #businessdevelopment #btp #digitalisation #startup #cotedivoire #abidjan","pid":"7499028080624123904","chars":1527,"hashtags":8,"mentions":3,"link":false,"question":false,"lang":"FR","theme":"Recrutement"},{"date":"2026-09-01","month":"2026-09","weekday":"Mardi","hour":10,"reactions":8,"comments":0,"reposts":1,"eng":9,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_btp-whatsapp-construction-activity-7500492865005879296-noZr?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"📱 « 𝐓𝐮 𝐚𝐬 𝐥𝐞 𝐜𝐨𝐧𝐭𝐚𝐜𝐭 𝐝’𝐮𝐧 𝐟𝐨𝐮𝐫𝐧𝐢𝐬𝐬𝐞𝐮𝐫 ? » Pour de nombreux professionnels du BTP, les achats commencent encore par un appel WhatsApp, un contact transmis par un collègue ou quelque","text":"📱 « 𝐓𝐮 𝐚𝐬 𝐥𝐞 𝐜𝐨𝐧𝐭𝐚𝐜𝐭 𝐝’𝐮𝐧 𝐟𝐨𝐮𝐫𝐧𝐢𝐬𝐬𝐞𝐮𝐫 ? »\n\nPour de nombreux professionnels du BTP, les achats commencent encore par un appel WhatsApp, un contact transmis par un collègue ou quelques messages envoyés à différents fournisseurs.\n\nCette méthode fonctionne… jusqu’à un certain point.\nLorsque les projets grandissent, les besoins se multiplient :\n\n🔍 Comparer plusieurs offres devient plus complexe ;\n 📇 Retrouver les bons contacts prend du temps ;\n 💬 Les informations sont dispersées dans plusieurs conversations ;\n 📋 Le suivi des demandes devient difficile ;\n ⚠️ Certaines opportunités peuvent être manquées faute de visibilité sur le marché.\n\n⏳ Résultat : des heures passées à rechercher, relancer et coordonner, plutôt qu’à faire avancer le projet.\n\nLa question n’est plus seulement de trouver un fournisseur.\n\n𝐋𝐚 𝐯𝐫𝐚𝐢𝐞 𝐪𝐮𝐞𝐬𝐭𝐢𝐨𝐧 𝐞𝐬𝐭 : 𝐜𝐨𝐦𝐦𝐞𝐧𝐭 𝐚𝐜𝐜é𝐝𝐞𝐫 𝐫𝐚𝐩𝐢𝐝𝐞𝐦𝐞𝐧𝐭 𝐚𝐮𝐱 𝐛𝐨𝐧𝐧𝐞𝐬 𝐢𝐧𝐟𝐨𝐫𝐦𝐚𝐭𝐢𝐨𝐧𝐬 𝐩𝐨𝐮𝐫 𝐩𝐫𝐞𝐧𝐝𝐫𝐞 𝐥𝐞𝐬 𝐛𝐨𝐧𝐧𝐞𝐬 𝐝é𝐜𝐢𝐬𝐢𝐨𝐧𝐬 ?\n\n🚀 C’est précisément l’un des enjeux de la digitalisation des achats dans le secteur de la construction.\n\nChez BLOK TECHNOLOGY, nous sommes convaincus que les outils numériques peuvent simplifier la mise en relation entre acheteurs et fournisseurs, tout en faisant gagner un temps précieux aux professionnels.\n\n🌐 www.blok.africa\n\n💬 Et vous, quelle est aujourd’hui la principale difficulté que vous rencontrez lors de vos achats de matériaux ou d’équipements ?\n\n#btp #whatsapp #construction #achats #approvisionnement #digitalisation #cotedivoire #innovation #bloktechnology","pid":"7500492865005879296","chars":1493,"hashtags":9,"mentions":0,"link":false,"question":true,"lang":"FR","theme":"Non classé"},{"date":"2026-09-07","month":"2026-09","weekday":"Lundi","hour":8,"reactions":12,"comments":0,"reposts":1,"eng":13,"media":"file","url":"https://www.linkedin.com/posts/blokafrica_smart-rfq-devis-trait%C3%A9-en-1-minute-gr%C3%A2ce-activity-7502649667294359552-ElZt?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🤖 𝐋’𝐈𝐀 𝐩𝐞𝐮𝐭-𝐞𝐥𝐥𝐞 𝐬𝐢𝐦𝐩𝐥𝐢𝐟𝐢𝐞𝐫 𝐮𝐧𝐞 𝐝𝐞𝐦𝐚𝐧𝐝𝐞 𝐝𝐞 𝐝𝐞𝐯𝐢𝐬 𝐜𝐨𝐦𝐩𝐥𝐞𝐱𝐞 ? Une demande peut contenir de nombreuses informations : 🧱 plusieurs produits ; 🔢 des quantités différentes ; 📋 des référe","text":"🤖 𝐋’𝐈𝐀 𝐩𝐞𝐮𝐭-𝐞𝐥𝐥𝐞 𝐬𝐢𝐦𝐩𝐥𝐢𝐟𝐢𝐞𝐫 𝐮𝐧𝐞 𝐝𝐞𝐦𝐚𝐧𝐝𝐞 𝐝𝐞 𝐝𝐞𝐯𝐢𝐬 𝐜𝐨𝐦𝐩𝐥𝐞𝐱𝐞 ?\n\nUne demande peut contenir de nombreuses informations :\n\n🧱 plusieurs produits ;\n🔢 des quantités différentes ;\n📋 des références précises ;\n⏱️ des délais à respecter ;\n🚚 des conditions de livraison.\n\nAvec le Smart RFQ, BLOK TECHNOLOGY développe une solution capable d’identifier et de structurer ces éléments afin de faciliter leur traitement.\n\nConcrètement, l’IA transforme une demande libre en informations plus claires et directement exploitables par les équipes. 🔎\n\nL’objectif : mieux comprendre le besoin dès le départ et simplifier le traitement des achats de matériaux. ✅\n\nLe Smart RFQ fait partie des solutions développées par BLOK pour accompagner les professionnels du BTP.\n\n🌐 Découvrez BLOK sur : www.blok.africa\n\n#intelligenceartificielle  #achatsbtp #constructiontech  #ia","pid":"7502649667294359552","chars":843,"hashtags":4,"mentions":1,"link":false,"question":false,"lang":"FR","theme":"Produit & offre"},{"date":"2026-09-08","month":"2026-09","weekday":"Mardi","hour":8,"reactions":10,"comments":0,"reposts":0,"eng":10,"media":"file","url":"https://www.linkedin.com/posts/blokafrica_yann-ia-conversationnelle-activity-7503002978409345027-Yuov?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"💬 𝐄𝐭 𝐬𝐢 𝐮𝐧𝐞 𝐬𝐢𝐦𝐩𝐥𝐞 𝐜𝐨𝐧𝐯𝐞𝐫𝐬𝐚𝐭𝐢𝐨𝐧 𝐩𝐞𝐫𝐦𝐞𝐭𝐭𝐚𝐢𝐭 𝐝𝐞 𝐟𝐨𝐫𝐦𝐮𝐥𝐞𝐫 𝐮𝐧 𝐛𝐞𝐬𝐨𝐢𝐧 𝐞𝐧 𝐦𝐚𝐭é𝐫𝐢𝐚𝐮𝐱 ? Avec Yann, notre IA conversationnelle, nous travaillons sur une manière plus simple d’accompagner le","text":"💬 𝐄𝐭 𝐬𝐢 𝐮𝐧𝐞 𝐬𝐢𝐦𝐩𝐥𝐞 𝐜𝐨𝐧𝐯𝐞𝐫𝐬𝐚𝐭𝐢𝐨𝐧 𝐩𝐞𝐫𝐦𝐞𝐭𝐭𝐚𝐢𝐭 𝐝𝐞 𝐟𝐨𝐫𝐦𝐮𝐥𝐞𝐫 𝐮𝐧 𝐛𝐞𝐬𝐨𝐢𝐧 𝐞𝐧 𝐦𝐚𝐭é𝐫𝐢𝐚𝐮𝐱 ?\n\nAvec Yann, notre IA conversationnelle, nous travaillons sur une manière plus simple d’accompagner les professionnels dans leurs demandes. 🤖\n\nL’utilisateur décrit son besoin avec ses propres mots :\n\n🗣️ « Je recherche du ciment, de l’acier et des parpaings pour mon chantier à Abidjan. »\n\nL’IA analyse la demande et identifie les principales informations nécessaires à son traitement. 🔎\n\nL’objectif : permettre aux professionnels d’exprimer facilement leur besoin, même lorsqu’ils ne connaissent pas enco cerpt":"🤖 𝐋’𝐈𝐀 𝐫𝐞𝐝𝐨𝐧𝐧𝐞 𝐝𝐮 𝐭𝐞𝐦𝐩𝐬 𝐚𝐮𝐱 é𝐪𝐮𝐢𝐩𝐞𝐬 𝐜𝐨𝐦𝐦𝐞𝐫𝐜𝐢𝐚𝐥𝐞𝐬. Un fournisseur peut disposer de centaines de références. Lorsqu’un client formule un besoin précis, le commercial doit rapidement ","text":"🤖 𝐋’𝐈𝐀 𝐫𝐞𝐝𝐨𝐧𝐧𝐞 𝐝𝐮 𝐭𝐞𝐦𝐩𝐬 𝐚𝐮𝐱 é𝐪𝐮𝐢𝐩𝐞𝐬 𝐜𝐨𝐦𝐦𝐞𝐫𝐜𝐢𝐚𝐥𝐞𝐬.\n\nUn fournisseur peut disposer de centaines de références. \nLorsqu’un client formule un besoin précis, le commercial doit rapidement retrouver le bon produit et les informations nécessaires pour lui répondre :\n\n💰 le prix ;\n📐 les dimensions ;\n📦 le conditionnement ;\n📋 les caractéristiques techniques.\n\nCes données existent souvent, mais elles ne sont pas toujours accessibles au bon moment.\n\nGrâce à l’IA, un copilote de vente peut aider les équipes commerciales à naviguer plus facilement dans leur catalogue et à mieux exploiter les informations disponibles.\n\nSon utilité est concrète : réduire le temps consacré à la recherche pour laisser davantage de place au conseil, au suivi et à la négociation.\n\nLe copilote ne remplace ni la relation client ni la connaissance du terrain. Il accompagne le commercial et l’aide à préparer une réponse plus rapidement.\n\nC’est la logique du copilote de vente développé par BLOK TECHNOLOGY : mettre l’IA au service de l’efficacité commerciale des fournisseurs. 🚀\n\n#blok #intelligenceartificielle #copilotedevente #fournisseurs #btp #ia","pid":"7505539755795922944","chars":1122,"hashtags":6,"mentions":1,"link":false,"question":false,"lang":"FR","theme":"Produit & offre"},{"date":"2026-09-16","month":"2026-09","weekday":"Mercredi","hour":11,"reactions":24,"comments":0,"reposts":1,"eng":25,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_%F0%9D%90%91%F0%9D%90%9E%F0%9D%90%AD%F0%9D%90%A8%F0%9D%90%AE%F0%9D%90%AB-%F0%9D%90%9E%F0%9D%90%A7-%F0%9D%90%A2%F0%9D%90%A6%F0%9D%90%9A%F0%9D%90%A0%F0%9D%90%9E%F0%9D%90%AC-%F0%9D%90%AC%F0%9D%90%AE%F0%9D%90%AB-activity-7505951126890995712-pg4V?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYX ui rassemble les professionnels du BTP depuis plus de 90 ans, c’est nous rapprocher de ceux qui construisent au quotidien. 🏗️\n\n🎯 Notre objectif est clair : échanger sur leurs besoins, nouer des partenariats et créer de nouvelles opportunités pour simplifier les achats de matériaux.\n\nCette démarche s’est aussi illustrée au Salon des Infrastructures d'Abidjan\n\n🎤 Notre cofondateur et CEO, Yohann Behi, a participé au panel « Digitalisation et transformation numérique du BTP en Afrique : défis et opportunités ».\n\nL’occasion de présenter BLOK TECHNOLOGY et la manière dont nous utilisons la donnée et l’intelligence artificielle pour structurer les demandes de devis et faciliter la recherche de matériaux auprès des fournisseurs.\n\nPour nous, la transformation numérique du BTP se construit avec les professionnels du secteur, à partir de leurs réalités.\n\nMerci au GIBTP - Groupement Ivoirien du Bâtiment et des Travaux Publics pour son accueil et aux organisateurs du Salon des Infrastructures d'Abidjan pour ces échanges. 🙏\n\n#blok #gibtp #sia2026 #btp #digitalisation #intelligenceartificielle","pid":"7507729172597915648","chars":1182,"hashtags":6,"mentions":5,"link":false,"question":false,"lang":"FR","theme":"Événements"},{"date":"2026-09-22","month":"2026-09","weekday":"Mardi","hour":8,"reactions":30,"comments":3,"reposts":1,"eng":34,"media":"img","url":"https://www.linkedin.com/posts/blokafrica_bloktechnology-teamblok-businessdevelopment-activity-7508080536142323714-f_Ei?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"👤 𝐏𝐨𝐫𝐭𝐫𝐚𝐢𝐭 𝐜𝐨𝐥𝐥𝐚𝐛𝐨𝐫𝐚𝐭𝐫𝐢𝐜𝐞 | À 𝐥𝐚 𝐫𝐞𝐧𝐜𝐨𝐧𝐭𝐫𝐞 𝐝'Aïroun Laïla Cissé, 𝐁𝐮𝐬𝐢𝐧𝐞𝐬𝐬 𝐃𝐞𝐯𝐞𝐥𝐨𝐩𝐞𝐫 𝐜𝐡𝐞𝐳 BLOK TECHNOLOGY 🚀 𝐄𝐧 𝐪𝐮𝐞𝐥𝐪𝐮𝐞𝐬 𝐦𝐨𝐭𝐬, 𝐪𝐮𝐞𝐥 𝐞𝐬𝐭 𝐭𝐨𝐧 𝐫ô𝐥𝐞 𝐜𝐡𝐞𝐳 𝐁𝐋𝐎𝐊 𝐓𝐞𝐜𝐡𝐧𝐨𝐥𝐨𝐠𝐲 ? Mon rôle consi","text":"👤 𝐏𝐨𝐫𝐭𝐫𝐚𝐢𝐭 𝐜𝐨𝐥𝐥𝐚𝐛𝐨𝐫𝐚𝐭𝐫𝐢𝐜𝐞 | À 𝐥𝐚 𝐫𝐞𝐧𝐜𝐨𝐧𝐭𝐫𝐞 𝐝'Aïroun Laïla Cissé, 𝐁𝐮𝐬𝐢𝐧𝐞𝐬𝐬 𝐃𝐞𝐯𝐞𝐥𝐨𝐩𝐞𝐫 𝐜𝐡𝐞𝐳 BLOK TECHNOLOGY \n\n🚀 𝐄𝐧 𝐪𝐮𝐞𝐥𝐪𝐮𝐞𝐬 𝐦𝐨𝐭𝐬, 𝐪𝐮𝐞𝐥 𝐞𝐬𝐭 𝐭𝐨𝐧 𝐫ô𝐥𝐞 𝐜𝐡𝐞𝐳 𝐁𝐋𝐎𝐊 𝐓𝐞𝐜𝐡𝐧𝐨𝐥𝐨𝐠𝐲 ?\n\nMon rôle consiste à identifier de nouvelles opportunités et à concevoir des stratégies pour soutenir la croissance de l’entreprise.\nJ’interviens également dans leur mise en œuvre, en collaboration avec les différentes équipes, afin de transformer les orientations définies en actions concrètes et en résultats.\n\n📈 𝐐𝐮𝐞𝐥𝐥𝐞 𝐦𝐢𝐬𝐬𝐢𝐨𝐧 𝐭’𝐚 𝐥𝐞 𝐩𝐥𝐮𝐬 𝐦𝐚𝐫𝐪𝐮é𝐞 𝐝𝐞𝐩𝐮𝐢𝐬 𝐭𝐨𝐧 𝐚𝐫𝐫𝐢𝐯é𝐞 ?\n\nLa conception d’une stratégie de restructuration interne dès mon arrivée chez BLOK Technology.\n\nCe projet m’a permis d’analyser notre organisation, d’identifier les axes d’amélioration et de proposer une nouvelle méthode de travail pour accompagner le développement de l’entreprise.\n\nAujourd’hui, je pilote sa mise en œuvre avec les équipes. Cette mission est particulièrement importante pour moi, car ses effets se traduisent directement dans notre manière de travailler et d’avancer collectivement.\n\n⚽ 𝐒𝐢 𝐭𝐞𝐬 𝐜𝐨𝐥𝐥è𝐠𝐮𝐞𝐬 𝐝𝐞𝐯𝐚𝐢𝐞𝐧𝐭 𝐭𝐞 𝐝é𝐜𝐫𝐢𝐫𝐞 𝐞𝐧 𝐭𝐫𝐨𝐢𝐬 𝐦𝐨𝐭𝐬 ?\n\nAttaquante centrale, exigeante et dynamique.\n\nAttaquante centrale, parce que j’aime aller droit au but, saisir les opportunités et faire avancer les projets. Affirmée, parce que je sais prendre des décisions et défendre une direction lorsqu’elle me semble nécessaire. Dynamique, parce que j’apporte de l’énergie dans tout ce que j’entreprends.\n\n💡 𝐐𝐮𝐞𝐥 𝐦𝐨𝐭 𝐫𝐞𝐩𝐫é𝐬𝐞𝐧𝐭𝐞 𝐥𝐞 𝐦𝐢𝐞𝐮𝐱 𝐁𝐋𝐎𝐊 𝐓𝐞𝐜𝐡𝐧𝐨𝐥𝐨𝐠𝐲 𝐬𝐞𝐥𝐨𝐧 𝐭𝐨𝐢 ?\n\nCroissance.\n\nParce que BLOK TECHNOLOGY est une entreprise qui évolue rapidement, se structure et cherche constamment de nouvelles façons de développer son activité.\n\nÀ travers son énergie et sa vision stratégique, Laïla contribue à structurer notre développement et à transformer nos ambitions en actions concrètes.\n\n👏 Merci Laïla pour ton engagement, ton énergie et ta contribution au développement de BLOK TECHNOLOGY !\n\n#bloktechnology #teamblok #businessdevelopment #croissance #startup #cotedivoire","pid":"7508080536142323714","chars":2005,"hashtags":6,"mentions":4,"link":false,"question":false,"lang":"FR","theme":"Non classé"},{"date":"2026-09-24","month" personne avec qui vous faites affaire — avant de lui ouvrir un compte, d'accepter un paiement, ou de signer un contrat.\n\nConcrètement, ça veut dire :\n→ Vérifier que votre client est bien qui il dit être \n→ Authentifier sa pièce d'identité (CNI, passeport…) \n→ Contrôler qu'il n'apparaît pas sur des listes de sanctions ou de personnes politiquement exposées\n→ Conserver les preuves en cas de contrôle BCEAO\n\nQui est concerné dans l'UEMOA ? Banques, fintechs, assurances, immobilier, gaming, microfinances. 🌍\n\nSans KYC conforme, vous exposez votre entreprise à des sanctions, des fraudes non détectées et une réputation fragilisée auprès de vos investisseurs.\n\nLa bonne nouvelle 🎯 : cette vérification peut aujourd'hui se faire en moins de 2 minutes. Sans paperasse. Sans friction.\n\nLa conformité ne doit plus être un frein — c'est un avantage compétitif.\nVous avez des questions sur vos obligations KYC ? Posez-les en commentaire 👇\n\nVisitez www.danaya.africa pour toute info.\n\n#KYC #Conformité #Fintech #BCEAO #UEMOA #RegTech","pid":"7443295909292969985","chars":1217,"hashtags":6,"mentions":0,"link":false,"question":true,"lang":"FR","theme":"Produit & offre"},{"date":"2026-04-01","month":"2026-04","weekday":"Mercredi","hour":12,"reactions":13,"comments":0,"reposts":0,"eng":13,"media":"img","url":"https://www.linkedin.com/posts/danayacompliance_kyb-conformitaez-fintech-activity-7445085343583809536-pVjR?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Le KYC, tout le monde en parle. Mais le KYB ? Beaucoup moins. 🏢 KYB = « Know Your Business » C'est l'équivalent du KYC — mais pour les entreprises. Quand votre client n'est pas un ","text":"Le KYC, tout le monde en parle. Mais le KYB ? Beaucoup moins. 🏢\n\nKYB = « Know Your Business » C'est l'équivalent du KYC — mais pour les entreprises.\n\nQuand votre client n'est pas un particulier mais une société, une PME ou un partenaire commercial, le KYB s'applique. Il s'agit de vérifier que l'entité juridique avec laquelle vous travaillez est bien ce qu'elle prétend être.\n\nPourquoi ignorer le KYB est risqué ? ⚠️\nDes entreprises fictives, des RCCM falsifiés, des structures écrans montées pour blanchir de l'argent — ça existe. Sans vérification, vous vous exposez nous seulement à des fraudes, mais également à des partenariats illégaux, des risques de complicité de blanchiment et des sanctions réglementaires lourdes.\n\nLa particularité de Danaya 🇨🇮 : nous nous connectons directement aux bases officielles ivoiriennes — RCCM, DFE — pour une vérification KYB en temps réel, 100% locale.\n\nParce qu'en Afrique francophone, la conformité doit être pensée africaine.\nVérifiez-vous systématiquement vos partenaires commerciaux avant de signer ?\n\nPour en savoir plus, contactez nous sur 225 0700788342 ou www.danaya.africa\n\n#KYB #Conformité #Fintech #BCEAO #Afrique #RegTech #Danaya #ConformiteDigitale #KYC #KYB #AML #RegTech #FintechAfrica #Compliance\n#DigitalTransformation","pid":"7445085343583809536","chars":1277,"hashtags":15,"mentions":0,"link":false,"question":true,"lang":"FR","theme":"Levée & partenariats"},{"date":"2026-04-07","month":"2026-04","weekday":"Mardi","hour":6,"reactions":11,"comments":0,"reposts":0,"eng":11,"media":"img","url":"https://www.linkedin.com/posts/danayacompliance_gitexafrica-gitexafrica2026-techafrica-activity-7447168921985630208-YKsM?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Nous sommes fiers d’annoncer notre participation au GITEX Africa 2026, grand événement tech & startup du continent, qui se tiendra du 7 au 9 avril 2026 à Marrakech. Une occasion un","text":"Nous sommes fiers d’annoncer notre participation au GITEX Africa 2026, grand événement tech & startup du continent, qui se tiendra du 7 au 9 avril 2026 à Marrakech.\n\nUne occasion unique d’échanger autour des enjeux majeurs de la conformité digitale en Afrique et de
