la traçabilité des diligences réalisées.\n\nAvec Danaya, banques, IMF, fintechs et assurances automatisent leurs contrôles KYC, KYB et AML/FT en moins d'une minute et disposent d'une piste d'audit complète en cas de contrôle réglementaire.\n\nLa conformité n'est plus seulement une obligation. Via Danaya, c'est une protection.\n#AML #LCBFT #KYC #KYB #Compliance #Fintech #Banque #Microfinance #Danaya #BCEAO #CENTIF","pid":"7472221338053824512","chars":995,"hashtags":11,"mentions":2,"link":false,"question":false,"lang":"FR","theme":"Événements"},{"date":"2026-06-23","month":"2026-06","weekday":"Mardi","hour":8,"reactions":7,"comments":0,"reposts":0,"eng":7,"media":"texte","url":"https://www.linkedin.com/posts/danayacompliance_bceao-uemoa-inclusionfinanciere-activity-7475099113286713346-I_wy?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"📊 73,6 % C'est le taux d'inclusion financière atteint dans l'UEMOA en 2024, selon le dernier rapport de la BCEAO (compte officiel) sur la situation de l'inclusion financière. Une p","text":"📊 73,6 %\n\nC'est le taux d'inclusion financière atteint dans l'UEMOA en 2024, selon le dernier rapport de la BCEAO (compte officiel) sur la situation de l'inclusion financière.\nUne progression remarquable qui confirme la transformation rapide du secteur financier en Afrique de l'Ouest 🚀 .\n\nMais derrière cette bonne nouvelle se cache un défi majeur.\nChaque nouveau client intégré dans le système financier doit être identifié, vérifié et accompagné dans le respect des exigences réglementaires.\nPlus l'inclusion progresse, plus les institutions financières doivent être capables de :\n\n✅ vérifier rapidement les identités (KYC / KYB);\n✅ lutter contre la fraude documentaire et l'usurpation d'identité ;\n✅ réaliser leurs contrôles AML/FT ;\n✅ conserver une preuve auditable des diligences effectuées.\nL'enjeu n'est donc plus seulement d'ouvrir davantage de comptes.\nL'enjeu est de permettre un accès rapide, sécurisé et conforme aux services financiers.\n\nChez Danaya, nous sommes convaincus que l'inclusion financière durable passe par une identité numérique fiable et une conformité accessible à tous les acteurs du marché.\nC'est pourquoi nous développons une infrastructure de confiance conçue en Afrique, pour l'Afrique, capable de prendre en charge les documents, les exigences réglementaires et les réalités opérationnelles du continent.\n\nLa confiance n'est pas un frein à l'inclusion.\nElle en est le fondement.\n\n#BCEAO #UEMOA #InclusionFinanciere #KYC #KYB #AML #Conformité #Fintech #IMF #DigitalIdentity #Danaya","pid":"7475099113286713346","chars":1515,"hashtags":11,"mentions":2,"link":false,"question":false,"lang":"FR","theme":"Convictions & analyses"},{"date":"2026-07-10","month":"2026-07","weekday":"Vendredi","hour":16,"reactions":39,"comments":0,"reposts":3,"eng":42,"media":"img","url":"https://www.linkedin.com/posts/danayacompliance_danaya-atco-grco-activity-7481385405926387715-Ui8a?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Danaya a eu l'honneur de participer à la Grande Rencontre des Compliance Officers, organisée par l'ATCO à Lomé. Dans un monde où les risques évoluent sans cesse, la conformité n'es","text":"Danaya a eu l'honneur de participer à la Grande Rencontre des Compliance Officers, organisée par l'ATCO à Lomé.\n\nDans un monde où les risques évoluent sans cesse, la conformité n'est plus une simple obligation réglementaire : elle est devenue un véritable levier de confiance, d'innovation et de développement économique.\n\nCes deux journées d'échanges ont démontré qu'en réunissant autorités, institutions financières, experts et acteurs technologiques, il est possible de construire ensemble un écosystème plus sûr, plus inclusif et plus résilient pour l'Afrique.\n\nUn immense merci à l'Association Togolaise des Compliance Officers (ATCO) pour l'organisation exemplaire de cette rencontre, ainsi qu'à l'ensemble des orateurs pour la qualité de leurs interventions, leur expertise et leur volonté de partager leurs expériences.\n\nChez Danaya, nous sommes fiers de contribuer, aux côtés de tous ces acteurs engagés, au développement d'une identité numérique de confiance et d'outils de conformité qui favorisent à la fois la sécurité, l'inclusion financière et la croissance du continent.\nParce que la confiance est le socle de toute économie moderne. Et qu'ensemble, nous pouvons faire de l'Afrique une référence mondiale en matière de conformité et d'innovation.\n#Danaya #ATCO #GRCO #Compliance #AML #KYC #RegTech #DigitalIdentity #FinancialInclusion #Trust #Africa","pid":"7481385405926387715","chars":1365,"hashtags":11,"mentions":2,"link":false,"question":false,"lang":"FR","theme":"Non classé"},{"date":"2026-09-15","month":"2026-09","weekday":"Mardi","hour":10,"reactions":11,"comments":1,"reposts":0,"eng":12,"media":"img","url":"https://www.linkedin.com/posts/danayacompliance_danaya-impactia2026-intelligenceartificielle-activity-7505567304118824960-DL6j?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Danaya était présente à la 2e Conférence Nationale sur l’Intelligence Artificielle – IMPACT IA 2026 à Abidjan. Chez Danaya, nous sommes convaincus que l’IA seule ne suffit pas. La ","text":"Danaya était présente à la 2e Conférence Nationale sur l’Intelligence Artificielle – IMPACT IA 2026 à Abidjan.\nChez Danaya, nous sommes convaincus que l’IA seule ne suffit pas.\nLa puissance de notre solution repose sur la combinaison de plusieurs sources :\n🔹 bases de données gouvernementales, \n🔹 bases de données publiques ;\n🔹 bases de données privées ;\n🔹 et intelligence artificielle, pour croiser, analyser et interpréter ces informations avec toujours plus de rapidité et de précision.\n\nC’est cette combinaison Données + IA qui nous permet d’apporter aux entreprises et institutions une solution complète de KYC, KYB et AML/CFT, adaptée aux réalités de l’Afrique de l’Ouest.\nAujourd’hui, Danaya est la solution de conformité de référence pour les entreprises opérant dans les pays de la BCEAO.\n\nVérification d’identité, vérification d’entreprises, screening AML/CFT, biométrie, détection d’incohérences, score de conformité et monitoring continu : notre plateforme rassemble les outils nécessaires pour sécuriser l'enregistrement et les relations d’affaires.\n\nLes données apportent la matière.\nL’IA permet de l’analyser.\nDanaya transforme les deux en confiance.\nDanaya — La conformité de référence dans l’espace BCEAO.\n#Danaya #ImpactIA2026 #IntelligenceArtificielle #BCEAO #UEMOA #KYC #KYB #AML #Compliance #RegTech #Fintech #Afrique #Abidjan","pid":"7505567304118824960","chars":1347,"hashtags":13,"mentions":0,"link":false,"question":false,"lang":"FR","theme":"Produit & offre"},{"date":"2026-09-28","month":"2026-09","weekday":"Lundi","hour":14,"reactions":19,"comments":0,"reposts":2,"eng":21,"media":"img","url":"https://www.linkedin.com/posts/danayacompliance_ais2026-aitekinnovationsummit-fintech-activity-7510346091633041408-7a36?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Vérifier un client, puis encaisser son paiement. Entre les deux, la fraude trouve souvent une porte. Le vendredi 2 octobre, à l'AITEK Innovation Summit, Danaya et Jèko animent ense","text":"Vérifier un client, puis encaisser son paiement. Entre les deux, la fraude trouve souvent une porte.\n\nLe vendredi 2 octobre, à l'AITEK Innovation Summit, Danaya et Jèko animent ensemble une masterclass sur cette chaîne :\n« Du client vérifié au paiement encaissé : deux plateformes ivoiriennes, une seule chaîne, et l'IA qui la surveille »\n\n🪪 Danaya vérifie l'identité des clients et la conformité des entreprises (KYC, KYB, LCB-FT) pour les institutions financières de l'UEMOA.\n\n💳 Jèko permet aux commerçants d'encaisser le Mobile Money et les cartes sur une seule solution.\n\n🔍 La séance montre comment l'entrée client et l'encaissement se tiennent, où la fraude se glisse, et comment l'IA aide à la repérer sans ralentir les ventes.\n\n🎯 Elle s'adresse aux banques, aux assurances, aux télécoms et aux grands distributeurs.\n\n🎤 Idriss Marcial MONTHE, cofondateur et CEO de Jèko\n🎤 Gauthier de Gerlache, cofondateur et CEO de Danaya\n🎙️ Animation : Leslie Ossete Ossété, cofondatrice et COO de Mstudio\n\n📅 Vendredi 2 octobre, de 12h à 13h\n📍 Siège AITEK, Zone 4, Abidjan (Roof, salle Esprit d'Équipe)\n👥 100 places\n\n🎟️ 1. Inscription au summit (gratuite) 👉 https://lnkd.in/ecAhcKcp\n🎓 2. Réservation de la masterclass dans l'agenda 👉 https://lnkd.in/eRYJg88r\n\n#AIS2026 #AitekInnovationSummit #Fintech #KYC #CoteDIvoire","pid":"7510346091633041408","chars":1309,"hashtags":5,"mentions":6,"link":true,"question":false,"lang":"FR","theme":"Produit & offre"}],"totals":{"n":16,"reactions":193,"comments":7,"reposts":8,"eng":208,"medRx":10,"avgRx":12},"months":[{"key":"2026-02","label":"Février","n":1,"reactions":15,"comments":2,"reposts":1,"eng":18,"medRx":15,"avgRx":15},{"key":"2026-03","label":"Mars","n":1,"reactions":15,"comments":3,"reposts":1,"eng":19,"medRx":15,"avgRx":15},{"key":"2026-04","label":"Avril","n":5,"reactions":51,"comments":1,"reposts":1,"eng":53,"medRx":11,"avgRx":10},{"key":"2026-05","label":"Mai","n":4,"reactions":26,"comments":0,"reposts":0,"eng":26,"medRx":6,"avgRx":6},{"key":"2026-06","label":"Juin","n":2,"reactions":17,"comments":0,"reposts":0,"eng":17,"medRx":8,"avgRx":8},{"key":"2026-07","label":"Juillet","n":1,"reactions":39,"comments":0,"reposts":3,"eng":42,"medRx":39,"avgRx":39},{"key":"2026-09","label":"Septembre","n":2,"reactions":30,"comments":1,"reposts":2,"eng":33,"medRx":15,"avgRx":15}],"themes":[{"k":"Produit & offre","n":3,"reactions":45,"comments":4,"reposts":3,"eng":52,"medRx":15,"avgRx":15,"key":"Produit & offre"},{"k":"Levée & partenariats","n":1,"reacti ent” en dioula : tout ce qui t","text":"JÈKO, c’est plus qu’un nom.\nC’est une vision.\nLe \"J\"de Jèko se transforme en un billet de banque. \nIssu du mot \"djè\", JÈKO renvoie aux “choses de l’argent” en dioula : tout ce qui touche à la gestion, à la circulation et à l’usage de l’argent au quotidien.\n\n Notre ambition ? \nSimplifier le paiement digital pour bancariser les commerçants africains et faciliter leur accès au crédit. \nPrêt à booster le \"djè\" des petits commerces ?\nwww.jeko.africa\n#francophoneafrica #fintech #paiements #digital","pid":"7450243668000747520","chars":496,"hashtags":4,"mentions":0,"link":false,"question":true,"lang":"FR","theme":"Produit & offre"},{"date":"2026-04-18","month":"2026-04","weekday":"Samedi","hour":10,"reactions":61,"comments":6,"reposts":2,"eng":69,"media":"img","url":"https://www.linkedin.com/posts/idrissmarcialmonthe_jaeyko-oapi-mstudio-activity-7451209252574183424-np0g?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"A l'origine du projet Jèko, le nom qui avait retenu le plus grand nombre de vote était \"mondjai\", mais après plusieurs recherches au niveau de l'OAPI et l'OMPI nous avons constaté ","text":"A l'origine du projet Jèko, le nom qui avait retenu le plus grand nombre de vote était \"mondjai\", mais après plusieurs recherches au niveau de l'OAPI et l'OMPI nous avons constaté que ce nom avait déjà été enregistré par une entreprise Ivoirienne.  Nous avons refait un nouveau sondage et le nom Jèko a fait l'unanimité.  \nVous voyez bien l'importance de faire des recherches avant le choix du nom de votre projet. \n#jèko #oapi #mstudio","pid":"7451209252574183424","chars":436,"hashtags":3,"mentions":0,"link":false,"question":false,"lang":"FR","theme":"Non classé"},{"date":"2026-04-18","month":"2026-04","weekday":"Samedi","hour":12,"reactions":41,"comments":0,"reposts":1,"eng":42,"media":"img","url":"https://www.linkedin.com/posts/idrissmarcialmonthe_je tivity-7463215413699604480-cLR_?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"💳 Et si encaisser devenait aussi simple qu’envoyer un lien ? Avec le lien de paiement de JEKO, vos clients paient facilement avec le moyen de paiement de leur choix : Mobile Money,","text":"💳 Et si encaisser devenait aussi simple qu’envoyer un lien ?\nAvec le lien de paiement de JEKO, vos clients paient facilement avec le moyen de paiement de leur choix : Mobile Money, carte bancaire et bien plus encore.\n✨ Ce qui fait la différence ?\n✅ Encaissez tous les moyens de paiement sur un seul lien\n✅ Personnalisez votre logo et vos couleurs pour renforcer la confiance de vos clients\n✅ Partagez votre lien partout : WhatsApp, Facebook, Instagram, SMS ou email\n✅ Recevez vos paiements rapidement et suivez tout en temps réel\nPlus qu’un simple lien de paiement, JEKO vous aide à vendre avec plus de confiance, plus de simplicité et une meilleure expérience client.\n🚀 Avec Jèko, transformez chaque conversation en opportunité de paiement.","pid":"7463215413699604480","chars":741,"hashtags":0,"mentions":1,"link":false,"question":false,"lang":"FR","theme":"Produit & offre"},{"date":"2026-05-24","month":"2026-05","weekday":"Dimanche","hour":13,"reactions":27,"comments":0,"reposts":0,"eng":27,"media":"img","url":"https://www.linkedin.com/posts/idrissmarcialmonthe_activity-7464306205457317888-uHsJ?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"","text":"","pid":"7464306205457317888","chars":0,"hashtags":0,"mentions":0,"link":false,"question":false,"lang":"FR","theme":"Non classé"},{"date":"2026-05-27","month":"2026-05","weekday":"Mercredi","hour":7,"reactions":19,"comments":1,"reposts":2,"eng":22,"media":"img","url":"https://www.linkedin.com/posts/idrissmarcialmonthe_activity-7465296254860816384-IC04?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J a été reçu, sans avoir à vérifier son téléphone ou attendre un SMS.\n\nRésultat : moins d'erreurs, moins de contestations et plus de confiance dans chaque encaissement.\n\nParce que vous avez déjà assez d'efforts à fournir pour développer votre activité.\n\nJEKO — Encaissez votre djè sans forcer.\n\n#JEKO #PaiementDigital #Fintech #MobileMoney #CarteBancaire #Retail #Commerce #Afrique #Innovation #business","pid":"7467885634456850432","chars":1388,"hashtags":10,"mentions":0,"link":false,"question":false,"lang":"FR","theme":"Produit & offre"},{"date":"2026-06-16","month":"2026-06","weekday":"Mardi","hour":13,"reactions":72,"comments":2,"reposts":2,"eng":76,"media":"img","url":"https://www.linkedin.com/posts/idrissmarcialmonthe_cet-apr%C3%A8s-midi-nous-%C3%A9tions-%C3%A0-orange-digital-activity-7472646562687574017-CGtb?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Cet après-midi nous étions à Orange Digital Center en France dans le cadre de notre participation à VivaTech et nous avons parlé des challenges sur les sujets d'actualité que sont:","text":"Cet après-midi nous étions à Orange Digital Center en France dans le cadre de notre participation à VivaTech  et nous avons parlé des challenges sur les sujets d'actualité que sont: l'intelligence artificielle, la cybersecurite, l'expérience client et enfin la santé et la culture.  \nmerci à Orange Cote d'Ivoire","pid":"7472646562687574017","chars":312,"hashtags":0,"mentions":2,"link":false,"question":false,"lang":"FR","theme":"Événements"},{"date":"2026-06-17","month":"2026-06","weekday":"Mercredi","hour":20,"reactions":117,"comments":1,"reposts":3,"eng":121,"media":"img","url":"https://www.linkedin.com/posts/idrissmarcialmonthe_hier-avant-le-d%C3%A9but-de-vivatech-deux-startups-activity-7473103302075850752-StVj?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"hier avant le début de VivaT ,"month":"2026-01","weekday":"Vendredi","hour":19,"reactions":352,"comments":9,"reposts":3,"eng":364,"media":"img","url":"https://www.linkedin.com/posts/stane-blegbo_on-peut-tromper-1-fois-1000-clients-mais-activity-7415470636934094848-ox5E?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"On peut tromper 1 fois 1000 clients, mais jamais 1000 fois le même client. 🥵 Aujourd’hui, nous avons célébré la 1000ᵉ commande d'Africafé, via l’application Djoli. Merci à toute l'","text":"On peut tromper 1 fois 1000 clients,\nmais jamais 1000 fois le même client. 🥵\n\nAujourd’hui, nous avons célébré la 1000ᵉ commande d'Africafé, via l’application Djoli.\nMerci à toute l'équipe Africafé pour la confiance quotidienne.","pid":"7415470636934094848","chars":227,"hashtags":0,"mentions":2,"link":false,"question":false,"lang":"FR","theme":"Produit & offre"},{"date":"2026-01-20","month":"2026-01","weekday":"Mardi","hour":17,"reactions":148,"comments":4,"reposts":0,"eng":152,"media":"img","url":"https://www.linkedin.com/posts/stane-blegbo_retour-au-lyc%C3%A9e-international-jean-mermoz-activity-7419426618353451008-1tR8?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Retour au Lycée International Jean Mermoz, près de 30 ans après, pour parler d’intelligence artificielle aux élèves 🤖 J’y ai vécu de très belles années. Et pourtant, je n’étais ni ","text":"Retour au Lycée International Jean Mermoz, près de 30 ans après, pour parler d’intelligence artificielle aux élèves 🤖\n\nJ’y ai vécu de très belles années.\nEt pourtant, je n’étais ni bon en mathématiques, ni à l’aise en anglais.\nRien ne me prédestinait à évoluer dans la tech ou l’IA.\n\nCe qui fait la différence, ce n’est pas ce que vous savez à un instant donné.\nC’est votre capacité à accepter ce que vous devez devenir.\n\nAccepter de changer maintenant \nAccepter d’apprendre toute votre vie\nAccepter de sortir des cases dans lesquelles on vous a parfois rangés trop tôt.\n\nMerci à l’Association des anciens élèves pour son engagement à créer ces ponts entre générations 🤝\n\nAux élèves : votre avenir ne se joue pas sur vos lacunes actuelles, mais sur votre capacité à évoluer.","pid":"7419426618353451008","chars":774,"hashtags":0,"mentions":0,"link":false,"question":false,"lang":"FR","theme":"Non classé"},{"date":"2026-02-11","month":"2026-02","weekday":"Mercredi","hour":9,"reactions":209,"comments":6,"reposts":7,"eng":222,"media":"img","url":"https://www.linkedin.com/posts/stane-blegbo_25-milliards-dafricains-%C3%A0-nourrir-en-activity-7427275910615089152-HM2C?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"💥 2,5 milliards d’Africains à nourrir en 2050. Ce chiffre me frappe à chaque fois. Nos systèmes alimentaires sont-ils prêts ? Des décisions que nous n’avons pas prises. Et donc des","text":"💥 2,5 milliards d’Africains à nourrir en 2050. Ce chiffre me frappe à chaque fois.\nNos systèmes alimentaires sont-ils prêts ?\n\nDes décisions que nous n’avons pas prises.\nEt donc des actes à poser maintenant.\nCertains n’attendent pas.\nN’attendent plus.\n\nLors du Prix Jeunes Espoirs 2025, j’ai vu des entrepreneurs déjà au travail. Former. Innover. Transformer.\nDes solutions concrètes, déjà en œuvre.\nL’avenir alimentaire de l’Afrique ne se décrète pas.\nIl se construit.  \n\n📍 Yamoussoukro – 6 février : L’ESA de l’INPHB\n🇩🇿🇧🇫🇨🇲🇨🇮🇲🇬🇨🇩 Bravo et merci à vous.","pid":"7427275910615089152","chars":554,"hashtags":0,"mentions":0,"link":false,"question":false,"lang":"FR","theme":"Levée & partenariats"},{"date":"2026-02-23","month":"2026-02","weekday":"Lundi","hour":18,"reactions":482,"comments":21,"reposts":10,"eng":513,"media":"img","url":"https://www.linkedin.com/posts/stane-blegbo_agritech-data-impact-activity-7431771386496315392-3G50?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"L’histoire d’une promesse faite à Toumodi il y a plus d’un an. Pré-financer nos meilleurs producteurs de fruits et légumes. Pas à l’intuition. Grâce à la donnée. 3 années d’histori","text":"L’histoire d’une promesse faite à Toumodi il y a plus d’un an.\n\nPré-financer nos meilleurs producteurs de fruits et légumes.\nPas à l’intuition.\nGrâce à la donnée.\n\n3 années d’historique.\nDes données collectées, structurées et analysées.\nUn scoring de performance objectif.\n\nBravo à Ayewo , partenaire financier engagé à nos côtés.\n\nChez Djoli , nous ne faisons pas de la distribution.\nNous construisons une infrastructure agricole pilotée par la data pour nourrir durablement nos populations.\n\n#AgriTech #Data #Impact #DJOLI #fintech","pid":"7431771386496315392","chars":533,"hashtags":5,"mentions":2,"link":false,"question":false,"lang":"FR","theme":"Non classé"},{"date":"2026-03-23","month":"2026-03","weekday":"Lundi","hour":9,"reactions":90,"comments":3,"reposts":1,"eng":94,"media":"img","url":"https://www.linkedin.com/posts/stane-blegbo_grand-lahou-4-mars-2026-comment-allez-vous-activity-7441777722839724032-KMll?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🌊 Grand-Lahou, 4 mars 2026. “Comment allez-vous vendre toute votre production?” 40 producteurs et une journée dédiée à l’accès au marché et aux partenariats commerciaux. Dans le ca","text":"🌊 Grand-Lahou, 4 mars 2026.\n“Comment allez-vous vendre toute votre production?”\n40 producteurs et une journée dédiée à l’accès au marché et aux partenariats commerciaux.\n\nDans le cadre du programme WACA, aux côtés de la cellule Sauvegarde Sociale et des membres de la plateforme Forêt Communautaire.\n\nChez Djoli, on croit que la tech agricole ne vaut rien sans le lien humain qui la précède.\nAccès au marché. Structuration. Partenariats durables.\n\nC’est notre terrain. \nC’est notre rôle.","pid":"7441777722839724032","chars":487,"hashtags":0,"mentions":1,"link":false,"question":false,"lang":"FR","theme":"Levée & partenariats"},{"date":"2026-04-22","month":"2026-04","weekday":"Mercredi","hour":8,"reactions":114,"comments":4,"reposts":1,"eng":119,"media":"img","url":"https://www.linkedin.com/posts/stane-blegbo_djoli-activity-7452627513085919232-cMFm?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"À notre productrice de Gbofia. 6 mois pour un crédit de 300.000 fcfa. Refusé. Pas parce qu’elle est risquée mais parcequ’elle est invisible. Pas de parcelle géolocalisée. Pas d’his","text":"À notre productrice de Gbofia.\n6 mois pour un crédit de 300.000 fcfa. Refusé.\nPas parce qu’elle est risquée mais parcequ’elle est invisible.\n\nPas de parcelle géolocalisée. Pas d’historique. Zéro vente tracée. Zéro flux documenté.\n\nTa data = ton collatéral.\nNous allons te rendre lisible, crédible. 😉\n#djoli","pid":"7452627513085919232","chars":306,"hashtags":1,"mentions":0,"link":false,"question":false,"lang":"FR","theme":"Non classé"},{"date":"2026-04-25","month":"2026-04","weekday":"Samedi","hour":8,"reactions":198,"comments":4,"reposts":1,"eng":203,"media":"img","url":"https://www.linkedin.com/posts/stane-blegbo_agritech-djoli-caektedivoire-activity-7453727768799920128-oCAO?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Boss tu n’avais pas dit ça 🤣 On avait dit “mission data à Yamoussoukro”. Nos data scientists pensaient : laptop, Clim, pizza à l’hôtel président. La réalité : bottes, soleil, les b","text":"Boss tu n’avais pas dit ça 🤣\nOn avait dit “mission data à Yamoussoukro”.\nNos data scientists pensaient : laptop, Clim, pizza à l’hôtel président.\n\nLa réalité : bottes, soleil, les branches, les « mangnans » (grosses fourmis 🐜 qui piquent) et un producteur qui demande pourquoi on prend en photo ses tomates.🍅 \n\nChez DJOLI, la donnée se collecte là où elle pousse.\nPas dans un dashboard. Dans un champ.\nPhysiquement, avec un smartphone, un drone ou les satellites. 🛰️ \n#Agritech #DJOLI #CôteDIvoire #epitech","pid":"7453727768799920128","chars":506,"hashtags":4,"mentions":0,"link":false,"question":false,"lang":"FR","theme":"Convictions & analyses"},{"date":"2026-04-30","month":"2026-04","weekday":"Jeudi","hour":16,"reactions":223,"comments":8,"reposts":4,"eng":235,"media":"img","url":"https://www.linkedin.com/posts/stane-blegbo_djoli-yiri-agl-activity-7455656810021285889-3wwY?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"La logistique vivrière en Afrique est cassée. Avec Yiri by AGL on a décidé de la réparer. Aujourd'hui, on franchit une nouvelle étape : Djoli rejoint Yiri, le centre d'innovation d","text":"La logistique vivrière en Afrique est cassée. \nAvec Yiri by AGL on a décidé de la réparer.\nAujourd'hui, on franchit une nouvelle étape : Djoli rejoint Yiri, le centre d'innovation d'Africa Global Logistics, 49 pays, des ports, des trains, des camions. \nL'épine dorsale logistique du continent.\n\nDJOLI, c'est le maillon que personne n'avait encore résolu : faire arriver ce que produisent nos paysans jusqu'aux assiettes de nos villes. \nSans pertes, sans ruptures, et des producteurs qui vivent de leur travail.\nLa donnée et l'IA comme infrastructure invisible. \nLa logistique comme colonne vertébrale.\n\nNourrir les villes africaines avec ce que produit l'Afrique.\nC'est ça, le chantier.\n\n#DJOLI #Yiri #AGL #digitalafrica","pid":"7455656810021285889","chars":720,"hashtags":4,"mentions":2,"link":false,"question":false,"lang":"FR","theme":"Clients & terrain"},{"date":"2026-05-02","month":"2026-05","weekday":"Samedi","hour":10,"reactions":159,"comments":1,"reposts":3,"eng":163,"media":"img","url":"https://www.linkedin.com/posts/stane-blegbo_djoli-fin-sales-activity-7456293268880912384-cHpM?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Une #djoli Journée la pluie a 4 jours de retard, ça change le scénario. ▸ Affou double-check sa veille des prix, avec Marcel. ▸ Kadi est sur son 50e achat de la journée. ▸ Thomas i","text":"Une #djoli Journée\nla pluie a 4 jours de retard, ça change le scénario.\n\n▸ Affou double-check sa veille des prix, avec Marcel.\n▸ Kadi est sur son 50e achat de la journée.\n▸ Thomas intègre l'API de Sentinel-2 et recalcule la marge d'un SKU, la CM3 a bougé.\n▸ Divine est dans un village. Connexion 3G faible. Elle reprend l'architecture de notre onboarding producteur, avec Josué et Maël.\n▸ Et Stane. Il leur fait confiance. \nMême quand à 45 secondes de sa présentation, c'est pas \"push\".\nIl sait que Boubacar va envoyer \"c'est bon boss, c'est live\".\n\nC'est ça Djoli. Pas une promesse. Une team qui décide.\n\nOn passe à l'étape suivante. \n@ceux qui n'étaient pas premiers de la classe. \n@ceux qui continuent de respirer même quand ça tangue. \n@ceux qui savent qu'à 4h du matin avec Maman Sarah, on apprend.\n\nPlusieurs portes vont s'ouvrir. #fin #sales #ops #tech\n\nDîtes nous qui vous êtes ? Candidature libre, pas par whatsapp, pas inbox, uniquement via ce lien : https://lnkd.in/ermcN2T7 \n\n#hiring #recrute \nPartager 😉 taguer","pid":"7456293268880912384","chars":1023,"hashtags":7,"mentions":1,"link":true,"question":true,"lang":"FR","theme":"Produit & offre"},{"date":"2026-05-06","month":"2026-05","weekday":"Mercredi","hour":10,"reactions":239,"comments":10,"reposts":2,"eng":251,"media":"img","url":"https://www.linkedin.com/posts/stane-blegbo_pourquoi-un-ambassadeur-de-france-re%C3%A7oit-il-activity-7457741289753559041-KehZ?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Pourquoi un Ambassadeur de France reçoit-il une startup agritech ivoirienne ? Parce que ce qui se joue à Abidjan actuellement dépasse Abidjan. La souveraineté alimentaire africaine","text":"Pourquoi un Ambassadeur de France reçoit-il une startup agritech ivoirienne ?\nParce que ce qui se joue à Abidjan actuellement dépasse Abidjan.\n\nLa souveraineté alimentaire africaine est un enjeu stratégique partagé.\n\nCe matin, S.E.M. Jean-Christophe Belliard nous a reçus avec Pierre De Gaétan NJIKAM, PDG du Fonds Pierre Castel. Un échange sans langue de bois, sur le rôle de la tech, de la data, de l'IA pour structurer nos chaînes de valeur agricoles.\n\nGrâce à Thomas Giannetti, toute l'équipe, et vous, Djoli continue d'avancer.\nMerci au Fonds Pierre Castel pour la confiance accordée en nous désignant Lauréat panafricain 2025.","pid":"7457741289753559041","chars":632,"hashtags":0,"mentions":3,"link":false,"question":false,"lang":"FR","theme":"Levée & partenariats"},{"date":"2026-05-13","month":"2026-05","weekday":"Mercredi","hour":8,"reactions":270,"comments":4,"reposts":3,"eng":277,"media":"img","url":"https://www.linkedin.com/posts/stane-blegbo_djoli-africaforward-terrain-activity-7460251873376182272-Syd3?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Clap de fin sur le sommet Africa Forward.🌍 Djoli n’est pas venu ici pour collectionner 200 nouvelles cartes de visite. Mais pour bâtir des alliances qui tiennent la route et qui fo","text":"Clap de fin sur le sommet Africa Forward.🌍\n\nDjoli n’est pas venu ici pour collectionner 200 nouvelles cartes de visite. \nMais pour bâtir des alliances qui tiennent la route et qui font bouger les lignes.\n\nGrâce à l’invitation du Fonds Pierre Castel, j’ai pu porter la voix de nos producteurs là où les discussions comptent vraiment. \n\nParce qu'au final, le seul indicateur qui vaille, c’est l’impact réel sur le terrain, chez ceux qui nous nourrissent.\n\nOn repart avec de nouveaux partenaires, \nune vision affinée et une énergie décuplée.\nLe sommet s'arrête, le vrai travail reprend. \nOn pousse. 🇨🇮🚀\n\n#Djoli #AfricaForward #Terrain #Impact \n\nMerci à ceux qui ont fait de ces 2 jours un nouveau tremplin pour #djoli \n\nGregory CLERC  \nPierre De Gaétan NJIKAM \nÉlisabeth Moreno \nAli Mnif \nMoustapha Ibrahim Malloum \nYaya Ouattara  \nRalph OLAYÉ \nTeddy ROUX  \nLeslie Ossete  \nJohanne BRUFFAERTS  \nEt mes compagnons de BLOK et Flot.  \n\n🙏🏾","pid":"7460251873376182272","chars":932,"hashtags":5,"mentions":14,"link":false,"question":false,"lang":"FR","theme":"Clients & terrain"},{"date":"2026-05-28","month":"2026-05","weekday":"Jeudi","hour":14,"reactions":406,"comments":46,"reposts":16,"eng":468,"media":"img","url":"https://www.linkedin.com/posts/stane-blegbo_bad-djoli-tech4impact-activity-7465772523809513473--J6q?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Djoli à la BAD ? Et pourquoi ? Pour présenter sa technologie de mesure de l’impact aux administrateurs, gouverneurs et son Président - African Development Bank Group lors des Assem","text":"Djoli à la BAD ? \nEt pourquoi ? \n\nPour présenter sa technologie de mesure de l’impact aux administrateurs, gouverneurs et son Président - African Development Bank Group lors des Assemblées annuelles, à Brazzaville.\n\nGrâce à l’imagerie satellitaire, aux drones et à la data science, nos équipes ont mesuré et présenté l’impact des investissements réalisés par la #bad dans la région du Bélier (en Côte d’Ivoire).\n\nUne solution technologique africaine, made by #DJOLI, pour les projets à impact sur notre continent.  \n\nAccompagnez-moi pour féliciter la Team Djoli  👍🏾\n\nLa vidéo démo en commentaire. \n\n#tech4impact #afdb #BAD #data #tech #2PAI","pid":"7465772523809513473","chars":640,"hashtags":8,"mentions":3,"link":false,"question":false,"lang":"FR","theme":"Levée & partenariats"},{"date":"2026-06-19","month":"2026-06","weekday":"Vendredi","hour":14,"reactions":60,"comments":1,"reposts":1,"eng":62,"media":"img","url":"https://www.linkedin.com/posts/stane-blegbo_cotedivoire-agriculture-semences-activity-7473746869505052672-Ueow?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"L’autonomie alimentaire va à la poubelle, si il est mal adressé. Devinette: Le sujet est colossal. 👇🏽 La graine…🌱 Nos systèmes semenciers africains Le sujet est à l’ordre du jour a","text":"L’autonomie alimentaire va à la poubelle, si il est mal adressé.\nDevinette:  Le sujet est colossal. 👇🏽\n\nLa graine…🌱 Nos systèmes semenciers africains\nLe sujet est à l’ordre du jour aujourd'hui, entre les acteurs de la filière. \nLa Recherche > La Production > La Distribution de semences.\n\nSans cette base, toute l'agritech du monde ne sert à rien.\n\nMerci à DOMNY SARL d’avoir convié Djoli à ces ateliers, \npour que la voix de nos producteurs continue de compter.\n\n#CotedIvoire #Agriculture #Semences #SupplyChain #Agribusiness","pid":"7473746869505052672","chars":526,"hashtags":5,"mentions":2,"link":false,"question":false,"lang":"FR","theme":"Clients & terrain"},{"date":"2026-07-08","month":"2026-07","weekday":"Mercredi","hour":13,"reactions":72,"comments":9,"reposts":5,"eng":86,"media":"img","url":"https://www.linkedin.com/posts/stane-blegbo_tech-education-djoli-activity-7480608499648053250-6rh2?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"À 10 ans, il est déjà professeur de robotique. Ses élèves ? Ils en ont 5. J’ai assisté à cette scène au MASS - Marché Africain des Solutions Spatiales 2026, à Abidjan. Avec ses cam","text":"À 10 ans, il est déjà professeur de robotique. \nSes élèves ? Ils en ont 5.\n\nJ’ai assisté à cette scène au MASS - Marché Africain des Solutions Spatiales 2026, à Abidjan. \n\nAvec ses camarades de classe, Séverin a créé un club de code et de robotique basé sur un principe simple : la transmission organique. \nLes aînés forment les plus petits. Ces derniers, une fois formés, prennent le relais.\nIci on ne parle pas de diplômes mais de compétences et d’un système éducatif qui se reproduit.\n\nEn deux ans, le petit frère de VEHI GOGBE SEVERIN est passé du statut d’élève à celui de formateur.\n\nPersonne ne l’a nommé à ce poste. \nLe système l’a généré tout seul.\n\nVotre modèle actuel se reproduit-il sans votre intervention, ou s’arrête-t-il de tourner dès que vous cessez de le pousser ?\n\n#tech #education #djoli","pid":"7480608499648053250","chars":808,"hashtags":3,"mentions":2,"link":false,"question":true,"lang":"FR","theme":"Recrutement"},{"date":"2026-07-27","month":"2026-07","weekday":"Lundi","hour":14,"reactions":95,"comments":3,"reposts":1,"eng":99,"media":"img","url":"https://www.linkedin.com/posts/stane-blegbo_fin-de-la-3e-saison-djoli-merci-%C3%A0-nos-tanties-activity-7487512622297284609--gZl?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Fin de la 3e saison Djoli Merci à nos Tanties pour les bénédictions et les encouragements quotidiens. 🙏🏾 Ces femmes tiennent la distribution alimentaire de notre pays, Sans ERP, sa","text":"Fin de la 3e saison Djoli \n\nMerci à nos Tanties pour les bénédictions et les encouragements quotidiens. 🙏🏾\n\nCes femmes tiennent la distribution alimentaire de notre pays, Sans ERP, sans prévisionnel, sans crédit bancaire, sans chatgpt. \n\nElles savent qui paie, qui triche, quand le prix de la tomate va monter.\nCette mémoire existe. \nDjoli ne fait que l’écrire pour et avec elles.","pid":"7487512622297284609","chars":380,"hashtags":0,"mentions":1,"link":false,"question":false,"lang":"FR","theme":"Levée & partenariats"},{"date":"2026-08-03","month":"2026-08","weekday":"Lundi","hour":12,"reactions":114,"comments":3,"reposts":1,"eng":118,"media":"img","url":"https://www.linkedin.com/posts/stane-blegbo_ce-qui-co%C3%BBte-le-plus-cher-dans-une-livraison-activity-7490020416992997376-AX6g?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Ce qui coûte le plus cher dans une livraison, c’est celle qui échoue. Ravi d’avoir animé ce matin une masterclass sur l’innovation logistique auprès de founders 🇨🇮 , dans le cadre ","text":"Ce qui coûte le plus cher dans une livraison, \nc’est celle qui échoue.\n\nRavi d’avoir animé ce matin une masterclass sur l’innovation logistique auprès de founders 🇨🇮 , dans le cadre du programme porté par la CDC-CI CAPITAL et Plug and Play.\n\n1h30 sur un sujet peu spectaculaire : \nle coût réel d’une livraison 😅 dans nos environnements.\n\nLe trajet sans recette, puis le second passage, les retours à vide, L’écart entre la marge apparente et la marge réelle, les \"clients oiseaux\"…. \n\nSouhaitons une belle réussite à tous ces « founders » qui trouvent, testent, de nouvelles solutions chaque jour.","pid":"7490020416992997376","chars":597,"hashtags":0,"mentions":2,"link":false,"question":false,"lang":"FR","theme":"Produit & offre"},{"date":"2026-08-04","month":"2026-08","weekday":"Mardi","hour":7,"reactions":141,"comments":13,"reposts":6,"eng":160,"media":"img","url":"https://www.linkedin.com/posts/stane-blegbo_il-y-a-un-crit%C3%A8re-cach%C3%A9-dans-ce-prix-dexcellence-activity-7490313817592213504-YKtZ?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Il y a un critère caché, dans ce prix d’Excellence. Le même chez tous les lauréats…2025, 2026… Écrit dans aucun règlement, annoncé à aucun micro. Jamais. J’ai vérifié plusieurs foi","text":"Il y a un critère caché, dans ce prix d’Excellence.\nLe même chez tous les lauréats…2025, 2026…\nÉcrit dans aucun règlement, \nannoncé à aucun micro. Jamais.\n\nJ’ai vérifié plusieurs fois avant de l’écrire. \nMais c’est bien trop systématique pour être un hasard.\n\nCe critère, c’est le temps.\nIls ont vraiment trop de « cardio », une résilience hors norme.\n\nAucun lauréat n’a été primé pour une bonne année. Ni pour un coup d’éclat. \nCe qu’on récompense là, c’est dix, vingt, trente ans sur le même métier, souvent dans des conditions qui donnaient toutes les raisons d’arrêter.\n\nLe seul critère qu’on ne peut pas simuler. \nOn ne rattrape pas dix ans de constance avec une bonne campagne insta.\n\nDans un monde qui célèbre la vitesse, ces gens rappellent l’essentiel : L’excellence qui construit un pays, ce n’est pas ce qui démarre, c’est ce qui tient.\n\nFélicitations aux lauréats. \nBravo à ceux qui font, se trompent, et recommencent.\nLe vrai prix, et notre soutien, ils l’avaient déjà avant la cérémonie.\n\nLe pdf des résultats en commentaire.","pid":"7490313817592213504","chars":1039,"hashtags":0,"mentions":0,"link":false,"question":false,"lang":"FR","theme":"Levée & partenariats"},{"date":"2026-08-10","month":"2026-08","weekday":"Lundi","hour":8,"reactions":102,"comments":1,"reposts":2,"eng":105,"media":"img","url":"https://www.linkedin.com/posts/stane-blegbo_djoli-agro-impact-activity-7492490125059362817-pPyL?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Les petits producteurs africains n'ont pas de données. ❌ c'est Faux. Ils en produisent tous les jours. Chaque récolte, chaque livraison, chaque paiement, chaque client servi est un","text":"Les petits producteurs africains n'ont pas de données.\n❌ c'est Faux. Ils en produisent tous les jours.\nChaque récolte, chaque livraison, chaque paiement, chaque client servi est une donnée.  \n\nCes chiffres existaient avant nous. \nIls partaient dans un cahier ou dans rien du tout.\nLe travail n'a jamais été de créer de la donnée. \n#djoli refuse qu'elle disparaisse.\n\n👇🏽 Pour notre producteur ce qui a changé: \nCe n'est pas sa parcelle. Elle fait toujours 1,8 hectare.\nCe sont les mêmes bananes plantain.\nCe qui a changé, c'est son accès au marché et à son pré-financement.\n\n#agro #impact #traçabilité","pid":"7492490125059362817","chars":600,"hashtags":4,"mentions":0,"link":false,"question":false,"lang":"FR","theme":"Produit & offre"},{"date":"2026-08-12","month":"2026-08","weekday":"Mercredi","hour":8,"reactions":61,"comments":3,"reposts":2,"eng":66,"media":"img","url":"https://www.linkedin.com/posts/stane-blegbo_sourcing-digitalisation-djoli-activity-7493222271940018176-7FrP?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"- Question sérieuse Stane, en vrai de vrai ... Tu as vraiment besoin d'internet et de l'IA pour ta tomate et ton concombre ? - Bien vu cher ami 😂 mais comment j'analyse les infomat","text":"- Question sérieuse Stane, en vrai de vrai ...\n Tu as vraiment besoin d'internet et de l'IA pour ta tomate et ton concombre ?\n- Bien vu cher ami 😂 \nmais comment j'analyse les infomations du marché ?\n\nIl rigolait et moi aussi. \nMais il a raison de poser la question.\n  \n- Quel producteur, quelle parcelle, quelle quantité, quelle qualité, pour quand, transporté par qui, à quel prix, comment les colis sont emballés, les risques de casse ... ? tu peux gérer 10.000 parcelles agricoles dans ta tête ? \n\nLa tomate n'a pas besoin d'IA, a priori.\nL'intelligence de marché : si. \n\n#sourcing #digitalisation #djoli","pid":"7493222271940018176","chars":607,"hashtags":3,"mentions":0,"link":false,"question":true,"lang":"FR","theme":"Levée & partenariats"},{"date":"2026-08-17","month":"2026-08","weekday":"Lundi","hour":9,"reactions":127,"comments":10,"reposts":0,"eng":137,"media":"img","url":"https://www.linkedin.com/posts/stane-blegbo_abidjan-papa-activity-7495041772063223808-3yDT?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"\"Papa tu repars ?\" \"Papa, les grandes vacances finissent, tu n'es jamais là\" Wo bouuuu* ma tête, mon coeur, mes jambes .... Je n'ai pas su. Je n'ai pas pu. Je n'ai pas voulu, parfo","text":"\"Papa tu repars ?\"\n\"Papa, les grandes vacances finissent, tu n'es jamais là\" \n\nWo bouuuu* ma tête, mon coeur, mes jambes ....\n\nJe n'ai pas su. Je n'ai pas pu. Je n'ai pas voulu, parfois. \nOn ne va pas polémiquer sur le pourquoi du comment ma fille. Les 3 sont vrais.\n« Viens, on sort ma Nini, mets tes chaussures. »\n\nPS: coucou spécial, à tous les papas du dimanche matin, de l'Ivoire Trade Center.\nBonne semaine \"collègue papa\" 😅 \net à dimanche prochain 🥤🍦. \n\n*wo bou = onomatopée Ivoirienne, imaginez un missile, ou la blague de scratch le chien ... wo bou\n#Abidjan \n#Papa","pid":"7495041772063223808","chars":574,"hashtags":2,"mentions":1,"link":false,"question":false,"lang":"FR","theme":"Convictions & analyses"},{"date":"2026-08-27","month":"2026-08","weekday":"Jeudi","hour":11,"reactions":68,"comments":4,"reposts":2,"eng":74,"media":"img","url":"https://www.linkedin.com/posts/stane-blegbo_agritech-cotedivoire-filiereagricole-activity-7498700592358346753-is-S?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Le producteur qui a récolté en mai a encaissé sept fois plus. Le sac de piment vert valait 58 000 Fcfa en mai Aujourd’hui : 8 500. 🌶️ Même sac. Même filière. Trois mois d’écart. Mm","text":"Le producteur qui a récolté en mai a encaissé sept fois plus.\nLe sac de piment vert valait 58 000 Fcfa en mai\nAujourd’hui : 8 500. 🌶️\n\nMême sac. Même filière. Trois mois d’écart.\n\nMme Kouamé, productrice à Bouaflé, a récolté la semaine dernière. Elle encaisse le prix plancher. \n\nNi le rendement ni la qualité n’expliquent l’écart. Juste le calendrier.\n\nAucun mécanisme de financement agricole ne tient tant que cette volatilité n’est pas mesurée.\n\nPS : à tous ceux qui vont vouloir sauvegarder ce graphique pour caler leur planning de production ou faire leur prévisionnel. \nQue Dieu vous garde. 🙏🏾\n\n#agritech #cotedivoire #filiereagricole #donnees #agriculture","pid":"7498700592358346753","chars":662,"hashtags":5,"mentions":0,"link":false,"question":false,"lang":"FR","theme":"Produit & offre"}],"totals":{"n":21,"reactions":37
