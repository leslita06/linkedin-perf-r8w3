es communautés pairs qui ont participé à nos cotés, notamment Réseau Ivoirien des Diplômés de la Diaspora (RIDD), Ministry of Digital Transition and Technological Innovation, HEC Paris in Africa, Abidjanaises In Tech, Women's Investment Club (WIC) African Business Club Choose Your Mentor French Tech Abidjan🙏🏾 \n\nPour finir, bravo à notre équipe Diaspora Connect: Longa Andrea MBUYAMBA, Ornella-Ashley Sangronio et Kirane Yassine pour ces 2 premières cohortes. \n\ncc Florence TAHIRI epse FADIKA Sophia El Hajaj Babel BALSOMI Lika DOUKOURE-SZAL Yannick Mekwegne et bien d'autres.","pid":"7465719686652043265","chars":1630,"hashtags":0,"mentions":22,"link":false,"question":false,"lang":"FR","theme":"Diaspora Connect"},{"date":"2026-05-29","month":"2026-05","weekday":"Vendredi","hour":10,"reactions":16,"comments":0,"reposts":3,"eng":19,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_startupafrica-fundraising-cotedivoire-activity-7466075049784037376-tbT4?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚀 SAVR Bootcamp Avec Smart Africa, nous lançons le SAVR Bootcamp à Abidjan du 22 au 26 juin. 5 jours intensifs pour les founders ouest-africains en préparation de levée. Ce qu'on v","text":"🚀 SAVR Bootcamp \n\nAvec Smart Africa, nous lançons le SAVR Bootcamp à Abidjan du 22 au 26 juin. 5 jours intensifs pour les founders ouest-africains en préparation de levée.\n\nCe qu'on voit bloquer le plus à ce stade ?\n\nPas le produit. Pas la traction.\n\nLe récit. La cohérence du chiffrage. La posture face à un comité.\n\nPendant 5 jours, on travaille avec les founders :\n\n🎯 Stratégie de levée — qui solliciter, dans quel ordre, à quel ticket\n💰 Modèle économique et projections, en mode comité d'investissement\n🎙️ Récit investisseur — celui qui fait gagner la salle\n📊 Deck challengé slide par slide, puis pitch live devant des investisseurs\n\n📅 Abidjan · 22-26 juin 2026\n👥 15 places · early-stage digital ou greentech basée en CI\n🗓 Candidatures jusqu'au 31 mai 2026\n\nProgramme porté par Smart Africa × Mstudio, dans le cadre d'AEDIB 2.0 financé par l'Union européenne.\n\n👉🏾 Postule ici : https://lnkd.in/d5uBpqsn\n\n#StartupAfrica #Fundraising #CoteDivoire #Mstudio","pid":"7466075049784037376","chars":957,"hashtags":4,"mentions":1,"link":true,"question":false,"lang":"FR","theme":"Programmes & candidatures"},{"date":"2026-06-01","month":"2026-06","weekday":"Lundi","hour":9,"reactions":26,"comments":1,"reposts":1,"eng":28,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_mstudio-barapay-ressourceshumaines-activity-7467151653872287744-py5j?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Mercredi matin, on invite les équipes RH, paie et finance des entreprises ivoiriennes à un petit-déjeuner chez Mstudio. L'occasion de rencontrer une de nos startups : Barapay. 💸 Ba","text":"Mercredi matin, on invite les équipes RH, paie et finance des entreprises ivoiriennes à un petit-déjeuner chez Mstudio.\n\nL'occasion de rencontrer une de nos startups : Barapay.\n\n💸 BaraPay digitalise l'avance sur salaire en Côte d'Ivoire. L'employé accède à son salaire déjà gagné en temps réel, sans dette ni paperasse. \n\n🏦  L'employeur garde sa trésorerie intacte, zéro coût ajouté, et gagne un vrai levier de rétention. \n\n👨🏾‍🏭Pour les RH, c'est moins d'avances à arbitrer chaque mois et un coup de pouce mesurable au climat social.\n\n🗓️ Date: Mercredi 3 juin de 8h à 9h30\n📍 Lieu: Mstudio,  RDC Tour D, Ivoire Trade Center\n\nPlaces limitées, inscription ici : https://luma.com/vkm1kdxd\n\n#Mstudio #BaraPay #RessourcesHumaines #FintechCI #Abidjan","pid":"7467151653872287744","chars":743,"hashtags":5,"mentions":1,"link":true,"question":false,"lang":"FR","theme":"Événements & écosystème"},{"date":"2026-06-02","month":"2026-06","weekday":"Mardi","hour":10,"reactions":105,"comments":1,"reposts":0,"eng":106,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_tech4impact-djoli-mstudio-activity-7467515446460743680-j2nc?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🛰️ Djoli aux Assemblées annuelles 2026 de la BAD à Brazzaville 🇨🇬. Imagerie satellitaire, drones et data science : la team Djoli a cartographié et quantifié les transformations agr","text":"🛰️ Djoli aux Assemblées annuelles 2026 de la BAD à Brazzaville 🇨🇬.\n\nImagerie satellitaire, drones et data science : la team Djoli a cartographié et quantifié les transformations agricoles dans la région du Bélier 🇨🇮, sur le projet 2PAI (Pôle Agro-Industriel du Bélier) financé par l' African Development Bank Group (BAD).\n\nUne solution africaine pour rendre l'impact des financements visible et mesurable.\n\nBravo ✪ Stane BLEGBO et toute la team Djoli 🌱\n\n#tech4impact #DJOLI #Mstudio","pid":"7467515446460743680","chars":482,"hashtags":3,"mentions":3,"link":false,"question":false,"lang":"FR","theme":"Nos startups"},{"date":"2026-06-03","month":"2026-06","weekday":"Mercredi","hour":9,"reactions":23,"comments":0,"reposts":6,"eng":29,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_startupafrica-fundraising-cotedivoire-activity-7467862692729503744-HjVM?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"📢 Extension : candidatures prolongées jusqu'à ce dimanche 7 juin (23h59). Le SAVR Bootcamp revient à Abidjan du 22 au 26 juin — 5 jours pour faire passer une startup qui a de la tr","text":"📢 Extension : candidatures prolongées jusqu'à ce dimanche 7 juin (23h59).\n\nLe SAVR Bootcamp revient à Abidjan du 22 au 26 juin — 5 jours pour faire passer une startup qui a de la traction au stade « financée par des investisseurs early-stage ».\n\nÀ ce stade, ce qui bloque la plupart des founders ouest-africains, ce n'est pas le produit ni la traction : c'est le récit, la solidité du modèle financier et la posture en pitch room. D'où des levées qui s'étirent sur de très longs mois!\n\nAu programme, en 5 jours :\n✦ Stratégie de levée — qui solliciter, dans quel ordre, à quel ticket\n✦ Modèle financier qui tient devant un comité\n✦ Storytelling investisseur\n✦ Deck stress-testé et pitch live devant investisseurs\n\n👀 Et plusieurs investisseurs rejoindront la cohorte en guests surprises — du pitch en conditions réelles.\n\n💚 Un appel particulier aux fondatrices et aux porteurs de projets en industries vertes : cette cohorte est faite pour vous. Candidatez.\n\n📍 Abidjan · 22-26 juin 2026\n👥 15 places · early-stage · digital ou greentech basée en CI\n⌛ Candidatures jusqu'au dimanche 7 juin — 23h59\n\nUn programme Smart Africa × Mstudio, dans le cadre d'AEDIB 2.0 financé par l'Union européenne.\n\n🔗 Postule : https://lnkd.in/d5uBpqsn\n\n#StartupAfrica #Fundraising #CoteDivoire #Mstudio #WomenInTech #GreenTech","pid":"7467862692729503744","chars":1302,"hashtags":6,"mentions":2,"link":true,"question":false,"lang":"FR","theme":"Programmes & candidatures"},{"date":"2026-06-05","month":"2026-06","weekday":"Vendredi","hour":11,"reactions":26,"comments":0,"reposts":3,"eng":29,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_le-plus-dur-ce-nest-pas-lia-cest-de-activity-7468632568679075840-DwPx?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Le plus dur, ce n'est pas l'IA. C'est de la faire tourner là où les registres publics ne sont même pas digitalisés. Briter consacre une étude de cas à Danaya 🇨🇮, l'une des startups","text":"Le plus dur, ce n'est pas l'IA. C'est de la faire tourner là où les registres publics ne sont même pas digitalisés.\n\nBriter consacre une étude de cas à Danaya 🇨🇮, l'une des startups que nous co-construisons chez Mstudio, dans le cadre du programme « AI Made in Africa » commandé par la GIZ.\n\nDanaya automatise la vérification KYC/KYB en temps réel à l'échelle de l'Afrique francophone — la conformité, sans les semaines d'attente.\n\nLe terrain sur lequel l'équipe construit :\n🔹 des registres publics encore largement non digitalisés\n🔹 une donnée fragmentée d'un pays à l'autre\n🔹 une pénurie de talents IA spécialisés\n\nDanaya le fait quand même. C'est exactement là que se joue notre métier de venture studio : bâtir avec les contraintes réelles de la région, pas ailleurs.\n\n👉 L'étude de cas Briter : https://lnkd.in/eDvi9nQS\n\nBravo à Gauthier de Gerlache, Michel Edjoa, Maureen Tia et à toute l'équipe Danaya 👏🏾","pid":"7468632568679075840","chars":910,"hashtags":0,"mentions":5,"link":true,"question":false,"lang":"FR","theme":"Convictions & analyses"},{"date":"2026-06-06","month":"2026-06","weekday":"Samedi","hour":8,"reactions":53,"comments":4,"reposts":4,"eng":61,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_starventure-mstudio-starventure-activity-7468948547040776192-ewgn?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚨 Startups de Côte d'Ivoire, du Sénégal et du Bénin : il ne reste que quelques jours. L' EBRD ouvre pour la première fois son programme #StarVenture à notre région : 24 mois d'acco","text":"🚨 Startups de Côte d'Ivoire, du Sénégal et du Bénin : il ne reste que quelques jours.\n\nL' EBRD ouvre pour la première fois son programme #StarVenture à notre région : 24 mois d'accompagnement sur mesure, accès à un réseau d'investisseurs, de mentors et d'experts internationaux.\n\nLe bilan du programme 👇🏾\n🌍 400+ startups accompagnées dans 30 marchés\n💰 plus de 850 M USD levés pendant ou après le programme\n\nChez Mstudio, nous construisons des startups — mais nous croyons aussi à un écosystème où les bonnes opportunités circulent. Celle-ci en est une.\n\n⏳ Candidatures jusqu'au 11 juin.\n👉 https://lnkd.in/d3h3rEfU\n\nMerci à Carine Vavasseur,  et aux équipes d'avoir ouvert le programme à l'Afrique francophone.\n\n#Mstudio #StarVenture #EBRD #StartupsAfrique #UEMOA","pid":"7468948547040776192","chars":762,"hashtags":6,"mentions":2,"link":true,"question":false,"lang":"FR","theme":"Programmes & candidatures"},{"date":"2026-06-08","month":"2026-06","weekday":"Lundi","hour":10,"reactions":42,"comments":0,"reposts":5,"eng":47,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_mstudio-jaeyko-cerclefinance-activity-7469702541740675072-aMdB?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"📅 Jeudi 11 juin, Jèko organise son tout premier Cercle Finance à Abidjan. DAF, dirigeant de PME ivoirienne ? C'est fait pour vous. L'idée : réunir des décideurs financiers autour d","text":"📅 Jeudi 11 juin, Jèko organise son tout premier Cercle Finance à Abidjan.\n\nDAF, dirigeant de PME ivoirienne ? C'est fait pour vous.\n\nL'idée : réunir des décideurs financiers autour d'un sujet très concret — comment la digitalisation des paiements transforme la gestion de trésorerie et les relations fournisseurs des entreprises ivoiriennes.\n\nAu programme:\n🤝 Des échanges entre pairs\n💬 L'équipe Jèko dispo pour vos questions\n🥂 Un cocktail pour prolonger les conversations\n\n🗓️ Jeudi 11 juin 2026, dès 17h\n📍 Mstudio — Ivoire Trade Center, Cocody, Abidjan\n🎟️ Gratuit, places limitées\n\nSi le rapprochement bancaire et le suivi des encaissements vous prennent encore trop de temps, c'est la soirée à ne pas manquer.\n\n👉 Inscription : https://luma.com/0bmyybq4\n\n\n#Mstudio #Jèko #CercleFinance #Fintech #DAF #Abidjan #CôteDIvoire","pid":"7469702541740675072","chars":821,"hashtags":7,"mentions":1,"link":true,"question":false,"lang":"FR","theme":"Événements & écosystème"},{"date":"2026-06-09","month":"2026-06","weekday":"Mardi","hour":9,"reactions":127,"comments":9,"reposts":4,"eng":140,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_mstudio-jaeyko-fintech-activity-7470044572744744962-lOSa?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Depuis 2020, Daniel Dang construit des produits fintech pour le marché africain. D'abord avec Dimbaya, puis avec Futa — un track record solide, bâti sur le terrain, qu'il met aujou","text":"Depuis 2020, Daniel Dang construit des produits fintech pour le marché africain. D'abord avec Dimbaya, puis avec Futa — un track record solide, bâti sur le terrain, qu'il met aujourd'hui au service des commerçants ivoiriens avec Jèko 🇨🇮.\n\nCe savoir-faire, il l'a aussi affûté au sein de fintechs européennes de premier plan, Pennylane et SeQura, où il a appris une exigence simple : un bon paiement est celui qui se fait oublier.\n\nAvec Idriss Marcial MONTHE (CEO), il co-construit Jèko, une solution qui réunit mobile money, cartes et espèces dans une interface unique pour les commerçants — résumée par sa promesse en dioula : « Encaissez votre djè sans forcer. »\n\nCe que Daniel pilote 👇🏾\n🧱 La Jèko Box, le Checkout API et les payment links — l'infrastructure qui sécurise chaque transaction.\n⚡ Une expérience conçue pour le commerçant, pas pour l'ingénieur.\n🔭 Et, demain, bien plus de services à valeur ajoutée pour les marchands.\n\nConstruire une infrastructure de paiement de niveau international avec une connaissance intime du marché africain : c'est exactement le type de parcours que nous sommes fiers d'accompagner chez Mstudio.\n\n#Mstudio #Jèko #Fintech #Abidjan","pid":"7470044572744744962","chars":1170,"hashtags":4,"mentions":3,"link":false,"question":false,"lang":"FR","theme":"Nos startups"},{"date":"2026-06-11","month":"2026-06","weekday":"Jeudi","hour":11,"reactions":57,"comments":2,"reposts":2,"eng":61,"media":"texte","url":"https://www.linkedin.com/posts/mstudiovc_mstudio-ia-jaeyko-activity-7470795726671929344-d2UC?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚀 Deux de nos startups rejoignent l'AI Foundry de Ventures Platform Fund. Jèko et Danaya ont été sélectionnées pour le programme AI Foundry de Ventures Platform, l'un des fonds les","text":"🚀 Deux de nos startups rejoignent l'AI Foundry  de Ventures Platform Fund.\n\nJèko et Danaya ont été sélectionnées pour le programme AI Foundry de Ventures Platform, l'un des fonds les plus actifs du continent (Moniepoint, PiggyVest…).\n\nDerrière cette sélection, deux bâtisseurs techniques 👇🏾\n\n👨🏾‍💻 Daniel Dang, CTO de Jèko — il conçoit l'infrastructure de paiement (Box POS, Checkout API, payment links) qui permet aux commerçants ivoiriens d'encaisser mobile money, cartes et espèces au même endroit.\n\n👨🏾‍💻 Michel Edjoa, CTO de Danaya— il construit la plateforme qui automatise la conformité KYC/KYB en temps réel pour les institutions financières d'Afrique francophone.\n\nLe point commun ? Chez eux, l'IA n'est pas un argument marketing. Elle est dans le moteur : décision de paiement, vérification d'identité, détection de fraude.\n\nVoir deux CTO de notre portefeuille reconnus à ce niveau, c'est la meilleure preuve que l'Afrique francophone ne se contente pas de consommer l'IA. Elle la construit.\n\nFélicitations à Daniel Dang et Michel Edjoa 👏🏾\n\n#Mstudio #IA #Jèko #Danaya #VenturesPlatform #AfriqueFrancophone","pid":"7470795726671929344","chars":1113,"hashtags":6,"mentions":5,"link":false,"question":false,"lang":"FR","theme":"Nos startups"},{"date":"2026-06-15","month":"2026-06","weekday":"Lundi","hour":10,"reactions":46,"comments":2,"reposts":7,"eng":55,"media":"file","url":"https://www.linkedin.com/posts/mstudiovc_post-linkedin-savr-activity-7472236299819778048-O4J_?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🇨🇮 Smart Africa Venture Readiness (SAVR) Bootcamp 2026 — découvrez les 15 startups sélectionnées Plus de 80 candidatures reçues. 15 startups retenues. 📅 Du 22 au 26 juin, à Abidjan","text":"🇨🇮 Smart Africa Venture Readiness (SAVR) Bootcamp 2026 — découvrez les 15 startups sélectionnées\n\nPlus de 80 candidatures reçues. 15 startups retenues.\n\n📅 Du 22 au 26 juin, à Abidjan, ces équipes suivront un programme intensif de cinq jours consacré à la préparation à la levée de fonds aux cotés d'investisseurs internationaux:\n\n🎯 Stratégie d'investissement\n💰 Modèle économique et projections financières\n🎙️ Construction du récit investisseur\n📊 Préparation au pitch devant un panel d'investisseurs\n\n👩🏾‍💻 Chacune des 15 équipes sélectionnées compte au moins une femme à sa direction, fidèle à notre engagement commun pour un écosystème entrepreneurial plus inclusif.\n\nLes startups de la cohorte SAVR 2026 sont :\n\nCOSNA INVESTMENTS\nContratChap\nDAJIO\nAD ABG Digital Solutions (YELI)\nSmart'BAB\nDigiSages\nRodasystem Corporation\nVERTIVOIRE GROUPE\nAttrey Services\nTripinafrica\npayiskoul\nYebanGo\nSowher\nViteVite App \nMoriento\n\n👏🏾 Félicitations à ces quinze équipes. Le travail de fond commence.\n\n🇪🇺 Un programme porté par Smart Africa et Mstudio, dans le cadre d'AEDIB 2.0, financé par l'Union européenne.\n\n#StartupAfrica #WomenInTech #CoteDivoire #SmartAfrica #Mstudio\n\ncc Yusuf Mutamba Arthur Germond","pid":"7472236299819778048","chars":1195,"hashtags":5,"mentions":13,"link":false,"question":false,"lang":"FR","theme":"Programmes & candidatures"},{"date":"2026-06-17","month":"2026-06","weekday":"Mercredi","hour":9,"reactions":45,"comments":2,"reposts":3,"eng":50,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_fintech-inclusionfinanciere-cotedivoire-activity-7472943637404934145-CEVD?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🇨🇮 Jèko sélectionnée pour Catapult: Inclusion Africa 2026 👏🏾 Jèko, l'une des startups que nous construisons au sein du studio, fait partie des 15 fintechs africaines retenues pour ","text":"🇨🇮 Jèko sélectionnée pour Catapult: Inclusion Africa 2026 👏🏾\n\nJèko, l'une des startups que nous construisons au sein du studio, fait partie des 15 fintechs africaines retenues pour la 9ᵉ édition de Catapult: Inclusion Africa, le programme du The LHoFT - Luxembourg House of Financial Technology mené avec ADA et le soutien de la Coopération luxembourgeoise.\n\n15 startups, 10 pays, une même ambition : faire avancer l'inclusion financière sur le continent.\n\n💳 Ce que construit Jèko : une solution d'encaissement qui réunit tous les moyens de paiement (mobile money, carte, cash) dans une seule interface pour les commerçants ivoiriens, dont beaucoup évoluent encore dans l'informel.\n\nAu programme :\n\n📍 Semaine 1 — Abidjan, du 29 juin au 3 juillet 2026, en ouverture avec le Groupe de la Banque africaine de développement\n🇱🇺 Semaine 2 — Luxembourg, du 9 au 13 novembre 2026\n\nAccès direct aux institutions financières, aux régulateurs et aux investisseurs à impact, mentorat d'experts, et un pitch final à l'IF2026 à Luxembourg.\n\nFélicitations à toute l'équipe Jèko 👏🏾. L'inclusion financière se construit startup après startup.\n\n🔗 www.jeko.africa\n\n#Fintech #InclusionFinanciere #CoteDivoire #CatapultInclusionAfrica #Mstudio","pid":"7472943637404934145","chars":1222,"hashtags":5,"mentions":2,"link":false,"question":false,"lang":"FR","theme":"Levée & partenariats"},{"date":"2026-06-19","month":"2026-06","weekday":"Vendredi","hour":9,"reactions":98,"comments":2,"reposts":6,"eng":106,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_mstudio-cybersaezcuritaez-ctf-activity-7473660959316905984-C4Qd?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🏆 On leur a prêté nos locaux. Ils en ont fait un tremplin vers le Top 100 mondial. Les pépites du Lab de Babel BALSOMI viennent de briller au CTF Kasperky, l'une des compétitions d","text":"🏆 On leur a prêté nos locaux. Ils en ont fait un tremplin vers le Top 100 mondial.\n\nLes pépites du Lab de Babel BALSOMI viennent de briller au CTF Kasperky, l'une des compétitions de cybersécurité les plus relevées de la planète :\n🥉 3ᵉ dans la sous région pour la Côte d'Ivoire\n🏅 4ᵉ dans la sous région pour le Bénin\n🌍 62ᵉ et 67ᵉ dans le Top 100 de la zone Asie, Russie, Europe et Amériques\n\nEt ce n'est pas un coup d'éclat isolé. L'an dernier, déjà accueillie dans nos locaux, l'équipe terminait 8ᵉ sur plus de 1 500 équipes à l'international.\n\nChez Mstudio, on ouvre nos portes pour que ces talents s'entraînent, se dépassent et se mesurent aux meilleurs, et on a été heureux de les accueillir une fois de plus la semaine dernière pour participer à cette compétition d'envergure depuis nos locaux.\n\nParce que l'excellence africaine en cybersécurité n'est pas une promesse pour demain. Elle est déjà là. Dans le travail acharné de ces pépites.\n\n👏🏾 Bravo à toute l'équipe du Lab. Et merci aux partenaires qui rendent ça possible : MTN Côte d’Ivoire, Hiero Digital, SNSAD.\n\nL'aventure continue. 🚀\n\n#Mstudio #Cybersécurité #CTF #Kaspersky #TalentsAfricains #CôteDIvoire #Bénin","pid":"7473660959316905984","chars":1174,"hashtags":7,"mentions":3,"link":false,"question":false,"lang":"FR","theme":"Événements & écosystème"},{"date":"2026-06-22","month":"2026-06","weekday":"Lundi","hour":10,"reactions":149,"comments":4,"reposts":0,"eng":153,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_cotedivoire-ia-numerique-activity-7474763139612545024-sxlF?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🇨🇮 Ce mois-ci, nous avons reçu la délégation de The World Bank Group au studio, à Abidjan. Au cœur de l'échange, une conviction que nous partageons : l'ambition d'un numérique qui ","text":"🇨🇮 Ce mois-ci, nous avons reçu la délégation de  The World Bank Group au studio, à Abidjan.\n\nAu cœur de l'échange, une conviction que nous partageons : l'ambition d'un numérique qui pèse 15 % du PIB d'ici 2030 ne se décrète pas. Elle se construit, startup par startup, emploi par emploi.\n\nC'est précisément le rôle d'un venture studio.\n\nNotre modèle :\n\n🧩 Partir de problèmes réels et investissables, pas d'idées séduisantes sans marché. Puis bâtir l'entreprise de zéro, en associant un profil entrepreneurial à un founder local qui connaît le terrain et ses codes.\n\n🤝 Séparer l'accompagnement technique du capital, en co-investissant aux côtés d'un partenaire VC, pour dé-risquer chaque jeune pousse et raccourcir son chemin vers la levée.\n\n🤖 Mettre l'IA au cœur de la méthode, non pas comme une vitrine, mais comme une couche de raisonnement qui capitalise sur de nombreux comités d'investissement et transmet ces apprentissages à nos founders, pour qu'ils bâtissent plus vite et plus juste.\n\nLa vraie question, désormais, est celle du passage à l'échelle :\n\nComment faire émerger non pas une, mais des dizaines, voire des centaines de startups locales à fort impact ? Comment outiller les écosystèmes (ministères, incubateurs, universités) pour qu'ils adoptent l'IA et la culture du produit ? Comment exporter cette méthode au-delà de la Côte d'Ivoire, en l'ancrant dans des équipes locales plutôt qu'en l'important ?\n\nC'est ce que nous construisons : un modèle réplicable, où nous apportons la méthodologie, le playbook et l'IA, pour que d'autres territoires lancent leur propre studio.\n\nMerci à Michel Rogy, Paul Nguyen, Dr Alberto Portugal, Adja Mansora Dahourou, Denis Medvedev et à toute la délégation de la Banque mondiale pour la richesse de cet échange 🚀\n\n#CoteDivoire #IA #Numerique #VentureStudio #Startups #BanqueMondiale #Mstudio","pid":"7474763139612545024","chars":1843,"hashtags":7,"mentions":3,"link":false,"question":false,"lang":"FR","theme":"Événements & écosystème"},{"date":"2026-06-23","month":"2026-06","weekday":"Mardi","hour":9,"reactions":49,"comments":1,"reposts":4,"eng":54,"media":"video","url":"https://www.linkedin.com/posts/mstudiovc_recrutement-abidjan-caektedivoire-activity-7475118020231872512-aQbz?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🔋 On recrute la pièce maîtresse de Revvo. Un smartphone premium ne devrait coûter ni une fortune… ni une planète. Chez Revvo, l'une de nos startups 🇨🇮, on donne une deuxième vie au","text":"🔋 On recrute la pièce maîtresse de Revvo.\n\nUn smartphone premium ne devrait coûter ni une fortune… ni une planète.\n\nChez Revvo, l'une de nos startups 🇨🇮, on donne une deuxième vie aux smartphones haut de gamme : certifiés sur 50 points de contrôle, garantis 6 mois, livrés en moins de 24h à Abidjan, payables en 3 ou 6 fois — et 60 kg de CO₂ économisés à chaque appareil. 🌍\n\nNotre ambition : devenir LE leader du smartphone reconditionné en Afrique de l'Ouest. Pour y arriver, il nous manque un moteur opérationnel 👇\n\n🎯 Head of Operations — Revvo (Abidjan)\n\nTon terrain de jeu : faire passer chaque appareil de l'achat à la revente, au meilleur niveau de qualité, de coût et de délai.\n• Chaîne de reconditionnement de A à Z (sourcing → contrôle qualité → mise en vente)\n• Qualité, garanties & SAV\n• Stock, logistique & livraison < 24h\n• Pilotage par les KPIs + management d'une équipe terrain\n\nLe profil :\n✅ 5+ ans en opérations / supply chain / logistique / production\n✅ Tu as déjà piloté une chaîne physique (stock, qualité, SAV)\n✅ Hands-on, obsédé·e par la qualité et les délais\n✅ Basé·e à Abidjan\n\nPrêt·e à bâtir la référence du reconditionné en Afrique de l'Ouest ?\n\n🌐 Découvre Revvo : www.revvo.africa\n👉 Postule ici : https://lnkd.in/eQrUP6Bh\n🎥 Vidéo par Le Média Positif 🍀\n\n#Recrutement #Abidjan #CôteDIvoire #Operations #SupplyChain #ÉconomieCirculaire #Tech","pid":"7475118020231872512","chars":1366,"hashtags":7,"mentions":2,"link":true,"question":true,"lang":"FR","theme":"Recrutement"},{"date":"2026-06-25","month":"2026-06","weekday":"Jeudi","hour":10,"reactions":24,"comments":0,"reposts":0,"eng":24,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_on-parle-beaucoup-de-la-lev%C3%A9e-beaucoup-moins-activity-7475850321823510529-i5Y0?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"On parle beaucoup de la levée. Beaucoup moins de ce qui vient après. Signer un term sheet, c'est une étape. Construire une relation fondateur–investisseur qui tient dans la durée, ","text":"On parle beaucoup de la levée. Beaucoup moins de ce qui vient après. \n\nSigner un term sheet, c'est une étape. Construire une relation fondateur–investisseur qui tient dans la durée, c'en est une autre — et c'est souvent là que tout se joue.\n\nRejoignez nous pour une conversation sans filtre:\n\n📅 Vendredi 26 juin à 17h30\n📍 Au Mstudio (RDC de la tour D d'ITC)\n\nUne conversation entre Mouhamed Ndoye(Co-Founder & CEO, Tanel Health) et Dr.  Dotun Olowoporoku (Managing Partner, Ventures Platform) sur ce qu'il faut vraiment pour bâtir une relation de confiance qui survit aux levées, aux pivots et aux moments difficiles.\n\nAnimé par Aude Juglard.\n\n🎟️ RSVP : luma.com/lfpt02za","pid":"7475850321823510529","chars":671,"hashtags":0,"mentions":3,"link":false,"question":false,"lang":"FR","theme":"Convictions & analyses"},{"date":"2026-06-30","month":"2026-06","weekday":"Mardi","hour":8,"reactions":38,"comments":0,"reposts":2,"eng":40,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_vendredi-soir-le-mstudio-a-accueilli-activity-7477639618780303360-ovWM?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🤝 Vendredi soir, le Mstudio a accueilli une conversation aussi rare que précieuse. En partenariat avec Ventures Platform, nous avons réuni un entrepreneur et son investisseur pour ","text":"🤝 Vendredi soir, le Mstudio a accueilli une conversation aussi rare que précieuse.\n\nEn partenariat avec Ventures Platform, nous avons réuni un entrepreneur et son investisseur pour parler de ce dont on parle trop peu : ce qui se passe après la levée.\n\nAutour de la table :\n👤Dr.  Dotun Olowoporoku — Ventures Platform Fund\n👤 Mouhamed Ndoye — fondateur de Tanel\n🎙️ Une conversation orchestrée par Aude Juglard (Mstudio)\n\nLe fil rouge de l'échange : comment construire une relation entrepreneur–investisseur qui tient dans la durée ?\n\nCe qu'on retient 👇\n💡 Lever des fonds n'est pas une ligne d'arrivée, c'est le début du vrai travail.\n💡 La confiance se construit dans la transparence, surtout quand ça tangue.\n💡 Le bon investisseur est un partenaire dans la durée, pas un juge ponctuel.\n\nMerci à toute l'équipe de Ventures Platform, Hady Barry, Kola A., Dolapo Morgan pour la franchise de l'échange!\n\nC'est exactement le type d'espace qu'on veut multiplier à Abidjan : des conversations honnêtes qui font grandir tout l'écosystème. 🌍🏾","pid":"7477639618780303360","chars":1031,"hashtags":0,"mentions":9,"link":false,"question":false,"lang":"FR","theme":"Levée & partenariats"},{"date":"2026-06-30","month":"2026-06","weekday":"Mardi","hour":10,"reactions":28,"comments":0,"reposts":5,"eng":33,"media":"texte","url":"https://www.linkedin.com/posts/mstudiovc_m-studio-account-manager-yelema-activity-7477662350171414528-aBOV?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🤖 Et si l'IA devenait (enfin) accessible aux entreprises africaines ? Yelema, c'est la nouvelle startup du Mstudio qui déploie et opère des agents IA métier clé en main pour les en","text":"🤖 Et si l'IA devenait (enfin) accessible aux entreprises africaines ?\n\nYelema, c'est la nouvelle startup du Mstudio qui déploie et opère des agents IA métier clé en main pour les entreprises et institutions d'Afrique francophone.\n\nLa première marketplace d'agents IA packagés pour l'Afrique francophone. 🚀\n\nOn construit les rôles clés autour de l'équipe fondatrice — 3 postes à fort impact, à Abidjan 👇\n\n🧠 Chief Technology Officer\nLe/la lead technique qui conçoit notre plateforme d'agents IA.\n→ https://lnkd.in/eeFSmRb4\n\n🎯 Head of Business Development\nLe profil qui ouvre et développe les grands comptes, en B2B comme en B2G.\n→ https://lnkd.in/eRcsn_Eb\n\n🤝 Account Manager\nLa personne de confiance qui garantit l'adoption et la réussite de nos clients.\n→ https://lnkd.in/ea_BvuUE\n\nEnvie de construire l'un des projets IA les plus ambitieux du continent, dès ses premières heures ?\n\nOn t'attend — postule. 🙌🏾\n\n#IntelligenceArtificielle #IA #Recrutement #Abidjan #Afrique #Tech","pid":"7477662350171414528","chars":975,"hashtags":6,"mentions":1,"link":true,"question":true,"lang":"FR","theme":"Nos startups"},{"date":"2026-07-02","month":"2026-07","weekday":"Jeudi","hour":9,"reactions":21,"comments":1,"reposts":1,"eng":23,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_la-conformit%C3%A9-ce-nest-pas-de-la-paperasse-activity-7478383243675906048-0wPC?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"La conformité, ce n'est pas de la paperasse. C'est de la donnée et de l'IA. Ce samedi 4 juillet, Michel Edjoa, CTO de Danaya, monte sur la scène du DataTour 2026 à Abidjan 🇨🇮 Danay","text":"La conformité, ce n'est pas de la paperasse. C'est de la donnée et de l'IA.\n\nCe samedi 4 juillet, Michel Edjoa, CTO de Danaya, monte sur la scène du DataTour 2026 à Abidjan 🇨🇮\n\nDanaya, c'est l'une des startups qu'on accompagne à Mstudio : une RegTech qui automatise le KYC, le KYB et la lutte anti-blanchiment en temps réel pour les institutions financières d'Afrique de l'Ouest. Derrière la promesse « conformité simple, sécurité renforcée », il y a une vraie infrastructure data et IA, pensée pour nos marchés.\n\nParce que la souveraineté numérique de notre région se jouera aussi là : sur notre capacité à bâtir des outils de confiance, conçus ici, pour nos institutions.\n\n📅 Samedi 4 juillet 2026\n📍 Institut Universitaire d'Abidjan (IUA)\n🎟️ Entrée gratuite sur inscription\n\nSi vous êtes à Abidjan, allez l'écouter. 👇","pid":"7478383243675906048","chars":818,"hashtags":0,"mentions":2,"link":false,"question":false,"lang":"FR","theme":"Nos startups"},{"date":"2026-07-06","month":"2026-07","weekday":"Lundi","hour":6,"reactions":18,"comments":1,"reposts":3,"eng":22,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_jj-1-meet-the-team-in-paris-venez-activity-7479783733865316352-wkiM?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"JJ-1 [Meet the Team in Paris 🇫🇷 ] Venez rencontrer la team de Diaspora Connect, programme phare de la fondation Mstudio ce mardi 7 juillet à Paris. Cet événement vous réunira autou","text":"JJ-1 [Meet the Team in Paris 🇫🇷 ] Venez rencontrer la team de Diaspora Connect, programme phare de la fondation Mstudio ce mardi 7 juillet à Paris.  \n\nCet événement vous réunira autour d’un sujet central : comment transformer une envie de retour ou d’engagement en Afrique en une trajectoire professionnelle concrète ?\n\nPensée comme un espace d’échange ouvert et interactif, cette rencontre permettra de croiser les regards de participants au programme, d’entreprises partenaires et d’acteurs de l’écosystème africain autour des réalités du marché de l’emploi, des opportunités de carrière, des défis du retour et des nouvelles formes de mobilité professionnelle entre l’Europe et l’Afrique.\n\nCe temps d’échange sans filtres sera également l’occasion de présenter Diaspora Connect, les résultats des deux premières cohortes, ainsi que les opportunités de stages, d’emplois et d’immersion professionnelle qui seront proposées dans le cadre de la cohorte 3.\n\n📅 Mardi 7 juillet  \n🕔 17h00 – 20h00\n📍 ESCP Business School – Campus Paris Champerret\n\n🎟️ Participation gratuite sur inscription obligatoire : https://luma.com/jpvjvzp8\nPlaces limitées.","pid":"7479783733865316352","chars":1141,"hashtags":0,"mentions":2,"link":true,"question":false,"lang":"FR","theme":"Diaspora Connect"},{"date":"2026-07-09","month":"2026-07","weekday":"Jeudi","hour":10,"reactions":58,"comments":1,"reposts":5,"eng":64,"media":"video","url":"https://www.linkedin.com/posts/mstudiovc_ia-afrique-mstudio-activity-7480923724892844033-gIyS?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Chez Mstudio, on a une conviction : l'avenir numérique de l'Afrique ne se jouera pas seulement dans les infrastructures. Il se jouera dans les usages. 🌍 La semaine dernière, notre ","text":"Chez Mstudio, on a une conviction : l'avenir numérique de l'Afrique ne se jouera pas seulement dans les infrastructures. Il se jouera dans les usages. 🌍\n\nLa semaine dernière, notre Co-fondatrice et COO Leslie Ossete portait cette voix aux Rencontres Économiques d'Aix, sur le panel « Qui contrôlera le cœur numérique du monde ? ».\n\nOui, la question des infrastructures est réelle : minerais, énergie, données, puissance de calcul — l'Afrique a des maillons à défendre sur toute la chaîne de valeur de l'IA.\n\nMais notre conviction, c'est que rien ne changera vraiment tant qu'on n'aura pas démocratisé l'USAGE de l'IA, à grande échelle. C'est là que naît l'impact. Et c'est là qu'on agit :\n\n🚀 On co-construit des startups qui utilisent l'IA pour résoudre de vrais problèmes des populations africaines.\n🤝 On accompagne les grands groupes privés et les gouvernements dans leur adoption de l'IA.\n🗣️ On croit à des applications et des modèles pensés pour nos réalités, entraînés sur nos données et nos langues. Pas du copier-coller.\n\nParce que le saut est à notre portée : l'ère agentique touche déjà le commerce, la santé, l'éducation, les services financiers, l'agriculture. Un pré-diagnostic médical sur WhatsApp, un conseil agronomique par photo, un tuteur pour chaque élève.\n\nL'Afrique n'a pas besoin de posséder l'usine pour mettre l'IA au service du plus grand nombre. Elle peut commencer par l'usage.\n\nC'est notre rôle. C'est ce qu'on construit, chaque jour. ✊🏾\n\nMerci au Le Cercle des économistes et à son président Jean-Hervé Lorenzi, à Pierre Jacquet pour le cadrage, à Emmanuel LECHYPRE pour la modération, et aux co-panélistes Eric Labaye, David Dupont-Noelël, @Young-Sun Park et Nicolas Dubourg pour la richesse des échanges 🙏🏾\n\n#IA #Afrique #Mstudio #SouveraineteNumerique #VentureStudio","pid":"7480923724892844033","chars":1797,"hashtags":5,"mentions":9,"link":false,"question":false,"lang":"FR","theme":"Convictions & analyses"},{"date":"2026-07-10","month":"2026-07","weekday":"Vendredi","hour":10,"reactions":65,"comments":3,"reposts":1,"eng":69,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_diasporaconnect-mstudio-caektedivoire-activity-7481286187480018944-BsXv?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🇨🇮 Mardi soir, la diaspora africaine avait rendez-vous à Paris. À l' ESCP (Campus Champerret), Diaspora Connect, programme porté par la Fondation Mstudio, a réuni des talents de la","text":"🇨🇮 Mardi soir, la diaspora africaine avait rendez-vous à Paris.\n\nÀ l' ESCP (Campus Champerret), Diaspora Connect, programme porté par la Fondation Mstudio, a réuni des talents de la diaspora autour d'une même question : comment poursuivre, ou relancer, sa carrière en Côte d'Ivoire en 2027 ?\n\nUne soirée d'échanges, des profils et des parcours très divers, et une même envie : contribuer au développement du pays.\n\nCes rencontres nourrissent directement la préparation de notre 3e cohorte, qui accueillera en 2027 une nouvelle promotion de talents prêts à mettre leur expertise au service des entreprises ivoiriennes.\n\nMerci à l'ESCP, et notamment à la Chaire ESCP Innovation Responsable en Afrique (IRA) pour l'accueil, et à toutes celles et ceux qui sont venus partager leur énergie et leurs projets.\n\nLa suite se construit avec vous. 🌍\n\ncc Yohann Marsollier Marième FOFANA \n\n#DiasporaConnect #Mstudio #CôteDIvoire #Diaspora #Talents","pid":"7481286187480018944","chars":935,"hashtags":5,"mentions":5,"link":false,"question":false,"lang":"FR","theme":"Diaspora Connect"},{"date":"2026-07-15","month":"2026-07","weekday":"Mercredi","hour":10,"reactions":49,"comments":2,"reposts":4,"eng":55,"media":"texte","url":"https://www.linkedin.com/posts/mstudiovc_m-studio-chef-de-projet-microfinances-activity-7483098049540509696-QDEj?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"💼 Waribei recrute son·sa Chef·fe de Projet Microfinances. Et ce poste, il est rare. Waribei, c'est la fintech qui débloque du crédit marchand instantané pour les petits commerçants","text":"💼 Waribei recrute son·sa Chef·fe de Projet Microfinances. Et ce poste, il est rare.\n\nWaribei, c'est la fintech qui débloque du crédit marchand instantané pour les petits commerçants d'Afrique de l'Ouest, sans garantie ni historique bancaire. Un QR code, un clic, et le stock est financé. Remboursement après la vente.\n\nDerrière chaque crédit débloqué, une question simple : d'où vient la liquidité qui alimente le loan book ? C'est tout l'enjeu de ce rôle.\n\nLa personne qu'on cherche va sécuriser, structurer et faire grandir cette liquidité. Un poste à la croisée de deux mondes :\n\n📊 La finance : lever de la dette, structurer, dialoguer avec les bailleurs et les institutions de microfinance.\n🏪 Le terrain : comprendre le risque réel du crédit marchand au contact des commerçants, des fournisseurs et des équipes.\n\nLe profil qu'on veut :\n• 3 à 6 ans en microfinance (IMF/SFD), banque (engagements, financement, risque), dette structurée ou fintech de lending\n• Une vraie aisance avec l'informel et les marchés\n• Le vocabulaire du risque maîtrisé : PAR, NPL, coût du risque, provisions\n• Un ancrage UEMOA\n\n📍 Abidjan, présentiel.\n\nSi c'est vous, ou si vous connaissez la bonne personne, le poste est ici 👇\nhttps://lnkd.in/dpvYYqJm\n\nOn construit l'infrastructure de financement du commerce informel ouest-africain. Il nous manque juste vous.","pid":"7483098049540509696","chars":1340,"hashtags":0,"mentions":1,"link":true,"question":false,"lang":"FR","theme":"Recrutement"},{"date":"2026-07-17","month":"2026-07","weekday":"Vendredi","hour":10,"reactions":33,"comments":2,"reposts":4,"eng":39,"media":"texte","url":"https://www.linkedin.com/posts/mstudiovc_lia-remplace-ses-d%C3%A9veloppeurs-comment-il-activity-7483822844846432257-HfnG?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🎙️ Quand l'un de nos fondateurs raconte comment il a reconstruit sa fintech, on écoute. Idriss Marcial MONTHE, fondateur & CEO de Jèko, était l'invité du podcast de Guy Berthol TEG","text":"🎙️ Quand l'un de nos fondateurs raconte comment il a reconstruit sa fintech, on écoute.\n\nIdriss Marcial MONTHE, fondateur & CEO de Jèko, était l'invité du podcast de Guy Berthol TEGUEU. Un échange sans filtre sur une conviction : aujourd'hui, un fondateur n'a plus besoin d'attendre une armée de développeurs pour construire.\n\nIdriss connaît le paiement en Afrique mieux que personne. Avant Jèko, il a cofondé CinetPay. Avec Jèko, il construit l'infrastructure qui permet aux commerçants ivoiriens d'encaisser simplement, en ligne comme en boutique.\n\nDans cet épisode, il raconte comment il a repensé et reconstruit Jèko en s'appuyant sur l'IA comme levier d'exécution. Pas l'IA comme mot à la mode : l'IA comme outil pour aller plus vite, tester plus tôt, et livrer un produit qui répond à un vrai besoin des marchands.\n\nC'est exactement le type de fondateur qu'on aime accompagner chez Mstudio : des opérateurs qui connaissent leur marché, exécutent vite, et bâtissent des solutions concrètes pour l'économie africaine.\n\n🎧 L'épisode complet est à écouter ici 👇\nhttps://lnkd.in/dGF-BBnw\n\n#Mstudio #Jèko #Fintech #Afrique #Entrepreneuriat","pid":"7483822844846432257","chars":1138,"hashtags":5,"mentions":3,"link":true,"question":false,"lang":"FR","theme":"Nos startups"},{"date":"2026-07-27","month":"2026-07","weekday":"Lundi","hour":16,"reactions":15,"comments":0,"reposts":1,"eng":16,"media":"texte","url":"https://www.linkedin.com/posts/mstudiovc_m-studio-head-of-operations-revvo-activity-7487540253466226688-jXKT?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"50 points de contrôle. 6 mois de garantie. Moins de 24h pour livrer. Derrière chaque smartphone Revvo, il y a une chaîne physique qui doit tourner sans accroc. Et aujourd'hui, on c","text":"50 points de contrôle. 6 mois de garantie. Moins de 24h pour livrer.\n\nDerrière chaque smartphone Revvo, il y a une chaîne physique qui doit tourner sans accroc. Et aujourd'hui, on cherche la personne qui va la faire tourner.\n\nRevvo donne une deuxième vie aux smartphones haut de gamme à Abidjan : appareils certifiés, paiement en 3 ou 6 fois, et 60 kg de CO₂ économisés à chaque appareil. Notre promesse tient en quatre mots : deuxième vie, première qualité.\n\nOn recrute notre Head of Operations.\n\n⚒️ La chaîne de reconditionnement, du sourcing à la mise en vente\n🛡️ La qualité et le SAV, parce que la confiance d'un client se joue exactement là\n📦 Le stock et la logistique, avec la livraison en moins de 24h comme standard\n🤝 Les fournisseurs certifiés\n📊 Le pilotage par les KPIs, et une équipe terrain à faire grandir\n\nLe profil : 5 ans et plus en opérations, supply chain, logistique ou service après-vente. Quelqu'un qui a déjà tenu une chaîne physique de bout en bout, qui pilote par la donnée et qui manage de près. Basé.e à Abidjan ou ouvert.e à s'y relocaliser.\n\nChez Revvo, les opérations ne sont pas une fonction support. C'est le produit lui-même.\n\n👉🏾 La fiche complète et les candidatures : https://lnkd.in/eQrUP6Bh\n\nPour en savoir plus, visitez: www.revvo.africa\n\n#Revvo #Abidjan #Recrutement #Operations #ÉconomieCirculaire","pid":"7487540253466226688","chars":1336,"hashtags":5,"mentions":1,"link":true,"question":false,"lang":"FR","theme":"Nos startups"},{"date":"2026-07-31","month":"2026-07","weekday":"Vendredi","hour":10,"reactions":52,"comments":1,"reposts":2,"eng":55,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_afrique-intelligenceartificielle-diaspora-activity-7488896257202032640-Z2ju?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🌍 Quels sont les atouts de l'Afrique dans la mondialisation ? Notre cofondatrice et COO Leslie Ossete était l'invitée d'Laïdi Ali dans « Aux avant-postes », sur FRANCE 24, pour en ","text":"🌍 Quels sont les atouts de l'Afrique dans la mondialisation ?\n\nNotre cofondatrice et COO Leslie Ossete était l'invitée d'Laïdi Ali dans « Aux avant-postes », sur FRANCE 24, pour en débattre.\n\nUn échange à trois, aux côtés de Ludovic. Ngatse, ministre de l'Économie, du Plan, de la Statistique et de la Prospective de la République du Congo, et de Stanislas Tomavo, président du conseil d'administration de l'Agence béninoise de la recherche et de l'innovation.\n\nAu cœur de la discussion : la jeunesse, la diaspora, le numérique et l'intelligence artificielle. Le capital local aussi, parce qu'on ne bâtit pas des champions africains uniquement avec de l'argent venu d'ailleurs. Et l'industrialisation du continent, qui reste la condition de tout le reste : transformer ici, plutôt qu'exporter brut et racheter fini.\n\nCe sont les sujets sur lesquels nous travaillons chaque jour depuis Abidjan : bâtir, aux côtés de fondateurs africains, des entreprises technologiques qui répondent aux besoins réels de leurs marchés.\n\nL'intelligence artificielle arrive au moment où le continent a la population la plus jeune du monde et une diaspora prête à contribuer bien plus qu'avant. Les compétences se construisent maintenant.\n\n🎥 L'émission est en ligne : https://lnkd.in/eYbY_DTC\n\n#Afrique #IntelligenceArtificielle #Diaspora #Industrialisation #VentureStudio","pid":"7488896257202032640","chars":1351,"hashtags":5,"mentions":5,"link":true,"question":false,"lang":"FR","theme":"Convictions & analyses"},{"date":"2026-08-13","month":"2026-08","weekday":"Jeudi","hour":10,"reactions":82,"comments":2,"reposts":1,"eng":85,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_un-pont-entre-dakar-et-abidjan-activity-7493607286658093057-p_PU?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🇸🇳 🇨🇮 Un pont entre Dakar et Abidjan. Nous avons eu le plaisir de recevoir ROKHAYA SOLANGE MBENGUE NDIR, Directrice de la Startup Factory de Orange Sonatel, au Mstudio. Une journée","text":"🇸🇳 🇨🇮 Un pont entre Dakar et Abidjan.\n\nNous avons eu le plaisir de recevoir ROKHAYA SOLANGE MBENGUE NDIR, Directrice de la Startup Factory de Orange Sonatel, au Mstudio.\n\nUne journée d'immersion dans le studio : visite de nos startups, rencontre des équipes, échanges sur le venture building et le venture clienting.\n\nUne conviction que nous partageons : ce qui change la trajectoire d'une startup, c'est celui qui en devient client. La relation entre grands groupes et startups en Afrique francophone doit évoluer dans ce sens.\n\nNos deux écosystèmes ont beaucoup à s'apporter. Cette visite en est le point de départ.\n\nMerci Rokhaya pour la qualité des échanges 🙏🏾","pid":"7493607286658093057","chars":664,"hashtags":0,"mentions":1,"link":false,"question":false,"lang":"FR","theme":"Convictions & analyses"},{"date":"2026-08-17","month":"2026-08","weekday":"Lundi","hour":8,"reactions":131,"comments":2,"reposts":2,"eng":135,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_une-dizaine-d%C3%A9tudiants-de-premi%C3%A8re-ann%C3%A9e-activity-7495037981381271554-LfPh?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🎓 Une dizaine d'étudiants de première année d'Epitech Côte d'Ivoire étaient au Mstudio jeudi dernier. Au programme : le fonctionnement d'un startup studio, puis un échange avec Myr","text":"🎓 Une dizaine d'étudiants de première année d'Epitech Côte d'Ivoire étaient au Mstudio jeudi dernier.\n\nAu programme : le fonctionnement d'un startup studio, puis un échange avec Myriel-Lys Ayegnon, notre Head of UI/UX design et avec Michel Edjoa, CTO de Danaya, sur les bonnes pratiques d'un jeune développeur et sur ce à quoi ressemble vraiment un parcours tech.\n\nCes étudiants cherchent leur premier stage de découverte à partir d'octobre. Si vous construisez une équipe technique à Abidjan, il y a là une génération à former.\n\nMerci à Epitech Afrique pour la confiance, et au plaisir de poursuivre cette dynamique 🙏🏾","pid":"7495037981381271554","chars":619,"hashtags":0,"mentions":3,"link":false,"question":false,"lang":"FR","theme":"Recrutement"},{"date":"2026-08-26","month":"2026-08","weekday":"Mercredi","hour":15,"reactions":35,"comments":0,"reposts":5,"eng":40,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_recrutement-ia-abidjan-activity-7498397608500035586-rXSv?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Yelema recrute deux postes clés à Abidjan. Yelema est la startup du Mstudio qui deploie de l'intelligence artificielle. Elle déploie des Experts IA prêts à l'emploi dans les entrep","text":"Yelema recrute deux postes clés à Abidjan.  \n\nYelema est la startup du Mstudio qui deploie de l'intelligence artificielle. \n\nElle déploie des Experts IA prêts à l'emploi dans les entreprises africaines, dans tous les métiers, là où les équipes travaillent déjà.  \n⚙️ Chief Technology Officer \nToute la technique, du premier client aux dix mille suivants. \n👉🏾 https://lnkd.in/eeFSmRb4  \n\n🎯 Head of Business Development \nL'ouverture du marché et la construction de la fonction commerciale. \n👉🏾 https://lnkd.in/eRcsn_Eb  \n\nDeux postes en présentiel, ouverts aussi aux profils prêts à s'installer à Abidjan.  \n#Recrutement #IA #Abidjan #CôteDIvoire #Yelema","pid":"7498397608500035586","chars":652,"hashtags":5,"mentions":1,"link":true,"question":false,"lang":"FR","theme":"Recrutement"},{"date":"2026-08-31","month":"2026-08","weekday":"Lundi","hour":10,"reactions":17,"comments":0,"reposts":2,"eng":19,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_tout-le-monde-parle-des-usages-de-lia-presque-activity-7500137846830346240-cjd3?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Tout le monde parle des usages de l'IA. Presque personne ne parle de ce qui les rend possibles. Avant qu'une intelligence artificielle rende le moindre service, il faut des données","text":"Tout le monde parle des usages de l'IA. Presque personne ne parle de ce qui les rend possibles.\n\nAvant qu'une intelligence artificielle rende le moindre service, il faut des données et des machines pour les faire tourner. Ce sont les deux couches dont tout dépend, et les moins bien comprises.\n\nMercredi 2 septembre, de 17h à 18h, nous ouvrons le capot avec Luc OKALOBE, fondateur de Yamify. Il construit une infrastructure d'IA souveraine pour le continent : des grappes de calcul hébergées au Nigeria, au Congo et en Afrique du Sud, qui permettent de déployer un outil d'IA en moins d'une minute depuis un centre de données africain. Passé par TikTok, Apple et IBM, il a levé cette année auprès de Launch Africa Ventures, l'un des fonds les plus actifs du continent.\n\nCe webinaire sera modéré par notre cofondatrice Leslie Ossete. Nous vous donnons rendez-vous en ligne.\n\nC'est gratuit et ouvert à tous. \n\n🔗 Inscription pour le webinaire : https://luma.com/anrw8zae\n\nLa séance prépare IMPACT IA, les assises nationales sur l'intelligence artificielle, du 9 au 11 septembre à Latrille Events, Abidjan : https://luma.com/4cqbpknm","pid":"7500137846830346240","chars":1129,"hashtags":0,"mentions":4,"link":true,"question":false,"lang":"FR","theme":"Programmes & candidatures"},{"date":"2026-09-07","month":"2026-09","weekday":"Lundi","hour":10,"reactions":121,"comments":4,"reposts":6,"eng":131,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_lia-ne-va-pas-seulement-transformer-les-activity-7502666992026382338-gcvL?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"L'IA ne va pas seulement transformer les entreprises financées. Elle transforme déjà le métier de ceux qui les financent. Jeudi 10 septembre, l'Association Ivoirienne des Investiss","text":"L'IA ne va pas seulement transformer les entreprises financées. Elle transforme déjà le métier de ceux qui les financent.\n\nJeudi 10 septembre, l'Association Ivoirienne des Investisseurs en Capital réunit ses membres dans les locaux du Mstudio, pour regarder ce que l'IA change dans le travail d'investisseur comme dans l'accompagnement des sociétés en portefeuille. Les discussions se veulent concrètes, centrées autour de cas d'usage implémentés par les membres, afin de maximiser le passage à l'action de ceux qui doutent encore. \n\nAude Juglard, Head of Finance de Mstudio, et Mohamed Diabi, Managing Partner de KeysFinance Partners, ouvrent les échanges avec une démonstration de leurs propres initiatives.\n\nCet événement se tient en marge d'Impact IA, la deuxième édition des assises nationales sur l'intelligence artificielle organisée par le Ministry of Digital Transition and Technological Innovation, dont il est l'un des side events. Nous vous accueillons à 18h dans les locaux de Mstudio, à l'Ivoire Trade Center, et la soirée se prolonge autour d'un cocktail.\n\n👉🏾 RSVP : https://luma.com/u2qqlyen","pid":"7502666992026382338","chars":1107,"hashtags":0,"mentions":7,"link":true,"question":false,"lang":"FR","theme":"Levée & partenariats"},{"date":"2026-09-08","month":"2026-09","weekday":"Mardi","hour":9,"reactions":27,"comments":1,"reposts":0,"eng":28,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_impactia-intelligenceartificielle-cotedivoire-activity-7503016297538969600-twWq?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚀 Quelles tâches votre entreprise pourrait-elle confier à l'IA dès demain ? Trier des candidatures, préparer la paie, produire toute la créa de vos réseaux sociaux, relancer un dev","text":"🚀 Quelles tâches votre entreprise pourrait-elle confier à l'IA dès demain ?\n\nTrier des candidatures, préparer la paie, produire toute la créa de vos réseaux sociaux, relancer un devis, répondre aux clients la nuit : l'IA sait déjà faire tout cela. Reste à savoir par où commencer.\n\nC'est ce que Mstudio apporte à Impact IA, la deuxième édition des assises nationales sur l'intelligence artificielle, organisée du 9 au 11 septembre par le Ministère de la Transition Numérique et de l'Innovation Technologique.\n\n🎓 Notre cofondatrice et directrice des opérations, Leslie Ossete, anime la masterclass « Créer de la valeur avec l'IA en entreprise : choisir les bons cas d'usage métier, et mesurer ce qu'ils rapportent ». Elle montre concrètement comment intégrer l'IA dans vos différentes fonctions : les ressources humaines, le marketing, le service client, la finance, le juridique, les opérations.\n\n🏢 Nous serons également au stand avec nos startups : Djoli, Waribei, Flot., Danaya et BLOK, chacune avec sa brique d'IA en fonctionnement.\n\n🤖 Nous y présentons aussi la version bêta de Yelema, notre dernière startup, qui déploie des experts IA dans les entreprises. Une dizaine d'experts tiennent chacun une fonction, du recrutement au support client. Chacun se branche sur vos outils et rend un livrable fini.\n\nInscrivez-vous à IMPACT IA, vous recevrez ensuite le lien pour vous inscrire à la masterclass.\n📅 Jeudi 10 septembre, masterclass à 14h30 \n📍 Latrille Events, Deux Plateaux, Abidjan\n\n#ImpactIA #IntelligenceArtificielle #CotedIvoire #VentureStudio #Yelema","pid":"7503016297538969600","chars":1561,"hashtags":5,"mentions":8,"link":false,"question":false,"lang":"FR","theme":"Recrutement"},{"date":"2026-09-14","month":"2026-09","weekday":"Lundi","hour":13,"reactions":64,"comments":4,"reposts":4,"eng":72,"media":"video","url":"https://www.linkedin.com/posts/mstudiovc_impact-ia-2026-a-atteint-ses-objectifs-activity-7505261138696159234-8Oab?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Impact IA 2026 a atteint ses objectifs. Trois jours, du 9 au 11 septembre, à Latrille Events, pour la deuxième édition des assises nationales sur l'IA, organisées par le Ministère ","text":"Impact IA 2026 a atteint ses objectifs.\n\nTrois jours, du 9 au 11 septembre, à Latrille Events, pour la deuxième édition des assises nationales sur l'IA, organisées par le Ministère de la Transition Numérique et de l'Innovation Technologique.\n\n  👏 Bravo à Artefact et Mistral pour l'étude menée avec le Ministère. Des semaines d'ateliers et d'entretiens avec les acteurs publics et privés, restituées devant tout l'écosystème. \n\n 🎓 Les masterclasses ont tenu leur promesse. Des séances animées par des praticiens, sur des usages réels, du code à la santé, de la finance à l'agriculture. Toutes au même niveau d'exigence.  \n\n🤖 La Clinique IA, tenue par notre startup Yelema, c'était quatre experts IA à disposition des participants : Koffi au design, Adjoua au recrutement, Fatima au marketing, Kouassi au commercial. Les visiteurs arrivaient avec un besoin, choisissaient leur borne, et repartaient avec le travail fini : un logo, une charte graphique, une maquette de site internet, une fiche de poste, une affiche, une étude de la concurrence.  \n\n🏗️ Au Cercle des Décideurs, notre startup BLOK a montré comment elle utilise l'IA avec PFO Construction, devant le Ministre, le président de la CGECI et celui de la Chambre de Commerce. Une demande de cotation arrive par WhatsApp, l'IA retrouve chaque produit dans un catalogue de plusieurs milliers de références, et le devis repart en quelques minutes là où il fallait deux jours. La majorité des demandes se traite sans intervention humaine.\n\n🎤 Leslie Ossete, notre cofondatrice et directrice des opérations, a animé la masterclass « Créer de la valeur avec l'IA en entreprise » devant une salle pleine de dirigeants et de patrons de PME. Elle y a défendu une idée simple : un agent qui sert à quelque chose repose sur le contexte de l'entreprise, la mémoire de ses échanges et les compétences de son métier.\n🚀 La suite est le vrai sujet. \n\nLes cas d'usage sont priorisés, la feuille de route se construit. Il faut maintenant passer à l'exécution.  \n\nMerci au Ministry of Digital Transition and Technological Innovation, aux équipes, et à tous ceux qui sont passés nous voir. \n\ncc Waly K. N'Diaye Naminsita Bakayoko Kounandi Stephane Coulibaly Bita Saran Diomande Alexia Amichia Fabrice Zapfack\n\nCrédit: vidéo issue du journal RTI Info.","pid":"7505261138696159234","chars":2287,"hashtags":0,"mentions":12,"link":false,"question":false,"lang":"FR","theme":"Recrutement"},{"date":"2026-09-15","month":"2026-09","weekday":"Mardi","hour":9,"reactions":25,"comments":3,"reposts":7,"eng":35,"media":"texte","url":"https://www.linkedin.com/posts/mstudiovc_yelema-ia-recrutement-activity-7505561013828739073-QcVJ?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚨 Yelema recrute à Abidjan : trois missions courtes pour entraîner nos experts IA. Yelema, notre startup qui déploie des experts IA dans les entreprises, compte une dizaine d'exper","text":"🚨 Yelema recrute à Abidjan : trois missions courtes pour entraîner nos experts IA.\n\nYelema, notre startup qui déploie des experts IA dans les entreprises, compte une dizaine d'experts métier. Ils trient des candidatures, préparent la paie, écrivent les publications du mois, répondent aux clients.\n\nPour les faire progresser, on cherche des gens du métier, qui savent à quoi ressemble un livrable bien fait.\n\n👥 Un(e) chargé(e) RH junior, deux semaines, pour entraîner Adjoua (recrutement) et Fatou (RH et paie) : contrats, paie, procédures, et des livrables qu'un DRH signerait tels quels.\n👉🏾 https://lnkd.in/eg6c2A9f\n\n🎨 Un(e) designer et marketer junior, deux semaines, pour entraîner Fatima (marketing) et Koffi (design) : briefs, plans de communication, visuels, avec les codes et les formats qui font vendre.\n👉🏾 https://lnkd.in/egVqit75\n\n📊 Un(e) data analyst, un mois, pour structurer la base de ressources des experts, construire un template par livrable, puis brancher tout ça sur les experts.\n👉🏾 https://lnkd.in/eGBrmQtJ\n\n📍 Ivoire Trade Center, sur place. Démarrage dès que possible. Missions rémunérées.\n\nLe vrai sujet, ce n'est pas la technique. C'est le métier.\n\n#Yelema #IA #Recrutement #Abidjan #CôtedIvoire","pid":"7505561013828739073","chars":1219,"hashtags":5,"mentions":1,"link":true,"question":false,"lang":"FR","theme":"Recrutement"},{"date":"2026-09-16","month":"2026-09","weekday":"Mercredi","hour":10,"reactions":149,"comments":3,"reposts":4,"eng":156,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_ia-afrique-koafec2026-activity-7505943239720517632-oDw_?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"De Séoul à Abidjan, avec de la puissance de calcul dans les valises. 🇰🇷🇨🇮 La semaine dernière, Mstudio était au KOAFEC 2026 à Séoul avec deux startups du studio, BLOK TECHNOLOGY et","text":"De Séoul à Abidjan, avec de la puissance de calcul dans les valises. 🇰🇷🇨🇮 \n\nLa semaine dernière, Mstudio était au KOAFEC 2026 à Séoul avec deux startups du studio, BLOK TECHNOLOGY et Danaya, invitées par l' African Development Bank Group et le Global Digital Innovation Network (GDIN) dans le cadre du partenariat Corée-Afrique sur l'IA.  \n\nRésultat : des Compute Credits remis par le Président de la BAD et la Primature coréenne, pour faire tourner nos modèles sur des données africaines, et un partenariat signé avec GDIN pour ouvrir un pont à double sens entre les écosystèmes coréen et africain.  Ce que nous en retenons 👇  \n\n💡 Notre thèse se vérifie. Neuf emplois africains sur dix sont informels : commerçants, agriculteurs, chauffeurs. C'est là que l'IA aura le plus d'impact, et elle n'y arrivera qu'à travers des entreprises. Et une entreprise naît dans un écosystème : un modèle et de la capacité de calcul ne suffisent pas.  \n\n🤝 Un partenariat qui se construit à deux. Les startups coréennes cherchent un accès au marché africain, les nôtres cherchent des briques techniques. Le bon accord fait circuler entreprises, talents et savoir-faire dans les deux sens.  \n\n🌍 Des rencontres qui comptent, avec celles et ceux qui construisent l'IA sur le continent : Kate Kallot-Bucken, Alex Tsado, Moustapha Cisse.  \n\n🎯 Un cap clair : des premières démonstrations concrètes en début d'année, sur des cas d'usage africains.  Merci à Jean Pierre Gashami, Ph.D. et à la BAD, à Sokjin Chang et à toute l'équipe GDIN pour l'accueil et la confiance.  \n\nBravo à Yohann Behi, Michel Edjoa et Aimedjim (Rayann) Dalmeida qui ont porté nos couleurs à Séoul.  \n\n#IA #Afrique #KOAFEC2026 #Mstudio #VentureStudio","pid":"7505943239720517632","chars":1699,"hashtags":5,"mentions":13,"link":false,"question":false,"lang":"FR","theme":"Levée & partenariats"},{"date":"2026-09-17","month":"2026-09","weekday":"Jeudi","hour":10,"reactions":19,"comments":1,"reposts":8,"eng":28,"media":"texte","url":"https://www.linkedin.com/posts/mstudiovc_recrutement-marketing-fintech-activity-7506291090313052161-OeQK?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"📣 Jèko recrute un Digital Marketer à Abidjan. Jèko, c'est la fintech qui permet aux commerçants d'encaisser tous les moyens de paiement, mobile money, cartes et espèces, depuis une","text":"📣 Jèko recrute un Digital Marketer à Abidjan.\n\nJèko, c'est la fintech qui permet aux commerçants d'encaisser tous les moyens de paiement, mobile money, cartes et espèces, depuis une seule interface : la Jèko Box en boutique, le checkout pour la vente en ligne, les liens de paiement par WhatsApp et SMS.\n\nLe poste : faire connaître Jèko aux commerçants d'Abidjan et transformer cette visibilité en démonstrations et en comptes ouverts, aux côtés du CEO.\n\nAu quotidien :\n\n📱 Animer les réseaux sociaux de Jèko et filmer les commerçants qui encaissent\n🎯 Piloter les campagnes payantes, quartier par quartier, secteur par secteur\n🎪 Organiser un événement tous les deux mois, là où sont les commerçants\n🤝 Monter les partenariats avec les influenceurs et la presse en ligne\n📊 Suivre les leads jusqu'à l'équipe commerciale et rendre compte chaque semaine\n\nLe profil : un à trois ans en marketing digital, des campagnes Meta Ads déjà lancées et suivies, à l'aise sur le terrain autant que derrière un écran, et le goût des chiffres. C'est le premier poste marketing local de Jèko : la stratégie, le calendrier et le budget se construisent avec vous.\n\n📍 Abidjan, temps plein, sur place, démarrage dès que possible.\n\n👉🏾 Pour postuler : https://lnkd.in/eFqdwB8U\n\nPartagez autour de vous, la bonne personne est souvent à un degré de distance.\n\n#Recrutement #Marketing #Fintech #Abidjan #Jèko","pid":"7506291090313052161","chars":1379,"hashtags":5,"mentions":1,"link":true,"question":false,"lang":"FR","theme":"Recrutement"},{"date":"2026-09-22","month":"2026-09","weekday":"Mardi","hour":9,"reactions":57,"comments":1,"reposts":9,"eng":67,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_diasporaconnect-mstudio-diaspora-activity-7508095856420515842-Uq_e?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Diaspora Connect ouvre sa cohorte 3. 🌍 Pour les talents de la diaspora africaine qui veulent vivre une expérience professionnelle en Côte d'Ivoire, les candidatures sont ouvertes j","text":"Diaspora Connect ouvre sa cohorte 3. 🌍\n\nPour les talents de la diaspora africaine qui veulent vivre une expérience professionnelle en Côte d'Ivoire, les candidatures sont ouvertes jusqu'au 18 octobre.\n\nLe programme est porté par la Fondation Mstudio, avec le soutien de l'Ambassade de France en Côte d'Ivoire. Il prend en charge le billet d'avion, le visa, le logement pendant quatre mois, et une semaine d'immersion à Abidjan pour décoder l'écosystème avant de prendre son poste.\n\n📌 Plus de 60 offres en ligne pour 30 places : CDI, CDD et stages chez Djamo, Wave Mobile Money, Artefact, BLOK TECHNOLOGY, COFINA Côte d'Ivoire, PFO IMMOBILIER,  et d'autres entreprises qui recrutent.\n\n📅 Candidatures jusqu'au 18 octobre 2026\n\n✈️ Arrivée à Abidjan mi-janvier 2027, prise de poste le 25 janvier\n\n👉 Postuler : https://lnkd.in/eEwqYDvg\n\n💬 Webinaire de présentation jeudi 24 septembre, 17h à Abidjan, 19h à Paris : https://luma.com/cc1fr64k\n\n#DiasporaConnect #Mstudio #Diaspora #Abidjan #CôteDIvoire","pid":"7508095856420515842","chars":993,"hashtags":5,"mentions":8,"link":true,"question":false,"lang":"FR","theme":"Diaspora Connect"},{"date":"2026-09-25","month":"2026-09","weekday":"Vendredi","hour":9,"reactions":16,"comments":1,"reposts":3,"eng":20,"media":"texte","url":"https://www.linkedin.com/posts/mstudiovc_yelema-ia-recrutement-activity-7509182508878430208-efMp?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚨 Yelema recrute à Abidjan : deux missions de deux semaines pour entraîner nos experts IA. Yelema, notre startup qui déploie des experts IA dans les entreprises, compte une dizaine","text":"🚨 Yelema recrute à Abidjan : deux missions de deux semaines pour entraîner nos experts IA.\n\nYelema, notre startup qui déploie des experts IA dans les entreprises, compte une dizaine d'experts métier. Deux d'entre eux ont besoin d'un vrai professionnel à leurs côtés.\n\n📒 Un(e) comptable confirmé(e), pour entraîner Mamadou (notre expert IA finance) : facturation, trésorerie, budget, reporting, et des livrables qu'un directeur financier validerait tels quels.\n👉🏾 https://lnkd.in/excfk4Xh\n\n⚖️ Un(e) juriste confirmé(e), pour entraîner Ibrahim (notre expert IA juridique) : contrats, recouvrement, litiges, marques, avec la rigueur qu'on attend d'un juriste d'entreprise.\n👉🏾 https://lnkd.in/eQuhz7J6\n\nVous avez trois à cinq ans de métier et l'envie de voir comment l'IA change votre travail ? C'est pour vous.\n\n📍 Ivoire Trade Center, sur place. Démarrage dès que possible. Missions rémunérées.\n\n#Yelema #IA #Recrutement #Abidjan #CôtedIvoire","pid":"7509182508878430208","chars":939,"hashtags":5,"mentions":1,"link":true,"question":true,"lang":"FR","theme":"Recrutement"},{"date":"2026-09-28","month":"2026-09","weekday":"Lundi","hour":9,"reactions":27,"comments":1,"reposts":2,"eng":30,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_ais2026-aitekinnovationsummit-activity-7510269709653569536-6qEe?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🇨🇮 Le vendredi 2 octobre, Mstudio sera à l' AITEK Innovation Summit 2026, au siège d'AITEK à Zone 4, Abidjan. 🎤 Notre cofondatrice et Directrice des Opérations, Leslie Ossete, part","text":"🇨🇮 Le vendredi 2 octobre, Mstudio sera à l' AITEK Innovation Summit 2026, au siège d'AITEK à Zone 4, Abidjan.\n\n🎤 Notre cofondatrice et Directrice des Opérations, Leslie Ossete, participe au panel « Innovation africaine : financer, acheter, changer d'échelle », de 15h à 16h, aux côtés de Djibril Doumbia (Comoé Capital), Daouda Coulibaly (Attijariwafa bank) et Florence TAHIRI epse FADIKA (Fondation Jeunesse Numérique), sous la modération de Dr Mafini Dosso, PhD, PMP (OIITID).\n\n🎓 Nous animons aussi une masterclass avec deux de nos startups, Danaya et Jèko : \"Du client vérifié au paiement encaissé : deux plateformes ivoiriennes, une seule chaîne, et l'IA qui la surveille\". Elle s'adresse aux banques, assurances, télécoms et grands distributeurs qui enrôlent et encaissent en volume.\n👉S'inscrire ici: https://lnkd.in/eH94vpxt\n\n🤝 Nous tenons enfin un stand dans la zone IA, avec trois de nos startups :\n🔹 Danaya, la conformité KYC et KYB pour les institutions financières de l'UEMOA\n🔹 Jèko, le paiement marchand pour les commerçants ivoiriens\n🔹 Yelema, des Experts IA déployés dans les entreprises africaines\n\nVenez échanger avec nos équipes sur le stand.\n\n📅 Vendredi 2 octobre, de 8h à 18h\n📍 Siège AITEK, rue Thomas Edison, Zone 4, Abidjan\n🎟️ Inscription gratuite, places limitées 👉 https://lnkd.in/ecAhcKcp\n🎫 Les réservations pour les masterclasses ouvriront ensuite, pour les inscrits\n\n#AIS2026 #AitekInnovationSummit","pid":"7510269709653569536","chars":1424,"hashtags":2,"mentions":11,"link":true,"question":false,"lang":"FR","theme":"Événements & écosystème"},{"date":"2026-09-29","month":"2026-09","weekday":"Mardi","hour":9,"reactions":19,"comments":1,"reposts":1,"eng":21,"media":"texte","url":"https://www.linkedin.com/posts/mstudiovc_m-studio-fleet-manager-flot-activity-7510632365530955776-84Lj?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"⚡Flot. recrute son Fleet Manager à Abidjan. Flot, c'est la startup de mobilité électrique du Mstudio : nous opérons une flotte de véhicules électriques et nous aidons des chauffeur","text":"⚡Flot. recrute son Fleet Manager à Abidjan.\n\nFlot, c'est la startup de mobilité électrique du Mstudio : nous opérons une flotte de véhicules électriques et nous aidons des chauffeurs VTC à devenir propriétaires de leur véhicule, avec le leasing, la maintenance et le suivi des recettes.\n\nLe poste : garder chaque véhicule sur la route. Vous pilotez la maintenance, vous tenez la relation avec les garages et les partenaires, et vous faites des chauffeurs une équipe qui prend soin du matériel.\n\nAu quotidien :\n\n🔧 Coordonner la maintenance préventive et corrective, suivre les diagnostics et réduire les immobilisations\n🤝 Tenir les prestataires et partenaires techniques à leurs engagements\n🚗 Animer chaque semaine les réunions avec les chauffeurs\n📊 Rendre compte chaque semaine à la direction : état de la flotte, coûts, performances\n\nLe profil : une vraie expérience en gestion de flotte, une bonne connaissance technique des véhicules, à l'aise avec les outils de suivi connectés, un leader sur le terrain. Permis de conduire obligatoire.\n\n📍 Abidjan, Ivoire Trade Center. Prestation de six mois renouvelable, démarrage dès que possible.\n\n👉🏾 Pour postuler : https://lnkd.in/e8Hw88is\n\nPartagez autour de vous, la bonne personne est souvent à un degré de distance.\n\n#Recrutement #MobilitéÉlectrique #Flot #Abidjan #CôtedIvoire","pid":"7510632365530955776","chars":1325,"hashtags":5,"mentions":1,"link":true,"question":false,"lang":"FR","theme":"Recrutement"},{"date":"2026-09-30","month":"2026-09","weekday":"Mercredi","hour":10,"reactions":24,"comments":0,"reposts":6,"eng":30,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_ais2026-aitekinnovationsummit-venturestudio-activity-7511013226579640320-51l-?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Deux startups du studio, deux maillons d'une même chaîne. Danaya vérifie qui est le client. Jèko encaisse ce qu'il paie. Le 2 octobre, à l' AITEK Innovation Summit, elles montrent ","text":"Deux startups du studio, deux maillons d'une même chaîne.\n\nDanaya vérifie qui est le client. Jèko encaisse ce qu'il paie. Le 2 octobre, à l' AITEK Innovation Summit, elles montrent ensemble comment ces deux étapes se tiennent, et comment l'IA aide à repérer la fraude entre les deux.\n\n🎓 Masterclass « Du client vérifié au paiement encaissé : deux plateformes ivoiriennes, une seule chaîne, et l'IA qui la surveille »\n🕛 Vendredi 2 octobre, de 12h à 13h, Roof, salle Esprit d'Équipe (1
