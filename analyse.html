:"Censé faire commenter.","nA":3,"nB":18,"medA":72,"medB":144,"delta":-50,"solid":false},{"name":"Des hashtags","note":"Presque partout.","nA":13,"nB":8,"medA":127,"medB":144,"delta":-12,"solid":true}],"top":["2026-02-23","2026-05-28","2026-01-09","2026-05-13","2026-05-06"],"noImpressions":true},{"key":"paul","label":"Paul Wilson","short":"Paul","kind":"person","desc":"du profil de Paul Wilson, COO de Flot","reposts":30,"posts":[{"date":"2026-01-06","month":"2026-01","weekday":"Mardi","hour":10,"reactions":16,"comments":1,"reposts":0,"eng":17,"media":"img","url":"https://www.linkedin.com/posts/paulwilsonpro_stellantis-va-d%C3%A9velopper-des-v%C3%A9hicules-autonomes-activity-7414247336937447424-FQ3_?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Stellantis va développer des véhicules autonomes avec Bolt Après avoir noué un partenariat avec Uber, Stellantis va travailler avec l’entreprise estonienne Bolt, spécialisée dans l","text":"Stellantis va développer des véhicules autonomes avec Bolt \nAprès avoir noué un partenariat avec Uber, Stellantis va travailler avec l’entreprise estonienne Bolt, spécialisée dans le ride hailing, autour d’un projet ici aussi lié aux véhicules autonomes.\n\nSource : https://lnkd.in/egeRCkSy","pid":"7414247336937447424","chars":289,"hashtags":0,"mentions":3,"link":true,"question":false,"lang":"FR","theme":"Levée & partenariats"},{"date":"2026-01-07","month":"2026-01","weekday":"Mercredi","hour":12,"reactions":19,"comments":1,"reposts":0,"eng":20,"media":"img","url":"https://www.linkedin.com/posts/paulwilsonpro_stellantis-nest-plus-le-seul-constructeur-activity-7414650769678733312-xjHy?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Stellantis n’est plus le seul constructeur automobile au capital de Leapmotor. FAW (Bestune), un groupe chinois détenu par une branche de l’état public, vient d’annoncer une montée","text":"Stellantis n’est plus le seul constructeur automobile au capital de Leapmotor. FAW (Bestune), un groupe chinois détenu par une branche de l’état public, vient d’annoncer une montée à 5 % du capital de Leapmotor ce qui en fera son troisième plus gros actionnaire. \n\nLeapmotor a vendu 500 millions de dollars d’actions à FAW ce qui va porter la valorisation totale à environ 10 milliards de dollars.\n\nSource : https://lnkd.in/erYVnmSH","pid":"7414650769678733312","chars":432,"hashtags":0,"mentions":2,"link":true,"question":false,"lang":"FR","theme":"Non classé"},{"date":"2026-01-12","month":"2026-01","weekday":"Lundi","hour":9,"reactions":21,"comments":3,"reposts":0,"eng":24,"media":"img","url":"https://www.linkedin.com/posts/paulwilsonpro_tesla-fsd-electricvehicle-activity-7416411183756513280-T_Op?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Le système FSD de Tesla est lancé en France uniquement en “test passager” car la véritable conduite autonome avancée n’a pas encore l’approbation réglementaire nécessaire en Europe","text":"Le système FSD de Tesla est lancé en France uniquement en “test passager” car la véritable conduite autonome avancée n’a pas encore l’approbation réglementaire nécessaire en Europe.\n\nL’option coûte 7 500 € aujourd’hui et sera activée à distance en 2026 après l’obtention de la réponse des autorités européennes, un élément crucial à déclarer à votre assureur.\n\nHashtags : #Tesla #FSD #ElectricVehicle #France #Europe \nSource : https://lnkd.in/e5TGThuf","pid":"7416411183756513280","chars":451,"hashtags":5,"mentions":0,"link":true,"question":false,"lang":"FR","theme":"Non classé"},{"date":"2026-01-13","month":"2026-01","weekday":"Mardi","hour":9,"reactions":35,"comments":3,"reposts":1,"eng":39,"media":"img","url":"https://www.linkedin.com/posts/paulwilsonpro_il-y-a-25-ans-je-suivais-l%C3%A9volution-activity-7416778540093939712-05_-?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Il y a 25 ans.... ....Je suivais l’évolution de la tech uniquement à travers le hardware sur les catalogues RueDuCommerce. Le software ? C’était pour les génies, les ingénieurs, pa","text":"Il y a 25 ans....\n\n\n\n\n....Je suivais l’évolution de la tech uniquement à travers le hardware sur les catalogues RueDuCommerce. Le software ? C’était pour les génies, les ingénieurs, pas pour nous.\n\nIl y a 4 ans, quand j’ai démarré sur des postes de décision dans la tech, j’ai compris une chose simple : personne n’y échappera avec l’IA* notamment.\n\nAujourd’hui, avec nos équipes chez Flot.,  nous développons des solutions que les entreprises africaines achetaient hier en Europe ou aux États-Unis. Des solutions locales, pensées pour nos marchés, sans rien à envier aux technologies de la Silicon Valley.\n\nIA, algorithmes, scoring, data…\nLes entrepreneurs africains ont compris une réalité fondamentale :\n\n> une entreprise ne se pilote plus à l’intuition.\n\nLa tech n’est plus un avantage compétitif.\nElle est devenue le socle de la croissance, de la performance et de la résilience.\n\nLe futur des entreprises africaines ne sera ni low-tech, ni importé clé en main.\nIl sera construit localement, piloté par la data, et pensé pour nos réalités.\n\nPS : *L’IA, comme toute innovation, n’a de valeur que si elle est utilisée avec une stratégie claire, des cas d’usage précis et une vision long terme.","pid":"7416778540093939712","chars":1196,"hashtags":0,"mentions":1,"link":false,"question":false,"lang":"FR","theme":"Produit & offre"},{"date":"2026-01-14","month":"2026-01","weekday":"Mercredi","hour":1,"reactions":7,"comments":0,"reposts":0,"eng":7,"media":"img","url":"https://www.linkedin.com/posts/paulwilsonpro_karmen-revenuebasedfinance-dette-activity-7417008807387529216-oTHP?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Equity et perte de controle progressif de son entreprise, dettes toxiques ou financements bancaires complexes et chers. OK on connait tous le schéma, mais avez vous déjà pensé RBF?","text":"Equity et perte de controle progressif de son entreprise, dettes toxiques ou financements bancaires complexes et chers. OK on connait tous le schéma, mais avez vous déjà pensé RBF? \n\n9/10 diront ''non'', j’explique : \n\nSi la levée de fonds ou les emprunts bancaires sont monnaie courante pour de nombreuses entreprises françaises comme internationales (en Afrique aussi). Ils sont parfois mal adaptés aux besoins plus ponctuels des jeunes entreprises du digital (e-commerce, SaaS ...). \n\nC’est là qu’entre en scène le RBF comme solution de financement : le Revenue Based Financing. Ce mode de financement non-dilutif (contrairement à la levée de fonds) permet aux entrepreneurs de ne pas s’endetter (pas sur le schéma classique), ou de réaliser des tables, et d’obtenir un financement en 24 à 48h.  \n\nPour mieux comprendre comment fonctionne le RBF, lisez l’article ci dessous 👇 \n\nHashtag : #Karmen #RevenueBasedFinance #Dette #Financement #Banque #RBF\nSource : https://lnkd.in/ed9GtDai","pid":"7417008807387529216","chars":986,"hashtags":6,"mentions":0,"link":true,"question":false,"lang":"FR","theme":"Levée & partenariats"},{"date":"2026-01-14","month":"2026-01","weekday":"Mercredi","hour":5,"reactions":19,"comments":0,"reposts":1,"eng":20,"media":"img","url":"https://www.linkedin.com/posts/paulwilsonpro_stellantis-installe-sa-marque-leapmotor-activity-7417074860654448642-VJhH?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🔌Stellantis installe sa marque Leapmotor sur un nouveau marché afin de devenir, avec l'ensemble des marques présentes sur ce territoire, leader du secteur à l'horizon 2030. Source ","text":"🔌Stellantis installe sa marque Leapmotor sur un nouveau marché afin de devenir, avec l'ensemble des marques présentes sur ce territoire, leader du secteur à l'horizon 2030.\n\nSource : https://lnkd.in/eiX_3M8U\nAntonin Moriscot","pid":"7417074860654448642","chars":224,"hashtags":0,"mentions":1,"link":true,"question":false,"lang":"FR","theme":"Non classé"},{"date":"2026-01-15","month":"2026-01","weekday":"Jeudi","hour":8,"reactions":9,"comments":0,"reposts":0,"eng":9,"media":"img","url":"https://www.linkedin.com/posts/paulwilsonpro_fintech-afrique-superapps-activity-7417478150349053952-rcdP?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Super-app, Corebanking, Customer 1st. En lisant cet article... Source : https://lnkd.in/ewVvPCQm Je me suis rendu compte d’une chose : on a vraiment de la marge en Afrique. 📊 Le ma","text":"Super-app, Corebanking, Customer 1st.\nEn lisant cet article...\n\n\nSource :\nhttps://lnkd.in/ewVvPCQm\n\nJe me suis rendu compte d’une chose : on a vraiment de la marge en Afrique. \n\n📊 Le marché des paiements mobiles au Vietnam a dépassé 40,5 milliards $, porté par des super-apps comme MoMo et ZaloPay qui accélèrent l’inclusion financière.\n\n➡️ Ça peut vraiment marcher en Afrique ?\nOui — mobile-first, peu de legacy bancaire et des besoins massifs encore non couverts. Super-app + core banking moderne + obsession client = scalabilité rapide.\n\n❓Celui qui comprend vite les usages clients en Afrique ne prend-il pas une longueur d’avance décisive ?\n\nIdriss Marcial MONTHE Leslie Ossete \n\n#Fintech #Afrique #SuperApps #Investissement #CustomerFirst #Innovation","pid":"7417478150349053952","chars":755,"hashtags":6,"mentions":2,"link":true,"question":true,"lang":"FR","theme":"Produit & offre"},{"date":"2026-02-05","month":"2026-02","weekday":"Jeudi","hour":9,"reactions":8,"comments":0,"reposts":0,"eng":8,"media":"img","url":"https://www.linkedin.com/posts/paulwilsonpro_recharger-un-ev-prend-beaucoup-de-temps-activity-7425102852878155777-7aif?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"\"Recharger un EV prend beaucoup de temps, j’ai pas le temps d’attendre 40 minutes etc...\" 🔌Tout ça c’est fini ! Bon ça l’etait déjà avec BYD et Tesla avec les Superchargers où en 2","text":"\"Recharger un EV prend beaucoup de temps,  j’ai pas le temps d’attendre 40 minutes etc...\"\n\n🔌Tout ça c’est fini ! Bon ça l’etait déjà avec BYD et Tesla avec les Superchargers où en 25 minutes c’etait plié (Autoroutes Vinci 🇫🇷) \n\nCATL va encore plus loin sur des modèles de batteries utilisés dans les pays émergents (Asie, Afrique, AmSud) : 12 minutes pour une recharge complète. \n\nLire l’article : https://lnkd.in/dunuBgWs","pid":"7425102852878155777","chars":423,"hashtags":0,"mentions":0,"link":true,"question":false,"lang":"FR","theme":"Non classé"},{"date":"2026-02-07","month":"2026-02","weekday":"Samedi","hour":11,"reactions":62,"comments":0,"reposts":0,"eng":62,"media":"img","url":"https://www.linkedin.com/posts/paulwilsonpro_tesla-maroc-electric-activity-7425858273477824513-pl18?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Tesla a présenté ce 6 février à Casablanca, pour la première fois en Afrique, deux de ses produits phares : le Cybertruck et le robot humanoïde Optimus. L’événement a eu lieu à Anf","text":"Tesla a présenté ce 6 février à Casablanca, pour la première fois en Afrique, deux de ses produits phares : le Cybertruck et le robot humanoïde Optimus. L’événement a eu lieu à AnfaPlace Mall, où la marque américaine a installé un point de vente éphémère, son tout premier espace physique sur le continent.\n\nEn parallèle de cette vitrine technologique, Tesla annonce l’ouverture de la commercialisation de ses modèles Model 3 et Model Y au Maroc. Le configurateur en ligne est désormais actif, avec des prix démarrant à 389.990 dirhams pour la Model 3 et 419.990 dirhams pour la Model Y. Les premières livraisons sont prévues pour l’été.\n\nSource : https://lnkd.in/dvcAwVG5\nTag : #Tesla #Maroc #Electric","pid":"7425858273477824513","chars":702,"hashtags":3,"mentions":1,"link":true,"question":false,"lang":"FR","theme":"Produit & offre"},{"date":"2026-02-14","month":"2026-02","weekday":"Samedi","hour":11,"reactions":23,"comments":2,"reposts":2,"eng":27,"media":"img","url":"https://www.linkedin.com/posts/paulwilsonpro_la-tech-sans-strat%C3%A9gie-on-en-parle-activity-7428403906273067010-9qIW?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🧠 La tech sans stratégie... On en parle ? Beaucoup de jeunes professionnels africains francophones disent « faire de la tech ». Mais font-ils aussi de la stratégie ? Aujourd’hui, o","text":"🧠 La tech sans stratégie... On en parle ? \n\n\n\nBeaucoup de jeunes professionnels africains francophones disent « faire de la tech ». Mais font-ils aussi de la stratégie ?\n\nAujourd’hui, on confond trop souvent compétence technique et vision stratégique. On valorise la capacité à coder, automatiser, analyser des données, déployer un produit. Très bien ! \n\nMais on oublie la question fondamentale :\n\nPourquoi le fait-on ?\nLa tech est un outil. Pas une finalité ! \n\nUn développeur peut créer une application brillante. Un ingénieur peut concevoir une architecture robuste. Un data analyst peut produire des dashboards impressionnants.\n\nMais si ces solutions ne répondent qu’au problème du moment, elles deviennent rapidement obsolètes. Pourquoi? Le temps, le marché et les usages évoluent plus vite que les lignes de code.\n\n♟️Résoudre l’instant vs construire le futur\n\nEn Afrique, beaucoup de projets tech cherchent à corriger une douleur immédiate :\n\nSimplifier un paiement\nDigitaliser un processus\nConnecter un service\n\nC’est utile. Mais ce n’est pas suffisant ! \n\nLa vraie question stratégique est :\n> Quelle transformation structurelle voulons-nous créer dans 5 ou 10 ans ?\n\n🎯 La tech doit être pensée comme une infrastructure de transformation, pas comme une réaction à court terme. Faire de la tech aujourd’hui exige trois dimensions :\n\n1. Compréhension du marché\n2. Vision stratégique long terme\n3. Maîtrise technique\n\nSi vous maîtrisez seulement la troisième, vous êtes exécutant. Si vous maîtrisez les trois, vous devenez disrupteur.\n\nLes plus grandes révolutions technologiques n’ont pas été créées par les meilleurs codeurs ou techniciens, elles ont été portées par des stratèges capables d’anticiper les usages futurs.\n\nElon Musk et Tesla :  ce n’est pas lui qui écrit les lignes de code. Il orchestre une vision systémique. En Afrique je pourrais parler aussi de Ladi Delano avec l’IA derriere Moove Waymo. \n\n😒 Le piège africain : courir derrière la technologie sans vision stratégique !\n\nNous importons souvent des solutions sans construire la vision qui va avec. Nous adoptons des outils sans redessiner le modèle économique. Nous copions des plateformes sans comprendre leur logique stratégique.\n\n📉 Résultat :\nDes produits fonctionnels.\nMais peu d’acteurs structurants.\n\nLa vraie puissance technologique ne vient pas de la maîtrise d’un langage. Elle vient de la capacité à transformer un secteur entier.\n\n💊 La question que tout professionnel tech africain devrait se poser : Est-ce que je construis une fonctionnalité…ou une infrastructure duplicable à l’echelle ?\n\nEst-ce que je suis un technicien performant…ou un stratège du futur ?\n\nLa tech sans vision est un gadget sophistiqué. La tech avec vision devient un levier de souveraineté.\n\n♟️L’Afrique n’a pas seulement besoin de développeurs. Elle a besoin de stratèges technologiques. Et la différence entre les deux déterminera qui construira les prochains champions du continent.","pid":"7428403906273067010","chars":2947,"hashtags":0,"mentions":4,"link":false,"question":true,"lang":"FR","theme":"Produit & offre"},{"date":"2026-03-06","month":"2026-03","weekday":"Vendredi","hour":19,"reactions":10,"comments":0,"reposts":0,"eng":10,"media":"img","url":"https://www.linkedin.com/posts/paulwilsonpro_non-ce-nest-pas-moi-sur-la-photo-mais-activity-7435763205026529281-U9WQ?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Non ce n’est pas moi sur la photo ! Mais si Gabriel le permet je vais parler de sa promesse avec Dust pour les entreprises. Pas de storytelling, des faits ! Ancien consultant et dé","text":"Non ce n’est pas moi sur la photo ! \n\nMais si Gabriel le permet je vais parler de sa promesse avec Dust pour les entreprises. Pas de storytelling, des faits ! \n\nAncien consultant et défenseur de la strat’ (ce n’est pas le nucleaire non plus) j’ai toujours pensé que la tech sans stratégie c’est moyen. Et je pense que l’IA résume cette pensée un peu. \n\nDepuis qu’on a créé Flot. je pilote la tech et les opérations avec une obsession : comment structurer toute la data qui tombe tous les jours pour améliorer avec mon cofounder nos prises de décisions et repousser encore plus loin le risque sur notre activité. \n\nOn a conçu toute la strat’ qu’il fallait, mais il manquait un truc, on avait de quoi payer l’essence mais on avait pas forcément les clés de la Ferrari, et c’est là que Dust a un peu tout changé : en seulement 48 heures et 3 iterations on a pu sortir je pense le top 3 des reportings que je n’ai jamais conçu dans ma vie pro. Ferrari, vitesse, vous aurez tout compris. \n\nQuand on parle de transformation digitale, deux éléments/facteurs sont importants à mon avis : la stratégie (savoir où on va) et la vitesse (productivité et capacité d’exécution). L’IA c’est la Ferrari que beaucoup de pilotes (stratèges) devraient apprendre à utiliser. \n\nL’interview de Gabriel vous aidera surement à mieux comprendre l’impact de l’IA dans la productivité de votre entreprise. \n\nhttps://lnkd.in/dQEbd3-V","pid":"7435763205026529281","chars":1405,"hashtags":0,"mentions":4,"link":true,"question":false,"lang":"FR","theme":"Convictions & analyses"},{"date":"2026-03-14","month":"2026-03","weekday":"Samedi","hour":10,"reactions":143,"comments":5,"reposts":26,"eng":174,"media":"img","url":"https://www.linkedin.com/posts/paulwilsonpro_abidjan-flot-recrute-pour-consolider-activity-7438536022797361152-qKTh?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Abidjan 🇨🇮 Flot. recrute pour consolider ses opérations et son déploiement sur Abidjan. Nous recherchons des profils dynamiques, dotés d’une grande autonomie et d’une capacité à re","text":"Abidjan 🇨🇮\n\nFlot. recrute pour consolider ses opérations et son déploiement sur Abidjan. Nous recherchons des profils dynamiques, dotés d’une grande autonomie et d’une capacité à reporter avec de la Data et l’IA. \n\nTrois (3) postes : \n\n• Assistante Gestion & Operations \n• Chargée d’Affaires Leasing \n• Fleet Manager \n\nVous connaissez un profil n’hesitez pas à m’envoyer un CV inbox, une recommandation ou ecrire à abidjan@flot.africa\n\nLieu : Ivoire Trade Center \n\nPS : Merci de bien lire le contenu des offres d’emplois.\n\n🔴 Cloture des offres Mardi 17 Mars 2026","pid":"7438536022797361152","chars":562,"hashtags":0,"mentions":1,"link":false,"question":false,"lang":"FR","theme":"Recrutement"},{"date":"2026-04-25","month":"2026-04","weekday":"Samedi","hour":14,"reactions":313,"comments":14,"reposts":2,"eng":329,"media":"img","url":"https://www.linkedin.com/posts/paulwilsonpro_michel-djombo-toutes-nos-f%C3%A9licitations-activity-7453809422784622592-s4na?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Michel Djombo Toutes nos félicitations cher Michel, Monsieur Le Ministre, pour votre entrée au gouvernement et votre nomination à la tête de ce ministère si important pour le dével","text":"Michel Djombo \n\nToutes nos félicitations cher Michel, Monsieur Le Ministre, pour votre entrée au gouvernement et votre nomination à la tête de ce ministère si important pour le développement économique de notre pays. \n\nC’est une nouvelle page qui s’ouvre pour les entrepreneurs et les entreprises du Congo-Brazzaville, nous vous souhaitons pleins succès dans votre mission.","pid":"7453809422784622592","chars":373,"hashtags":0,"mentions":1,"link":false,"question":false,"lang":"FR","theme":"Non classé"},{"date":"2026-05-11","month":"2026-05","weekday":"Lundi","hour":14,"reactions":136,"comments":5,"reposts":15,"eng":156,"media":"img","url":"https://www.linkedin.com/posts/paulwilsonpro_recrutement-mobilitaezaezlectrique-startup-activity-7459610710092931072-ybGT?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚀 Flot recrute ! La startup qui transforme la mobilité électrique à Abidjan ⚡️ cherche 2 talents pour rejoindre notre aventure : 1️⃣ Fleet Manager 2️⃣ Chargé(e) d’affaires Leasing ","text":"🚀 Flot recrute !\n\nLa startup qui transforme la mobilité électrique à Abidjan ⚡️ cherche 2 talents pour rejoindre notre aventure :\n1️⃣ Fleet Manager\n2️⃣ Chargé(e) d’affaires Leasing\n📍 Lieu : Ivoire Trade Center, Cocody, Abidjan\n📧 Candidature : abidjan@flot.africa\n\n[Indiquez références + prétention salariale]\n⏰ Date limite : 13 Mai 2026 à 12h00\nRejoignez-nous pour réinventer la mobilité électrique à Abidjan ! 🌱🔋\n\n#Recrutement #MobilitéÉlectrique #Startup #Abidjan #Flot #Emploi #CV #MStudio #Banque #Leasing #Automobile","pid":"7459610710092931072","chars":521,"hashtags":11,"mentions":0,"link":false,"question":false,"lang":"FR","theme":"Recrutement"},{"date":"2026-05-23","month":"2026-05","weekday":"Samedi","hour":14,"reactions":12,"comments":0,"reposts":0,"eng":12,"media":"file","url":"https://www.linkedin.com/posts/paulwilsonpro_data-nouveau-collateral-cr%C3%A9dit-en-afrique-activity-7463955581041586177-Sg5T?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"83% des emplois africains sont dans l'informel. $518 milliards c'est le déficit de financement en Afrique (Source IFC) Pourtant, les banques continuent de financer avec les mêmes o","text":"83% des emplois africains sont dans l'informel. $518 milliards c'est le déficit de financement en Afrique (Source IFC)\n\nPourtant, les banques continuent de financer avec les mêmes outils qu'il y a 30 ans, rigides et très peu agiles avec une analytique basée sur ce qu'ils voient là où une grande partie de l'activité économique du continent est encore invisible. \n\nLe vrai problème n'est pas l'absence d'activité économique en Afrique. C'est l'absence d'outils pour la lire. Chaque transaction mobile money, chaque flux de paiement, chaque kilomètre parcouru par un véhicule connecté — tout cela produit de la donnée.\n\nEt cette donnée est en train de devenir le nouveau collatéral du crédit africain, au point de transformer structurellement et systémiquement la capacité du continent à financer son économie. \n\nDans ce carrousel, j'explore comment :\n→ Le mobile money construit une infrastructure de lecture du risque\n→ Le Data Driven Finance peut débloquer $518Md de marché non capté\n→ L'IA va rendre le crédit africain adaptatif, prédictif et inclusif\n\nDemain en Afrique, le principal collatéral ne sera plus le relevé bancaire.\nCe sera la donnée.\n\n#FinancementAfrique #DataDrivenFinance #MobileMoney #Fintech #Crédit\nMichel Djombo Pierre-Alexandre Assou Luc JS MISSIDIMBAZI Vérone MANKOU Omar Denis Bongo Ondimba Issa Attye","pid":"7463955581041586177","chars":1327,"hashtags":5,"mentions":6,"link":false,"question":false,"lang":"FR","theme":"Convictions & analyses"},{"date":"2026-05-25","month":"2026-05","weekday":"Lundi","hour":8,"reactions":136,"comments":5,"reposts":2,"eng":143,"media":"img","url":"https://www.linkedin.com/posts/paulwilsonpro_ia-leasing-abidjan-activity-7464597099288977408-4o3_?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"⚡️ Vision, Execution, Impact ! Ce ne sont pas que des mots mais une traduction terrain de ce que nous essayons de construire Pierre-Alexandre Assou et moi autour de Flot. Permettre","text":"⚡️ Vision, Execution, Impact ! \n\nCe ne sont pas que des mots mais une traduction terrain de ce que nous essayons de construire Pierre-Alexandre Assou et moi autour de Flot. \n\nPermettre à des milliers de professionnels de la mobilité à Abidjan 🇨🇮 de devenir enfin propriétaires d’un actif leur permettant à la fois de mieux gagner leurs vies et de réduire globalement leur empreinte carbone. \n\nEntre IA leasing IoT et modèles de scoring alternatifs, notre ambition repose avant tout sur l’utilisation des nouvelles technologies comme levier d’impact global. \n\nVous êtes investisseur, banque institution ou concession automobile, passez nous voir dans nos bureaux au Batiment D (MStudio) à Ivoire Trade Center en face de Sofitel Ivoire. \n\n#IA #Leasing #Abidjan #Mobilité #Electrique Vérone MANKOU Michel Djombo CDC-CI CAPITAL FIGA CONGO Aurelien de Meaux Nicolas Dufourcq Ambition Africa by Business France","pid":"7464597099288977408","chars":904,"hashtags":5,"mentions":8,"link":false,"question":false,"lang":"FR","theme":"Levée & partenariats"},{"date":"2026-06-17","month":"2026-06","weekday":"Mercredi","hour":13,"reactions":40,"comments":4,"reposts":1,"eng":45,"media":"img","url":"https://www.linkedin.com/posts/paulwilsonpro_pr%C3%A9sent-%C3%A0-vivatech-et-aux-%C3%A9v%C3%A9nements-in-activity-7472999758874279936-PYvQ?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚀 Présent à VivaTech et aux événements In/OffSide demain à Paris. Si vous souhaitez échanger autour des sujets suivants : IA & Intégration de solutions Transformation digitale Mobi","text":"🚀 Présent à VivaTech et aux événements In/OffSide demain à Paris.\n\nSi vous souhaitez échanger autour des sujets suivants : \n\nIA & Intégration de solutions\nTransformation digitale\nMobilités \nFinancements spécialisés (automobile) \nAsset Management\n\nJe serai disponible pour rencontrer entrepreneurs, investisseurs et acteurs de l'innovation.\n\n📅 Vous pouvez réserver un créneau directement via ce lien : \nhttps://lnkd.in/ebxgsAdb\nOn s’attrape ! 👋\n\n**** ENG Below ****🚀 \n\nAttending VivaTech and In/OffSide Events tomorrow in Paris.\n\nIf you'd like to discuss:\n🤖 Artificial Intelligence & solution integrations\n📲 Digital transformation\n🚗 Mobility & automotive financing solutions\n💰 Specialized financing\n📈 Asset Management\n\nI'll be available to connect with entrepreneurs, investors, executives, and innovation leaders.\n\n📅 Feel free to book a meeting slot through this link: https://lnkd.in/ebxgsAdb forward to meeting you.Let's connect! 👋","pid":"7472999758874279936","chars":933,"hashtags":0,"mentions":0,"link":true,"question":false,"lang":"EN","theme":"Levée & partenariats"},{"date":"2026-07-03","month":"2026-07","weekday":"Vendredi","hour":16,"reactions":98,"comments":10,"reposts":7,"eng":115,"media":"img","url":"https://www.linkedin.com/posts/paulwilsonpro_leadership-tech-ia-activity-7478854236022243328-NMft?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Nous ne construisons pas seulement une fintech de la mobilité. Nous contribuons aussi à construire les talents de demain en Côte d'Ivoire. Ce matin, nous avons accueilli cinq dével","text":"Nous ne construisons pas seulement une fintech de la mobilité.\nNous contribuons aussi à construire les talents de demain en Côte d'Ivoire.\n\nCe matin, nous avons accueilli cinq développeuses et développeurs d'Epitech x Wecode dans nos bureaux qui depuis plusieurs semaines sont immergés au cœur de Flot Copilot, notre système d'information, pour travailler sur des cas d'usage concrets en IA, développement logiciel et cybersécurité.\n\nAvec Pierre-Alexandre Assou, nous partageons une conviction simple : le talent ne suffit pas. Il a besoin d'opportunités, de confiance et surtout de mise en pratique.\n\nEn Afrique, beaucoup de jeunes ne manquent pas de compétences. Ils manquent d'une première entreprise qui leur ouvre la porte. Et si chaque entreprise accompagnait environ 10 jeunes par an ? Nous formerions plus de 100 000 talents aux métiers du code, de l'IA et de la transformation digitale rien qu'en Côte d'Ivoire. \n\nC'est ainsi que se construira l'écosystème technologique africain. \n\nChez Flot, nous avons choisi de transmettre et de co-construire. Parce qu'investir dans des jeunes pépites est certainement l'investissement le plus stratégique qu'une entreprise puisse faire et la tech c'est le prochain levier du développement économique du continent, on y est déjà ! \n\nAnne-Alice FIEVET Opauquou Michel H. OKOU Cédric Youkou Céline BERTRAND-HARDY Marc Ariel Oka\n\n#Leadership #Tech #IA #TransformationDigitale #Talent #Epitech #WeCode #CotedIvoire #Abidjan #Flot Epitech - L'école de l'excellence informatique Epitech Afrique Mstudio","pid":"7478854236022243328","chars":1543,"hashtags":10,"mentions":9,"link":false,"question":false,"lang":"FR","theme":"Levée & partenariats"},{"date":"2026-07-07","month":"2026-07","weekday":"Mardi","hour":12,"reactions":49,"comments":1,"reposts":0,"eng":50,"media":"img","url":"https://www.linkedin.com/posts/paulwilsonpro_flot-abidjan-financement-activity-7480236361363525632-46bU?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Le financement automobile est bien plus complexe et technique qu'on ne le pense. Certains le simplifient par manque d'expertise/expérience, alors que l'automobile reste l'une des i","text":"Le financement automobile est bien plus complexe et technique qu'on ne le pense. Certains le simplifient par manque d'expertise/expérience, alors que l'automobile reste l'une des industries les plus complexes à financer.\n\n\n🗺️ Entre 2019 et 2022, pendant plusieurs mois, j'ai parcouru toute la France, et même la Corse : Montpellier, Toulouse, Paris, Brest, Quimperlé, Ajaccio, Auxerre, etc. Gros coup de cœur pour la Bretagne, tout de même.\n\n📊 Plus de 200 concessions et filiales auditées, près de 500 000 plans de financement VN/VO contrôlés, des notations financières, des échanges avec des dirigeants de concessions et des entrepreneurs qui ne jurent que par l'automobile, ainsi que plusieurs centaines de millions d'euros d'actifs à auditer.\n\n🔍 Piloter et auditer une centaine de concessions automobiles, c'est un véritable travail de terrain : du garage aux pièces détachées, de l'assurance aux plans de financement. Le wholesale financing exige une expertise complète autour de l'asset qu'est l'automobile.\n\n🏦 Mon passage chez Ford Credit puis Opel Bank m'a appris une chose : on ne finance pas uniquement un actif, on finance tout un environnement où les risques sont multiples. Beaucoup ne voient que la ligne de crédit, mais il y a tout un univers technique et complexe derrière le financement de la distribution à grande échelle. C'est là que le métier d'auditeur risques prend toute sa valeur dans le wholesale financing : développer une vision à 360° de l'actif financé afin de réduire le risque d'exposition sur plusieurs années.\n\n🌍 Et c'est exactement cet environnement que j'ai retrouvé en lançant Flot à Abidjan, avec des contraintes un peu plus tropicales que celles que j'avais connues en France.\n\n💡 Capitalisez sur vos expériences actuelles : elles vous serviront bien plus tôt… et bien plus longtemps… que vous ne l'imaginez.\n\n#Flot. #Abidjan #Financement #Automobile #Wholesale #Credit","pid":"7480236361363525632","chars":1906,"hashtags":6,"mentions":0,"link":false,"question":false,"lang":"FR","theme":"Non classé"},{"date":"2026-08-05","month":"2026-08","weekday":"Mercredi","hour":8,"reactions":20,"comments":0,"reposts":1,"eng":21,"media":"img","url":"https://www.linkedin.com/posts/paulwilsonpro_moove-flot-leasing-activity-7490692199345586176-6E_D?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚀 Moove lève 250 millions de dollars en Serie C pour atteindre une valorisation de 2,1 milliards de dollars et accélérer le déploiement de l'infrastructure mondiale de la mobilité ","text":"🚀 Moove lève 250 millions de dollars en Serie C pour atteindre une valorisation de 2,1 milliards de dollars et accélérer le déploiement de l'infrastructure mondiale de la mobilité autonome !\n\n🔗 Lire l'article complet : https://lnkd.in/eac_Wynu\n\nLa stratégie de Moove dans le domaine de la mobilité autonome repose sur cinq années d'expérience dans la construction et l'exploitation d'infrastructures de mobilité à grande échelle. \n\nPartis d'un lancement initial de 76 véhicules à Lagos, la startup gére aujourd'hui environ 42 000 véhicules répartis dans 29 villes (dans 13 pays), pour un chiffre d'affaires annuel récurrent (ARR) de 420 millions de dollars. 📈\n\nDepuis 2020, Moove a développé la plateforme de capitaux, de flottes et d'opérations nécessaire pour déployer et gérer efficacement des actifs de transport à grande échelle. Aujourd'hui, l'entreprise emploie 3 300 personnes à travers le monde et opère l'une des flottes de VTC les plus importantes au monde. \n\nCette croissance s'est appuyée sur une combinaison de développement organique et d'acquisitions stratégiques, telles que Kovi au Brésil et Tokyo Taxi au Japon. 🌍🚗\n\n\n🇬🇧 English Version\n🚀 Moove Raises $250 Million at $2.1 Billion Valuation to Scale the Global Infrastructure Layer for Autonomous Mobility\n\nMoove’s autonomous strategy is grounded in five years of building and operating mobility infrastructure at scale, from an initial launch of 76 vehicles in Lagos to approximately 42,000 vehicles across 29 cities (13 countries) and achieving an ARR of $420 million. 📈\n\nSince 2020, Moove has built the capital, fleet and operations platform required to deploy and manage productive human driven ride-hail mobility assets at scale. Today, the company employs 3,300 people globally, and operates approximately 42,000 vehicles across 29 cities in 13 countries, making it one of the largest ride-hailing fleets in the world. It has expanded through a combination of organic growth and strategic acquisitions, including Kovi in Brazil and Tokyo Taxi in Japan, and has grown to $420 million ARR. 🌍🚗\n\n🔗 Read the full article : https://lnkd.in/eac_Wynu\n\n#Moove #Flot #Leasing #Africa #DriveToOwn #Finance #Strategy #Mobility #Abidjan #Google #Waymo","pid":"7490692199345586176","chars":2212,"hashtags":11,"mentions":1,"link":true,"question":false,"lang":"EN","theme":"Levée & partenariats"},{"date":"2026-08-17","month":"2026-08","weekday":"Lundi","hour":10,"reactions":200,"comments":5,"reposts":10,"eng":215,"media":"img","url":"https://www.linkedin.com/posts/paulwilsonpro_revolut-fintech-afrique-activity-7495060632925499393-toQL?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🇫🇷 Une étude récente sur Revolut publiée par Romain Liquard du pôle économique et recherche du groupe Crédit Agricole montre à quel point la nouvelle banque (licence hexagone obten","text":"🇫🇷 Une étude récente sur Revolut publiée par Romain Liquard du pôle économique et recherche du groupe Crédit Agricole montre à quel point la nouvelle banque (licence hexagone obtenue) s’est transformée avec une mutation fortement ‘’humaine’’ et non technologique. \n\n\n\n🎙️Je vous explique : \n\nOn extrapole souvent autour de l’IA et de la technologie, oubliant l’intelligence humaine. Les disrupteurs comme Revolut eux pensent inversement. Pourquoi? \n\n💾 Parceque la tech construit une machine, les métiers eux font croître une entreprise pas la tech uniquement. La recherche, les services, le support, les sales et l’ingénierie ne sont pas vraiment remplacés par l’IA ou du moins l’humain reste le facteur X sur ces métiers, la neobanque est passée de >7000 à >13000 employés : la finalité n’est donc pas la tech en soi mais comment scaler avec des ‘’génies’’ qui seront supportés par la tech, comment structurer une organisation globale et non juste ‘’tech-obsessed’’. \n\nRevolut  a cessé d’être une application pour devenir une vraie organisation capable de se vendre et s’installer n’importe où. C’est ce modèle que les fintechs africaines doivent comprendre et assimiler. \n\n⚡️La tech permet d’innover et d’accélérer mais ne vous permettra pas forcément de scale up, l’IA permet de consolider et de mieux analyser, de dérisquer comprendre et structurer mais ne remplace pas le génie humain et ça Revolut l’a compris. \n\nLe lien 🔗 de l’étude : https://lnkd.in/eSGwFnhB\n\nLes Echos Crédit Agricole Revolut #Revolut #Fintech #Afrique #IA","pid":"7495060632925499393","chars":1531,"hashtags":4,"mentions":6,"link":true,"question":false,"lang":"FR","theme":"Convictions & analyses"},{"date":"2026-08-27","month":"2026-08","weekday":"Jeudi","hour":12,"reactions":95,"comments":4,"reposts":0,"eng":99,"media":"img","url":"https://www.linkedin.com/posts/paulwilsonpro_iccf2-hec-paris-activity-7498711015593861120-z-mF?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚀 L’an passé avec Flot. je levais pour la première fois des fonds auprès d’un VC, un monde que j’ai plutôt découvert en 2024. Le jargon, très spécifique mais surtout un univers où ","text":"🚀 L’an passé avec Flot. je levais pour la première fois des fonds auprès d’un VC, un monde que j’ai plutôt découvert en 2024. Le jargon, très spécifique mais surtout un univers où tout est fin et précis. Chaque mot chaque chiffre dans le monde de l’investissement a une importance pour la suite. \n\n🎓Cette année, j’intègre HEC Paris non seulement pour compléter une expérience naissante mais surtout pour consolider une expertise grandissante dans ce milieu. \n\nEn Octobre je démarre le fameux ICCF2, certification reconnue dans le milieu de la finance et qui je l’espère me permettra de compléter un parcours professionnel déjà atypique. \n\n#ICCF2 #HEC #Paris #Finance #VC #AlumniHEC","pid":"7498711015593861120","chars":681,"hashtags":6,"mentions":0,"link":false,"question":false,"lang":"FR","theme":"Levée & partenariats"},{"date":"2026-09-03","month":"2026-09","weekday":"Jeudi","hour":12,"reactions":85,"comments":1,"reposts":4,"eng":90,"media":"img","url":"https://www.linkedin.com/posts/paulwilsonpro_electricmobility-ux-techforgood-activity-7501247647765348353-fnXI?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🇨🇮 En arrivant à Abidjan en 2024, j'étais loin d'imaginer à quel point la technologie pouvait transformer en profondeur le quotidien des Africains. C'est exactement le sens de notr","text":"🇨🇮 En arrivant à Abidjan en 2024, j'étais loin d'imaginer à quel point la technologie pouvait transformer en profondeur le quotidien des Africains. C'est exactement le sens de notre mission chez Flot. : faire le pont entre les réalités de milliers de professionnels et l'innovation technologique.\n\nIl y a encore 5 ans, repenser l'UX Driver dans notre secteur relevait de l'impensable en Afrique — un chemin audacieux que des pionniers comme Moove ont été les premiers à tracer.\n\nMais chez Flot, nous ne concevons pas une application « de plus ». Notre solution est une expérience utilisateur unique et essentielle pour les professionnels de la mobilité électrique. Véritable copilote au quotidien sur 36 mois, elle intègre suivi de progression vers la propriété, paiements mobile money, activité en temps réel, géolocalisation des bornes à Abidjan et transparence totale des frais.\n\n💡 Fierté supplémentaire : cette application a été entièrement conçue par de talentueuses femmes tech. Pierre-Alexandre Assou et moi nous sommes profondément engagés pour la mixité et la place des femmes dans l'écosystème numérique.\n\nUn immense merci à toutes les équipes, partenaires et contributeurs qui font vivre cette aventure. Marc Ariel Oka Opauquou Michel H. OKOU Cédric Youkou Myriel-Lys Ayegnon Neiba Aristide Guy Kouakou Laetitia Grâce Koffi Rosine Koffi Géraud ALLE Mstudio\n\nDécouvrez notre vision sur 👉 www.flot.africa 🌍⚡️\n\n#ElectricMobility #UX #TechForGood #WomenInTech #StartUp #WestAfrica #Abidjan #Innovation #Flot","pid":"7501247647765348353","chars":1514,"hashtags":9,"mentions":12,"link":false,"question":false,"lang":"FR","theme":"Produit & offre"},{"date":"2026-09-14","month":"2026-09","weekday":"Lundi","hour":4,"reactions":87,"comments":6,"reposts":4,"eng":97,"media":"img","url":"https://www.linkedin.com/posts/paulwilsonpro_evsummit-mobilitaezaezlectrique-flot-activity-7505113171188183040-c6S6?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Je suis présent du 14 au 16 septembre 2026 au Nordic Africa EV Summit à Addis-Abeba pour échanger sur l'avenir du transport propre et durable sur le continent. 🔋 www.africaevsummit","text":"Je suis présent du 14 au 16 septembre 2026 au Nordic Africa EV Summit à Addis-Abeba pour échanger sur l'avenir du transport propre et durable sur le continent. 🔋 \n\nwww.africaevsummit.com\n\nLancé début 2026, Flot. (basés à Abidjan 🇨🇮) permet aux professionnels de la mobilité urbaine d'accéder à des solutions packagées de leasing électrique avec une double promesse : plus d'impact et de réduction carbone, mais surtout des professionnels qui deviennent enfin propriétaires de leurs véhicules.\n\nNous misons sur la technologie pour soutenir nos opérations et affiner nos décisions — des briques technologiques propriétaires conçues depuis Abidjan qui nous permettent aujourd'hui de réduire considérablement le risque sur notre activité :\n\n📊 Fleet Management & IoT\n🤖 Intelligence artificielle & maintenance prédictive\n💳 Scoring alternatif & gestion des risques de paiement\n\nVous souhaitez en savoir plus sur notre approche ou découvrir Flot ?\n☕ Prenons un café ou rencontrons-nous directement sur place pendant le sommet !\n\nCc : Vérone MANKOU Michel Djombo CDC-CI CAPITAL Comoé Capital Mstudio\n#EVSummit #MobilitéÉlectrique #Flot #GreenTech #FleetManagement #Abidjan #AddisAbeba #Leasing\n\n-----------------------------------\n🇺🇲 English Below \n\nI am attending the Nordic Africa EV Summit in Addis Ababa from September 14 to 16, 2026, to discuss the future of clean and sustainable transport on the continent. 🔋 www.africaevsummit.com \n\nLaunched at the beginning of 2026, Flot (based in Abidjan 🇨🇮) enables urban mobility professionals to access packaged electric leasing solutions with a dual promise: greater impact and carbon reduction, but above all, enabling professionals to finally own their vehicles.\n\nWe rely on technology to support our operations and sharpen our decisions—proprietary tech stacks built right out of Abidjan that allow us to significantly de-risk our business today: \n\n📊 Fleet Management & IoT \n🤖 Artificial Intelligence & Predictive Maintenance \n💳 Alternative Scoring & Payment Risk Management\n\nWant to learn more about our approach or discover Flot? \n☕ Let’s grab a coffee or meet up directly on-site during the summit!\n\n#EVSummit #ElectricMobility #Flot #GreenTech #FleetManagement #Abidjan #AddisAbeba #Leasing","pid":"7505113171188183040","chars":2236,"hashtags":16,"mentions":5,"link":false,"question":true,"lang":"EN","theme":"Événements"},{"date":"2026-09-22","month":"2026-09","weekday":"Mardi","hour":14,"reactions":67,"comments":6,"reposts":3,"eng":76,"media":"img","url":"https://www.linkedin.com/posts/paulwilsonpro_la-semaine-derni%C3%A8re-flot-a-pris-part-au-activity-7508163296768843776-HV7t?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"La semaine dernière, Flot a pris part au @Nordic Africa EV Summit à Addis-Abeba 🇪🇹. Le principal learning : la mobilité électrique n'est plus un concept d'avenir, c'est le moteur d","text":"La semaine dernière, Flot a pris part au @Nordic Africa EV Summit à Addis-Abeba 🇪🇹.  \n\nLe principal learning : la mobilité électrique n'est plus un concept d'avenir, c'est le moteur direct du potentiel économique africain 🚀. Et l’Ethiopie l’a très vite compris en structurant ce secteur. \n\nEntre financements, infrastructures, nouveaux usages et agilité opérationnelle, l'E-Mobility redéfinit la trajectoire de nos économies 🌍.\n\nTrois piliers structurent cette transformation :\n\n * Le mix énergétique et le digital : pour bâtir des réseaux résilients et connectés.\n * La data au cœur de l'équation : clé de voûte de l'optimisation, de la maintenance prédictive et de la performance des flottes.\n * La convergence des modèles : l'expérience pionnière des pays nordiques combinée à la dynamique unique de l'Éthiopie prouve que l'électrique n'est plus une alternative marginale, mais un choix stratégique central.\n\nEt grand merci à nos partenaires GIZ Côte d'Ivoire Barbara Adoléhoumé Comoé Capital Daniel Bongardt mais aussi aux différents ‘’fellows’’ durant le sommet Axel Peyriere Younes RABEH Ben Diop Abraham Balima pour leurs échanges. Nos remerciements aussi à MobilityX, Stuart Minnaar et Dustin Kahler et une mention spéciale à Yuma (ይልማ) Dodai pour la visite de leur infrastructure à Addis Abeba. \n\nCc : Pierre-Alexandre Assou Paul WILSON","pid":"7508163296768843776","chars":1345,"hashtags":0,"mentions":13,"link":false,"question":false,"lang":"FR","theme":"Événements"}],"totals":{"n":25,"reactions":1710,"comments":76,"reposts":79,"eng":1865,"medRx":40,"avgRx":68},"months":[{"key":"2026-01","label":"Janvier","n":7,"reactions":126,"comments":8,"reposts":2,"eng":136,"medRx":19,"avgRx":18},{"key":"2026-02","label":"Février","n":3,"reactions":93,"comments":2,"reposts":2,"eng":97,"medRx":23,"avgRx":31},{"key":"2026-03","label":"Mars","n":2,"reactions":153,"comments":5,"reposts":26,"eng":184,"medRx":7 function niceTicks(max,n){
  const raw=Math.max(max,1)/n, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw)||10*mag;
  const top=Math.ceil(Math.max(max,1)/step)*step, out=[];
  for(let v=0;v<=top+step*.001;v+=step) out.push(Math.round(v));
  return out;
}

function actions(){
  const out=[], T=V.tests||[];
  const noon=T.find(t=>t.name.startsWith("Publier à partir de midi"));
  if(noon) out.push({k:"L'heure", i:"clock",
    h:noon.delta>0?"Publie à partir de midi":"Reste sur le matin",
    p:`Les ${pl(noon.nA,"post")} publiés à partir de midi font <b>${fmt(noon.medA)}</b> ${V.unit} médianes. Les ${pl(noon.nB,"post")} du matin en font <b>${fmt(noon.medB)}</b>.`,
    w:`${noon.delta>0?"+":""}${noon.delta} % de ${V.metricName}, à contenu inchangé${noon.solid?"":" — échantillon court, à confirmer"}`});
  const fm=(V.byMedia||[]).filter(d=>d.n>=5);
  if(fm.length>1){const b=fm[0], w=fm[fm.length-1];
    out.push({k:"Le format", i:"file", h:`${LAB[b.k]||b.k} plutôt que ${(LAB[w.k]||w.k).toLowerCase()}`,
      p:`Le format ${(LAB[b.k]||b.k).toLowerCase()} fait <b>${fmt(V.gv(b))}</b> ${V.unit} médianes sur ${pl(b.n,"post")}, contre <b>${fmt(V.gv(w))}</b> pour ${(LAB[w.k]||w.k).toLowerCase()} sur ${pl(w.n,"post")}.`,
      w:`Écart de ${Math.round((V.gv(b)/Math.max(V.gv(w),1)-1)*100)} % entre le meilleur et le pire format`});}
  const th=(V.themes||[]).filter(t=>t.n>=3);
  if(th.length){const b=th[0];
    out.push({k:"Le sujet", i:"tag",
      h:V.reach?`Écris plus sur « ${b.key} »`:`« ${b.key} » est ce qui porte le mieux`,
      p:`C'est le sujet qui porte le mieux : <b>${fmt(V.gv(b))}</b> ${V.unit} médianes sur ${pl(b.n,"post")}${V.reach?`, avec ${pc(b.er)} % d'engagement`:""}.`,
      w:`Le sujet suivant plafonne à ${fmt(V.gv(th[1]||b))} ${V.unit}`});}
  if(V.reach){
    const eng=[...(V.themes||[])].filter(t=>t.n>=3).sort((a,b)=>b.er-a.er)[0];
    if(eng && V.gv(eng)<V.totals.median) out.push({k:"Le problème à traiter", i:"alert",
      h:`« ${eng.key} » mérite mieux que ${fmt(V.gv(eng))} ${V.unit}`,
      p:`C'est ton sujet le plus engageant (<b>${pc(eng.er)} %</b> d'engagement, ${pc(eng.conv)} ‰ de commentaires) et pourtant l'un des moins vus. Ceux qui le lisent adorent, mais il ne circule pas.`,
      w:"Problème de diffusion, pas d'écriture"});
  }else{
    const q=(V.tests||[]).find(t=>t.name.startsWith("Une question"));
    if(q) out.push({k:"À vérifier", i:"flask", h:q.delta>0?"Les questions finales fonctionnent":"Les questions finales ne servent à rien",
      p:`Les ${pl(q.nA,"post")} qui se terminent par une question font <b>${fmt(q.medA)}</b> réactions médianes, contre <b>${fmt(q.medB)}</b> pour les autres.`,
      w:q.solid?"Écart solide":"Échantillon court, à confirmer"});
  }
  return out.slice(0,4);
}

  <section>

  </section>

  <section>
    <div class="shead"><div><h2>${ic("list")}<span id="tblTitle">Toutes les publications</span></h2>
      <p>Clique sur une ligne pour lire le post en entier. La flèche à droite l'ouvre sur LinkedIn. Les en-têtes trient.</p></div></div>
    <div class="tbl">
      <div class="th" id="thead">
        <button data-s="date" class="on">Date <span data-c="date">↓</span></button>
        <button data-s="excerpt">Publication <span data-c="excerpt"></span></button>
        <button data-s="theme" class="h3">Sujet <span data-c="theme"></span></button>
        <button data-s="__m" class="r">${reach?"Vues":"Réactions"} <span data-c="__m"></span></button>

        <span></span>
      </div>
      <div id="rows"></div>
    </div>
  </section>

  ${reach?`<p class="foot"><b>Source.</b> Les ${D.totals.n} publications de ta page personnelle entre le 1<sup>er</sup> janvier et le 31 juillet 2026, récupérées via l'API LinkedIn. Impressions, réactions, commentaires et partages sont les compteurs réels. Engagement = (réactions + commentaires + partages) ÷ impressions. Commentaires ‰ = commentaires pour mille impressions : c'est l'indicateur qui prédit le mieux la diffusion, parce qu'un commentaire relance la distribution là où une réaction ne le fait presque plus.</p>
  <p class="foot"><b>Comment lire les écarts.</b> Ils sont calculés sur des <b>médianes</b>, pas des moyennes, pour qu'une seule grosse publication ne fausse pas la comparaison. Ce sont des corrélations sur ${D.totals.n} publications, avec des effets qui se mélangent : tes posts de midi ne sont pas les mêmes que ceux du matin. À lire comme des hypothèses à tester, pas comme des lois.</p>
  <p class="foot"><b>Ce qui manque.</b> Abonnés gagnés, vues de profil, apparitions dans les recherches : LinkedIn ne les expose pas par l'API et n'en garde aucun historique mensuel. Il faudrait un relevé manuel chaque mois depuis ton tableau de bord créateur.</p>`
  :`<p class="foot"><b>Source.</b> Les ${V.totals.n} publications 2026 de ${V.label}, récupérées via l'API LinkedIn. Réactions, commentaires et partages sont les compteurs réels. <b>Aucune impression n'est exposée</b> : ni portée, ni taux d'engagement, ni comparaison de reach avec ta page personnelle ne sont possibles ici.</p>
  <p class="foot"><b>Les sujets sont automatiques.</b> Contrairement à ton onglet, où les six thèmes sont classés à la main, ceux-ci sont marqués par score de mots-clés puis corrigés à la main au cas par cas. Un post qui parle d'un événement <b>et</b> d'une startup tombe dans le sujet le mieux noté. À lire comme un ordre de grandeur, pas comme un classement exact.</p>`}`;

  document.querySelectorAll("#thead button").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.s;
    if(sortKey===k) sortDir*=-1; else {sortKey=k; sortDir=(k==="excerpt"||k==="theme")?1:-1;}
    document.querySelectorAll("#thead button").forEach(x=>{

      x.querySelector("[data-c]").textContent=x.dataset.s===sortKey?(sortDir===1?"↑":"↓"):"";});
    render();
  }));
  document.getElementById("clearAll").addEventListener("click",()=>{selM=null;selT=null;render();});
}

function chart(){
  const W=900,H=300,L=62,R=46,T=18,B=44;
  const iw=W-L-R, ih=H-T-B, step=iw/Math.max(V.months.length,1);
  const mx=Math.max(...V.months.map(V.mv),1);
  const ticks=niceTicks(mx,4), top=ticks[ticks.length-1];
  const line=V.reach?V.months.map(m=>m.er):V.months.map(m=>m.n);
  const maxL=Math.max(...line,1)*1.3;
  let g="",bars="",dots="",labs="",pts=[];
  ticks.forEach(v=>{const y=T+ih-ih*(v/top);
    g+=`<line x1="${L}" y1="${y.toFixed(1)}" x2="${W-R}" y2="${y.toFixed(1)}" stroke="var(--line)"/>
        <text x="${L-11}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="12" fill="var(--muted)"
        font-family="Disp,sans-serif">${v?fmt(v):"0"}</text>`;});
  V.months.forEach((m,i)=>{
    const bw=step*.5, x=L+step*i+(step-bw)/2, h=ih*(V.mv(m)/top), y=T+ih-h;
    const on=!selM||selM===m.key;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}"
      height="${Math.max(h,1).toFixed(1)}" rx="5" fill="${selM===m.key?"var(--brand-d)":"var(--brand)"}"
      opacity="${on?1:.2}"><title>${m.label} — ${fmt(V.mv(m))} ${V.unit}</title></rect>`;
    const cx=L+step*i+step/2, cy=T+ih-ih*(line[i]/maxL); pts.push([cx,cy]);
    dots+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="4.5" fill="var(--card)"
      stroke="var(--warm)" stroke-width="2.5" opacity="${on?1:.25}"><title>${m.label} — ${V.reach?pc(m.er)+" % d'engagement":pl(m.n,"publication")}</title></circle>`;
    labs+=`<text x="${cx.toFixed(1)}" y="${H-16}" text-anchor="middle" font-size="13"
      font-family="Disp,sans-serif" font-weight="${selM===m.key?700:500}"
      fill="${selM===m.key?"var(--brand)":"var(--muted)"}">${SHORT[m.key]||m.label}</text>`;
  });
  document.getElementById("svg").innerHTML=g+bars+
    `<path d="${pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")}"
      fill="none" stroke="var(--warm)" stroke-width="2" stroke-linejoin="round" opacity=".6"/>`+dots+labs;
  document.getElementById("mLegend").innerHTML=
    `<span><i style="background:var(--brand)"></i>${V.reach?"Impressions":"Réactions"} du mois</span>
     <span><i style="background:var(--warm)"></i>${V.reach?"Taux d'engagement":"Nombre de publications"}</span>`;
}

function scatter(){
  const W=900,H=420,L=64,R=24,T=18,B=54, iw=W-L-R, ih=H-T-B;
  const yv=p=>V.reach?p.er:p.comments;
  const xT=niceTicks(Math.max(...V.posts.map(V.pv)),4), xMax=xT[xT.length-1];
  const yT=niceTicks(Math.max(...V.posts.map(yv)),4), yMax=yT[yT.length-1];
  let g="";
  yT.forEach(v=>{const y=T+ih-ih*(v/yMax);
    g+=`<line x1="${L}" y1="${y.toFixed(1)}" x2="${W-R}" y2="${y.toFixed(1)}" stroke="var(--line)"/>
        <text x="${L-10}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="12" fill="var(--muted)"
        font-family="Disp,sans-serif">${V.reach?pc(v)+" %":fmt(v)}</text>`;});
  xT.forEach(v=>{const x=L+iw*(v/xMax);
    g+=`<line x1="${x.toFixed(1)}" y1="${T}" x2="${x.toFixed(1)}" y2="${T+ih}" stroke="var(--line)"/>
        <text x="${x.toFixed(1)}" y="${T+ih+21}" text-anchor="middle" font-size="12" fill="var(--muted)"
        font-family="Disp,sans-serif">${v?fmt(v):"0"}</text>`;});
  const on=p=>(!selM||p.month===selM)&&(!selT||p.theme===selT);
  const pts=[...V.posts].sort((a,b)=>(on(a)?1:0)-(on(b)?1:0)).map(p=>{
    const x=L+iw*(V.pv(p)/xMax), y=T+ih-ih*(yv(p)/yMax), o=on(p);
    return `<a href="${p.url}" target="_blank" rel="noopener"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}"
      r="${o?7:4}" fill="${tc(p.theme)}" fill-opacity="${o?.8:.14}" stroke="var(--card)" stroke-width="1.5"
      style="cursor:pointer"><title>${dfr(p.date)} — ${fmt(V.pv(p))} ${V.unit}, ${V.reach?pc(p.er)+" % d'engagement":pl(p.comments,"commentaire")}
${p.theme}
${esc(p.excerpt.slice(0,90))}</title></circle></a>`;}).join("");
  document.getElementById("scatter").innerHTML=g+pts+
    `<text x="${L+iw/2}" y="${H-12}" text-anchor="middle" font-size="12.5" fill="var(--muted)"
      font-family="Disp,sans-serif">${V.reach?"Impressions":"Réactions"} →</text>`;
  document.getElementById("scLegend").innerHTML=V.themes.map(t=>
    `<span style="opacity:${!selT||selT===t.key?1:.32}"><i style="background:${tc(t.key)}"></i>${esc(t.key)}</span>`).join("");
}

function timeline(){
  const W=900,H=250,L=18,R=18,T=16,B=44, iw=W-L-R, ih=H-T-B;
  const d0=Date.UTC(2026,0,1), d1=Date.UTC(2026,6,31), span=d1-d0;
  const max=Math.max(...V.posts.map(V.pv),1);
  let g="";
  for(let m=0;m<7;m++){
    const x=L+iw*((Date.UTC(2026,m,1)-d0)/span);
    g+=`<line x1="${x.toFixed(1)}" y1="${T}" x2="${x.toFixed(1)}" y2="${T+ih}" stroke="var(--line)"/>
        <text x="${(x+6).toFixed(1)}" y="${T+ih+21}" font-size="12" fill="var(--muted)"
        font-family="Disp,sans-serif">${SHORT["2026-"+String(m+1).padStart(2,"0")]}</text>`;
  }
  const on=p=>(!selM||p.month===selM)&&(!selT||p.theme===selT);
  const bars=V.posts.map(p=>{
    const x=L+iw*((Date.parse(p.date+"T00:00:00Z")-d0)/span);
    const h=ih*(V.pv(p)/max), o=on(p);
    return `<a href="${p.url}" target="_blank" rel="noopener"><rect x="${(x-2.8).toFixed(1)}"
      y="${(T+ih-h).toFixed(1)}" width="5.6" height="${Math.max(h,2).toFixed(1)}" rx="2.2"
      fill="${tc(p.theme)}" opacity="${o?.9:.13}" style="cursor:pointer"><title>${dfr(p.date)} — ${fmt(V.pv(p))} ${V.unit}
${p.theme}
${esc(p.excerpt.slice(0,90))}</title></rect></a>`;}).join("");
  document.getElementById("timeline").innerHTML=
    g+`<line x1="${L}" y1="${T+ih}" x2="${W-R}" y2="${T+ih}" stroke="var(--line)"/>`+bars;
  let worst=0,wa="",wb="";
  V.posts.forEach((p,i)=>{ if(!i) return;
    const d=(Date.parse(p.date)-Date.parse(V.posts[i-1].date))/864e5;
    if(d>worst){worst=d;wa=V.posts[i-1].date;wb=p.date;}});
  document.getElementById("gapNote").textContent=
    `Le plus long silence : ${worst} jours, du ${dfr(wa)} au ${dfr(wb)}.`;
}

function hero(list,filtered){
  const s=k=>list.reduce((a,r)=>a+(r[k]||0),0);
  const med=list.length?median(list.map(V.pv)):0;
  const d=(v,ref,u)=>{ if(!filtered||!list.length) return "";
    const x=v-ref, c=x>=0?"var(--up)":"var(--down)";
    return `<span class="d" style="color:${c}">${x>=0?"↑":"↓"} ${Math.abs(x).toLocaleString("fr-FR",{maximumFractionDigits:u?2:0})}${u||""} vs ensemble</span>`;};
  const cells = V.reach ? [
    [fmt(s("impressions")),"Impressions","","eye"],
    [fmt(list.length),"Publications","","file"],
    [pc(s("impressions")?s("eng")/s("impressions")*100:0)+" %","Taux d'engagement",
      d(s("impressions")?s("eng")/s("impressions")*100:0,D.totals.er," pt"),"pulse"],
    [fmt(med),"Vues médianes",d(med,D.totals.median),"gauge"],
    [fmt(s("reactions")),"Réactions","","heart"],
    [fmt(s("comments")),"Commentaires","","chat"],
  ] : [
    [fmt(s("reactions")),"Réactions","","heart"],
    [fmt(list.length),"Publications","","file"],
    [fmt(med),"Réactions médianes",d(med,V.totals.medRx),"gauge"],
    [fmt(s("comments")),"Commentaires","","chat"],
    [fmt(s("reposts")),"Partages","","share"],
    ["—","Impressions","<span class=\"d\" style=\"color:var(--muted);font-weight:500\">non exposées par LinkedIn</span>","eye"],
  ];
  document.getElementById("hero").innerHTML=cells.map(([v,l,e,i])=>
    `<div class="hc">${ic(i)}<b>${v}</b><span>${l}</span>${e}</div>`).join("");
}

    <p>Tu es à <b>${pc(er)} %</b>. La moyenne plateforme des profils personnels est de <b>${pc(B.avg)} %</b>, et la zone considérée comme bonne va de <b>${pc(B.good[0])} %</b> à <b>${pc(B.good[1])} %</b>. Tu es donc <b>${Math.round((B.avg-er)/B.avg*100)} % en dessous de la moyenne</b>. Source : ${B.src.replace(/\n/g," ")}</p>

function diag(r){
  const out=[], noon=(V.tests||[]).find(t=>t.name.startsWith("Publier à partir de midi"));
  const ref=V.reach?D.totals.median:V.totals.medRx;
  out.push(V.pv(r)>=ref ? `Au-dessus de la médiane (${fmt(ref)} ${V.unit}).`
                        : `En dessous de la médiane (${fmt(ref)} ${V.unit}).`);
  if(noon) out.push(r.hour>=12 ? `Publié à ${r.hour} h, ${noon.delta>0?"le meilleur créneau":"le créneau le moins porteur"}.`
                               : `Publié à ${r.hour} h, ${noon.delta>0?"le créneau le moins porteur":"le meilleur créneau"}.`);
  const best=(V.byMedia||[]).filter(d=>d.n>=3)[0];
  if(best && r.media===best.k) out.push(`Format ${(LAB[r.media]||r.media).toLowerCase()}, le plus performant.`);
  out.push(r.link ? "Contient un lien dans le corps." : "Aucun lien dans le corps.");
  return out.join(" ");
}

function table(list){

    return (typeof A==="string"?A.localeCompare(B):A-B)*sortDir;});

    <div class="pr">
      <div class="prh">
        <button class="exp" aria-expanded="false">
          <span class="d">${dfr(r.date)}</span>

          <span class="e h4">${V.reach?pc(r.er)+" %":fmt(r.comments)}</span>
        </button>
        <a class="ext" href="${r.url}" target="_blank" rel="noopener"

      </div>
      <div class="body">
        <div class="meta">
          <span class="tag"><span class="dot" style="background:${tc(r.theme)}"></span>${esc(r.theme)}</span>
          <span class="tag">${LAB[r.media]||r.media}</span>
          <span>${r.weekday} ${r.date.split("-").reverse().join("/")} à ${r.hour} h</span>
          <span>${pl(r.reactions,"réaction")}, ${pl(r.comments,"commentaire")}, ${pl(r.reposts,"partage")}</span>
          <span>${pl(r.chars,"signe")}, ${pl(r.hashtags,"hashtag")}</span>
        </div>
        <div class="diag">${diag(r)}</div>
        <pre>${esc(r.text)}</pre>
        <a class="go" href="${r.url}" target="_blank" rel="noopener">Ouvrir sur LinkedIn ↗</a>
      </div>
    </div>`).join("") : `<div class="empty">Aucune publication ne correspond à ce filtre.</div>`;
  document.querySelectorAll("#rows .pr").forEach(pr=>{
    const b=pr.querySelector(".exp");
    b.addEventListener("click",()=>{const o=pr.classList.toggle("open");
      b.setAttribute("aria-expanded",o?"true":"false");});
  });
}

/* ============ rendu ============ */
function render(){
  let list=V.posts;
  if(selM) list=list.filter(p=>p.month===selM);
  if(selT) list=list.filter(p=>p.theme===selT);
  const m=selM?V.months.find(x=>x.key===selM):null;
  const bits=[m?m.label+" 2026":null, selT].filter(Boolean);
  document.getElementById("clearAll").hidden=!bits.length;
  document.getElementById("tblTitle").textContent=
    bits.length ? "Publications — "+bits.join(" · ") : "Toutes les publications";
  document.querySelectorAll(".tp").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===selT));
  document.querySelectorAll(".mo").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===selM));
  hero(list,bits.length>0); topics(); acts(); tests(); strip(); chart(); scatter(); timeline();
  bars("hour",V.byHour); bars("wday",V.byWeekday); bars("media",V.byMedia);
  tops(); bench(); table(list);
}

const ORDER=["perso",...ACC.map(a=>a.key)];
document.getElementById("tabs").innerHTML=ORDER.map(k=>{
  const v=VIEWS[k];
  return `<button class="tab" data-v="${k}" role="tab" aria-selected="false">${ic(v.tabIcon)}${v.label}</button>`;
}).join("");

function go(k){
  vk=k; V=VIEWS[k]; selM=null; selT=null; sortKey="date"; sortDir=-1;
  document.querySelectorAll(".tab").forEach(t=>{
    const on=t.dataset.v===k; t.classList.toggle("on",on); t.setAttribute("aria-selected",on);
    if(on) t.scrollIntoView({block:"nearest",inline:"nearest"});});
  document.getElementById("mastTitle").textContent=V.title;
  document.getElementById("mastSub").textContent=V.sub;
  skeleton(); render(); window.scrollTo({top:0,behavior:"instant"});
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>go(t.dataset.v)));

document.getElementById("periodLbl").textContent=
  `Janvier → juillet 2026 · relevé du ${D.pulled}`;
(function(){
  const b=document.getElementById("tgl");
  b.addEventListener("click",()=>{
    const cur=document.documentElement.getAttribute("data-theme")
      || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
    document.documentElement.setAttribute("data-theme",cur==="dark"?"light":"dark");
  });
})();
go("perso");
</script>
