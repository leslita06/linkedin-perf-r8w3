e beaucoup pour moi. Quand je suis arrivée à Abidjan et que j'ai lancé le studio, c'est elle qui m'a ouvert des portes : des mises en relation, de l'entraide, cette culture du « on avance mieux ensemble ».\n\nC'est exactement ce que je retiens de nos échanges :\n\n🤝 Un écosystème qui avance n'est pas le plus financé. C'est le plus connecté.\n🌍 Une communauté, ce n'est pas un carnet d'adresses. C'est du lien, de l'entraide, du vrai.\n⚡ Pour un founder, être bien entouré change tout.\n\nMerci Olivier Cechura (fondateur de doo!) pour l'animation, et à mes co-panélistes Lamine BARRO Catherine Assanvo Kounandi Stephane Coulibaly Ama O. Houssène Ben Souda pour la qualité de l'échange 🙌🏾\n\nEt c'est ce même esprit de communauté que je retrouve chez ENTOURAGE.\n\nCe lundi soir, j'anime un dinner à Paris : autour d'une table, une vraie conversation. Pas une conférence. On échange, on s'écoute, en toute simplicité. On discute tech, IA, Afrique, retour, et tout autre sujet de votre choix.\n\nSi vous êtes à Paris et que vous avez envie d'échanger, venez 👇\n\n🗓 Lundi soir 20h à Paris\n🎟️ https://lnkd.in/eM869zNH\n\n#FrenchTechAbidjan #Entourage #Entrepreneuriat #StartupAfrica #Communauté","pid":"7479114405998202880","chars":1443,"hashtags":5,"mentions":8,"link":true,"question":false,"lang":"FR","impressions":4267,"er":1.9,"convRate":0.47,"theme":"Événements & écosystème"},{"date":"2026-07-08","month":"2026-07","weekday":"Mercredi","hour":11,"reactions":48,"comments":10,"reposts":1,"eng":59,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_afrique-ia-souverainetenumerique-activity-7480581005158993920-8ZkO?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"L'Afrique n'est pas condamnée à être la mine du numérique. Elle peut en être l'architecte. 🌍 La semaine dernière, aux Rencontres Économiques d'Aix-En-Provence, on m'a posé LA quest","text":"L'Afrique n'est pas condamnée à être la mine du numérique. Elle peut en être l'architecte. 🌍\n\nLa semaine dernière, aux Rencontres Économiques d'Aix-En-Provence, on m'a posé LA question : « Qui contrôlera le cœur numérique du monde ? »\n\nVoici ce que j'y ai porté, vue d'Afrique 👇\n\nLa chaîne de valeur des semi-conducteurs est déjà verticalisée : l'Asie fabrique les puces, les États-Unis les conçoivent, l'Europe tient la lithographie. Chaque continent maîtrise un maillon, et donc un pouvoir de négociation.\n\nAlors, où l'Afrique capte-t-elle SA valeur ? Ma conviction : sur deux mouvements complémentaires.\n\n1️⃣ Se spécialiser sur ce qu'on tient déjà (le vertical) :\n⛏️ Nos minerais critiques : cobalt, coltan, manganèse, lithium, uranium. Aujourd'hui on exporte la roche, on ne fixe pas les prix. Demain, on transforme sur place.\n⚡ Notre énergie : solaire, hydro, géothermie. Tout un « green compute » sous-exploité pour alimenter nos usines.\n📊 Nos données : le prochain pétrole. 1,5 milliard d'habitants, mais des données encore informelles, souvent sur papier. À nous de les structurer et de les exploiter les premiers.\n\n2️⃣ Occuper la couche applicative (l'horizontal) :\n🚀 Nos propres applications, nos propres modèles entraînés sur nos langues. Pas du copier-coller.\n\nParce que l'Afrique est le continent des grands sauts : du fixe au mobile, de la banque au mobile money. Le prochain, c'est l'ère agentique. Elle touche déjà le commerce, la santé, l'éducation, les services financiers, l'agriculture.\n\nSe spécialiser en vertical, rester présents en horizontal.\nC'est comme ça qu'on cesse d'être au menu. Et qu'on passe à la table.\n\nL'Afrique a déjà sauté deux fois. La troisième, c'est maintenant — et cette fois, on la construit nous-mêmes. ✊🏾\n\nMerci au Le Cercle des économistes et à son président Jean-Hervé Lorenzi\npour l'invitation, et à Élisabeth Moreno qui m'a chaleureusement recommandée pour ce panel. Merci à Pierre Jacquet pour le cadrage, à Emmanuel LECHYPRE pour la modération, et à mes co-panélistes Eric Labaye, David Dupont-Noel, @Young-Sun Park et Nicolas Dubourg pour la richesse de l'échange 🙏🏾\n\nSur quel maillon l'Afrique doit-elle miser en premier ? 💬\n\n#Afrique #IA #SouveraineteNumerique #Semiconducteurs\n#RencontresEconomiques","pid":"7480581005158993920","chars":2255,"hashtags":5,"mentions":8,"link":false,"question":true,"lang":"FR","impressions":1824,"er":3.23,"convRate":5.48,"theme":"IA & souveraineté"},{"date":"2026-07-09","month":"2026-07","weekday":"Jeudi","hour":8,"reactions":219,"comments":12,"reposts":5,"eng":236,"media":"video","url":"https://www.linkedin.com/posts/leslieossete_afrique-minerais-souverainetenumerique-activity-7480893715591446528-0lLe?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"On exploite les minerais africains depuis un siècle. Et si le vrai basculement était en train de s'opérer, là, maintenant ? Aux Rencontres Économiques d'Aix organisées par Le Cercl","text":"On exploite les minerais africains depuis un siècle. Et si le vrai basculement était en train de s'opérer, là, maintenant ?\n\nAux Rencontres Économiques d'Aix organisées par Le Cercle des économistes, j'ai défendu une idée : ce n'est plus une utopie, c'est un mouvement de fond. Les pays africains ne veulent plus vendre la roche brute. Ils veulent transformer sur place, et remonter la chaîne de valeur.\n\nLe Gabon bannit l'export de manganèse brut d'ici 2029. La RDC impose des quotas sur son cobalt. Et au dernier G7, à Évian, le Kenya a posé la règle : on transforme localement, ou pas d'accord.\n\nPersonne ne prétend fabriquer des puces demain matin. Mais on peut commencer par le semi-fini : transformer un cran plus haut, capter plus de valeur, monter les marches une à une.\n\nÀ une condition : que ça repose sur des partenariats durables. Ceux qui créent de l'emploi local et transfèrent les compétences, pas ceux qui repartent avec la ressource. C'est là que se joue le vrai gagnant-gagnant.\n\nParce que la valeur est en aval. Et c'est comme ça que l'Afrique cesse d'être au menu, pour passer à la table.\n\nMa réponse complète est dans la vidéo 🎥 J'attends vos insights en commentaire 👇\n\n#Afrique #Minerais #SouveraineteNumerique #IA #RencontresEconomiques","pid":"7480893715591446528","chars":1259,"hashtags":5,"mentions":1,"link":false,"question":false,"lang":"FR","impressions":7871,"er":3.0,"convRate":1.52,"theme":"IA & souveraineté"},{"date":"2026-07-10","month":"2026-07","weekday":"Vendredi","hour":9,"reactions":110,"comments":4,"reposts":3,"eng":117,"media":"video","url":"https://www.linkedin.com/posts/leslieossete_ia-afrique-innovation-activity-7481271040619433984-IcnI?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"La chaîne de valeur de l'IA a plusieurs couches. Les minerais, l'énergie, la puissance de calcul… et tout en haut, la couche applicative. C'est là que l'Afrique peut avancer le plu","text":"La chaîne de valeur de l'IA a plusieurs couches. Les minerais, l'énergie, la puissance de calcul… et tout en haut, la couche applicative. C'est là que l'Afrique peut avancer le plus vite.\n\nC'est ce que j'ai défendu aux Rencontres Économiques d'Aix organisée par Le Cercle des économistes. Fabriquer nos puces ou nos data centers prendra des années. Mais rien ne nous empêche, dès aujourd'hui, de construire la couche logicielle : des applications qui utilisent l'IA et nos propres données pour résoudre nos propres problèmes.\n\nEt le moment est unique. Avec l'open source de plus en plus accessible, entraîner un modèle sur nos données, nos langues et nos réalités n'a jamais été aussi possible. L'IA n'est pas magique : elle amplifie ce qu'on lui donne. À nous de lui donner NOS données, pas celles des autres.\n\nPrenez la santé. Former assez de médecins pour les 100 millions d'habitants de la RDC prendrait des années. Un bot WhatsApp connecté à l'IA, entraîné sur des données de santé africaines, peut déjà faire du pré-diagnostic et aider à sauver des vies.\n\nEt ce n'est pas de la théorie. Au Mstudio, c'est déjà ce qu'on construit avec nos startups :\n\n🛵 Flot. s'appuie sur la donnée pour transformer des chauffeurs qui louaient leur véhicule en propriétaires.\n🛡️ Danaya utilise l'IA pour vérifier l'identité et détecter la fraude en quasi temps réel.\n🏪 Waribei finance le stock des petits commerçants, à partir de leurs données de vente.\n\nOccuper cette couche applicative, c'est capter la valeur là où on peut le faire maintenant, pendant qu'on construit patiemment le reste de la chaîne.\n\nVoilà le vrai saut : ne pas attendre l'infrastructure pour bâtir l'usage.\n\nSelon vous, quel secteur va basculer le plus vite grâce à l'IA ? Ma réponse est dans la vidéo 🎥 j'attends vos insights en commentaire 👇\n\n#IA #Afrique #Innovation #Startups #Mstudio #RencontresEconomiques","pid":"7481271040619433984","chars":1872,"hashtags":6,"mentions":5,"link":false,"question":true,"lang":"FR","impressions":3499,"er":3.34,"convRate":1.14,"theme":"IA & souveraineté"},{"date":"2026-07-11","month":"2026-07","weekday":"Samedi","hour":11,"reactions":97,"comments":3,"reposts":2,"eng":102,"media":"video","url":"https://www.linkedin.com/posts/leslieossete_afrique-diaspora-ia-activity-7481663586659045376-rURY?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"On croit toujours que la richesse de l'Afrique, ce sont ses minerais. Notre vraie richesse est humaine : notre jeunesse et nos intelligences. C'est le message que j'ai porté aux Re","text":"On croit toujours que la richesse de l'Afrique, ce sont ses minerais.\nNotre vraie richesse est humaine : notre jeunesse et nos intelligences.\n\nC'est le message que j'ai porté aux Rencontres Économiques d'Aix-En-Provence la semaine dernière, pendant qu'on débattait puces, énergie et data centers.\n\nNous sommes le continent le plus jeune du monde. C'est notre plus grande force pour l'ère de l'IA, à une condition : former cette jeunesse aux métiers de demain. L'intelligence artificielle, la donnée, le calcul. Apprendre à construire ces technologies, pas seulement à les consommer.\n\nEt nous avons une deuxième chance, souvent oubliée : notre diaspora. Des ingénieurs et des cadres africains façonnent déjà l'IA chez Nvidia, chez Qualcomm, chez Intel, etc. Une expertise de pointe qui construit aujourd'hui pour les autres.\n\nOr quelque chose bouge. Près de 40% de la diaspora tech pense déjà à rentrer. Et le lien existe déjà : chaque année, la diaspora envoie près de 100 milliards de dollars vers le continent, davantage que les investissements étrangers ou l'aide au développement. L'argent revient. Aux compétences de suivre.\n\nFormer notre jeunesse, faire revenir nos talents : voilà comment on bâtit notre propre production et nos propres modèles, au lieu de les regarder se construire ailleurs.\n\nEt ce n'est pas qu'une conviction. C'est pour ça qu'on a lancé Diaspora Connect au sein de la fondation Mstudio, avec nos partenaires, l'Ambassade de France en Côte d'Ivoire et le fonds Équipe France : reconnecter ces talents aux entreprises qui construisent en Côte d'Ivoire. Le pont existe. Reste à l'élargir.\n\nAlors, comment on forme et on fait rentrer les bâtisseurs de l'Afrique de demain ? Ma réponse est dans la vidéo 🎥 j'attends vos insights en commentaire 👇\n\n#Afrique #Diaspora #IA #Jeunesse #Talent #SouveraineteNumerique #RencontresEconomiques","pid":"7481663586659045376","chars":1856,"hashtags":7,"mentions":2,"link":false,"question":true,"lang":"FR","impressions":2619,"er":3.89,"convRate":1.15,"theme":"IA & souveraineté"},{"date":"2026-07-13","month":"2026-07","weekday":"Lundi","hour":11,"reactions":183,"comments":3,"reposts":1,"eng":187,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_entrepreneuriat-entourage-reseau-activity-7482388371902771200-Q7r4?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Lundi dernier, à Paris, j'ai animé mon Dinner d'Expert avec ENTOURAGE. Et j'ai repensé à une chose qu'on sous-estime quand on entreprend : le prix de l'isolement. Quand tu construi","text":"Lundi dernier, à Paris, j'ai animé mon Dinner d'Expert avec ENTOURAGE.\n\nEt j'ai repensé à une chose qu'on sous-estime quand on entreprend : le prix de l'isolement.\n\nQuand tu construis seul, tu passes un temps fou à chercher des réponses que quelqu'un, quelque part, a déjà trouvées. Tu tâtonnes. Tu fais des erreurs qui coûtent des mois. Souvent juste parce que tu n'avais personne à qui poser la bonne question au bon moment.\n\nC'est exactement ce que crée Entourage : un cadre où tu peux poser tes vraies questions, obtenir des réponses honnêtes, éviter les faux pas et gagner un temps précieux.\n\nAutour de cette table, des profils très différents, du QA testing, à l'audit financier en passant par l'actuariat,  des parcours qui n'ont rien à voir. Et pourtant les mêmes questions de fond :\n🎯 Est-ce que je connais vraiment ma cible ?\n🧭 Est-ce que mon projet est aligné avec mon pourquoi ?\n🏗️ Est-ce que mes fondations sont solides avant d'accélérer ?\n\nCe que je retiens : le réseau n'est pas un luxe, c'est un raccourci. Bien s'entourer, c'est refuser d'apprendre seul ce que d'autres peuvent vous épargner.\n\nUn immense clin d'œil à mon amie Elisa Curie NGOUAKA, l'une des meilleures expertes en communication que je connaisse, pour avoir pris part à cet échange💛🏾\n\nMerci Entourage de nous avoir réuni.es 🙏🏾\n\nEt vous, quelle est la question que vous n'osez jamais poser à voix haute ?\n\n#Entrepreneuriat #Entourage #Reseau #Mentorat #StartupAfrica","pid":"7482388371902771200","chars":1448,"hashtags":5,"mentions":2,"link":false,"question":true,"lang":"FR","impressions":12506,"er":1.5,"convRate":0.24,"theme":"Événements & écosystème"},{"date":"2026-07-29","month":"2026-07","weekday":"Mercredi","hour":8,"reactions":50,"comments":0,"reposts":1,"eng":51,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_africinnovsummit-entrepreneuriat-ia-activity-7488148878920249344-VLbe?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚨 Ce matin, on ouvre le Road to Afric'innov Summit. Quel futur pour les SAE africaines ? C'est la question qu'on met sur la table à 9h GMT, avec Christian JEKINNOU, Benjamin Ngonga","text":"🚨 Ce matin, on ouvre le Road to Afric'innov Summit.\n\nQuel futur pour les SAE africaines ? C'est la question qu'on met sur la table à 9h GMT, avec Christian JEKINNOU, Benjamin Ngongang et Abderrahmane Chaoui.\n\nLa vraie question n'est pas de savoir si l'IA va remplacer les accompagnateurs. C'est de savoir ce qu'elle leur permet enfin de faire pour 1 000 entrepreneurs au lieu de 20. C'est le sujet du Lab 3 que je porte 🤖\n\n4 Labs se lancent aujourd'hui et travailleront jusqu'au Summit de novembre :\n🏅 Qualité & Label 2.0\n💰 Financement des SAE & pipeline startup\n🤖 IA & métiers de l'accompagnement\n🏛️ Politiques publiques, Startup Act & écosystème\n\nSi vous accompagnez des entrepreneurs en Afrique, c'est maintenant que ça se joue.\n\n🗓 Aujourd'hui, 9h – 10h30 GMT\n📍 En ligne, inscription obligatoire\n\n👉🏾 Je m'inscris : https://lnkd.in/euhxtjbp\n\n#AfricinnovSummit #Entrepreneuriat #IA #AfriqueFrancophone","pid":"7488148878920249344","chars":902,"hashtags":4,"mentions":3,"link":true,"question":false,"lang":"FR","impressions":4062,"er":1.26,"convRate":0.0,"theme":"Événements & écosystème"},{"date":"2026-07-31","month":"2026-07","weekday":"Vendredi","hour":9,"reactions":149,"comments":10,"reposts":6,"eng":165,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_caektedivoire-ivoiretechnext15-ivoiretechscaleup-activity-7488881281003421697-ieAw?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🇨🇮 Depuis que je suis à Abidjan, je rencontre beaucoup d'entrepreneurs du numérique. Une chose revient tout le temps. On a tendance à mettre dans le même sac une startup d'un an qu","text":"🇨🇮 Depuis que je suis à Abidjan, je rencontre beaucoup d'entrepreneurs du numérique.\n\nUne chose revient tout le temps. On a tendance à mettre dans le même sac une startup d'un an qui cherche encore son marché et une PME de dix ans qui fait déjà plusieurs centaines de millions de chiffre d'affaires. Mêmes appels à candidatures, mêmes formats d'accompagnement, mêmes attentes. Ce ne sont pourtant pas les mêmes besoins.\n\nL'une a besoin de traction, d'amorçage, de rencontres avec des investisseurs. L'autre a besoin d'accès à la commande publique, de financement bancaire, et de références assez solides pour aller vers la sous-région.\n\nC'est pour ça que le lancement d'Ivoire Tech Next 15 et d'Ivoire Tech Scale Up, le 29 juillet au Sofitel Abidjan, me paraît important. Le Ministry of Digital Transition and Technological Innovation a construit deux programmes distincts pour ces deux réalités. \n\nNext 15 pour les startups tech en forte croissance. \n\nScale Up pour les PME technologiques établies.\n\nÇa paraît simple. C'est en réalité assez rare, et pour celles qui candidatent, ça change tout.\n\nEt l'ensemble s'inscrit dans la feuille de route numérique 2026-2028 du Ministère, ce qui lui donne une suite.\n\n📩 Candidatures ouvertes jusqu'au 13 septembre à minuit. \n👉 Startups : www.next15.ivoire.tech\n👉 PME technologiques : www.scaleup.ivoire.tech\n\nBravo à Alexia Amichia, Kounandi Stephane Coulibaly et Florence TAHIRI epse FADIKA, et à toutes les équipes du Ministère. Ce genre d'initiative est nécessaire.\n\nHâte de découvrir les lauréats 🚀\n\n#CôtedIvoire #IvoireTechNext15 #IvoireTechScaleUp #Startups #AfriqueFrancophone","pid":"7488881281003421697","chars":1624,"hashtags":5,"mentions":4,"link":false,"question":false,"lang":"FR","impressions":7775,"er":2.12,"convRate":1.29,"theme":"Événements & écosystème"},{"date":"2026-08-19","month":"2026-08","weekday":"Mercredi","hour":12,"reactions":61,"comments":1,"reposts":1,"eng":63,"media":"video","url":"https://www.linkedin.com/posts/leslieossete_quand-est-ce-quon-verra-des-s%C3%A9ries-activity-7495813733248827392-9nNf?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🇨🇮 Quand est-ce qu'on verra des Séries B et des Séries C en Côte d'Ivoire ? Aujourd'hui, on voit surtout des levées de fonds en amorçage. Un peu de Série A, et encore. Pendant ce t","text":"🇨🇮 Quand est-ce qu'on verra des Séries B et des Séries C en Côte d'Ivoire ?\n\nAujourd'hui, on voit surtout des levées de fonds en amorçage. Un peu de Série A, et encore. \n\nPendant ce temps, la tech africaine a levé 4,1 milliards de dollars en 2025, et cet argent va d'abord aux entreprises déjà structurées.  \n\nCe n'est pas un problème de talent. \n\nPour changer d'échelle, une startup a besoin de trois choses :  \n\n🏛️ de la commande publique \n🛒 de l'accès au marché \n💶 de l'accès aux investisseurs\n\nC'est ce qu'Ivoire Tech Next 15 et Ivoire Tech Scale Up, deux programmes du Ministry of Digital Transition and Technological Innovation cherchent à apporter. \n\n\n📅 Un Webinaire est organisé demain, jeudi 20 août pour en apprendre plus.\n👉 Inscription : https://luma.com/lweriqgs  \n🔗 Candidatures ouvertes jusqu'au 13 septembre.\n\nJ'encourage fortement l'écosystème tech ivoirien à participer  🦾","pid":"7495813733248827392","chars":889,"hashtags":0,"mentions":1,"link":true,"question":false,"lang":"FR","impressions":2940,"er":2.14,"convRate":0.34,"theme":"Data & marché"},{"date":"2026-08-26","month":"2026-08","weekday":"Mercredi","hour":8,"reactions":148,"comments":3,"reposts":17,"eng":168,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_recrutement-ia-abidjan-activity-7498299473392185344-Dza2?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚀 On recrute deux personnes pour Yelema. Yelema, c'est notre dernière startup au Mstudio. Elle déploie l'intelligence artificielle dans les entreprises africaines : des Experts IA ","text":"🚀 On recrute deux personnes pour Yelema.  \n\nYelema, c'est notre dernière startup au Mstudio. Elle déploie l'intelligence artificielle dans les entreprises africaines : des Experts IA prêts à l'emploi, dans tous les métiers, que les équipes utilisent là où elles travaillent déjà. L'idée tient en une phrase, rendre l'IA vraiment à portée, clé en main.  \n\nDeux postes à Abidjan, en présentiel:\n\n ⚙️ Chief Technology Officer \nTu prends toute la technique et tu fais tenir la production, du premier client aux dix mille suivants. \n👉🏾 https://lnkd.in/eEvgxqqE  \n\n🎯 Head of Business Development\nTu ouvres le marché et tu construis la fonction commerciale, des premiers grands comptes aux partenariats. \n👉🏾 https://lnkd.in/eQAVyjv8  \n\nCe ne sont pas des postes d'exécution. On cherche des gens ambitieux et passionnés, qui veulent que leurs décisions comptent encore dans cinq ans. \n\nSi vous connaissez la bonne personne, envoyez-lui ce post, qu'elle soit déjà à Abidjan ou prête à s'y installer.  \n\n#Recrutement #IA #Abidjan #CôteDIvoire #Yelema","pid":"7498299473392185344","chars":1040,"hashtags":5,"mentions":1,"link":true,"question":false,"lang":"FR","impressions":10879,"er":1.54,"convRate":0.28,"theme":"Événements & écosystème"},{"date":"2026-08-31","month":"2026-08","weekday":"Lundi","hour":9,"reactions":45,"comments":2,"reposts":6,"eng":53,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_ia-donnees-cotedivoire-activity-7500115202709934081-1wIr?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"On parle beaucoup de ce que l'IA sait faire. On parle rarement de ce qu'il faut avoir sous la main pour qu'elle fonctionne. Une IA repose sur trois choses, et il en manque presque ","text":"On parle beaucoup de ce que l'IA sait faire. On parle rarement de ce qu'il faut avoir sous la main pour qu'elle fonctionne.\n\nUne IA repose sur trois choses, et il en manque presque toujours une. Les données, tout ce que votre organisation produit et garde sans toujours s'en servir. Le modèle, le programme entraîné pour en tirer une réponse. Et la puissance de calcul, les machines qui font tourner le modèle. Quand l'une des trois manque, le projet s'arrête au pilote.\n\nMercredi 2 septembre, je modère une séance avec Luc OKALOBE pour disséquer cette chaine de valeur autour de l'intelligence artificielle.\n\nPassé par TikTok, Apple et IBM, formé à UC Berkeley, Luc est le fondateur de Yamify, où il construit un cloud souverain hébergé dans des centres de données africains. \n\nUne heure, sans aucun prérequis. Vous pouvez venir sans rien connaître au sujet, c'est exactement pour vous que cette séance existe.\n\n📅 Mercredi 2 septembre, 17h à 18h, en ligne et gratuit.\n👉🏾 Inscription : https://luma.com/anrw8zae\n\nLa séance précède IMPACT IA, les Assises nationales de l'IA du Ministry of Digital Transition and Technological Innovation, du 9 au 11 septembre à Abidjan.\n\n#IA #Donnees #CotedIvoire #AfriqueFrancophone","pid":"7500115202709934081","chars":1215,"hashtags":4,"mentions":3,"link":true,"question":false,"lang":"FR","impressions":2677,"er":1.98,"convRate":0.75,"theme":"IA & souveraineté"},{"date":"2026-09-02","month":"2026-09","weekday":"Mercredi","hour":14,"reactions":35,"comments":0,"reposts":1,"eng":36,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_ia-cotedivoire-activity-7500926597256921088-Xzlg?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"C'est ce soir, 17h. Des centaines de personnes inscrites pour une heure sur le sujet le moins glamour de l'IA, et le plus décisif : sans données rangées et sans puissance de calcul","text":"C'est ce soir, 17h.\n\nDes centaines de personnes inscrites pour une heure sur le sujet le moins glamour de l'IA, et le plus décisif : sans données rangées et sans puissance de calcul, un projet s'arrête au pilote.\n\nJ'anime avec Luc OKALOBE, qui installe chez Yamify les serveurs qui font tourner l'IA depuis l'Afrique. Session ouverte pour les débutants, qui essayent de comprendre la chaine de valeur qui propulse l'adoption de l'IA sur le continent.\n\nVous pouvez encore vous inscrire 👉🏾 https://luma.com/anrw8zae\n\n#IA #CotedIvoire","pid":"7500926597256921088","chars":531,"hashtags":2,"mentions":1,"link":true,"question":false,"lang":"FR","impressions":1631,"er":2.21,"convRate":0.0,"theme":"IA & souveraineté"},{"date":"2026-09-09","month":"2026-09","weekday":"Mercredi","hour":9,"reactions":85,"comments":3,"reposts":1,"eng":89,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_impactia-intelligenceartificielle-cotedivoire-activity-7503376826728132608-r-CL?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"💡 On me demande souvent si l'IA va remplacer les équipes. Ce que je vois sur le terrain, c'est l'inverse. 👥 Trier des candidatures 💰 Préparer la paie 📊 Faire la clôture comptable d","text":"💡 On me demande souvent si l'IA va remplacer les équipes. \n\nCe que je vois sur le terrain, c'est l'inverse.  \n\n👥 Trier des candidatures \n💰 Préparer la paie \n📊 Faire la clôture comptable du mois \n🎨 Sortir toute la créa du mois \n📞 Relancer un devis \n🌙 Répondre à un client à 23h  \n\nTout ça se délègue déjà. \n\nDans la dernière étude AI at Work du BCG, 42 % des utilisateurs réguliers déclarent gagner huit heures par semaine, soit une journée de travail entière. C'est exactement là que tout se joue.  \n\n🎓 C'est le sujet de ma masterclass à Impact IA, les assises nationales sur l'intelligence artificielle organisées par le Ministère de la Transition Numérique et de l'Innovation Technologique.  \n\n« Créer de la valeur avec l'IA en entreprise : choisir les bons cas d'usage métier, et mesurer ce qu'ils rapportent »  \n\n📅 Jeudi 10 septembre \n🕝 14h30 à 15h30 \n📍 Latrille Events, Deux Plateaux, salle 3  \n\nJe l'ai pensée pour les dirigeants de PME ou de grands groupes, et pour les managers qui cherchent à optimiser la productivité de leurs équipes, en ressources humaines, en comptabilité, en marketing, au commercial ou en relation client. \n\nOn va regarder où l'IA rapporte vraiment dans votre métier, comment l'installer, et comment mesurer ce qu'elle vous rend.  \n\n🎟️ Inscrivez-vous à IMPACT IA : https://luma.com/4cqbpknm \nPuis à la masterclass : https://luma.com/jkk2usoc  \n\n\n#ImpactIA #IntelligenceArtificielle #CotedIvoire","pid":"7503376826728132608","chars":1426,"hashtags":3,"mentions":1,"link":true,"question":false,"lang":"FR","impressions":2728,"er":3.26,"convRate":1.1,"theme":"IA & souveraineté"},{"date":"2026-09-25","month":"2026-09","weekday":"Vendredi","hour":9,"reactions":83,"comments":1,"reposts":3,"eng":87,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_ais2026-aitekinnovationsummit-activity-7509182714831380480-xGmW?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🎤 Le vendredi 2 octobre, je serai à l' AITEK Innovation Summit 2026, au siège d'AITEK en Zone 4, Abidjan. Je participe au panel « Innovation africaine : financer, acheter, changer ","text":"🎤 Le vendredi 2 octobre, je serai à l' AITEK Innovation Summit 2026, au siège d'AITEK en Zone 4, Abidjan.  \n\nJe participe au panel « Innovation africaine : financer, acheter, changer d'échelle », de 15h à 16h. 💡 \n\nLe sujet, je le vois tous les jours au studio. Une innovation qui marche s'arrête rarement faute d'idée. Elle s'arrête faute de premier contrat, faute de financement au bon moment, faute de pouvoir passer de dix clients à mille.  \n\n🗣️ J'en débattrai avec Djibril Doumbia (Comoé Capital), Daouda coulibaly (Attijariwafa bank) et Florence TAHIRI epse FADIKA(Fondation Jeunesse Numérique), sous la modération légation de la Banque mondiale et de l' IFC dans ses locaux à Abidjan.\n\nCette visite a donné lieu à des échanges de fond autour de plusieurs priorités clés mises en avant par la Banque mondiale et l'IFC pour l’Afrique de l'Ouest, notamment :\n🤖 intelligence artificielle,\n🌐 transformation digitale,\n🏗️ digital public infrastructure,\n🎓 compétences numériques et inclusion.\n\nUn moment d’échange constructif, au croisement des enjeux institutionnels et des dynamiques d’innovation portées par les écosystèmes entrepreneuriaux locaux.\n📸 Retour en images.\n\ncc Paul Nguyen\n\n#Throwback #BanqueMondiale #DigitalTransformation #IA #InnovationAfrica #StartupStudio","pid":"7413879573341396992","chars":722,"hashtags":6,"mentions":1,"link":false,"question":false,"lang":"FR","theme":"Événements & écosystème"},{"date":"2026-01-07","month":"2026-01","weekday":"Mercredi","hour":11,"reactions":72,"comments":0,"reposts":5,"eng":77,"media":"video","url":"https://www.linkedin.com/posts/mstudiovc_cotedivoire-entrepreneurs-startup-activity-7414623358299910144-77u7?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🎥 Nos entrepreneurs racontent pourquoi ils ont choisi la Côte d’Ivoire. Ce témoignage met en lumière ce que beaucoup ressentent : 🇨🇮 un marché en croissance 🚀 une énergie entrepren","text":"🎥 Nos entrepreneurs racontent pourquoi ils ont choisi la Côte d’Ivoire.\n\nCe témoignage met en lumière ce que beaucoup ressentent :\n🇨🇮 un marché en croissance\n🚀 une énergie entrepreneuriale unique\n🌍 une position stratégique pour rayonner en Afrique de l’Ouest\n🤝 une communauté qui se construit vite… et fort\n\nAu Mstudio, on accompagne ces équipes qui font le choix de bâtir localement avec une ambition régionale.\n\n📌 Découvrez la vidéo dans son entièreté👇\nhttps://lnkd.in/eybFvqSz\n\n💬 Et vous, selon vous, quel est le plus grand avantage de la Côte d’Ivoire pour entreprendre aujourd’hui ?\n\n#CotedIvoire #entrepreneurs #startup #Afrique #innovation #Mstudio","pid":"7414623358299910144","chars":655,"hashtags":6,"mentions":1,"link":true,"question":true,"lang":"FR","theme":"Convictions & analyses"},{"date":"2026-01-09","month":"2026-01","weekday":"Vendredi","hour":13,"reactions":113,"comments":0,"reposts":7,"eng":120,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_focus-repatpreneurs-r%C3%A9pondre-%C3%A0-lappel-activity-7415390012189376512--1WE?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Focus Repat’preneurs : Répondre à l’appel 🌍✨ Dans le cadre de la semaine d’immersion de la cohorte n°1 de Diaspora Connect, le Mstudio a le plaisir d’accueillir un afterwork réunis","text":"Focus Repat’preneurs : Répondre à l’appel 🌍✨\n\nDans le cadre de la semaine d’immersion de la cohorte n°1 de Diaspora Connect, le Mstudio a le plaisir d’accueillir un afterwork réunissant quatre entrepreneurs répatriés, aux parcours complémentaires, qui entreprennent aujourd’hui dans des secteurs clés : la construction 🏗️, la santé 🩺, l’e-commerce 🛒 et la logistique 🚚.\n\nIls partageront leur expérience du retour sur le continent 🔄, la réalité de la création et du développement d’une startup en Afrique ⚙️, ainsi que les opportunités et défis rencontrés sur le terrain.\n\nIntervenants 🎤\nWaly K. N'Diaye, co-fondateur de BLOK 🏗️\nSophie Tall, co-fondatrice de La Ruche Health 🩺\nMoulaye TABOURÉ, co-fondateur de Anka 🛒\nZeinabou Sidibe, fondatrice de Afrisends 🚚\n\nUn moment d’échanges 🤝, de retours d’expérience 💬 et de networking 🍸.\n📌 Inscriptions : https://luma.com/1lrj412x","pid":"7415390012189376512","chars":872,"hashtags":0,"mentions":5,"link":true,"question":false,"lang":"FR","theme":"Diaspora Connect"},{"date":"2026-01-12","month":"2026-01","weekday":"Lundi","hour":10,"reactions":40,"comments":1,"reposts":2,"eng":43,"media":"video","url":"https://www.linkedin.com/posts/mstudiovc_startupstudio-foundersvoices-entrepreneurs-activity-7416419807161622528-0YVD?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🎬 Ils en parlent mieux que nous. Quand ce sont les entrepreneurs du Mstudio qui racontent l’aventure, tout devient plus clair. 💬 “Un vrai cofondateur” 💬 “Un cadre qui structure” 💬 ","text":"🎬 Ils en parlent mieux que nous.\n\nQuand ce sont les entrepreneurs du Mstudio qui racontent l’aventure, tout devient plus clair.\n💬 “Un vrai cofondateur”\n💬 “Un cadre qui structure”\n💬 “Un accompagnement qui fait gagner du temps”\n\nDans cette vidéo, ils expliquent ce que le Mstudio leur apporte concrètement : du support stratégique, de l’exécution, des experts, et surtout… de l’accélération 🚀\n👉 Regardez la vidéo complète ici :\nhttps://lnkd.in/eybFvqSz\n\nParce qu’au Mstudio, on ne se contente pas d’accompagner.\nOn construit avec les entrepreneurs.\n\n#StartupStudio #FoundersVoices #Entrepreneurs #Innovation","pid":"7416419807161622528","chars":605,"hashtags":4,"mentions":1,"link":true,"question":false,"lang":"FR","theme":"Nos startups"},{"date":"2026-01-13","month":"2026-01","weekday":"Mardi","hour":8,"reactions":90,"comments":5,"reposts":2,"eng":97,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_akwaba-cette-semaine-marque-le-lancement-activity-7416760580373647360-7tq_?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Akwaba 🇨🇮 Cette semaine marque le lancement de la semaine d’immersion de la cohorte Diaspora Connect 2026 à Abidjan. Diaspora Connect est un programme de l'Ambassade de France en C","text":"Akwaba 🇨🇮\n\nCette semaine marque le lancement de la semaine d’immersion de la cohorte Diaspora Connect 2026 à Abidjan.\n\nDiaspora Connect est un programme de l'Ambassade de France en Côte d'Ivoire et de la fondation Mstudio, qui accompagne des talents de la diaspora souhaitant s’engager professionnellement ou entrepreneurialement en Afrique, à travers une immersion terrain et une intégration au sein d’organisations locales.\n\nAprès 200 candidatures reçues,\n👉 35 talents ont été sélectionnés et débutent cette semaine un parcours rythmé par des rencontres avec l’écosystème, une meilleure compréhension du terrain et un ancrage local, avant leur intégration au sein des entreprises partenaires.\n\nNous souhaitons plein succès à l’ensemble des talents de la cohorte 2026.","pid":"7416760580373647360","chars":769,"hashtags":0,"mentions":1,"link":false,"question":false,"lang":"FR","theme":"Diaspora Connect"},{"date":"2026-01-19","month":"2026-01","weekday":"Lundi","hour":10,"reactions":7,"comments":0,"reposts":1,"eng":8,"media":"texte","url":"https://www.linkedin.com/posts/mstudiovc_what-investors-expect-in-francophone-africa-activity-7418966341207990272-dXOP?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"💰 VC Funding en Afrique francophone : au-delà des chiffres, la question de la profondeur En 2026, l’Afrique francophone continue de capter l’attention des investisseurs. Plus de $1","text":"💰 VC Funding en Afrique francophone : au-delà des chiffres, la question de la profondeur\n\nEn 2026, l’Afrique francophone continue de capter l’attention des investisseurs. Plus de $1 Md levé sur près de 200 deals : les volumes progressent, les deals se multiplient, et certains secteurs – fintech en tête – confirment leur traction.\n\nMais chez Mstudio, nous pensons que le vrai sujet n’est plus seulement combien est levé, mais comment l’écosystème se structure.\n👉 Concentration des deals vs profondeur du pipeline\n👉 Early-stage infrastructure vs méga-rounds\n👉 Discipline opérationnelle, exits réalistes et capital patient\n\nL’Afrique francophone n’essaie pas de répliquer les modèles de l’Afrique anglophone. Elle construit autre chose : un écosystème plus sobre, plus builder-led, et souvent plus proche des réalités terrain.\n\n📖 TechCabal met des mots justes sur cette dynamique dans cet article que nous recommandons vivement :\n🔗 https://lnkd.in/dQzvw9G5\n\n\n#AfriqueFrancophone #VentureCapital #StartupsAfrica #Builders #EarlyStage #Mstudio #TechCabal","pid":"7418966341207990272","chars":1051,"hashtags":7,"mentions":0,"link":true,"question":false,"lang":"FR","theme":"Convictions & analyses"},{"date":"2026-01-21","month":"2026-01","weekday":"Mercredi","hour":11,"reactions":61,"comments":3,"reposts":5,"eng":69,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_venturestudios-africatech-earlystage-activity-7419703860832923648-gBmy?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"📊 Dans son Africa Investment Report 2025, Briter met en lumière la montée en puissance des venture studios comme structures clés de l’écosystème tech africain — capables de combler","text":"📊 Dans son Africa Investment Report 2025, Briter met en lumière la montée en puissance des venture studios comme structures clés de l’écosystème tech africain — capables de combler le fossé entre preuve de concept et passage à l’échelle.\n\nNous sommes fiers de voir Mstudio identifié parmi les venture studios opérant sur le continent et contribuant à :\n✔️la structuration de startups dès les toutes premières phases,\n✔️la mutualisation de capacités critiques (produit, tech, financement),\n✔️et la création de trajectoires plus résilientes dans des environnements où l’accès au capital reste fragmenté.\n\nComme le souligne le rapport, les venture studios jouent aujourd’hui un rôle d’institutional co-founder, en absorbant une part significative du risque early-stage et en restant engagés bien au-delà des modèles d’accompagnement classiques.\n\n👉 Africa Investment Report 2025: https://lnkd.in/dPUB446f\n\n#VentureStudios #AfricaTech #EarlyStage #VentureBuilding","pid":"7419703860832923648","chars":958,"hashtags":4,"mentions":1,"link":true,"question":false,"lang":"FR","theme":"Convictions & analyses"},{"date":"2026-01-23","month":"2026-01","weekday":"Vendredi","hour":11,"reactions":58,"comments":0,"reposts":0,"eng":58,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_diasporaconnect-mtalk-repatpreneurs-activity-7420420921045258240-i9WJ?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"À l’occasion de la semaine d’immersion de la cohorte #1 de Diaspora Connect, Mstudio a accueilli un MTALK dédié aux Repat’preneurs : entreprendre après le retour. Quatre entreprene","text":"À l’occasion de la semaine d’immersion de la cohorte #1 de Diaspora Connect, Mstudio a accueilli un MTALK dédié aux Repat’preneurs : entreprendre après le retour.\n\nQuatre entrepreneurs répatriés ont partagé, sans filtre, les réalités du terrain, les ajustements nécessaires et une question clé :\n👉 le retour est-il une condition de réussite ou un accélérateur ?\n\n✨Un moment d’échanges et de transmission, fidèle à l’esprit de Diaspora Connect : 🌍 comprendre le terrain et 🚀 construire des projets à impact depuis le continent.\n\nMerci Waly K. N'Diaye, Sophie Tall, Zeinabou Sidibe, et Moulaye TABOURÉ pour le moment de partage 🤝🏿🙏🏿\n\n#DiasporaConnect #MTalk #Repatpreneurs","pid":"7420420921045258240","chars":670,"hashtags":4,"mentions":5,"link":false,"question":false,"lang":"FR","theme":"Diaspora Connect"},{"date":"2026-01-29","month":"2026-01","weekday":"Jeudi","hour":9,"reactions":157,"comments":4,"reposts":2,"eng":163,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_welcome-to-mstudio-jean-luc-gaman-activity-7422570533298364416-Am0e?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚀 Welcome to Mstudio, Jean Luc GAMAN! Nous sommes ravis d’annoncer que Jean-Luc Gaman rejoint le Mstudio en tant que co-fondateur & CTO de Barapay. Jean-Luc est un CTO orienté arch","text":"🚀 Welcome to Mstudio, Jean Luc GAMAN!\n\nNous sommes ravis d’annoncer que Jean-Luc Gaman rejoint le Mstudio en tant que co-fondateur & CTO de Barapay.\n\nJean-Luc est un CTO orienté architecture et exécution, avec une forte expertise en data analytics et intelligence artificielle, et une solide expérience dans la conception de systèmes tech scalables.\n\nBarapay développe une solution d’avance sur salaire, permettant aux employés d’accéder à une partie de leur rémunération avant la fin du mois, de manière simple, sécurisée et responsable, tout en offrant aux entreprises un outil moderne de bien-être financier pour leurs équipes.\n\nRavis de t’avoir à bord pour construire Barapay.\n\nLet’s build. 💥","pid":"7422570533298364416","chars":696,"hashtags":0,"mentions":1,"link":false,"question":false,"lang":"FR","theme":"Équipe & studio"},{"date":"2026-01-30","month":"2026-01","weekday":"Vendredi","hour":11,"reactions":12,"comments":0,"reposts":0,"eng":12,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_ecosystem-mixer-c%C3%B4te-divoire-activity-7422962051725275136-eOPo?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚀 Ecosystem Mixer – Côte d’Ivoire 🇨🇮 Dans le cadre d’un programme porté par Flat6Labs en partenariat avec IFC - International Finance Corporation, nous avons le plaisir d’accueilli","text":"🚀 Ecosystem Mixer – Côte d’Ivoire 🇨🇮\n\nDans le cadre d’un programme porté par Flat6Labs en partenariat avec IFC - International Finance Corporation, nous avons le plaisir d’accueillir au Mstudio un Ecosystem Mixer réunissant les acteurs clés de l’écosystème entrepreneurial.\n\n📅 Lundi 2 février\n🕠 17h30 – 20h30\n📍 Mstudio, RDC – Tour D de l’Ivoire Trade Center\n\nCe moment est pensé comme un espace de rencontres et d’échanges entre :\nstartups, investisseurs, builders, opérateurs et partenaires de l’écosystème.\n\nL’objectif : créer des connexions utiles, partager des retours d’expérience et renforcer les synergies au sein de l’écosystème ivoirien.\n\n👉 Inscription (RSVP) : https://luma.com/17aog5hn\n\nAu plaisir de vous accueillir au Mstudio pour cette soirée dédiée aux connexions de qualité ✨","pid":"7422962051725275136","chars":791,"hashtags":0,"mentions":2,"link":true,"question":false,"lang":"FR","theme":"Levée & partenariats"},{"date":"2026-02-02","month":"2026-02","weekday":"Lundi","hour":7,"reactions":21,"comments":1,"reposts":0,"eng":22,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_venturecapital-exits-entrepreneuriat-activity-7423997200155975680-BTRN?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"📊 30 ans de Venture Capital et de M&A : enseignements tirés des États-Unis, de l’Europe et de l’Asie 🎙️ Nous aurons le plaisir d’accueillir Eric Plantier, Founder de Blueprint Part","text":"📊 30 ans de Venture Capital et de M&A : enseignements tirés des États-Unis, de l’Europe et de l’Asie\n\n🎙️ Nous aurons le plaisir d’accueillir Eric Plantier, Founder de Blueprint Partners, pour un échange sans filtre autour de :\n👉 ce que 30 ans de VC & M&A enseignent vraiment\n👉 les erreurs récurrentes des entrepreneurs et investisseurs\n👉 les différences clés entre 🇺🇸 🇪🇺 🇨🇳 les grands écosystèmes mondiaux\n👉 ce que l’Afrique peut concrètement en retenir aujourd’hui\n\n👥 Un talk concret, basé sur des retours d’expérience terrain, à destination des: entrepreneurs,  investisseurs et acteurs de l’écosystème\n\n📍 Mstudio – RDC Tour D, Ivoire Trade Center\n🗓 Vendredi 6 février 2026\n⏰ 17h\n⚠️ Il ne reste que quelques places\n📝 👉 Inscription ici : https://luma.com/1ouj4cpu\n#VentureCapital #Exits #Entrepreneuriat  #Abidjan #MTalks","pid":"7423997200155975680","chars":822,"hashtags":5,"mentions":1,"link":true,"question":false,"lang":"FR","theme":"Convictions & analyses"},{"date":"2026-02-09","month":"2026-02","weekday":"Lundi","hour":11,"reactions":135,"comments":6,"reposts":5,"eng":146,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_rejoignez-les-startu ps, opérateurs agricoles et investisseurs au","text":"Le Mstudio accueille un petit-déjeuner AfricaAgri Connect, co-organisé avec notre agritech Djoli.\n\nUn moment convivial pour réunir startups, opérateurs agricoles et investisseurs autour d’un objectif commun : créer des connexions utiles et ouvrir des opportunités concrètes.\n\nAu programme :\n• Échanges pragmatiques sur les opportunités dans l’agro\n• Focus sur les corridors régionaux\n• Discussion autour des modèles qui scalent réellement en Afrique de l’Ouest\nSi le sujet vous intéresse, vous êtes notre invité 👇\n\n🕘 Mardi 17 février 2026 – 9h00\n📍 Mstudio ITC, rez de chaussée de la tour D\n\nInscription ici :\nhttps://lnkd.in/eUbaAbaP\n\nAu plaisir de vous y retrouver.\n\ncc ✪ Stane BLEGBO Leslie Ossete","pid":"7429161002631376896","chars":699,"hashtags":0,"mentions":3,"link":true,"question":false,"lang":"FR","theme":"Événements & écosystème"},{"date":"2026-02-23","month":"2026-02","weekday":"Lundi","hour":15,"reactions":24,"comments":0,"reposts":2,"eng":26,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_la-premi%C3%A8re-cohorte-dediaspora-connecta-activity-7431720315677851648-HT2i?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"La première cohorte de Diaspora Connect a confirmé une dynamique forte : de plus en plus de talents de la diaspora souhaitent contribuer concrètement à l’économie ivoirienne. À leu","text":"La première cohorte de Diaspora Connect a confirmé une dynamique forte : de plus en plus de talents de la diaspora souhaitent contribuer concrètement à l’économie ivoirienne.\n\nÀ leur arrivée à Abidjan, les 35 participants ont vécu une semaine d’immersion stratégique : rencontres avec des dirigeants, leaders tech, structures d’innovation et acteurs institutionnels. Des échanges francs sur les réalités du marché, suivis d’une intégration en entreprise alignée sur des besoins réels et opérationnels.\n\n📅 Le 25 février, nous lançons l’appel à candidatures pour la Cohorte 2.\n\nCette nouvelle édition met un accent encore plus fort sur le parcours professionnel : mission en entreprise avec perspective de pré-embauche.\n✔ Sélection exigeante\n✔ Matching précis entre talents et entreprises partenaires\n✔ Accompagnement structuré pour sécuriser la mobilité\n\nLe programme comprend :\n✈️ Billet d’avion aller-retour\n🏠 Logement pendant 4 mois\n🛂 Visa pris en charge\n💰 Allocation mensuelle\n\nVous êtes un talent prêt à structurer votre retour et à avoir un impact concret ?\n👉 Toutes les informations et candidatures sur : [https://lnkd.in/eQzEhWJx]","pid":"7431720315677851648","chars":1137,"hashtags":0,"mentions":1,"link":true,"question":true,"lang":"FR","theme":"Diaspora Connect"},{"date":"2026-02-27","month":"2026-02","weekday":"Vendredi","hour":10,"reactions":54,"comments":0,"reposts":3,"eng":57,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_les-candidatures-pour-notre-programme-activity-7433092295039692800-8t-v?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚀 Les candidatures pour notre programme Diaspora Connect – Cohorte #2 sont officiellement ouvertes ! À cette occasion, retrouvez Samba LO, fondateur de Socium, pour un webinaire ex","text":"🚀 Les candidatures pour notre programme Diaspora Connect  – Cohorte #2 sont officiellement ouvertes !\n\nÀ cette occasion, retrouvez Samba LO, fondateur de Socium, pour un webinaire exclusif le 3 mars avec notre Head of programs, Longa Andrea et notre chargé de recrutement, Ornella.\n \nEntre la France et l’Afrique, il a construit une trajectoire tech ambitieuse et engagée. Il viendra partager son expérience :\n→ Comment saisir les opportunités entre deux écosystèmes\n→ Ce que signifie concrètement faire le saut\n→ Les réalités du terrain quand on décide de s’implanter\nUn échange authentique pour celles et ceux qui envisagent l’aventure.\n\nDiaspora Connect, c’est :\n→ 4 à 6 mois d’immersion à Abidjan\n→ Billet d’avion, visa et logement pris en charge\n→ Une allocation mensuelle\n→ 20+ entreprises partenaires et 30+ offres ouvertes\n\n📅 3 mars 2026\n🕔 17h Abidjan / 18h Paris\n🔗 Inscription : https://luma.com/8grpaq1v\n\nLes candidatures sont live. C’est le moment.","pid":"7433092295039692800","chars":959,"hashtags":1,"mentions":2,"link":true,"question":false,"lang":"FR","theme":"Diaspora Connect"},{"date":"2026-03-02","month":"2026-03","weekday":"Lundi","hour":12,"reactions":76,"comments":3,"reposts":8,"eng":87,"media":"texte","url":"https://www.linkedin.com/posts/mstudiovc_mstudio-recrute-stage-analyste-corporate-activity-7434217376340000769-R_-I?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚀 Mstudio recrute – Stage Analyste Corporate Finance (Bras droit CFO) Envie d’être au cœur des décisions financières d’un startup studio actif en Afrique ? Tu travailleras directem","text":"🚀 Mstudio recrute – Stage Analyste Corporate Finance (Bras droit CFO)\nEnvie d’être au cœur des décisions financières d’un startup studio actif en Afrique ?\n\nTu travailleras directement avec notre CFO Aude Juglard sur les sujets suivants:\n📈modélisation financière\n📈suivi de performance des startups\n📈préparation d’éléments investisseurs\n📈analyse d’opportunités d’investissement\n\nProfil : solide base en corporate finance, issu.e d'une grande école de commerce à l'international, rigueur analytique, intérêt pour l’early-stage et l’investissement.\n\nUn stage exigeant, à forte exposition, au plus près des levées et de l’allocation de capital.\n\n📩 Détails & candidature :\nhttps://lnkd.in/ewAWGjWh\n\ncc HEC Africa HEC Paris MBA Africa Alliance HEC Start'Africa Club Afrique emlyon ESCP HEC Finance Club Rising Africa Neoma BS - Reims NEOMA Alumni Edhec For African Business Lille ASPA Paris Campus Sciences Po","pid":"7434217376340000769","chars":903,"hashtags":0,"mentions":10,"link":tr rrain des marchés africains, des process testés et documentés et une exécution rigoureuse.\n\nL’IA accélère.\nElle ne remplace pas les fondamentaux.\n💡 Le vrai enjeu : aller plus vite vers la vérité.\n\n🔗 Lire l’article complet : https://lnkd.in/e3F3AFaU","pid":"7440370274996273153","chars":587,"hashtags":1,"mentions":1,"link":true,"question":false,"lang":"FR","theme":"Événements & écosystème"},{"date":"2026-03-23","month":"2026-03","weekday":"Lundi","hour":11,"reactions":148,"comments":15,"reposts":0,"eng":163,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_teammstudio-newjoiner-officemanager-activity-7441808541503389696-bJL0?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"✨ Nous avons le plaisir d’accueillir Diane Brigitte ALLOU au sein de Mstudio ! Diane rejoint l’aventure en tant qu’Office Manager, avec un rôle clé au cœur de notre organisation. A","text":"✨ Nous avons le plaisir d’accueillir Diane  Brigitte ALLOU au sein de Mstudio !\n\nDiane rejoint l’aventure en tant qu’Office Manager, avec un rôle clé au cœur de notre organisation.\n\nAu quotidien, elle veille à ce que tout fonctionne parfaitement : coordination des équipes, gestion des opérations internes, amélioration continue de notre environnement de travail… bref, elle est l’un des piliers de notre efficacité collective.\n\nAu-delà de ses compétences, Diane apporte une énergie positive, un sens du détail et une vraie culture du service qui font déjà la différence.\n\nNous sommes ravis de l’avoir à bord pour accompagner la croissance de Mstudio 🚀\n\nBienvenue Diane 👏\n#TeamMstudio #NewJoiner #OfficeManager #StartupLife","pid":"7441808541503389696","chars":723,"hashtags":4,"mentions":1,"link":false,"question":false,"lang":"FR","theme":"Équipe & studio"},{"date":"2026-03-30","month":"2026-03","weekday":"Lundi","hour":11,"reactions":42,"comments":2,"reposts":2,"eng":46,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_nous-sommes-ravis-dannoncer-quemstudio-activity-7444337669255421952-U1e5?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Nous sommes ravis d’annoncer que Mstudio sera présent au GITEX AFRICA🇲🇦 Une belle opportunité pour échanger, rencontrer des acteurs clés et explorer les prochaines grandes innovati","text":"Nous sommes ravis d’annoncer que Mstudio sera présent au GITEX AFRICA🇲🇦 \n\nUne belle opportunité pour échanger, rencontrer des acteurs clés et explorer les prochaines grandes innovations en Afrique et au-delà 🚀\n\nSi vous y serez, rencontrons-nous 🤝\n\nNous serions ravis d’échanger avec des fondateurs, VCs,  et partenaires qui façonnent le futur de la tech africaine.\n\n📍 Rendez-vous au GITEX !","pid":"7444337669255421952","chars":390,"hashtags":0,"mentions":1,"link":false,"question":false,"lang":"FR","theme":"Événements & écosystème"},{"date":"2026-04-08","month":"2026-04","weekday":"Mercredi","hour":7,"reactions":202,"comments":3,"reposts":0,"eng":205,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_mstudio-revvo-tech-activity-7447546667257446400-Q8N9?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Chez Mstudio, on construit bien plus que des startups : on contribue à former les talents tech de demain💻 Chaque emploi créé au sein de notre écosystème est une opportunité pour la","text":"Chez Mstudio, on construit bien plus que des startups : on contribue à former les talents tech de demain💻  \n\nChaque emploi créé au sein de notre écosystème est une opportunité pour la jeunesse ivoirienne de monter en compétences, de s’approprier les technologies et de participer activement à la transformation digitale du continent 🌍\n\nNous croyons en une nouvelle génération de builders, développeurs, designers et opérateurs capables de créer, scaler et innover depuis l’Afrique, pour le monde ⚡\n\nFiers de voir nos startups devenir des moteurs d’employabilité, de transmission de savoir et d’empowerment.\n\nLe futur de la tech africaine se construit ici, avec eux. 🚀\n\nPour en savoir plus sur Revvo, notre startup dans le recommerce, dont l’equipe est representee ci-dessous, visitez: www.revvo.africa\n\n#Mstudio #Revvo #Tech #Jeunesse #CotedIvoire #Talent #Startup #Innovation #Digital #Afrique","pid":"7447546667257446400","chars":894,"hashtags":10,"mentions":1,"link":false,"question":false,"lang":"FR","theme":"Convictions & analyses"},{"date":"2026-04-20","month":"2026-04","weekday":"Lundi","hour":10,"reactions":247,"comments":4,"reposts":10,"eng":261,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_mstudio-techafrique-epitech-activity-7451940246885142528-PXaO?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Le plus grand défi de nos startups en portfolio n'est pas toujours le capital. C'est le talent tech. 🎯 La semaine dernière, on a reçu 25 étudiants en Master d'Epitech Bénin le temp","text":"Le plus grand défi de nos startups en portfolio n'est pas toujours le capital. C'est le talent tech. 🎯\n\nLa semaine dernière, on a reçu 25 étudiants en Master d'Epitech Bénin le temps d'une matinée à Abidjan. Data, IA, cloud, cybersécurité, transformation digitale: exactement les profils que recherchent nos ventures.\n\nAu programme : présentation de Mstudio, de notre modèle studio, et des 11 startups du portfolio. Mais surtout, une discussion franche sur leur insertion professionnelle dans nos entreprises 💼 : ce que nos founders attendent, ce que les étudiants cherchent, comment faire matcher les deux.\n\nMerci à Epitech Afrique pour ce partenariat 🚀\n\ncc Max VENITE\n\n#Mstudio #TechAfrique #Epitech #Talent","pid":"7451940246885142528","chars":709,"hashtags":4,"mentions":2,"link":false,"question":false,"lang":"FR","theme":"Nos startups"},{"date":"2026-04-22","month":"2026-04","weekday":"Mercredi","hour":11,"reactions":279,"comments":7,"reposts":9,"eng":295,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_mstudio-flot-mobilitaezaezlectrique-activity-7452676346406752256-9Pmc?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Deux co-founders. Une obsession : réinventer le financement de la mobilité en Afrique francophone. 🚗⚡ Flot. permet aux chauffeurs VTC de devenir propriétaires de leur propre véhicu","text":"Deux co-founders. Une obsession : réinventer le financement de la mobilité en Afrique francophone. 🚗⚡\n\nFlot. permet aux chauffeurs VTC de devenir propriétaires de leur propre véhicule électrique en 36 mois.  Apport minimal, zéro frais d'inscription, un paiement quotidien. Chaque course rapproche le chauffeur de la propriété — tout en effaçant un peu de CO₂.\n\nUn modèle audacieux. Il fallait le duo capable de le porter.\n\nPierre-Alexandre Assou(CEO) — ex-Investor Manager en Private Equity, ex-administrateur de plusieurs sociétés africaines. Il apporte à Flot ce qu'on trouve rarement chez un founder early-stage : une discipline d'investisseur, une lecture pointue de la gouvernance et de la finance d'entreprise. Installé en Afrique francophone depuis 8 ans — il en connaît les rouages. 🌍\n\nPaul WILSON (COO) — 15 ans en banque, ex-Directeur conseil et Senior Consultant en transformation digitale. Il a audité plus de 110 filiales automobiles à travers le monde et structuré du leasing auto pour les majors du financement mondial. Autrement dit : personne ne connaît mieux que lui les mécanismes sur lesquels repose le modèle de Flot. 🏦\n\nUn investisseur devenu opérateur. Un expert bancaire devenu entrepreneur. Ensemble, ils construisent une infrastructure qui pourrait transformer la mobilité urbaine dans toute la région. 🌍\n\n📢 Flot recrute pour accompagner sa croissance :\n💼 1 Leasing Manager — pour gérer les paiements de leasing des chauffeurs.\n📩 Envoyez CV + lettre de motivation à intern@mstudio.vc avec en objet Flot- Votre Nom- Leasing Manager.\n👉 Découvrez Flot : www.flot.africa\n\n#Mstudio #Flot #MobilitéÉlectrique #Recrutement #AbidjanTech #Founders","pid":"7452676346406752256","chars":1664,"hashtags":6,"mentions":3,"link":false,"question":false,"lang":"FR","theme":"Nos startups"},{"date":"2026-04-23","month":"2026-04","weekday":"Jeudi","hour":11,"reactions":238,"comments":2,"reposts":4,"eng":244,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_mstudio-founders-startuplife-activity-7453034981779726336-DGNR?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Il y a quelque chose qu'on n'avait pas anticipé en lançant Mstudio. Quand on imagine un startup studio, on pense bureaux partagés, ressources mutualisées, syndications avec les VCs","text":"Il y a quelque chose qu'on n'avait pas anticipé en lançant Mstudio.\n\nQuand on imagine un startup studio, on pense bureaux partagés, ressources mutualisées, syndications avec les VCs. \nOn pense infrastructure, capital, méthode. 🏗️\n\nMais ce qu'on voit tous les jours dans nos locaux, c'est autre chose.\n\nDes founders qui se chambrent en salle de pause ☕. \nDes CTO qui se dépannent entre deux bugs. \nDes afterworks qui finissent tard 🍹. \nDes anniversaires fêtés à l'étage. \nDes WhatsApps qui fusent à toute heure pour partager un lead, une bonne blague, ou une victoire. 🎉\n\nL'entrepreneuriat est un des métiers les plus solitaires qui existent. Nos founders l'ont transformé en sport d'équipe. 🏆\n\nIci, quand une startup signe un gros client, tout le monde trinque. \n\nQuand une autre lève, tout le monde fête. \n\nOn rame ensemble, on rigole ensemble, on gagne ensemble. 🚀\n\nC'est peut-être ça, notre vraie valeur ajoutée.\n\n#Mstudio #Founders #StartupLife #AbidjanTech","pid":"7453034981779726336","chars":961,"hashtags":4,"mentions":0,"link":false,"question":false,"lang":"FR","theme":"Convictions & analyses"},{"date":"2026-04-27","month":"2026-04","weekday":"Lundi","hour":10,"reactions":116,"comments":2,"reposts":0,"eng":118,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_mstudio-danaya-fintech-activity-7454480744048963584-XBFr?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Dans la zone UEMOA, la conformité est devenue une condition de survie pour toute entreprise financière. ⚖️ Directives BCEAO qui se durcissent, exigences AML/CFT de la CENTIF, stand","text":"Dans la zone UEMOA, la conformité est devenue une condition de survie pour toute entreprise financière. ⚖️\n\nDirectives BCEAO qui se durcissent, exigences AML/CFT de la CENTIF, standards GAFI — chaque banque, fintech, microfinance ou assureur doit aujourd'hui vérifier l'identité de ses clients rapidement, proprement, et de façon traçable. Sous peine de sanctions lourdes, voire de perte de licence.\n\nC'est la brique que construit Danaya, une des startups de notre portfolio. 🔐\nKYC, KYB, AML, Face-match — une suite complète pensée pour les réalités locales : documents d'identité de la zone, RCCM, bases de données gouvernementales, listes de sanctions et PEP. 🌍 Intégrable par API en quelques minutes. ⚡\n\nDéjà adopté par Advans, Remuci, et d'autres acteurs régulés de la région.\n\nAu moment où la BCEAO n'a jamais été aussi exigeante, Danaya construit une infrastructure critique pour la prochaine génération de services financiers en Afrique francophone. 🚀\n\n👉 Découvrez Danaya : www.danaya.africa\nUne bonne partie de l'équipe qui fait tourner tout ça ⬇️\n\n#Mstudio #Danaya #Fintech #Compliance #BCEAO #UEMOA","pid":"7454480744048963584","chars":1108,"hashtags":6,"mentions":1,"link":false,"question":false,"lang":"FR","theme":"Nos startups"},{"date":"2026-05-04","month":"2026-05","weekday":"Lundi","hour":10,"reactions":92,"comments":1,"reposts":3,"eng":96,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_venturestudio-startupafrica-venturebuilding-activity-7457006134554411008-Sp-F?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"📍 L'écosystème early-stage africain ne manque pas d'activité. Mais la façon dont les startups sont construites et financées reste un défi structurel. FMO - Dutch entrepreneurial de","text":"📍 L'écosystème early-stage africain ne manque pas d'activité. Mais la façon dont les startups sont construites et financées reste un défi structurel.\n\nFMO - Dutch entrepreneurial development bank, SAIS (Scaling Agriculture Innovations through Start-ups), and Briter viennent de publier « Venture Studios in Africa », l'une des analyses les plus poussées à ce jour sur le rôle des venture studios sur le continent.\n\nNous sommes fiers d'y figurer comme l'un des 3 case studies, aux côtés de Delta40 Venture Studio et Pyramidia Ventures 🙌🏾\n\n📊 Quelques signaux forts (étude sur 3 500+ startups, 40+ studios, 160+ entreprises analysées) :\n\n🌟 Les startups issues de venture studios ont 2× plus de chances de lever un follow-on que celles passant par un incubateur\n🌟 Elles atteignent les stades pre-seed et seed environ 1 an plus tôt\n🌟 Près de 90 % accèdent à de l'equity ou de la dette plutôt qu'à des grants\n\n✅ Ce que cela confirme pour Mstudio :\n\n👉🏾 Notre dual entity modèle \"venture studio + sidecar fund” (avec Ring Africa) concentre aujourd'hui 68 % du financement early-stage en Côte d'Ivoire\n👉🏾 Une démonstration concrète que le modèle studio peut catalyser tout un écosystème en Afrique francophone\n\nLe rapport pose une question essentielle : construire des entreprises est un défi ; assurer la pérennité des venture builders eux-mêmes, dans des environnements à capital limité, en est un autre.\n\nC'est exactement la conversation que nous voulons continuer à porter.\n\n📖 Lire le white paper 👇🏾\nhttps://lnkd.in/guyJfbKC\n\n#VentureStudio #StartupAfrica #VentureBuilding #FrancophoneAfrica #EarlyStage #Mstudio","pid":"7457006134554411008","chars":1607,"hashtags":6,"mentions":5,"link":true,"question":false,"lang":"FR","theme":"Convictions & analyses"},{"date":"2026-05-06","month":"2026-05","weekday":"Mercredi","hour":13,"reactions":36,"comments":2,"reposts":0,"eng":38,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_africaforwardic-venturestudio-startupafrica-activity-7457776276041420800-ggDM?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🌍 Mstudio sera à Africa Forward | Inspire & Connect 🇰🇪 La semaine prochaine, le 11 mai 2026 à Nairobi, nous serons présents à Africa Forward, sous le haut patronage des Présidents ","text":"🌍 Mstudio sera à Africa Forward | Inspire & Connect 🇰🇪\n\nLa semaine prochaine, le 11 mai 2026 à Nairobi, nous serons présents à Africa Forward, sous le haut patronage des Présidents Emmanuel Macron et William Ruto, co-organisé par Bpifrance, Business France et Proparco.\n\n🎤 Mstudio sera représenté par notre co-fondatrice et COO Leslie Ossete, qui portera la voix du modèle venture studio et de l' écosystème tech en Afrique francophone.\n\nL'événement réunira  1 500+ leaders économiques et institutionnels autour des grands sujets de la coopération économique Afrique–France :\n\n👉🏾 Co-industrialisation et souveraineté économique\n👉🏾 Innovation et compétitivité africaine\n👉🏾 Financement et alliances stratégiques\n\nVous y serez aussi ? Nous serions ravis d'échanger autour de l'innovation africaine.\n\n📅 11 mai 2026 \n📍 Nairobi, Kenya  🇰🇪 \n🔗 https://lnkd.in/eWsGJaUh\n\n#AfricaForwardIC #VentureStudio #StartupAfrica #Mstudio #FrancophoneAfrica #Nairobi #Kenya","pid":"7457776276041420800","chars":952,"hashtags":7,"mentions":4,"link":true,"question":true,"lang":"FR","theme":"Événements & écosystème"},{"date":"2026-05-13","month":"2026-05","weekday":"Mercredi","hour":9,"reactions":254,"comments":4,"reposts":9,"eng":267,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_blok-btp-construction-activity-7460256307250483201-ppiP?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🏗️ Coup de projecteur sur BLOK, une de nos startups. BLOK réinvente la chaîne d'approvisionnement du secteur de la construction en Afrique francophone : une plateforme mobile et we","text":"🏗️ Coup de projecteur sur BLOK, une de nos startups.\n\nBLOK réinvente la chaîne d'approvisionnement du secteur de la construction en Afrique francophone : une plateforme mobile et web qui connecte les chantiers directement aux fournisseurs certifiés de matières premières.\n\nEt derrière la plateforme, une équipe dédiée, à votre disposition pour traiter vos devis, vous accompagner sur vos commandes et garantir la qualité des livraisons.\n\n🤖 Petit clin d'œil au chatbot IA intégré au site : votre assistant 24/7 pour cadrer un besoin, comparer des matériaux ou démarrer une demande de devis en quelques secondes.\n\nFini les devis qui traînent, les ruptures de stock et les écarts de qualité. Tout se commande, se suit et se livre depuis une seule app pensée pour le terrain.\n\n🧱 Constructeurs, chefs de chantier, entreprises BTP — gagnez du temps et de la marge sur vos approvisionnements.\n\n👉 Découvrez BLOK : www.blok.africa\n\nBravo à toute l'équipe pour le travail accompli. La construction africaine se digitalise, et BLOK en est l'une des locomotives.\n\n#BLOK #BTP #Construction #AfriqueFrancophone #Mstudio","pid":"7460256307250483201","chars":1105,"hashtags":5,"mentions":0,"link":false,"question":false,"lang":"FR","theme":"Nos startups"},{"date":"2026-05-14","month":"2026-05","weekday":"Jeudi","hour":10,"reactions":71,"comments":0,"reposts":0,"eng":71,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_africaforwardic-mstudio-nairobi-activity-7460641313059766272-vY9m?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🌍 Africa Forward Summit — Nairobi, Kenya 🇰🇪. 2 000 décideurs, 30 chefs d'État, et une première : la France co-organise un sommet de cette ampleur dans un pays anglophone du contine","text":"🌍 Africa Forward Summit — Nairobi, Kenya 🇰🇪.\n\n2 000 décideurs, 30 chefs d'État, et une première : la France co-organise un sommet de cette ampleur dans un pays anglophone du continent. Le signal est clair — le récit France–Afrique se réécrit, et il s'écrit autrement.\n\nPendant longtemps, parler de « partenariats France–Afrique » voulait dire aide, coopération, projets descendants. Ce qui se joue à Nairobi est d'un autre ordre : des États qui négocient d'égal à égal, des entrepreneurs africains qui posent les termes, des opérateurs qui construisent l'infrastructure réelle du continent.\n\nLe développement, ce n'est plus une promesse. C'est ce que des équipes opérationnelles livrent dans nos villes.\n\nC'est dans cette bascule que Mstudio se situe.\n\nNotre cofondatrice Leslie Ossete intervenait sur un panel autour de l'IA 🤖 — pour rappeler une conviction simple : l'Afrique n'a pas besoin de rattraper son retard sur l'IA, elle a besoin de faire un leapfrog. De sauter les étapes que d'autres continents ont dû franchir, pour aller débloquer ce que personne d'autre ne peut débloquer pour nous — la multiplication du GDP du continent sur une décennie. Et cela ne se jouera pas dans les démos, mais dans des cas d'usage IA qui marchent dans la vraie économie, celle où 80 % du commerce passe encore par le secteur informel.\n\n🚀 Trois de nos startups ont porté nos couleurs au sommet :\n• ✪ Stane BLEGBO — de Djoli, agritech qui structure les filières agricoles ouest-africaines\n• Yohann Behi et Waly K. N'Diaye — de BLOK, contech qui digitalise la chaîne du bâtiment\n• Pierre-Alexandre Assou — de Flot., qui dynamise la mobilité électrique pour les chauffeurs de VTC\n\nTrois entreprises, trois marchés, une même conviction : le continent n'a pas besoin qu'on lui raconte son avenir. Il a besoin d'opérateurs qui le construisent.\n\nMerci à Bpifrance, Business France et Proparco pour la co-organisation, sous le Haut Patronage de S.E. Emmanuel Macron et S.E. William Ruto. La direction est la bonne : passer du discours aux flux.\n\nÀ Mstudio, on opère. On n'évangélise pas. ✨\n\n#AfricaforwardIC #Mstudio #Nairobi #VentureBuilder","pid":"7460641313059766272","chars":2124,"hashtags":4,"mentions":10,"link":false,"question":false,"lang":"FR","theme":"Événements & écosystème"},{"date":"2026-05-19","month":"2026-05","weekday":"Mardi","hour":8,"reactions":58,"comments":0,"reposts":2,"eng":60,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_bienvenue-%C3%A0-abidjan-cohorte-2-la-deuxi%C3%A8me-activity-7462419492829020161-ffA0?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🌍 Bienvenue à Abidjan, Cohorte 2 ! La deuxième promotion de Diaspora Connect a officiellement démarré sa semaine d'immersion en Côte d'Ivoire. On parle souvent de la mobilité diasp","text":"🌍 Bienvenue à Abidjan, Cohorte 2 ! La deuxième promotion de Diaspora Connect a officiellement démarré sa semaine d'immersion en Côte d'Ivoire.\n\nOn parle souvent de la mobilité diasporique comme d'une tendance prometteuse. En moins d'un an et deux cohortes, les chiffres parlent déjà :\n\n▸ 500+ candidatures qualifiées\n▸ 60+ talents insérés dans 40+ entreprises partenaires\n▸ 12 nationalités représentées\n▸ 56 % de diaspora ivoirienne dans cette cohorte 2 — contre 35 % l'année dernière\n\nL'envie de contribuer, de revenir, de s'ancrer ne fait pas que persister. Elle s'accélère.\n\nEt pour la première fois, deux embauches directes en CDI et CDD sur des postes seniors, avant même le démarrage des missions. Un signal fort de la confiance qui grandit — côté entreprises comme côté candidats.\n\nCes 26 talents rejoindront dans quelques jours des entreprises comme Groupe COFINA, Eranove, Artefact, Daba Finance, Women's Investment Club (WIC), PFO IMMOBILIER, KÔMIAN et bien d'autres — sur des missions à fort impact : data & IA, finance & investissement, développement commercial, gestion de projet, marketing, juridique, RH.\n\nDerrière chaque chiffre, il y a des personnes. Des parcours. Des choix forts. Certains rentrent pour la première fois. D'autres reviennent après des années. Tous ont décidé que c'était le bon moment.\n\n📅 Jeudi 21 mai, Mstudio réunit les deux cohortes, ses entreprises partenaires, des décideurs et des acteurs de l'écosystème pour l'événement Diaspora, Mobilité et Retours #2 — pour présenter ce bilan et poser la vraie question : comment transformer ce potentiel en impact structurant pour l'économie ivoirienne ?\n\n🕑 14h00 – 21h00\n📍 Byblos Hôtel, Abidjan\n🔗 Il reste quelques places : https://luma.com/hg3s81sc\n\nAkwaba 🇨🇮","pid":"7462419492829020161","chars":1741,"hashtags":1,"mentions":8,"link":true,"question":true,"lang":"FR","theme":"Diaspora Connect"},{"date":"2026-05-20","month":"2026-05","weekday":"Mercredi","hour":10,"reactions":71,"comments":1,"reposts":9,"eng":81,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_savrbootcamp-startupafrica-investmentreadiness-activity-7462804335102468096-X0OW?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚀 APPEL À CANDIDATURES — SAVR BOOTCAMP CÔTE D’IVOIRE 2026 Vous développez une startup digitale ou greentech en Côte d’Ivoire et préparez une levée de fonds dans les prochains mois ","text":"🚀 APPEL À CANDIDATURES — SAVR BOOTCAMP CÔTE D’IVOIRE 2026\n\nVous développez une startup digitale ou greentech en Côte d’Ivoire et préparez une levée de fonds dans les prochains mois ?\n\nLe SAVR Bootcamp est un programme intensif de 5 jours conçu pour aider les fondateur·trice·s early-stage à devenir réellement “investment-ready”.\n\nOrganisé par Smart Africa en collaboration avec le Mstudio, dans le cadre du programme Africa-EU Digital Innovation Bridge (AEDIB 2.0), le bootcamp réunira une cohorte de 15 startups sélectionnées à Abidjan du 22 au 26 juin 2026.\n\nPendant 5 jours, les participant·e·s travailleront sur :\n✓ leur stratégie de levée de fonds\n✓ leur modèle économique et financier\n✓ leur storytelling investisseur\n✓ leur pitch deck\n✓ leur préparation au pitch devant investisseurs\n\n📍 Abidjan, Côte d’Ivoire\n📅 22–26 juin 2026\n👥 Cohorte limitée à 15 startups\n\n⏳ Ouverture des candidatures : 18 mai 2026\n⏳ Date limite de candidature : 31 mai 2026 à 23h59\n\n👉 Candidatez ici : https://lnkd.in/d5uBpqsn  \n\ncc Arthur Germond Yusuf Mutamba\n\n#SAVRBootcamp #StartupAfrica #InvestmentReadiness #Greentech #DigitalInnovation #CotedIvoire #Fundraising #Entrepreneuriat  #Mstudio #AfricaEuropeDigitalInnovationBridge #GlobalGateway","pid":"7462804335102468096","chars":1228,"hashtags":11,"mentions":3,"link":true,"question":false,"lang":"FR","theme":"Programmes & candidatures"},{"date":"2026-05-20","month":"2026-05","weekday":"Mercredi","hour":15,"reactions":28,"comments":0,"reposts":0,"eng":28,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_diasporaconnect-mstudioventures-diaspora-activity-7462880516510461952-LRW7?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🌍 Diaspora, Mobilité et Retours 2 — Mstudio y sera. Jeudi 21 mai, notre équipe participe à Diaspora, Mobilité et Retours 2, l'événement organisé par Diaspora Connect autour d'un su","text":"🌍 Diaspora, Mobilité et Retours 2 — Mstudio y sera.\n\nJeudi 21 mai, notre équipe participe à Diaspora, Mobilité et Retours 2, l'événement organisé par Diaspora Connect autour d'un sujet au cœur de notre mission : comment transformer les dynamiques de la diaspora africaine en levier concret de développement économique ?\n\nAu programme : un talk-show en partenariat avec Choose Your Mentor, réunissant acteurs du secteur public, du privé et de l'entrepreneuriat pour des échanges concrets, — retours terrain, transfert de compétences, création d'opportunités. Animé par Malick Diabaté, la table ronde inclura Penda Sow, Mahamane Sow, Souhony BRAGBO et Leslie Ossete.\n\nChez Mstudio, on croit profondément que les talents de la diaspora sont un actif stratégique pour l'Afrique francophone. Ce type de rencontre, c'est exactement là où les connexions qui comptent se nouent.\n📅 Jeudi 21 mai 2026\n🕑 14h00 – 21h00\n📍 Byblos Hôtel, Abidjan\n\n🎟️ Places limitées — inscription obligatoire : https://luma.com/hg3s81sc\n\nMerci à Choose Your Mentor, l'Ambassade de France en Côte d'Ivoire et tous les partenaires de cette édition.\n\nOn se retrouve là-bas 👋\n\n#DiasporaConnect #MstudioVentures #Diaspora #TalentsAfricains #CôtedIvoire #Entrepreneuriat #Abidjan","pid":"7462880516510461952","chars":1241,"hashtags":7,"mentions":7,"link":true,"question":false,"lang":"FR","theme":"Diaspora Connect"},{"date":"2026-05-26","month":"2026-05","weekday":"Mardi","hour":10,"reactions":345,"comments":9,"reposts":11,"eng":365,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_65-millions-de-fcfa-cdc-ci-capital-vient-activity-7464978698203594753-EdM0?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"65 millions de FCFA. CDC-CI Capital vient d'investir dans Flot., une des startups du Mstudio. Parce que derrière ce chiffre, il y a une conviction partagée : la transition vers la ","text":"65 millions de FCFA. CDC-CI Capital vient d'investir dans Flot., une des startups du Mstudio.\n\nParce que derrière ce chiffre, il y a une conviction partagée : la transition vers la mobilité électrique en Côte d'Ivoire ne se fera pas sans un modèle financier pensé pour ceux qui conduisent — pas pour ceux qui possèdent déjà.\n\nFlot, c'est ça :\n→ Un chauffeur de ride-hailing. Zéro apport initial.\n→ Remboursements quotidiens via mobile money, calés sur ses revenus réels.\n→ Clés en 48h.\n→ Propriétaire de son véhicule électrique en 36 mois.\n\nMerci à CDC-CI CAPITAL pour cette confiance. Ce financement permet d'accélérer le déploiement de Flot à Abidjan et de mettre encore plus de chauffeurs sur la route vers la propriété.\n\nLa suite arrive. Restez connectés. 💚\n\nChauffeur, Deviens patron !\n\nBravo à Pierre-Alexandre Assou et Paul WILSON!","pid":"7464978698203594753","chars":838,"hashtags":0,"mentions":4,"link":false,"question":false,"lang":"FR","theme":"Levée & partenariats"},{"date":"2026-05-28","month":"2026-05","weekday":"Jeudi","hour":11,"reactions":94,"comments":2,"reposts":2,"eng":98,"media":"img","url":"https://www.linkedin.com/posts/mstudiovc_jeudi-dernier-%C3%A0-travers-notre-programme-activity-7465719686652043265-_2cT?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Jeudi dernier, à travers notre programme Diaspora Connect, nous avons organisé l'évènement Diaspora, Mobilité et Retours 2 🌍 C'était l'occasion pour nous de réunir nos 60 lauréats,","text":"Jeudi dernier, à travers notre programme Diaspora Connect, nous avons organisé l'évènement Diaspora, Mobilité et Retours 2 🌍 \n\nC'était l'occasion pour nous de réunir nos 60 lauréats, de la cohorte 1 et 2 de Diaspora Connect, ces jeunes talents issus de la diaspora africaine en France, en stages, emplois et parcours entrepreneurial qui ont choisi la Côte d'Ivoire pour contribuer humainement au développement du continent. 🇨🇮 \n\nAu programme: talk show, ateliers, échanges.\n\nMerci Malick Diabaté, Mahamane Sow, Penda Sow, Souhony BRAGBO, et Leslie Ossete d'avoir autant partagé sur leurs parcours de répats 💫 \n\nKuddos à Charm Matuba pour avoir magistralement animé la séance en tant que MC 🎤 \n\nNotre partenaire, l' Ambassade de France en Côte d'Ivoire, a été représentée par Mme Nathalie Dupont, qui a une fois de plus souligné la richesse de la double culture, occidentale et africaine, que portent les talents de Diaspora Connect, arme unique pour l'ascension économique du continent 📈 \n\nPar ailleurs, un grand merci à notre audience, et aux membres d
