eekday":"Mardi","hour":8,"reactions":77,"comments":0,"reposts":2,"eng":79,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diasporaconnect-activity-7467494168580456449-9TAm?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"[IMMERSION WEEK — JOUR 2] Le deuxième jour de la semaine d’immersion a été marqué par une rencontre privilégiée avec Penda Sow, marraine de la cohorte 2, dans les locaux de du Grou","text":"[IMMERSION WEEK — JOUR 2]\nLe deuxième jour de la semaine d’immersion a été marqué par une rencontre privilégiée avec Penda Sow, marraine de la cohorte 2, dans les locaux de du Groupe Ferili.\n\nEntrepreneure, dirigeante et figure reconnue de l’écosystème africain, Penda a partagé avec les participants son parcours, ses apprentissages, sa vision du leadership et sa lecture des opportunités qui existent aujourd’hui sur le continent.\n\nLes membres de la cohorte ont également pu découvrir les activités de Ferili et échanger avec plusieurs collaborateurs du groupe, leur offrant une vision plus concrète des métiers, des enjeux de croissance et des opportunités qui existent au sein de l’écosystème local.\n\nCe moment a marqué le début d’une relation de mentorat qui se poursuivra bien au-delà de cette semaine d’immersion pour certains. Et le début d'une relation professionnelle pour Patricia Assabe , membre de la cohorte, qui rejoint le Groupe FERILI en tant que Resp. Marketing & Communication . \n\nMerci à Penda Sow et aux équipes de Ferili pour leur accueil chaleureux et la richesse des échanges.\n\n#DiasporaConnect","pid":"7467494168580456449","chars":1118,"hashtags":1,"mentions":3,"link":false,"question":false,"lang":"FR","theme":"Cohorte & immersion"},{"date":"2026-06-03","month":"2026-06","weekday":"Mercredi","hour":15,"reactions":41,"comments":1,"reposts":0,"eng":42,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diasporaconnect-activity-7467958403798188032-uhzI?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"[IMMERSION WEEK — JOUR 3] Comprendre un écosystème, c’est aussi comprendre celles et ceux qui le structurent. Dans le cadre de la semaine d’immersion de Diaspora Connect, la cohort","text":"[IMMERSION WEEK — JOUR 3] Comprendre un écosystème, c’est aussi comprendre celles et ceux qui le structurent.\n\nDans le cadre de la semaine d’immersion de Diaspora Connect, la cohorte 2 a été accueillie au Ministry of Digital Transition and Technological Innovation\npour un temps d’échange avec Kounandi Stephane Coulibaly, Directeur de l’Innovation. \n\nCette rencontre a permis aux participants de découvrir la vision portée par le Ministère pour accélérer la transformation numérique de la Côte d’Ivoire et faire du digital un levier de compétitivité, d’innovation et d’inclusion.\n\nAvec Kounandi Stephane Coulibaly, les échanges ont porté sur les grandes priorités du pays en matière d’innovation, le rôle des startups dans la transformation économique ainsi que les opportunités offertes aux talents souhaitant contribuer à la construction de l’économie numérique ivoirienne.\n\nAu-delà des politiques publiques, cette rencontre a surtout permis aux participants de comprendre comment institutions, entreprises, hubs et entrepreneurs travaillent ensemble pour construire l'écosystème numérique de demain.\n\nMerci à Stéphane Coulibaly et aux équipes du Ministère pour leur accueil et la richesse des échanges.\n#DiasporaConnect","pid":"7467958403798188032","chars":1223,"hashtags":1,"mentions":3,"link":false,"question":false,"lang":"FR","theme":"Cohorte & immersion"},{"date":"2026-06-04","month":"2026-06","weekday":"Jeudi","hour":11,"reactions":158,"comments":3,"reposts":5,"eng":166,"media":"video","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diaspora-connect-%C3%A0-lhonneur-sur-life-activity-7468258060457738240-xJit?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"📺 Diaspora Connect à l'honneur sur LIFE TV (Côte d'Ivoire) - Emission 13 Minutes Chrono Merci à Life TV pour ce reportage consacré à Diaspora Connect lors de l'événement Diaspora, ","text":"📺 Diaspora Connect à l'honneur sur LIFE TV (Côte d'Ivoire) - Emission 13 Minutes Chrono\n\nMerci à Life TV pour ce reportage consacré à Diaspora Connect lors de l'événement Diaspora, Mobilité et Retours 2. Cette couverture met en lumière une conviction qui guide notre action depuis le lancement du programme : la diaspora africaine ne doit plus être considérée uniquement comme une source de transferts financiers, mais comme un véritable levier de développement économique, de transfert de compétences et d'innovation pour le continent.\n\nLe reportage revient également sur un enjeu majeur partagé par Jean Yves Bragbo : \"chaque année, la diaspora ivoirienne transfère plus de 840 milliards FCFA vers la Côte d'Ivoire. Pourtant, seule une faible part de ces flux contribue aujourd'hui à des projets créateurs d'emplois et de valeur durable.\"\n\nNotre ambition est simple : transformer ce potentiel humain, financier et entrepreneurial en impact concret pour les économies africaines.\n\nMerci à tous les talents, entreprises, partenaires et institutions qui rendent cette aventure possible.\n\n🎥 Découvrez le reportage ci-dessous.\n\nLonga Andrea MBUYAMBA Ornella-Ashley Sangronio Kirane Yassine Mahamane Sow Penda Sow Leslie Ossete Jean Yves Bragbo Charm Matuba Marwa Ahmed Sophia El Hajaj Florence TAHIRI epse FADIKA Anah Safiratou Coulibaly, CISA, PMP Babel BALSOMI Yannick Mekwegne Steve Essis Sandra M. Kenza Coulibaly Lika DOUKOURE-SZAL Nanna Sylla-Coulibaly NOFERIMA FOFANA Aziz Yao Kone Lanzeni","pid":"7468258060457738240","chars":1493,"hashtags":0,"mentions":24,"link":false,"question":false,"lang":"FR","theme":"Presse & résultats"},{"date":"2026-06-09","month":"2026-06","weekday":"Mardi","hour":15,"reactions":40,"comments":0,"reposts":2,"eng":42,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diasporaconnect-activity-7470133973458018304-b89a?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"[IMMERSION WEEK — JOUR 5] Comment créer des passerelles concrètes entre les talents de la cohorte et celles et ceux qui construisent déjà l’écosystème local ? C’est tout l’objectif","text":"[IMMERSION WEEK — JOUR 5] Comment créer des passerelles concrètes entre les talents de la cohorte et celles et ceux qui construisent déjà l’écosystème local ?\n\nC’est tout l’objectif de ACT LIKE, le cocktail dînatoire organisé dans le cadre de la semaine d’immersion de la cohorte 2 de Diaspora Connect. Le temps d’une soirée, nos bénéficiaires ont pu échanger en petits groupes avec des dirigeants, entrepreneurs et experts autour des réalités du terrain, des trajectoires professionnelles, de l’entrepreneuriat, du leadership et des opportunités qui existent aujourd’hui en Côte d’Ivoire.\n\nMerci à : Sarrah Coulibaly, Paul Régis Bessala, Fitzgerald Bony, Alpha LY, Alain Anzara, Stephanie Kouassi, Sophie Tall, Lynsay Mabe, Anah Safiratou Coulibaly, CISA, PMP  et Maimouna Toure CISA, PMP  pour leur disponibilité et la richesse des échanges.\n\nLe format \"speed table mentoring\" a permis des discussions particulièrement directes, concrètes et sans filtre. Certains participants découvraient l’Afrique de l’Ouest pour la première fois. D’autres envisageaient déjà leur avenir professionnel sur le continent. Tous avaient en commun une même volonté : comprendre, apprendre et trouver leur place dans l’écosystème.\n\nMerci à l’ensemble des intervenants, à notre partenaire Royal Work Club et à l’Ambassade de France en Côte d’Ivoire pour leur confiance et leur engagement aux côtés du programme.\n\n#DiasporaConnect Robin NICOLET Longa Andrea MBUYAMBA Ornella-Ashley Sangronio","pid":"7470133973458018304","chars":1471,"hashtags":1,"mentions":15,"link":false,"question":false,"lang":"FR","theme":"Cohorte & immersion"},{"date":"2026-06-10","month":"2026-06","weekday":"Mercredi","hour":14,"reactions":40,"comments":0,"reposts":4,"eng":44,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_save-the-date-nous-sommes-convaincus-activity-7470474937007284224-2z7l?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"[SAVE THE DATE] 🤝 Nous sommes convaincus que les meilleures opportunités naissent souvent des rencontres. C'est dans cet esprit que Diaspora Connect, ASPA Paris Campus Sciences Po ","text":"[SAVE THE DATE] 🤝 Nous sommes convaincus que les meilleures opportunités naissent souvent des rencontres.\n\nC'est dans cet esprit que Diaspora Connect, ASPA Paris Campus Sciences Po  et PariBabi ont décidé d'unir leurs communautés le temps d'une soirée d'échange et de networking à Abidjan.\n\nNos organisations partagent une même volonté : créer davantage de connexions entre les talents, favoriser le partage d'expériences et encourager l'émergence de nouvelles collaborations.\n\nQue vous soyez étudiant, jeune diplômé, professionnel, entrepreneur ou simplement curieux d'en apprendre davantage sur les dynamiques entre l'Europe et l'Afrique, cette rencontre est l'occasion d'échanger avec des profils aux parcours variés et de développer votre réseau dans un cadre convivial.\n\nAu programme :\n✨ Témoignages et retours d'expérience\n✨ Discussions autour des opportunités professionnelles et entrepreneuriales\n✨ Rencontres entre membres de nos différentes communautés\n✨ Moment de networking autour d'un cocktail\n\nAu-delà de l'événement, cette initiative reflète une conviction simple : lorsque les communautés se rencontrent, elles créent plus de valeur ensemble que séparément.\n\n📍 Mstudio , ITC\n📅 Mercredi 17 Juin\n🔗 https://luma.com/bkhbhszp \n\nNous avons hâte de vous retrouver !\nBaptiste Heintz Hélène Cuny-Coulibaly Souleymane Diallo  Emmanuelle Fofana","pid":"7470474937007284224","chars":1350,"hashtags":0,"mentions":7,"link":true,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-06-11","month":"2026-06","weekday":"Jeudi","hour":12,"reactions":21,"comments":0,"reposts":1,"eng":22,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diasporaconnect-womeninventures-activity-7470818719372476416-hX_s?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🌍 Comment construire une carrière au service du financement de l’innovation et de l’entrepreneuriat en Afrique ? Pour notre prochain rencontre avec la cohorte Diaspora Connect, nou","text":"🌍 Comment construire une carrière au service du financement de l’innovation et de l’entrepreneuriat en Afrique ?\n\nPour notre prochain rencontre avec la cohorte Diaspora Connect, nous aurons le plaisir d'accueillir deux femmes engagées qui contribuent chaque jour au développement de l'écosystème entrepreneurial africain :\n\n✨ Hady Barry – Ventures Platform Fund\n ✨ Solène Jalet – Bpifrance\n\nÀ travers leurs parcours, elles partageront leur expérience, leurs choix de carrière et leur vision des métiers qui accompagnent les entrepreneurs et financent l'innovation.\n\nCette conversation sera l'occasion d'aborder :\n- Les coulisses des métiers de l'investissement et du financement de l'innovation\n- Les différentes façons de contribuer au développement économique du continent\n- Les opportunités pour les talents africains et de la diaspora\n- Les défis, apprentissages et perspectives de carrière dans cet écosystème en pleine croissance\n\nDeux parcours inspirants, deux regards complémentaires et une même ambition : soutenir celles et ceux qui bâtissent l'Afrique de demain.\n\nMerci à Hady et Solène d'avoir accepté de partager leur expérience avec notre communauté. \n\n#DiasporaConnect #WomenInVentures","pid":"7470818719372476416","chars":1200,"hashtags":2,"mentions":4,"link":false,"question":false,"lang":"FR","theme":"Convictions & diaspora"},{"date":"2026-06-16","month":"2026-06","weekday":"Mardi","hour":11,"reactions":8,"comments":0,"reposts":0,"eng":8,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_j-1-nous-sommes-convaincus-que-les-meilleures-activity-7472607953775177728-D7FR?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"[J-1] 🤝 Nous sommes convaincus que les meilleures opportunités naissent souvent des rencontres. C'est dans cet esprit que Diaspora Connect, ASPA Paris Campus – Page officielle et P","text":"[J-1] 🤝 Nous sommes convaincus que les meilleures opportunités naissent souvent des rencontres.\n\nC'est dans cet esprit que Diaspora Connect, ASPA Paris Campus – Page officielle et PariBabi ont décidé d'unir leurs communautés le temps d'une soirée d'échange et de networking à Abidjan.\n\nNos organisations partagent une même volonté : créer davantage de connexions entre les talents, favoriser le partage d'expériences et encourager l'émergence de nouvelles collaborations.\n\nQue vous soyez étudiant, jeune diplômé, professionnel, entrepreneur ou simplement curieux d'en apprendre davantage sur les dynamiques entre l'Europe et l'Afrique, cette rencontre est l'occasion d'échanger avec des profils aux parcours variés et de développer votre réseau dans un cadre convivial.\n\nAu programme :\n✨ Témoignages et retours d'expérience\n✨ Discussions autour des opportunités professionnelles et entrepreneuriales\n✨ Rencontres entre membres de nos différentes communautés\n✨ Moment de networking autour d'un cocktail\n\nAu-delà de l'événement, cette initiative reflète une conviction simple : lorsque les communautés se rencontrent, elles créent plus de valeur ensemble que séparément.\n\n📍 Mstudio , ITC\n📅 Mercredi 17 Juin\n🔗 https://luma.com/bkhbhszp \n\nNous avons hâte de vous retrouver !\nBaptiste Heintz Hélène Cuny-Coulibaly Souleymane Diallo Emmanuelle Fofana","pid":"7472607953775177728","chars":1344,"hashtags":0,"mentions":7,"link":true,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-06-16","month":"2026-06","weekday":"Mardi","hour":15,"reactions":42,"comments":1,"reposts":0,"eng":43,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diasporaconnect-activity-7472670067923537920-Shaw?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚀 Retour sur notre dernière rencontre mensuelle Diaspora Connect avec la cohorte 2. Jeudi dernier, nous avons eu le plaisir d'accueillir deux femmes aux parcours inspirants, Hady B","text":"🚀 Retour sur notre dernière rencontre mensuelle Diaspora Connect avec la cohorte 2. \n\nJeudi dernier, nous avons eu le plaisir d'accueillir deux femmes aux parcours inspirants, Hady Barry (Ventures Platform Fund) et Solène Jalet ( Bpifrance ) , pour une conversation riche autour des métiers du financement de l'entrepreneuriat et de l'innovation en Afrique modérée par R. Estelle N. .\n\nAu-delà de leurs fonctions respectives, elles nous ont partagé avec beaucoup de transparence les choix, les opportunités, les doutes et les apprentissages qui ont façonné leurs parcours.\n\nQuelques enseignements qui ont particulièrement marqué les participants :\n✨ Il existe de nombreuses façons de contribuer au développement du continent, que ce soit au sein de fonds d'investissement, d'institutions publiques, d'accélérateurs ou directement auprès des entrepreneurs.\n✨ Les carrières ne sont pas toujours linéaires. Les opportunités se construisent souvent à travers les rencontres, la curiosité et la capacité à saisir les occasions qui se présentent.\n✨ L'impact ne se limite pas à la création d'entreprise. Accompagner, financer et soutenir celles et ceux qui innovent est aussi une manière puissante de contribuer à la transformation de l'Afrique.\n✨ Les talents de la diaspora ont un rôle important à jouer et de multiples portes d'entrée pour mettre leurs compétences au service des écosystèmes africains.\n\nUn immense merci à Hady et Solène pour leur générosité, leur disponibilité et la qualité des échanges.\n\nMerci également aux membres de la cohorte Diaspora Connect pour leurs questions pertinentes et leur engagement constant lors de ces rencontres.\n\n#DiasporaConnect","pid":"7472670067923537920","chars":1664,"hashtags":1,"mentions":5,"link":false,"question":false,"lang":"FR","theme":"Cohorte & immersion"},{"date":"2026-06-19","month":"2026-06","weekday":"Vendredi","hour":10,"reactions":60,"comments":0,"reposts":0,"eng":60,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_mercredi-soir-paribabi-aspa-paris-campus-activity-7473688925878951937-C5Q5?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Mercredi soir, PariBabi , ASPA Paris Campus – Page officielle et Diaspora Connect ont réuni leurs communautés autour d’un moment d’échange, de partage et de rencontres au Mstudio. ","text":"Mercredi soir, PariBabi , ASPA Paris Campus – Page officielle et Diaspora Connect ont réuni leurs communautés autour d’un moment d’échange, de partage et de rencontres au  Mstudio.\n\nDans un contexte où beaucoup cherchent à mieux comprendre les opportunités qui existent en Afrique, cette soirée a confirmé une chose : les talents de la diaspora ont envie de se rencontrer, d’échanger leurs expériences et de construire ensemble.\n\nMerci à toutes les personnes qui ont pris le temps de participer, de partager leur parcours, leurs questionnements, leurs ambitions et leurs conseils. La richesse des discussions a une nouvelle fois démontré la force de nos réseaux lorsque nous créons des espaces de dialogue et de connexion.\n\nMerci également aux équipes de l'ASPA et Paribabi pour leur mobilisation et leur confiance dans cette initiative commune.\n\nBaptiste Heintz Souleymane Diallo Longa Andrea MBUYAMBA","pid":"7473688925878951937","chars":902,"hashtags":0,"mentions":7,"link":false,"question":false,"lang":"FR","theme":"Partenaires & institutions"},{"date":"2026-06-22","month":"2026-06","weekday":"Lundi","hour":10,"reactions":56,"comments":4,"reposts":6,"eng":66,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_meet-the-team-in-paris-venez-rencontrer-activity-7474763116908838912-6O0y?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"[Meet the Team in Paris 🇫🇷 ] Venez rencontrer l'équipe de Diaspora Connect le mardi 7 juillet à Paris. À l’occasion du lancement de la troisième cohorte de Diaspora Connect, cet év","text":"[Meet the Team in Paris 🇫🇷 ] Venez rencontrer l'équipe de Diaspora Connect le mardi 7 juillet à Paris.  \n\nÀ l’occasion du lancement de la troisième cohorte de Diaspora Connect, cet événement vous réunira autour d’un sujet central : comment transformer une envie de retour ou d’engagement en Afrique en une trajectoire professionnelle concrète ?\n\nPensée comme un espace d’échange ouvert et interactif, cette rencontre permettra de croiser les regards de participants au programme, d’entreprises partenaires et d’acteurs de l’écosystème africain autour des réalités du marché de l’emploi, des opportunités de carrière, des défis du retour et des nouvelles formes de mobilité professionnelle entre l’Europe et l’Afrique.\n\nCe temps d’échange sans filtres sera également l’occasion de présenter Diaspora Connect, les résultats des deux premières cohortes, ainsi que les opportunités de stages, d’emplois et d’immersion professionnelle qui seront proposées dans le cadre de la cohorte 3.\n\n📅 Mardi 7 juillet  \n🕔 17h00 – 20h00\n📍 ESCP Business School – Campus Paris Champerret\n\n🎟️ Participation gratuite sur inscription obligatoire : https://luma.com/jpvjvzp8\nPlaces limitées.","pid":"7474763116908838912","chars":1167,"hashtags":0,"mentions":2,"link":true,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-06-25","month":"2026-06","weekday":"Jeudi","hour":11,"reactions":43,"comments":0,"reposts":1,"eng":44,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_agenda-de-nos-partenaires-%C3%A0-ne-pas-activity-7475869992379559936-wJ3u?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"[AGENDA DE NOS PARTENAIRES 📆 ] À ne pas manquer cette semaine à Paris 🇫🇷 🚀 Vous êtes étudiant, jeune diplômé, membre de la diaspora ou en recherche d'opportunités professionnelles ","text":"[AGENDA DE NOS PARTENAIRES 📆 ] À ne pas manquer cette semaine à Paris 🇫🇷 \n\n🚀 Vous êtes étudiant, jeune diplômé, membre de la diaspora ou en recherche d'opportunités professionnelles ? Voici deux événements à ne pas manquer cette semaine à Paris.\n\n🎓 1. Prix d'Excellence de l'Étudiant Africain\n📅 27 juin 2026 – Paris\nAu-delà de la remise de prix, cet événement se positionne comme un véritable espace de rencontre entre étudiants, entreprises, institutions, mentors et leaders africains. \n\n🌍 2. Forum Diaspora for Growth\n📅 26 & 27 juin 2026 – Paris\nPorté avec le soutien des autorités ivoiriennes, ce forum se veut le rendez-vous stratégique de la diaspora pour mobiliser talents, investissements et réseaux au service du développement économique de la Côte d'Ivoire. \n\n📆  Rencontrez notre équipe le 7 juillet à Paris pour découvrir les opportunités de la prochaine cohorte et échanger concrètement sur les perspectives professionnelles en Côte d'Ivoire. 🇨🇮 (Places limitées : https://luma.com/jpvjvzp8)","pid":"7475869992379559936","chars":1002,"hashtags":0,"mentions":2,"link":true,"question":false,"lang":"FR","theme":"Partenaires & institutions"},{"date":"2026-06-27","month":"2026-06","weekday":"Samedi","hour":6,"reactions":59,"comments":0,"reposts":4,"eng":63,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_une-soir%C3%A9e-trois-communaut%C3%A9s-des-rencontres-activity-7476514656946171904-Z0y1?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Une soirée, trois communautés, des rencontres qui comptent. Le 17 juin, au Mstudio d'Abidjan, Diaspora Connect, ASPA Paris Campus Sciences Po et PariBabi se sont réunis pour une so","text":"Une soirée, trois communautés, des rencontres qui comptent.\n\nLe 17 juin, au Mstudio d'Abidjan, Diaspora Connect, ASPA Paris Campus Sciences Po et PariBabi se sont réunis pour une soirée animée marquée par des témoignages forts : des talents formés en Europe, revenus en Côte d'Ivoire et pleinement insérés professionnellement, ainsi que des membres Paribabi et de l'ASPA qui ont trouvé des opportunités concrètes grâce à la force du réseau.\n\nUn message est ressorti avec clarté : la Côte d'Ivoire est un pays d'hospitalité, d'avenir, riche en opportunités d'affaires, en entrepreneuriat et en emploi accessibles à ceux qui auront la capacité d'établir les bonnes stratégies de réseau et de positionnement pour les obtenir.\n\nLa soirée s'est terminée comme il se doit autour de cocktails et d'échanges spontanés, le meilleur cadre pour tisser de nouveaux liens. 🍹🤝\n\nSouleymane Diallo Baptiste Heintz Hélène Cuny-Coulibaly","pid":"7476514656946171904","chars":919,"hashtags":0,"mentions":7,"link":false,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-06-30","month":"2026-06","weekday":"Mardi","hour":6,"reactions":20,"comments":2,"reposts":6,"eng":28,"media":"file","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_opportunit%C3%A9s-%C3%A0-saisir-en-c%C3%B4te-divoire-activity-7477601922590408705-v7ol?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"[OPPORTUNITÉ START-UPS] Et si votre prochain défi, c'était de construire la tech qui fait avancer l'Afrique de l'Ouest ? En attendant l'ouverture de la 3ᵉ cohorte Diaspora Connect,","text":"[OPPORTUNITÉ START-UPS] Et si votre prochain défi, c'était de construire la tech qui fait avancer l'Afrique de l'Ouest ?\n\nEn attendant l'ouverture de la 3ᵉ cohorte Diaspora Connect, deux de nos startups partenaires ouvrent des postes clés. Elles cherchent des talents prêts à bâtir, pas juste à observer. 👇\n\n📍 Revvo , le Back Market de l'Afrique francophone.\nElle démocratise l'accès aux équipements informatiques reconditionnés, fiables et à prix juste. Le poste pour accélérer :\n🔧 Head of Operations\n\n📍 Yelema, la startup qui rend l'IA accessible aux entreprises d'Afrique de l'Ouest.\nElle déploie des agents IA qui font tourner leur quotidien. Les postes pour écrire la suite :\n📈 Head of Business Development\n🤝 Account Manager\n💻 Chief Technology Officer (CTO)\n\nRevvo et Yelema sont deux startups accompagnées et financées par Mstudio, le startup studio qui représente plus de 60% des levées de fonds en Côte d'Ivoire.\n\nEnvie de rejoindre une aventure à fort impact, en pleine croissance, en Côte d'Ivoire ? C'est le moment.\n\nLiens de candidature ci-dessous:\n🔗  Head of Operations REVVO https://lnkd.in/eQrUP6Bh\n🔗  Head of Business Development YELEMA https://lnkd.in/eRcsn_Eb\n🔗 Account Manager YELEMA https://lnkd.in/ea_BvuUE\n🔗 Chief Technology Officer (CTO) YELEMA https://lnkd.in/eeFSmRb4","pid":"7477601922590408705","chars":1292,"hashtags":0,"mentions":1,"link":true,"question":true,"lang":"FR","theme":"Candidatures & postes"},{"date":"2026-06-30","month":"2026-06","weekday":"Mardi","hour":16,"reactions":16,"comments":0,"reposts":1,"eng":17,"media":"video","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_agenda-notre-partenaire-cepici-officiel-activity-7477756852630458368-d4GB?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"[AGENDA 📆] Notre partenaire CEPICI Officiel , le Centre de Promotion des Investissements en Côte d'Ivoire (CEPICI) ira à la rencontre de la diaspora ivoirienne et africaine au Cana","text":"[AGENDA 📆] Notre partenaire CEPICI Officiel ,  le Centre de Promotion des Investissements en Côte d'Ivoire (CEPICI) ira à la rencontre de la diaspora ivoirienne et africaine au Canada pour un moment d'échanges dédié aux opportunités d'investissement en Côte d'Ivoire. \n\nVous êtes au Canada ? Participez au \"Roadshow Diaspora Canada 2026\" , une initiative qui s’annonce riche en opportunités et en rencontres enrichissantes.\nAu programme : découverte des dispositifs d'accompagnement, rencontre avec les équipes et échanges avec les partenaires autour des secteurs porteurs de l'économie ivoirienne.\n\n📍𝐌𝐨𝐧𝐭𝐫é𝐚𝐥 — 𝟏𝐞𝐫 𝐣𝐮𝐢𝐥𝐥𝐞𝐭 𝟐𝟎𝟐𝟔 | 𝟏𝟑𝐡𝟎𝟎 – 𝟏𝟕𝐡𝟎𝟎𝐀𝐥𝐭 𝐇ô𝐭𝐞𝐥 – 𝟏𝟐𝟎 𝐑𝐮𝐞 𝐏𝐞𝐞𝐥, 𝐌𝐨𝐧𝐭𝐫é𝐚𝐥, 𝐐𝐂 𝐇𝟑𝐂 𝟎𝐋𝟖\n 📍𝐓𝐨𝐫𝐨𝐧𝐭𝐨 — 𝟒 𝐣𝐮𝐢𝐥𝐥𝐞𝐭 𝟐𝟎𝟐𝟔 | 𝟏𝟑𝐡𝟎𝟎 – 𝟏𝟕𝐡𝟎𝟎𝐍𝐨𝐯𝐨𝐭𝐞𝐥 𝐓𝐨𝐫𝐨𝐧𝐭𝐨 𝐂𝐞𝐧𝐭𝐫𝐞 – 𝟒𝟓 𝐓𝐡𝐞 𝐄𝐬𝐩𝐥𝐚𝐧𝐚𝐝𝐞\n\nPour toute information complémentaire, contactez :\n ✉️ 𝐏𝐚𝐫 𝐞-𝐦𝐚𝐢𝐥\n• aziz.yao@cepici.ci \n• emmanuelle.diallo@cepici.ci \n 📱𝐏𝐚𝐫 𝐖𝐡𝐚𝐭𝐬𝐀𝐩𝐩\n• +225 05 76 04 70 07 \n• +225 01 03 64 45 59","pid":"7477756852630458368","chars":954,"hashtags":0,"mentions":1,"link":false,"question":false,"lang":"FR","theme":"Partenaires & institutions"},{"date":"2026-07-04","month":"2026-07","weekday":"Samedi","hour":6,"reactions":18,"comments":0,"reposts":1,"eng":19,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diasporaconnect-activity-7479051371036663808-mcJv?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Diaspora Connect, Et après ? Aujourd'hui se tient le Career Day de Diaspora Connect, une étape clé du parcours d'accompagnement proposé aux talents de notre programme souhaitant po","text":"Diaspora Connect, Et après ?\n\nAujourd'hui se tient le Career Day de Diaspora Connect, une étape clé du parcours d'accompagnement proposé aux talents de notre programme souhaitant poursuivre leur carrière en Côte d'Ivoire.\n\nCette journée a été conçue pour permettre aux bénéficiaires de confronter leur projet professionnel aux réalités du marché de l'emploi ivoirien et de bénéficier de retours concrets de la part de professionnels du recrutement.\n\nAu programme :\n• une masterclass dédiée aux clés d'une intégration professionnelle maîtrisée et d'un positionnement réussi ;\n• un exercice de pitch permettant à chaque participant de présenter son parcours et son projet ;\n• des entretiens individuels avec des Directrices RH, recruteurs et experts RH issus d'entreprises partenaires.\n\nNous remercions chaleureusement les entreprises et professionnels RH qui ont accepté de consacrer une partie de leur temps à cet exercice, contribuant ainsi à une meilleure connexion entre les talents de la diaspora et les besoins des organisations implantées en Côte d'Ivoire : Anne-Emmanuelle DESANTI , Stéphane ZOLA , Eline Ndinga , Aurel YAO , Didier MONTSON , Marina Tieni ✨ et Aude-Ellen Coffie\n\n#DiasporaConnect Leïla RICHARD - TOUMA Grey Search Africa","pid":"7479051371036663808","chars":1244,"hashtags":1,"mentions":10,"link":false,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-07-04","month":"2026-07","weekday":"Samedi","hour":8,"reactions":25,"comments":0,"reposts":1,"eng":26,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diaspora-connect-et-apr%C3%A8s-aujourdhui-activity-7479081586857050112--_U-?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Diaspora Connect, Et après ? Aujourd'hui se tient le Career Day de Diaspora Connect, une étape clé du parcours d'accompagnement proposé aux talents de notre programme souhaitant po","text":"Diaspora Connect, Et après ?\n\nAujourd'hui se tient le Career Day de Diaspora Connect, une étape clé du parcours d'accompagnement proposé aux talents de notre programme souhaitant poursuivre leur carrière en Côte d'Ivoire.\n\nCette journée a été conçue pour permettre aux bénéficiaires de confronter leur projet professionnel aux réalités du marché de l'emploi ivoirien et de bénéficier de retours concrets de la part de professionnels du recrutement.\n\nAu programme :\n• une masterclass dédiée aux clés d'une intégration professionnelle maîtrisée et d'un positionnement réussi, animée par Kathleen Aumercier ;\n• un exercice de pitch permettant à chaque participant de présenter son parcours et son projet ;\n• des entretiens individuels avec des Directrices RH, recruteurs et experts RH issus d'entreprises partenaires.\n\nUn grand merci à Kathleen Aumercier ✨ d'ouvrir cette journée en partageant son expérience et ses conseils pour aider les participants à mieux appréhender les attentes du marché ivoirien et à construire une stratégie de carrière durable.\n\nNous remercions également les entreprises et professionnels RH qui ont accepté de consacrer une partie de leur temps à cet exercice, contribuant ainsi à une meilleure connexion entre les talents de la diaspora et les besoins des organisations implantées en Côte d'Ivoire.","pid":"7479081586857050112","chars":1325,"hashtags":0,"mentions":2,"link":false,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-07-07","month":"2026-07","weekday":"Mardi","hour":21,"reactions":29,"comments":0,"reposts":0,"eng":29,"media":"file","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_meetup-paris-activity-7480378954823163904-Gheo?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🇫🇷 Ce soir, Diaspora Connect est à Paris ! Nous avons le plaisir de vous réunir pour une soirée d'échanges consacrée aux opportunités de carrière en Côte d'Ivoire. Cette rencontre ","text":"🇫🇷 Ce soir, Diaspora Connect est à Paris !\n\nNous avons le plaisir de vous réunir pour une soirée d'échanges consacrée aux opportunités de carrière en Côte d'Ivoire.\n\nCette rencontre sera l'occasion de découvrir les résultats de Diaspora Connect, d'entendre les témoignages de nos anciens participants Anaïs Mwamba , Marilou Soumah & Enock NDONGALA , d'échanger avec des entreprises qui recrutent et de répondre à toutes les questions de celles et ceux qui envisagent de poursuivre leur parcours professionnel en Côte d'Ivoire dès 2027.\n\nNous aurons également l'honneur d'accueillir Son Excellence Monsieur le Consul Général de Côte d'Ivoire à Paris Issiaka Konate , qui ouvrira cette soirée placée sous le signe de la mobilité des talents, du retour et de la coopération entre la diaspora et la Côte d'Ivoire.\n\nMerci à l' ESCP Business School pour son accueil, ainsi qu'à l'ensemble de nos partenaires et des associations de grandes écoles mobilisées à nos côtés notamment Esther BOUA, Promotrice de l'evenement Le Grand Retour de la Diaspora.\n\nRendez-vous ce soir ! 🇨🇮✨\n#DiasporaConnect #Paris","pid":"7480378954823163904","chars":1094,"hashtags":2,"mentions":6,"link":false,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-07-23","month":"2026-07","weekday":"Jeudi","hour":8,"reactions":61,"comments":1,"reposts":1,"eng":63,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diasporaconnect-activity-7485967228887195648-Hpk2?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Retour sur la masterclass Diaspora Connect : mieux comprendre le marché ivoirien pour construire son projet professionnel 🇨🇮🌍 Dans le cadre du Career Day de la cohorte 2 de Diaspor","text":"Retour sur la masterclass Diaspora Connect : mieux comprendre le marché ivoirien pour construire son projet professionnel 🇨🇮🌍\n\nDans le cadre du Career Day de la cohorte 2 de Diaspora Connect, nos talents ont participé à une masterclass dédiée aux enjeux d’intégration professionnelle et aux clés pour réussir son retour en Côte d’Ivoire.\n\nAnimée par Kathleen Aumercier ✨ Aumercier, cette session a permis aux participants de mieux appréhender :\n✨ les attentes des entreprises et du marché de l’emploi ivoirien ;\n ✨ les leviers pour se présenter et valoriser son parcours international ;\n ✨ l’importance du positionnement professionnel dans une démarche de mobilité.\n\nAu-delà du partage d’expérience, cette masterclass a été un véritable moment d’échange permettant aux talents de prendre du recul sur leur projet.\n\nUn grand merci à Kathleen Aumercier pour sa disponibilité, ses conseils précieux et son engagement auprès des talents de Diaspora Connect.\n#DiasporaConnect","pid":"7485967228887195648","chars":970,"hashtags":1,"mentions":2,"link":false,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-07-24","month":"2026-07","weekday":"Vendredi","hour":8,"reactions":66,"comments":0,"reposts":4,"eng":70,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diasporaconnect-activity-7486329594611146752-CQvp?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Career Day Diaspora Connect : connecter les talents aux opportunités professionnelles en Côte d’Ivoire 🇨🇮🌍 Le Career Day de la cohorte 2 de Diaspora Connect a également été marqué ","text":"Career Day Diaspora Connect : connecter les talents aux opportunités professionnelles en Côte d’Ivoire 🇨🇮🌍\n\nLe Career Day de la cohorte 2 de Diaspora Connect a également été marqué par une série d’entretiens individuels entre nos talents et des professionnelles du recrutement et des ressources humaines.\n\nCette journée a offert aux participants l’opportunité de :\n✨ présenter leur parcours et leur projet professionnel ;\n ✨ bénéficier de retours personnalisés sur leur CV et leur positionnement ;\n ✨ mieux comprendre les attentes des employeurs en Côte d’Ivoire ;\n ✨ élargir leur réseau et identifier de nouvelles perspectives professionnelles.\n\nNous remercions chaleureusement les recruteurs et expertes RH qui ont accepté d’accompagner cette étape clé du parcours :\n🤝 Anne-Emmanuelle DESANTI\n 🤝 Stéphane ZOLA\n 🤝 Eline Ndinga\n 🤝 Aurel YAO\n 🤝 Didier MONTSON\n 🤝 Marina Tieni ✨\n 🤝 Grey Search Africa\n\nBravo aux volontaires bénéficiaires de la cohorte qui ont géré la coordination et la logistique de l'événement R. Estelle N. et Mayqueen GBEDO\n\n#DiasporaConnect","pid":"7486329594611146752","chars":1060,"hashtags":1,"mentions":10,"link":false,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-07-31","month":"2026-07","weekday":"Vendredi","hour":9,"reactions":32,"comments":0,"reposts":1,"eng":33,"media":"video","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diasporaconnect-diaspora-afriquefrancophone-activity-7488881238355812352-cihW?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🌍 On parle beaucoup des milliards que la diaspora envoie. Beaucoup moins des compétences qu'elle pourrait rapatrier. C'est le message porté par Leslie Ossete, cofondatrice de Mstud","text":"🌍 On parle beaucoup des milliards que la diaspora envoie. Beaucoup moins des compétences qu'elle pourrait rapatrier.\n\nC'est le message porté par Leslie Ossete, cofondatrice de Mstudio, sur le plateau d'« Aux avant-postes » avec Laïdi Ali, journaliste à FRANCE 24, enregistré aux Rencontres Économiques d'Aix-en-Provence.\n\nSon constat tient en une phrase : la diaspora africaine est prête à contribuer bien plus qu'avant, et ce qui manque aujourd'hui, ce ne sont pas les intentions, ce sont les mécanismes.\n\n💸 Les transferts financiers de la diaspora dépassent désormais les flux d'investissement des bailleurs de fonds. On sait faire circuler l'argent, on ne sait pas encore faire circuler l'expertise.\n\n🎓 Et à l'heure où le numérique et l'intelligence artificielle redessinent les économies, tout repose sur une même condition : disposer des compétences pour construire et produire nous-mêmes. Comme elle l'a rappelé sur le plateau, c'est maintenant que ça se joue.\n\nCe mécanisme, c'est exactement ce que nous construisons.\n\nDiaspora Connect est le programme de la Fondation Mstudio qui organise le retour des talents de la diaspora vers la Côte d'Ivoire. Un parcours :\n\n✔ Une immersion professionnelle de 4 à 6 mois en entreprise ivoirienne, qui débouche sur un contrat\n✔ Un atterrissage pris en charge : billet, visa, logement, semaine d'intégration\n✔ Un réseau d'entreprises d'accueil, en majorité dans le numérique\n✔ Des partenariats avec des grandes écoles en France et en Côte d'Ivoire\n\n🤝 Ce travail est rendu possible par le soutien du ministère de l'Europe et des Affaires étrangères, à travers le Fonds Équipe France+, et par l'accompagnement de l'Ambassade de France en Côte d'Ivoire, engagés auprès du programme depuis son lancement.\n\nNous continuons à structurer le retour des compétences, entreprise par entreprise, talent par talent.\n\nLes transferts d'argent font vivre. Le transfert de compétences fait construire.\n\n#DiasporaConnect #Diaspora #AfriqueFrancophone #CôteDIvoire","pid":"7488881238355812352","chars":1991,"hashtags":4,"mentions":3,"link":false,"question":false,"lang":"FR","theme":"Convictions & diaspora"},{"date":"2026-08-04","month":"2026-08","weekday":"Mardi","hour":14,"reactions":19,"comments":3,"reposts":0,"eng":22,"media":"video","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_businesstrip2026-activity-7490406243182747649-2DIb?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🎥 Business Trip des African Professionals – Retour en images sur la visite du Mstudio 🌍 Le Business Trip des African Professionals réunissait en avril dernier une délégation de pro","text":"🎥 Business Trip des African Professionals – Retour en images sur la visite du Mstudio\n\n🌍 Le Business Trip des African Professionals réunissait en avril dernier une délégation de professionnels et entrepreneurs de la diaspora pour une immersion terrain en Côte d'Ivoire. Au-delà du networking classique, l'objectif est de confronter les participants à la réalité de l'écosystème entrepreneurial local, à travers des rencontres et des visites d'entreprises à fort impact.\n\n🚀 C'est dans cette dynamique que la délégation des AP a été accueillie chez Mstudio, le premier startup studio d'Afrique francophone axé sur la technologie mobile. \nLa visite a aussi été le moment de découvrir Diaspora Connect, notre programme opéré au sein de La Fondation Mstudio, qui mobilise les talents de la diaspora africaine et les connecte à l'écosystème ivoirien via un parcours d'immersion professionnelle.\n\nChristian Nsiona \n#BusinessTrip2026","pid":"7490406243182747649","chars":925,"hashtags":1,"mentions":5,"link":false,"question":false,"lang":"FR","theme":"Convictions & diaspora"},{"date":"2026-08-06","month":"2026-08","weekday":"Jeudi","hour":11,"reactions":10,"comments":0,"reposts":1,"eng":11,"media":"file","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_postes-%C3%A0-pourvoir-yelema-activity-7491089449905401856-dyqL?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"[OPPORTUNITÉ START-UPS] Et si votre prochain défi, c'était de construire la tech qui fait avancer l'Afrique de l'Ouest ? En attendant l'ouverture de la 3ᵉ cohorte Diaspora Connect,","text":"[OPPORTUNITÉ START-UPS] Et si votre prochain défi, c'était de construire la tech qui fait avancer l'Afrique de l'Ouest ?\n\nEn attendant l'ouverture de la 3ᵉ cohorte Diaspora Connect, une de nos startups partenaires ouvrent des postes clés. Elles cherchent des talents prêts à bâtir. 👇\n\n🚀  Yelema, la startup qui rend l'IA accessible aux entreprises d'Afrique de l'Ouest. Elle déploie des agents IA qui font tourner leur quotidien. Les postes à pourvoir sont :\n💻 Chief Technology Officer (CTO)\n📈 Head of Business Development\n\nYelema est une startup accompagnée et financée par Mstudio, le startup studio qui représente plus de 60% des levées de fonds en Côte d'Ivoire.\n\nEnvie de rejoindre une aventure à fort impact, en pleine croissance, en Côte d'Ivoire ? C'est le moment.\n\nLiens de candidature ci-dessous:\n🔗 Chief Technology Officer (CTO) YELEMA https://lnkd.in/eeFSmRb4\n🔗 Head of Business Development YELEMA https://lnkd.in/eRcsn_Eb","pid":"7491089449905401856","chars":934,"hashtags":0,"mentions":1,"link":true,"question":true,"lang":"FR","theme":"Candidatures & postes"},{"date":"2026-08-10","month":"2026-08","weekday":"Lundi","hour":8,"reactions":50,"comments":1,"reposts":3,"eng":54,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_meet-africa-lancement-dun-appel-%C3%A0-projets-activity-7492490119904575488-JeS-?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚀 [MEET Africa] Lancement d’un appel à projets à destination des structures d’accompagnement à l’entrepreneuriat de notre partenaire MEET Africa ! Vous êtes une structure d'accompa","text":"🚀 [MEET Africa] Lancement d’un appel à projets à destination des structures d’accompagnement à l’entrepreneuriat de notre partenaire MEET Africa !\n\nVous êtes une structure d'accompagnement (incubateurs, accélérateurs, associations, réseaux d'accompagnement, entreprises ou autres acteurs spécialisés) capables de concevoir et mettre en œuvre un programme d'accompagnement technique et financier pour des entrepreneur-e-s des diasporas africaines.\n\n🎯 L'objectif : accompagner le développement d'entreprises à impact social et environnemental portées par des entrepreneur-e-s des diasporas au Cameroun, en Côte d'Ivoire, au Maroc, au Sénégal et en Tunisie.\n\nLes partenaires doivent être capables de :\n ✅ identifier et sélectionner des entrepreneur-e-s diasporiques ;\n ✅ proposer un accompagnement technique de qualité, adapté aux besoins spécifiques des entrepreneur-e-s diasporiques ;\n ✅ gérer un dispositif de soutien financier au bénéfice des entreprises sélectionnées ;\n ✅ contribuer au renforcement d'un entrepreneuriat à impact, avec une attention particulière portée aux femmes entrepreneures.\n\n📣 Vous êtes une structure d'accompagnement et souhaitez contribuer à cette dynamique entre l'Europe et l'Afrique ? Ne manquez pas cette opportunité !\n\n🔗 Toutes les informations et les modalités de candidature sont disponibles ici : https://lnkd.in/evc6Tpya \n\nMEET Africa (phase 3) est financé par l’ AFD - Agence Française de Développement et la Région Île-de-France, et mis en œuvre par Expertise France.","pid":"7492490119904575488","chars":1505,"hashtags":0,"mentions":6,"link":true,"question":true,"lang":"FR","theme":"Convictions & diaspora"},{"date":"2026-08-26","month":"2026-08","weekday":"Mercredi","hour":14,"reactions":51,"comments":1,"reposts":1,"eng":53,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_cohorte3-diasporaconnect-activity-7498392452060405761-twhY?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"[Activité mensuelle #Cohorte3] 🇨🇮 Retour sur notre visite au VITIB SA ! Vendredi 21 août, la Cohorte 3 de Diaspora Connect a eu l'honneur d'être accueillie au VITIB S.A. (Village d","text":"[Activité mensuelle #Cohorte3] 🇨🇮 Retour sur notre visite au VITIB SA !\n\nVendredi 21 août, la Cohorte 3 de Diaspora Connect  a eu l'honneur d'être accueillie au VITIB S.A. (Village des Technologies de l'Information et de la Biotechnologie).\nUne immersion riche au cœur de l'innovation ivoirienne :\n 🔹 Présentation du rôle stratégique du VITIB dans l'écosystème tech & innovation\n 🔹 Échanges avec la Direction sur la vision et les opportunités offertes aux entreprises\n 🔹 Visite des infrastructures : Data Center de  ST DIGITAL et visite des différents chantiers en cours\n\nUn grand merci à Monsieur Mebeti Dosso , Nicaise DOUKA , Aicha Dosso, Loukman Konaté , Go Ange Morel Kader, Pagielle KOUADIO , Valerie ZOHE du VITIB S.A. et à toute l'équipe de ST DIGITAL ( Yann-Gabriel N'ZI , Yves Samen , BEUGRE Affi Paulin )  pour leur accueil chaleureux et la qualité des échanges. Cette rencontre illustre parfaitement l'esprit d'innovation de l'écosystème ivoirien. \n\n#DiasporaConnect","pid":"7498392452060405761","chars":978,"hashtags":2,"mentions":14,"link":false,"question":false,"lang":"FR","theme":"Cohorte & immersion"},{"date":"2026-08-28","month":"2026-08","weekday":"Vendredi","hour":9,"reactions":25,"comments":1,"reposts":2,"eng":28,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_agenda-abidjan-notre-partenaire-le-activity-7499033762286989313-qhJ9?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"[AGENDA - 📍Abidjan ] Notre partenaire le RBP-CI - Réseau des bénéficiaires de la Bourse de la Présidence de Côte d’Ivoire vous donne rendez-vous pour son événement annuel, le rende","text":"[AGENDA - 📍Abidjan ] Notre partenaire le RBP-CI - Réseau des bénéficiaires de la Bourse de la Présidence de Côte d’Ivoire vous donne rendez-vous pour son événement annuel, le rendez-vous des Boursier 🇨🇮🎓\n\nUn moment de rencontre et de partage autour des parcours d’excellence, avec les boursiers, anciens boursiers, futurs bénéficiaires et partenaires autour d’un enjeu essentiel : bien s’orienter et construire son parcours académique et professionnel.\n\n📅 29/08/2026\n📍 MStudio - Abidjan\n🕒 13h30 à 18h\n👉🏾 Inscription obligatoire : https://lnkd.in/eH38fazu\n\nN’hésitez pas à partager l’information autour de vous, notamment aux étudiants et jeunes qui pourraient être intéressés.\n\nOn vous attend nombreux !","pid":"7499033762286989313","chars":703,"hashtags":0,"mentions":0,"link":true,"question":false,"lang":"FR","theme":"Portraits & témoignages"},{"date":"2026-09-01","month":"2026-09","weekday":"Mardi","hour":8,"reactions":25,"comments":1,"reposts":0,"eng":26,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_partenaire-officiel-et-si-votre-prochain-activity-7500468104783732736-0Aqk?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"[PARTENAIRE OFFICIEL] Et si votre prochain voyage était aussi un investissement sur votre avenir ? Nous sommes ravis d'être partenaire de l'initiative \" Le Grand retour de la Diasp","text":"[PARTENAIRE OFFICIEL] Et si votre prochain voyage était aussi un investissement sur votre avenir ?\n\nNous sommes ravis d'être partenaire de l'initiative \" Le Grand retour de la Diaspora\". \n\nDans le même esprit que la semaine d'immersion de notre programme, notre partenaire Le Grand Retour de la Diaspora, organise une semaine de séjour en Côte d’Ivoire pour rencontrer des partenaires d’affaires ou professionnels, découvrir des opportunités d’investissement concrètes, comprendre les réalités du terrain et construire des projets durables.\n\nDu 23 au 30 octobre 2026, entrepreneurs, investisseurs et talents de la diaspora se retrouvent à Abidjan.\n\nPrêt à vivre une expérience qui peut changer votre trajectoire ?\nDécouvrez le programme sur https://lnkd.in/eMKck-YJ","pid":"7500468104783732736","chars":765,"hashtags":0,"mentions":0,"link":true,"question":true,"lang":"FR","theme":"Cohorte & immersion"},{"date":"2026-09-08","month":"2026-09","weekday":"Mardi","hour":8,"reactions":145,"comments":1,"reposts":24,"eng":170,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_j-10-les-candidatures-de-la-troisi%C3%A8me-activity-7502999385853677571-9KkK?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"[🗳️J-10] Les candidatures de la troisième cohorte de Diaspora Connect ouvrent dans dix jours 🌍 Le programme Diaspora Connect, c'est au minimum 4 mois à Abidjan dans une startup ou ","text":"[🗳️J-10] Les candidatures de la troisième cohorte de Diaspora Connect ouvrent dans dix jours 🌍\n\nLe programme Diaspora Connect, c'est au minimum 4 mois à Abidjan dans une startup ou entreprise innovante. Une mission concrète, pour un vrai impact. Pour certains, ce sera même le début d'une installation durable en Côte d'Ivoire.\n\nLe programme s'adresse aux talents de la diaspora : étudiants en fin d'études ou en césure, jeunes diplômés, professionnels intermédiaires ou confirmés… qui veulent contribuer à la transformation de l'économie ivoirienne depuis l'intérieur.\n\nCe qui est pris en charge : billet d'avion ✈️, visa 📂, logement 🏠 pendant 4 mois, et une semaine d'immersion à l'arrivée pour décrypter l'écosystème local avant même de commencer.\n\nCe programme est porté par la Fondation MStudio en collaboration avec l’Ambassade de France en Côte d’Ivoire et le Ministère de l’Europe et des Affaires étrangères de France. 🇫🇷🇨🇮\n\n🗓️ Candidatures ouvertes du 18 septembre au 18 octobre 📍 Prévoir une arrivée en Côte d'Ivoire : le week-end du 16 janvier à Abidjan 🔗 https://lnkd.in/eEwqYDvg","pid":"7502999385853677571","chars":1091,"hashtags":0,"mentions":0,"link":true,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-09-16","month":"2026-09","weekday":"Mercredi","hour":14,"reactions":50,"comments":0,"reposts":1,"eng":51,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diasporaconnect-ferili-activity-7505993191662239744-1eVy?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🌍 Retour sur notre Afterwork Ferili Côte d'Ivoire x Diaspora Connect : quand les parcours se rencontrent ✨ Jeudi 10 septembre, la cohorte 2 de Diaspora Connect a été conviée à un a","text":"🌍 Retour sur notre Afterwork Ferili Côte d'Ivoire x Diaspora Connect : quand les parcours se rencontrent ✨\n\nJeudi 10 septembre, la cohorte 2 de Diaspora Connect a été conviée à un afterwork  chez Ferili Côte d'Ivoire, sous le thème « African Chic » 🥂\nUn rendez-vous pensé par notre bénéficiaire Patricia Assabe , Marketing & Communication Manager au sein du groupe pour créer du lien entre nos talents de la diaspora et des Cofinois au parcours inspirant, passés par l'international avant de revenir s'installer à Abidjan.\n\n💡 Au programme : des échanges sincères et concrets, des retours d'expérience riches en enseignements, et de précieux conseils pour accompagner la suite du parcours entrepreneurial de nos participants.\n🤝 Réseautage, convivialité, musique et bonne humeur étaient au rendez-vous — dans un cadre chaleureux qui a permis à chacun de tisser de nouvelles connexions.\n\nUn grand merci à Patricia Assabe, à la marraine de la cohorte Penda Sow ,  et toute l'équipe Ferili CI, et en particulier au pôle Marketing & Communication, pour leur accueil et leur générosité au sein de leurs locaux. Merci également aux Cofinois qui ont pris le temps de partager leur vécu avec authenticité : \n- Yalis Sané, DRH, Groupe Cofina \n- Mareme SENE, Chief Transformation, Technology & Marketing Officer, Groupe Cofina\n- Ousmane SADJI, Responsable Administratif et Financier, Ferili Côte d’Ivoire\n- FIENY HONORAT KOUAME, Head Support & Exploitation IT, Groupe Cofina\n- ⁠Gaël Angoula, Consultant Marketing Digital & Fondateur Growth Marketing AI\n\n #DiasporaConnect #Ferili","pid":"7505993191662239744","chars":1567,"hashtags":2,"mentions":11,"link":false,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-09-17","month":"2026-09","weekday":"Jeudi","hour":14,"reactions":59,"comments":0,"reposts":5,"eng":64,"media":"video","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_j-1-demain-les-candidatures-de-la-cohorte-activity-7506359655871291394-ip76?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"[🗳️J-1] Demain, les candidatures de la Cohorte 3 de Diaspora Connect ouvrent officiellement 🌍 Un atout du programme qui fait vraiment la différence ? La semaine d'immersion. 🔑 C'es","text":"[🗳️J-1] Demain, les candidatures de la Cohorte 3 de Diaspora Connect ouvrent officiellement 🌍\n\nUn atout du programme qui fait vraiment la différence  ? La semaine d'immersion. 🔑\n\nC'est elle, la clé de voûte de Diaspora Connect. Avant même de démarrer leur mission, les bénéficiaires vivent une semaine entière pour décrypter l'écosystème ivoirien : rencontres avec les acteurs clés de l'innovation, visites d'institutions et d'entreprises, immersion dans les dynamiques locales, prise de repères concrets sur les codes professionnels d'Abidjan.\n\nVous hésitez ? Retour sur la semaine d'immersion de la Cohorte 2 : ce moment qui transforme une arrivée en Côte d'Ivoire en un vrai point de départ. \n\n🗓️ Candidatures ouvertes du 18 septembre au 18 octobre 2026 \n 📍 Prévoir une arrivée en Côte d'Ivoire : le week-end du 16 janvier 2027 à Abidjan \n 🔗 https://lnkd.in/eEwqYDvg\n\nÀ demain !","pid":"7506359655871291394","chars":881,"hashtags":0,"mentions":0,"link":true,"question":false,"lang":"FR","theme":"Cohorte & immersion"},{"date":"2026-09-18","month":"2026-09","weekday":"Vendredi","hour":6,"reactions":6,"comments":0,"reposts":1,"eng":7,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diasporaconnect-activity-7506592998038835200-06Gl?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚨 53 offres. 30 places. C'est parti pour la Cohorte 3 de Diaspora Connect ! À midi, ce 18 septembre, les offres sont en ligne. Voici à quoi t'attendre : 📄 Contrats : 18 CDI + 5 CDD","text":"🚨 53 offres. 30 places. C'est parti pour la Cohorte 3 de Diaspora Connect !\n\nÀ midi, ce 18 septembre, les offres sont en ligne. Voici à quoi t'attendre :\n\n📄 Contrats : 18 CDI + 5 CDD + plusieurs stages\n🏢 Qui recrute : grandes entreprises, PME, start-up, ONG\n💡 Secteurs en tête : Tech · Immobilier & construction · Publicité & marketing · Finance & fintech\n🗓️ 1 semaine d'immersion pour découvrir l'écosystème ivoirien avant même d'entrer en entreprise\n\nTu es un talent de la diaspora prêt à mettre ton expertise au service de la Côte d'Ivoire ? C'est le moment. 🇨🇮\n\n📍 Publication des offres sur notre siteweb\n🔗 https://lnkd.in/eEwqYDvg\n\nAvec le soutien de la France, de l'Ambassade de France en Côte d'Ivoire et de la Fondation MStudio.\n\n#DiasporaConnect","pid":"7506592998038835200","chars":754,"hashtags":1,"mentions":0,"link":true,"question":true,"lang":"FR","theme":"Cohorte & immersion"},{"date":"2026-09-18","month":"2026-09","weekday":"Vendredi","hour":17,"reactions":75,"comments":0,"reposts":6,"eng":81,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_vous-avez-de-lexp%C3%A9rience-la-c%C3%B4te-divoire-activity-7506766662998740992-czbY?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🌍 Vous avez de l'expérience. La Côte d'Ivoire a des opportunités pour vous. Diaspora Connect ouvre les candidatures de sa Cohorte 3 pour des professionnel(le)s de la diaspora afric","text":"🌍 Vous avez de l'expérience. La Côte d'Ivoire a des opportunités pour vous.\n\nDiaspora Connect ouvre les candidatures de sa Cohorte 3 pour des professionnel(le)s de la diaspora africaine — quel que soit votre niveau de séniorité.\n\nDeux profils, un même programme :\n• Vous voulez tester le terrain le temps d'une mission → stage, CDD ou prestation.\n• Vous cherchez à vous installer durablement → CDI, avec un potentiel de continuité au-delà des 4 mois pris en charge par le programme.\n\n🏢 Postes ouverts chez Totem Experience, Djamo, Wave, Artefact, Blok, Groupe Cofina, Trenderz, PFO Immobilier, Eranove, Women's Investment Club Côte d'Ivoire, Stop au Chat Noir et d'autres entreprises innovantes.\n\n📅 Candidatures : 18 septembre → 18 octobre 2026\n📍 Départ : semaine d'immersion dès le 18 janvier 2027, prise de poste le 25 janvier 2027\n\n👉 Postulez : https://lnkd.in/eEwqYDvg\n👉 Prochain webinaire — jeudi 24 septembre, 17h (Abidjan) / 19h (Paris) : https://luma.com/cc1fr64k","pid":"7506766662998740992","chars":971,"hashtags":0,"mentions":0,"link":true,"question":false,"lang":"FR","theme":"Cohorte & immersion"},{"date":"2026-09-21","month":"2026-09","weekday":"Lundi","hour":8,"reactions":52,"comments":4,"reposts":4,"eng":60,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_d%C3%A9couvrez-comment-vivre-une-exp%C3%A9rience-activity-7507710371344932864-Rag6?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🌍 Découvrez comment vivre une expérience professionnelle en Côte d’Ivoire grâce à Diaspora Connect ! Nous organisons un webinaire pour vous présenter en détail le programme Diaspor","text":"🌍 Découvrez comment vivre une expérience professionnelle en Côte d’Ivoire grâce à Diaspora Connect !\n\nNous organisons un webinaire pour vous présenter en détail le programme Diaspora Connect porté par la Fondation Mstudio avec le soutien de l’Ambassade de France en Côte d’Ivoire, et les opportunités ouvertes pour la prochaine cohorte.\n\n📅 Jeudi 24 septembre 2026\n⏰ 19h (Paris) / 17h (Abidjan)\n📍 En ligne – inscription sur https://luma.com/cc1fr64k \n\nNe manquez pas cette opportunité d’explorer concrètement un retour structuré et accompagné vers le continent. \n\n📝 Postulez jusqu'au 18 octobre sur : https://lnkd.in/eEwqYDvg","pid":"7507710371344932864","chars":624,"hashtags":0,"mentions":0,"link":true,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-09-22","month":"2026-09","weekday":"Mardi","hour":13,"reactions":23,"comments":6,"reposts":1,"eng":30,"media":"file","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_comment-postuler-%C3%A0-diaspora-connect-activity-7508159281536626688-C8Q7?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Comment postuler à Diaspora Connect — Cohorte 3 ? Les candidatures sont ouvertes du 18 septembre au 18 octobre : plus de 60 fiches de poste dans 35 entreprises en Côte d'Ivoire, po","text":"Comment postuler à Diaspora Connect — Cohorte 3 ?\n\nLes candidatures sont ouvertes du 18 septembre au 18 octobre : plus de 60 fiches de poste dans 35 entreprises en Côte d'Ivoire, pour une prise de poste en janvier 2027.\n\nLe parcours tient en 5 étapes :\n• Parcourez les offres sur la plateforme — filtrez par secteur, contrat ou entreprise.\n• Ajoutez jusqu'à 5 offres à « Ma sélection ». C'est votre panier : le bouton se trouve tout en haut à droite du site.\n• Vérifiez votre panier, puis validez avec « Postuler avec ces X offres ».\n• Lisez le Guide du candidat avant de remplir le formulaire : il répond à l'essentiel sur le programme et sur ce qui relève de vous.\n• Remplissez le formulaire — un seul, quelle que soit votre sélection.\n\nDeux conseils que nous vous devons :\n💡 Postulez tôt. Diaspora Connect est adossé à de véritables entreprises partenaires, dont les offres ne sont pas exclusives. Certaines peuvent sélectionner leur candidat avant la clôture des candidatures.\n💡 Préparez vos entretiens. Le niveau d'exigence est réel : connaissez l'entreprise, son marché et ses produits ; soyez clair sur ce que vous venez apporter ; attendez-vous à défendre une étude de cas.\n\n🗳️ Candidatures jusqu'au 18 octobre — https://lnkd.in/exeFGBkj\n#DiasporaConnect","pid":"7508159281536626688","chars":1262,"hashtags":1,"mentions":1,"link":true,"question":false,"lang":"FR","theme":"Candidatures & postes"},{"date":"2026-09-23","month":"2026-09","weekday":"Mercredi","hour":8,"reactions":50,"comments":0,"reposts":3,"eng":53,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_save-the-date-abidjan-dreaming-activity-7508442993993904129-wYLv?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"[SAVE THE DATE ​📍 ABIDJAN 🇨🇮] Dreaming Africa : entre héritage et enjeux d'avenir ? Diaspora Connect a le plaisir de vous convier à son afterwork de clôture de la deuxième cohorte,","text":"[SAVE THE DATE ​📍 ABIDJAN 🇨🇮] Dreaming Africa : entre héritage et enjeux d'avenir ?\n\nDiaspora Connect a le plaisir de vous convier à son afterwork de clôture de la deuxième cohorte, à la croisée de l'art, de l'entrepreneuriat et des trajectoires plurielles qui façonnent l'Afrique de demain.\n\n​Le temps d'une soirée, nous croiserons nos regards sur l'identité, la société, l'économie — et sur ce que signifie construire, qu'on vienne d'ici ou d'ailleurs. Ce sera également l'occasion de revenir, en toute intimité, sur les expériences vécues par nos talents à Abidjan depuis le début de la cohorte.\n\n​📍 Fondation Charles Donwahi pour l'Art Contemporain \n📅 Vendredi 25 septembre \n🕕 17h00 – 20h30\n\n​Au programme :\n​- Avant-Première du documentaire réalisé par Nader Fakhry\n​- Talk & Débat\n​- Networking & cocktail \n\n​RSVP : Places limitées https://luma.com/6p8gcl9i\nFondation Charles Donwahi Pour l'Art Contemporain","pid":"7508442993993904129","chars":913,"hashtags":0,"mentions":3,"link":true,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-09-24","month":"2026-09","weekday":"Jeudi","hour":10,"reactions":11,"comments":0,"reposts":0,"eng":11,"media":"file","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_dreaming-africa-vendredi-25-septembre-activity-7508827924196945921-A-9B?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🌍 Dreaming Africa : entre héritage et enjeux d'avenir Le programme Diaspora Connect a le plaisir de vous convier à son afterwork de clôture de la deuxième cohorte, à la croisée de ","text":"🌍 Dreaming Africa : entre héritage et enjeux d'avenir\n\nLe programme Diaspora Connect a le plaisir de vous convier à son afterwork de clôture de la deuxième cohorte, à la croisée de l'art, de l'entrepreneuriat et des trajectoires plurielles qui façonnent l'Afrique de demain.\n\nPour cette soirée de clôture de la Cohorte 3, nous avons réuni trois voix fortes, chacune incarnant à sa manière ce que signifie construire en Afrique aujourd'hui.\n\n🎤 Nabou FallFall — Intervenante \n🎤 Renée Mariame KONATE — Maître de Cérémonie \n🎤 Stane BLEGBO — Présentation du documentaire “De la production agricole jusqu'au paiement final.”\n\nEnsemble, ils porteront le débat central de la soirée : entre héritage et enjeux d'avenir, à quoi ressemble, très concrètement, le rêve africain ?\n\n📍 Fondation Charles Donwahi pour l'Art Contemporain \n📅 Vendredi 25 septembre \n🕕 17h00 – 20h30\n\nAu programme :\n- Avant-Première du documentaire “De la production agricole jusqu'au paiement final.” réalisé par Nader Fakhry \n- Talk & Débat\n- Networking & cocktail \nRSVP : Inscription obligatoire https://luma.com/6p8gcl9i\n\nUn programme soutenu par le Fonds Équipe France+, le Ministère de l’Europe et des Affaires Étrangères et l'Ambassade de France en Côte d'Ivoire.","pid":"7508827924196945921","chars":1232,"hashtags":0,"mentions":4,"link":true,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-09-24","month":"2026-09","weekday":"Jeudi","hour":14,"reactions":22,"comments":2,"reposts":0,"eng":24,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_webinaire-d%C3%A9couvrez-ce-soir-comment-activity-7508895106230583298-IddF?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"[WEBINAIRE 💻️ ] 🌍 Découvrez ce soir comment vivre une expérience professionnelle en Côte d’Ivoire grâce à Diaspora Connect ! Nous organisons un webinaire pour vous présenter en dét","text":"[WEBINAIRE 💻️ ] 🌍 Découvrez ce soir comment vivre une expérience professionnelle en Côte d’Ivoire grâce à Diaspora Connect !\n\nNous organisons un webinaire pour vous présenter en détail le programme Diaspora Connect porté par la Fondation Mstudio avec le soutien de l’Ambassade de France en Côte d’Ivoire, et les opportunités ouvertes pour la prochaine cohorte.\n\n📅 Jeudi 24 septembre 2026\n⏰ 19h (Paris) / 17h (Abidjan)\n📍 En ligne – inscription gratuite sur Luma\n\n🌟 Pour ce nouveau rendez-vous Diaspora Connect, nous avons le plaisir d'accueillir des anciens bénéficiaires de nos cohortes.\n\nLors de ce webinaire, nous répondrons à toutes vos questions en direct avec l'équipe sur :\n- Le fonctionnement du programme\n- Le process de candidature\n- Les conditions de mission (Stage, CDD ou CDI)\n- Les modalités de prise en charge (4 mois)\n- Les réalités du marché ivoirien\n\n📝 Postulez à partir du 18 Septembre sur : https://lnkd.in/eEwqYDvg\n\nNe manquez pas cette opportunité d’explorer concrètement un retour structuré et accompagné vers le continent.","pid":"7508895106230583298","chars":1045,"hashtags":0,"mentions":0,"link":true,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-09-25","month":"2026-09","weekday":"Vendredi","hour":8,"reactions":92,"comments":1,"reposts":3,"eng":96,"media":"video","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_ce-soir-%C3%A0-la-fondation-charles-donwahi-activity-7509160148620201985-_WuB?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🎬 Ce soir, à la Fondation Charles Donwahi... Nous vous présentons Stane Blegbo, co-fondateur et COO de Djoli, la plateforme qui connecte directement les producteurs vivriers aux re","text":"🎬 Ce soir, à la Fondation Charles Donwahi...\n\nNous vous présentons Stane Blegbo, co-fondateur et COO de Djoli, la plateforme qui connecte directement les producteurs vivriers aux restaurants, maquis et hôtels de Côte d'Ivoire — du champ à l'assiette, sans intermédiaire.\n\nComme beaucoup de talents de notre écosystème, Stane a construit son parcours entre la France et la Côte d'Ivoire, avant de choisir d'ancrer son énergie entrepreneuriale à Abidjan. Avec Djoli, il s'attaque à un défi bien réel : simplifier une chaîne d'approvisionnement encore largement informelle, réduire le gaspillage, et sécuriser les revenus des producteurs locaux — une innovation récemment récompensée par le Prix Pierre Castel 2025 (Super Prix Panafricain).\n\nC'est justement ce sujet — le poids et la créativité de l'économie informelle dans la restauration ivoirienne — qu'explore notre documentaire, présenté par Stane ce soir lors de la soirée Dreaming Africa.\n\n📅 Fondation Charles Donwahi pour l'Art Contemporain.","pid":"7509160148620201985","chars":997,"hashtags":0,"mentions":0,"link":false,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-09-25","month":"2026-09","weekday":"Vendredi","hour":14,"reactions":24,"comments":2,"reposts":0,"eng":26,"media":"video","url":"https://www.linkedin.com/posts/activity-7508080271603314688-AtIX?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Et si on commençait par découvrir les entreprises… avant de découvrir leurs opportunités ? Je vous partage aujourd’hui le teaser de Inside Company Culture. Et justement, avec Diasp","text":"Et si on commençait par découvrir les entreprises… avant de découvrir leurs opportunités ?\n\nJe vous partage aujourd’hui le teaser de Inside Company Culture.\n\nEt justement, avec Diaspora Connect, la 3ᵉ cohorte est maintenant ouverte : plus de 30 opportunités sont à pourvoir en Côte d’Ivoire, en CDI, CDD et stages.\n\nSi vous êtes un talent de la diaspora et que vous envisagez une nouvelle opportunité en Côte d’Ivoire, c’est peut-être le moment de regarder ce qui est proposé.\n\n👉 Les candidatures sont ouvertes jusqu’au 18 octobre 2026.\nLe site de candidature est maintenant en ligne : https://lnkd.in/e8R7WTA6\n\nOn a hâte de découvrir vos profils !","pid":"7508080271603314688","chars":648,"hashtags":0,"mentions":2,"link":true,"question":false,"lang":"FR","theme":"Candidatures & postes"},{"date":"2026-09-26","month":"2026-09","weekday":"Samedi","hour":12,"reactions":14,"comments":2,"reposts":3,"eng":19,"media":"file","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_meet-our-team-activity-7509582896697958401-4zwH?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"[Meet our team 👋] Venez rencontrer l'équipe Diaspora Connect Pendant tout l'appel à candidatures, notre équipe vous donne rendez-vous sur 7 événements partenaires, à Paris 🇫🇷 et à ","text":"[Meet our team 👋] Venez rencontrer l'équipe Diaspora Connect\n \nPendant tout l'appel à candidatures, notre équipe vous donne rendez-vous sur 7 événements partenaires, à Paris 🇫🇷 et à Abidjan 🇨🇮. Candidats, partenaires, entreprises : venez nous poser vos questions sur le programme et votre candidature.\n \n🇫🇷 À Paris, avec Miryam MATINUA Responsable de recrutement pour la cohorte 3 : \n- AFRICA Day - 3 octobre 2026 \n- AMID 2026 par African Business Club - 24 octobre 2026 \n- African Engineers Day par AEN-African Engineers Network - 7 novembre 2026 \n- Ambition Africa by Business France - 24 et 25 novembre (en ligne)\n\n🇨🇮 À Abidjan, avec Longa Andrea MBUYAMBA, Directrice Programme.\n- LFM Summit par LFM - Du 15 au 17 octobre 2026\n- Tipping Point par Le Cercle des Pas Seuls - 17 octobre 2026\n- Le Grand Retour de la Diaspora - Du 23 au 30 octobre 2026","pid":"7509582896697958401","chars":851,"hashtags":0,"mentions":8,"link":false,"question":false,"lang":"FR","theme":"Candidatures & postes"},{"date":"2026-09-28","month":"2026-09","weekday":"Lundi","hour":16,"reactions":13,"comments":0,"reposts":2,"eng":15,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_webinaire-2-vous-avez-de-lexp%C3%A9rience-activity-7510382171195420672-7xqX?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"[WEBINAIRE #2 💻️ ] 🌍 Vous avez de l'expérience. La Côte d'Ivoire a des opportunités pour vous. Nous organisons notre second webinaire pour vous présenter en détail le programme Dia","text":"[WEBINAIRE #2 💻️ ] 🌍 Vous avez de l'expérience. La Côte d'Ivoire a des opportunités pour vous. \n\nNous organisons notre second webinaire pour vous présenter en détail le programme Diaspora Connect porté par la Fondation Mstudio avec le soutien de l’Ambassade de France en Côte d’Ivoire, et les opportunités ouvertes pour la prochaine cohorte.\n\n📅 Jeudi 01 octobre 2026\n⏰ 19h (Paris) / 17h (Abidjan)\n📍 En ligne – inscription gratuite sur Luma\n\nLors de ce webinaire, nous répondrons à toutes vos questions en direct avec l'équipe sur :\n- Le fonctionnement du programme\n- Le process de candidature\n- Les conditions de mission (Stage, CDD ou CDI)\n- Les modalités de prise en charge (4 mois)\n- Les réalités du marché ivoirien\n\n📝 Postulez du 18 Septembre au 18 octobre sur : https://lnkd.in/eEwqYDvg\n\nNe manquez pas cette opportunité d’explorer concrètement un retour structuré et accompagné vers le continent.","pid":"7510382171195420672","chars":902,"hashtags":1,"mentions":0,"link":true,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-09-29","month":"2026-09","weekday":"Mardi","hour":8,"reactions":32,"comments":0,"reposts":7,"eng":39,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_le-programme-diaspora-connect-ouvre-les-activity-7510609502254120960-wDHL?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🌍 Le programme Diaspora Connect ouvre les candidatures de sa Cohorte 3 pour des professionnel(le)s de la diaspora africaine — quel que soit votre niveau de séniorité. 💼 Plus de 60 ","text":"🌍 Le programme Diaspora Connect ouvre les candidatures de sa Cohorte 3 pour des professionnel(le)s de la diaspora africaine — quel que soit votre niveau de séniorité. \n\n💼 Plus de 60 offres sont en ligne, en CDI, en CDD et en stage, chez Djamo, Wave Mobile Money, Artefact, BLOK TECHNOLOGY, Totem Experience, COFINA Côte d'Ivoire et bien d'autres.  \n\n✈️ Le vol, le logement et le visa sont pris en charge par le programme.  \n\n📅 Les talents arrivent à Abidjan mi-janvier 2027 et démarrent leur mission le 25 janvier.  \n⏳ Les candidatures restent ouvertes jusqu'au 18 octobre.  \n👉 Les offres et le formulaire : https://lnkd.in/eEwqYDvg \n💻️  Prochain webinaire — jeudi 01 octobre, 17h (Abidjan) / 19h (Paris) : https://luma.com/9muvflco \n\nSi quelqu'un autour de vous pense à rentrer, envoyez-lui ce post.","pid":"7510609502254120960","chars":800,"hashtags":0,"mentions":0,"link":true,"question":false,"lang":"FR","theme":"Cohorte & immersion"},{"date":"2026-09-29","month":"2026-09","weekday":"Mardi","hour":10,"reactions":26,"comments":2,"reposts":2,"eng":30,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diasporaconnect-dreamingafrica-activity-7510639997755183104-X8J-?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Retour sur une soirée mémorable : la soirée Dreaming Africa par Diaspora Connect à La Fondation Donwahi ! 🌍✨ Ce vendredi 25 septembre, la Fondation Charles Donwahi pour l'Art Conte","text":"Retour sur une soirée mémorable : la soirée Dreaming Africa par Diaspora Connect à La Fondation Donwahi ! 🌍✨\n\nCe vendredi 25 septembre, la Fondation Charles Donwahi pour l'Art Contemporain a vibré au rythme d'échanges inspirants, d'émotions et de partage.\n\nEnsemble, nous nous sommes rassemblés autour d'une thématique : Dreaming Africa — entre héritage et enjeux d'avenir.\n\n📸 Au cœur de ce moment d'exception :\n\n• Avant-première documentaire : Un éclairage fascinant sur la créativité et la dynamique du secteur de la restauration en Côte d'Ivoire (produit par Nader Fakhry), présenté par Stane BLEGBO (Djoli) et modéré par Kirane Yassine. Le documentaire sera bientôt disponible en ligne.\n\n• Le Talk inspirationnel : Un débat captivant réunissant Nabou Fall et Renée Mariame KONATE. Ensemble, elles ont exploré le thème « Dreaming Africa » sous toutes ses facettes : entre la transmission de nos héritages culturels, l'impact de la diaspora et les stratégies audacieuses pour construire l'Afrique de demain.\n\n• Célébration de la Cohorte 2 : Un moment fort de témoignages croisés et de bilan après 4 mois d'immersion au cœur de l'écosystème abidjanais, mettant en valeur l'intégration de nos talents dans leurs entreprises d'accueil et dans la ville.\n\n🙏 Remerciements chaleureux :\nUn immense merci à  Yango Côte d'Ivoire (Monette Assie) pour leur contribution dans le documentaire aux côtés de Jèko (Idriss Marcial MONTHE) , ainsi qu'à la DGIE ( DIRECTION GÉNÉRALE DES IVOIRIENS DE L'EXTÉRIEUR ( DGIE) pour leur soutien précieux et leur présence aux côtés de nos initiatives.\n\n🚀 La suite commence maintenant !\nL'aventure continue et l'appel à candidatures pour la Cohorte 3 est désormais ouvert. 👉 Postulez sur https://lnkd.in/eEwqYDvg\n\n#DiasporaConnect #DreamingAfrica","pid":"7510639997755183104","chars":1770,"hashtags":2,"mentions":12,"link":true,"question":false,"lang":"FR","theme":"Candidatures & postes"},{"date":"2026-09-30","month":"2026-09","weekday":"Mercredi","hour":17,"reactions":23,"comments":0,"reposts":1,"eng":24,"media":"video","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diasporaconnect-activity-7511110180294676481-zSk8?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"[ACT LIKE Régis Bamba 🎥] Rentrer en Côte d'Ivoire sans plan… et finir par bâtir l'une des fintechs les plus en vue du continent ? 🇨🇮 En 2011, Régis Bamba rentre à Abidjan. Et il le","text":"[ACT LIKE Régis Bamba 🎥] Rentrer en Côte d'Ivoire sans plan… et finir par bâtir l'une des fintechs les plus en vue du continent ? 🇨🇮\n\nEn 2011, Régis Bamba rentre à Abidjan. Et il le reconnaît sans détour : son retour a cruellement manqué de planification. Les débuts sont complexes, l'adaptation prend du temps.\n\nMais ce qu'il découvre sur place change sa trajectoire : un potentiel immense, et des populations prêtes à adopter les solutions innovantes qu'on leur propose.\n\nDe cette conviction naît Djamo , qui utilise la technologie pour démocratiser l'inclusion financière auprès de la jeunesse francophone. En 2025, l'entreprise lève 17 millions de dollars et vise désormais l'échelle continentale, avec l'élargissement de ses services d'épargne et de crédit.\n\nDans cette vidéo, Regis revient sur son parcours de repat, avec franchise… et une touche d'humour autour des plats locaux pour conclure 😄\n\n🎬 Et ce soir, on entre chez Djamo avec Inside Company Culture une web série sur la culture d'entreprise des entreprises africaines soutenue par Diaspora Connect ! Miryam MATINUA reçoit Felicia O. Sangare pour parler de ce qui se vit vraiment en interne :\n→ Garder une culture solide dans une fintech qui grandit vite\n→ Les 30 premiers jours d'un nouveau collaborateur\n→ Les profils qui s'épanouissent chez Djamo\n→ L'impact de l'IA sur les équipes\nLa vidéo sera disponible sur les pages Youtube de Diaspora Connect  et Inside Company Culture . \n\nVous aussi, rejoignez l'entreprise en postulant au programme. 2 offres sont à pourvoir au sein de Djamo Côte d'Ivoire 😉 \nCandidatures Cohorte 3 ouvertes jusqu'au 18 octobre 👉 diaspora-connect.africa\n\n#DiasporaConnect","pid":"7511110180294676481","chars":1664,"hashtags":1,"mentions":8,"link":false,"question":false,"lang":"FR","theme":"Portraits & témoignages"}],"totals":{"n":89,"reactions":4303,"comments":109,"reposts":292,"eng":4704,"medRx":35,"avgRx":48},"months":[{"key":"2026-01","label":"Janvier","n":6,"reactions":494,"comments":9,"reposts":17,"eng":520,"me
