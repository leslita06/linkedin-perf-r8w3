:root{
  --bg:#F4F6F9; --card:#FFFFFF; --ink:#0B1220; --ink2:#2C3A4F; --muted:#5C6B82;
  --line:#E3E8EF; --soft:#EFF3F8;
  --brand:#0A66C2; --brand-d:#004182; --brand-w:#E7F0FA;
  --up:#0F9D58; --down:#D93025; --warm:#F2994A;
  --sh:0 1px 2px rgba(11,18,32,.05), 0 8px 24px rgba(11,18,32,.05);
  --sh2:0 2px 6px rgba(11,18,32,.07), 0 18px 44px rgba(11,18,32,.09);
}
@media(prefers-color-scheme:dark){
  :root{--bg:#0B0F16; --card:#131A24; --ink:#EEF3F9; --ink2:#C7D2E0; --muted:#8B9AAE;
        --line:#212C3A; --soft:#1A2330; --brand:#5BA4E8; --brand-d:#8FC4F5; --brand-w:#16283C;
        --sh:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
        --sh2:0 2px 6px rgba(0,0,0,.45), 0 18px 44px rgba(0,0,0,.5)}
}
:root[data-theme="dark"]{--bg:#0B0F16; --card:#131A24; --ink:#EEF3F9; --ink2:#C7D2E0; --muted:#8B9AAE;
  --line:#212C3A; --soft:#1A2330; --brand:#5BA4E8; --brand-d:#8FC4F5; --brand-w:#16283C;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --sh2:0 2px 6px rgba(0,0,0,.45), 0 18px 44px rgba(0,0,0,.5)}
:root[data-theme="light"]{--bg:#F4F6F9; --card:#FFFFFF; --ink:#0B1220; --ink2:#2C3A4F; --muted:#5C6B82;
  --line:#E3E8EF; --soft:#EFF3F8; --brand:#0A66C2; --brand-d:#004182; --brand-w:#E7F0FA;
  --sh:0 1px 2px rgba(11,18,32,.05), 0 8px 24px rgba(11,18,32,.05);
  --sh2:0 2px 6px rgba(11,18,32,.07), 0 18px 44px rgba(11,18,32,.09)}

*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);
  font-family:"Body",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16.5px;line-height:1.62;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 90px}
.num{font-family:"Disp","Body",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
h1,h2,h3,h4{font-family:"Disp","Body",sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.15}
a{color:inherit}
button{font:inherit;color:inherit}

/* ---------- en-tête ---------- */
.mast{margin-bottom:26px}
.brandrow{display:flex;align-items:center;gap:11px;margin-bottom:20px}
.brandrow svg{width:30px;height:30px;flex:none}
.brandrow .bn{font-family:"Disp",sans-serif;font-weight:700;font-size:17px;letter-spacing:-.02em}
.brandrow .bs{color:var(--muted);font-size:14px}
.brandrow .sp{flex:1}
.tgl{background:var(--card);border:1px solid var(--line);border-radius:99px;
  width:38px;height:38px;cursor:pointer;display:grid;place-items:center;box-shadow:var(--sh)}
.tgl svg{width:17px;height:17px}
.mast h1{font-size:clamp(30px,4.6vw,44px);margin-bottom:10px}
.mast .sub{color:var(--muted);font-size:16px;max-width:70ch}

.tabwrap{margin:24px 0 22px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.tabwrap::-webkit-scrollbar{height:0}
.tabs{display:inline-flex;gap:4px;background:var(--soft);border:1px solid var(--line);
  border-radius:99px;padding:4px}
.tab{border:0;background:none;border-radius:99px;padding:9px 17px;font-size:14.5px;
  font-weight:600;color:var(--muted);cursor:pointer;transition:.16s;white-space:nowrap;
  display:inline-flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--card);color:var(--brand);box-shadow:var(--sh)}
.tab svg{width:15px;height:15px;flex:none}

/* ---------- icônes ---------- */
svg.i{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.shead h2{display:flex;align-items:center;gap:10px}
.shead h2 svg.i{width:22px;height:22px;color:var(--brand);stroke-width:2.1}
.card h3{display:flex;align-items:center;gap:8px}
.card h3 svg.i{width:17px;height:17px;color:var(--brand)}
.hc{position:relative}
.hc svg.i{position:absolute;top:16px;right:16px;width:17px;height:17px;color:var(--muted);opacity:.6}
.act .k{display:flex;align-items:center;gap:7px}
.act .k svg.i{width:14px;height:14px}
.tp .rk svg.i{width:13px;height:13px;vertical-align:-2px;margin-right:4px}

/* ---------- cartes chiffres ---------- */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px}
.hc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;
  box-shadow:var(--sh)}
.hc b{display:block;font-family:"Disp",sans-serif;font-size:33px;font-weight:700;line-height:1.05;
  letter-spacing:-.03em}
.hc span{display:block;font-size:13.5px;color:var(--muted);margin-top:6px;font-weight:500}
.hc .d{display:block;font-size:13px;margin-top:5px;font-weight:600}

/* ---------- sections ---------- */
section{margin-top:46px}
.shead{margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;
  gap:16px;flex-wrap:wrap}
.shead h2{font-size:26px;margin-bottom:6px}
.shead p{color:var(--muted);font-size:15px;max-width:74ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
.pad{padding:20px 22px}
.note{background:var(--brand-w);border:1px solid var(--line);border-radius:16px;padding:16px 18px;
  font-size:15px;color:var(--ink2);max-width:92ch}
.note b{color:var(--ink)}

/* ---------- sujets ---------- */
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:16px}
.tp{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:var(--sh);display:flex;flex-direction:column;transition:.16s;text-align:left;
  cursor:pointer;padding:0}
.tp:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
.tp[aria-pressed="true"]{outline:2px solid var(--brand);outline-offset:-2px}
.tp .bar{height:5px}
.tp .in{padding:17px 19px 19px;display:flex;flex-direction:column;gap:11px;flex:1}
.tp .rk{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.tp h3{font-size:18px}
.tp .big{display:block;font-family:"Disp",sans-serif;font-size:34px;font-weight:700;line-height:1;letter-spacing:-.03em}
.tp .u{display:block;font-size:13.5px;color:var(--muted);font-weight:500;margin-top:5px}
.tp .st{display:flex;gap:16px;font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);
  padding-top:11px}
.tp .st b{color:var(--ink);font-weight:600}
.tp .best{font-size:14px;color:var(--ink2);background:var(--soft);border-radius:11px;padding:11px 13px;
  line-height:1.5}
.tp .best i{display:block;font-style:normal;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin-bottom:5px}

/* ---------- recommandations ---------- */
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.act{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--brand);
  border-radius:14px;padding:19px 20px;box-shadow:var(--sh)}
.act .k{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
.act h3{font-size:18px;margin:9px 0 8px}
.act p{font-size:15px;color:var(--ink2)}
.act .why{margin-top:11px;font-size:13.5px;color:var(--muted);font-weight:600}

/* ---------- tests ---------- */
.test{display:grid;grid-template-columns:1fr 128px;gap:18px;align-items:center;
  padding:17px 0;border-top:1px solid var(--line)}
.test:first-child{border-top:0}
.test h4{font-size:16px;font-weight:600;font-family:"Body",sans-serif;margin-bottom:4px;
  display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.test p{font-size:14.5px;color:var(--muted);max-width:66ch}
.test .d{font-family:"Disp",sans-serif;font-size:29px;font-weight:700;line-height:1;text-align:right;
  letter-spacing:-.03em}
.test .n{font-size:13px;color:var(--muted);text-align:right;margin-top:5px}
.up{color:var(--up)} .down{color:var(--down)}
.badge{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
  padding:3px 9px;border-radius:99px}
.b-ok{background:rgba(15,157,88,.14);color:var(--up)}
.b-weak{background:var(--soft);color:var(--muted)}

/* ---------- barres ---------- */
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.card h3{font-size:17px;margin-bottom:3px}
.card .hint{color:var(--muted);font-size:13.5px;margin-bottom:15px}
.brow{display:grid;grid-template-columns:1fr 96px 74px;gap:12px;align-items:center;padding:8px 0}
.brow .lab{font-size:14.5px;font-weight:500}
.brow .lab small{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.track{height:9px;border-radius:99px;background:var(--soft);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),var(--brand-d))}
.brow .val{text-align:right;font-weight:700;font-size:15px;font-family:"Disp",sans-serif}

/* ---------- mois ---------- */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:11px;margin-bottom:20px}
.mo{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;
  cursor:pointer;text-align:left;transition:.16s;box-shadow:var(--sh)}
.mo:hover{box-shadow:var(--sh2)}
.mo[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-w)}
.mo .mn{font-size:13px;font-weight:600;color:var(--muted)}
.mo .mv{display:block;font-family:"Disp",sans-serif;font-size:23px;font-weight:700;line-height:1.15;
  letter-spacing:-.03em}
.mo .mp{font-size:12.5px;color:var(--muted)}
.chart{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;
  box-shadow:var(--sh)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px;
  vertical-align:-1px}

/* ---------- benchmark ---------- */
.bench .scale{position:relative;height:34px;border-radius:99px;overflow:hidden;background:var(--soft);
  margin:26px 0 0}
.bench .band{position:absolute;top:0;bottom:0}
.bench .you{position:absolute;top:-5px;width:4px;height:44px;border-radius:99px;background:var(--brand);
  transform:translateX(-50%)}
.bench .yl{position:absolute;top:-30px;transform:translateX(-50%);font-size:13px;font-weight:700;

vity-7416465086174699521-YTVV?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"✨ Premier post de l’année, et pas n’importe lequel. Cette semaine marque le début de la semaine d’immersion de la cohorte 2026 de Diaspora Connect, à Abidjan. Après 200 candidature","text":"✨ Premier post de l’année, et pas n’importe lequel.\n\nCette semaine marque le début de la semaine d’immersion de la cohorte 2026 de Diaspora Connect, à Abidjan.\n\nAprès 200 candidatures reçues,\n👉 35 talents ont été sélectionnés.\n\nDes profils engagés, aux parcours variés, prêts à contribuer concrètement aux organisations partenaires et à l’écosystème.\n\nCe programme, c’est avant tout :\ndes parcours professionnels et entrepreneuriaux solides\nune diversité de profils, de pays et d’expériences\nune envie commune : s’engager, revenir, construire\n\nUn immense merci à :\ntoutes les personnes candidates 🙏\nles entreprises et organisations partenaires 🤝\nles soutiens institutionnels et l’équipe qui rendent cette aventure possible 🚀\n\nCette semaine, place au terrain, aux échanges, aux rencontres et à l’action.\n\nBravo à Longa Andrea MBUYAMBA, Kirane Yassine, Marwa Ahmed à toute la team Diaspora Connect 🙌\nBienvenue à la cohorte 2026. Akwaba 🇨🇮\n#DiasporaConnect #Innovation #Talents #Immersion #Afrique #Impact","pid":"7416465086174699521","chars":1002,"hashtags":6,"mentions":4,"link":false,"question":false,"lang":"FR","impressions":6479,"er":2.13,"convRate":0.31,"theme":"Diaspora Connect"},{"date":"2026-01-19","month":"2026-01","weekday":"Lundi","hour":13,"reactions":164,"comments":14,"reposts":8,"eng":186,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_uemoa-vcinafrica-startupafrica-activity-7419010197664460800-c7UW?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"💰 Fundraising dans l’UEMOA en 2025 : ce que disent vraiment les chiffres Top 5 pays par volumes & activité 👇 🇸🇳 Sénégal — $172M | 11 deals 🇧🇯 Bénin — $100M | 3 deals 🇹🇬 Togo — $31M","text":"💰 Fundraising dans l’UEMOA en 2025 : ce que disent vraiment les chiffres\n\nTop 5 pays par volumes & activité 👇\n🇸🇳 Sénégal — $172M | 11 deals\n🇧🇯 Bénin — $100M | 3 deals\n🇹🇬 Togo — $31M | 3 deals\n🇨🇮 Côte d’Ivoire — $28M | 20 deals\n🇲🇱 Mali — $17.7M | 2 deals\n\n📊 Lecture rapide (et utile)\nLes volumes restent très concentrés, portés par un nombre limité de transactions \nLa 🇨🇮 Côte d’Ivoire se distingue par la densité de deals, confirmant son rôle de hub opérationnel plutôt que de marché à méga-rounds\nUne partie de la zone reste hors des radars du VC, moins par manque d’opportunités que par déficit d’infrastructure et de capital early-stage\n\n👉 Le vrai sujet n’est plus combien est levé, mais la profondeur du pipeline, la qualité des fondateurs et la capacité à construire des entreprises durables.\n\n📌 La profondeur avant les headlines.\n\n📖 Pour aller plus loin sur cette lecture “au-delà des chiffres”:  \n🔗 https://lnkd.in/ewxp-Mxg\n\n#UEMOA #VCinAfrica #StartupAfrica #EarlyStage","pid":"7419010197664460800","chars":977,"hashtags":4,"mentions":0,"link":true,"question":false,"lang":"FR","impressions":10740,"er":1.73,"convRate":1.3,"theme":"Data & marché"},{"date":"2026-01-20","month":"2026-01","weekday":"Mardi","hour":11,"reactions":122,"comments":1,"reposts":8,"eng":131,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_uemoa-venturecapital-equity-activity-7419335133079433216-ItzT?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"📊 Qui investit vraiment en UEMOA ? En 2025, les levées en equity dans la sous-région racontent bien plus qu’un simple classement d’investisseurs. Elles mettent en lumière une réali","text":"📊 Qui investit vraiment en UEMOA ?\n\nEn 2025, les levées en equity dans la sous-région racontent bien plus qu’un simple classement d’investisseurs.\n\nElles mettent en lumière une réalité encore trop peu adressée :\n👉 l’Afrique francophone reste une zone largement insuffisamment couverte par le capital-risque international.\n\nDans ce contexte, le marché ne se contente pas de se financer — il se construit.\nEt cette construction repose sur des acteurs capables de créer le pipeline, réduire le risque et structurer l’accompagnement des startups, attirant ainsi du capital extérieur, notamment européen.\n\n🔎 Les investisseurs les plus actifs en equity deals en 2025 :\n🇫🇷 Digital Africa (AFD) – 4 deals\n🇨🇮 Mstudio – 3 deals\n🇫🇷 Ring Capital – 3 deals\n🇸🇳 OYASS CAPITAL– 2 deals\n🇨🇮 CDC-CI CAPITAL (Caisse des Dépôts et Consignations de Côte d’Ivoire) – 2 deals\n🇫🇷 Investisseurs & Partenaires - I&P – 2 deals\n\n🤝 Ce qui change vraiment\nLe développement du co-investissement entre structures d’accompagnement et fonds. C’est notamment le cas de 🇨🇮 Mstudio, startup studio ivoirien, et 🇫🇷 Ring Capital, fonds d’impact européen, dont le partenariat illustre une approche intégrée combinant expertise technique et financement des startups.\n\n🏛️ À saluer également\nL’engagement d’acteurs institutionnels comme 🇨🇮 CDC-CI Capital, dont l’intervention renforce la profondeur du marché, l’ancrage local du capital et la crédibilité des tours equity.\n\n💰 Par ailleurs, plusieurs VCs internationaux ont réalisé des deals equity ponctuels dans des startups plus matures comme Djamo, Kera Health, Gozem, Spiro, Jobo Interim, entre autres.\nParmi eux : IFC, Enza Capital, Axian, Janngo Capital, Partech, Catalyst, Saviu, Teranga, Noru Capital, etc.\n\n📌 La dynamique se joue maintenant.\n\nL’enjeu sera de voir davantage de business angels rejoindre le mouvement, ainsi que plus de fonds internationaux s’engager durablement sur du follow on, dans un marché qui reste, pour l’instant, très early stage.\n\n📩 Pour aller plus loin, je détaille les tendances clés qui ont marqué la tech africaine en 2025 dans ma newsletter 👇\n👉 https://lnkd.in/eDHmcH7c\n\n#UEMOA #VentureCapital #Equity #StartupStudios #ImpactInvesting","pid":"7419335133079433216","chars":2180,"hashtags":5,"mentions":6,"link":true,"question":false,"lang":"FR","impressions":9912,"er":1.32,"convRate":0.1,"theme":"Data & marché"},{"date":"2026-01-26","month":"2026-01","weekday":"Lundi","hour":12,"reactions":99,"comments":2,"reposts":3,"eng":104,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_diasporaconnect-actlike-retouraupays-activity-7421526871181316096-Rj57?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"✨ Afterwork “ACT LIKE” | Diaspora Connect Dans le cadre de la semaine d’immersion de la cohorte Diaspora Connect, nous avons organisé un Apéro Talk “ACT LIKE” au Royal Work Club. U","text":"✨ Afterwork “ACT LIKE” | Diaspora Connect\n\nDans le cadre de la semaine d’immersion de la cohorte Diaspora Connect, nous avons organisé un Apéro Talk “ACT LIKE” au Royal Work Club.\n\nUn moment d’échanges francs, où j’ai été ravie de partager un peu de mon parcours :\n💬 évoluer en tant que femme dans des industries encore très masculines,\n💬 le choix assumé du modèle startup studio,\n💬 et pourquoi Abidjan comme point d’ancrage.\n\nBeaucoup de questions, beaucoup de discussions sans filtre — et surtout des échanges utiles, concrets, et inspirants avec les talents de la diaspora.\n\nMerci à tous les mentors, Steven BEDI, Lina Kacyem, CPCU, Franck Kié, Malick Diabaté, Alexia Amichia, Aude-Marie INCHOT, Sadibou Sow pour la qualité des conversations. 🙌\n\n#DiasporaConnect #ACTLIKE  #RetourAuPays #Abidjan","pid":"7421526871181316096","chars":798,"hashtags":4,"mentions":9,"link":false,"question":false,"lang":"FR","impressions":4942,"er":2.1,"convRate":0.4,"theme":"Diaspora Connect"},{"date":"2026-01-29","month":"2026-01","weekday":"Jeudi","hour":12,"reactions":40,"comments":0,"reposts":1,"eng":41,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_ecosystem-startups-cotedivoire-activity-7422611047221469184-0_kB?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚀 Ecosystem Mixer – Côte d’Ivoire 🇨🇮 Dans le cadre d’un programme porté par Flat6Labs en partenariat avec IFC - International Finance Corporation, nous avons le plaisir d’accueilli","text":"🚀 Ecosystem Mixer – Côte d’Ivoire 🇨🇮\n\nDans le cadre d’un programme porté par Flat6Labs en partenariat avec IFC - International Finance Corporation, nous avons le plaisir d’accueillir au Mstudio un Ecosystem Mixer réunissant les acteurs clés de l’écosystème entrepreneurial.\n\n📅 Lundi 2 février\n🕠 17h30 – 20h30\n📍 Mstudio, RDC – Tour D de l’Ivoire Trade Center\n\nCe moment est pensé comme un espace de rencontres et d’échanges entre :\nstartups, investisseurs, builders, opérateurs et partenaires de l’écosystème.\n\nL’objectif : créer des connexions utiles, partager des retours d’expérience et renforcer les synergies au sein de l’écosystème ivoirien.\n\n👉 Inscription (RSVP) : https://luma.com/17aog5hn\n\nAu plaisir de vous accueillir au Mstudio pour cette soirée dédiée aux connexions de qualité ✨\n#Ecosystem #Startups #CotedIvoire #Entrepreneuriat #VC #Flat6Labs #IFC","pid":"7422611047221469184","chars":862,"hashtags":7,"mentions":3,"link":true,"question":false,"lang":"FR","impressions":2933,"er":1.4,"convRate":0.0,"theme":"Événements & écosystème"},{"date":"2026-02-23","month":"2026-02","weekday":"Lundi","hour":11,"reactions":117,"comments":2,"reposts":1,"eng":120,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_africatech-venturecapital-ai-activity-7431666032328577024-pt44?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Merci encore à TechCabal pour cette série de prédictions 2026 🙏 Parmi toutes les contributions, celles qui m’ont le plus marquée : 💰 Le retour des fondamentaux financiers Les entre","text":"Merci encore à TechCabal pour cette série de prédictions 2026 🙏\n\nParmi toutes les contributions, celles qui m’ont le plus marquée :\n💰 Le retour des fondamentaux financiers\nLes entreprises avec un bilan solide auront un vrai avantage.\n\n🤝 Plus de fusions et acquisitions\nDavantage de consolidation dans l’écosystème.\n\n⚡ L’IA va accélérer les écarts\nLes organisations performantes iront beaucoup plus vite. Les autres décrocheront plus vite aussi.\n\n🏗 Le modèle startup studio reconnu comme une vraie classe d’actifs\nPlus de structuration, moins d’improvisation.\n\n💳 La finance intégrée partout\nMême les startups non-fintech intégreront des services financiers dans leur modèle.\n\n2026 s’annonce plus mature, plus exigeante, et plus structurante pour la tech africaine.\n\n👉 Article complet : https://lnkd.in/edPhiUmj\n\n#AfricaTech #VentureCapital #AI #StartupStudio","pid":"7431666032328577024","chars":857,"hashtags":4,"mentions":1,"link":true,"question":false,"lang":"FR","impressions":4253,"er":2.82,"convRate":0.47,"theme":"Convictions & parcours"},{"date":"2026-02-24","month":"2026-02","weekday":"Mardi","hour":10,"reactions":314,"comments":56,"reposts":11,"eng":381,"media":"file","url":"https://www.linkedin.com/posts/leslieossete_r%C3%A9cap-mstudio-2025-activity-7432015146245427201-YbW-?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"3 ans déjà. Le Mstudio, c’est aujourd’hui 68% des startups ivoiriennes ayant levé en early-stage depuis 2023 🇨🇮 🚀 10 startups financées 💶 8,65M€ levés 📊 3,3M€ de revenus générés 📈 ","text":"3 ans déjà.\n\nLe Mstudio, c’est aujourd’hui 68% des startups ivoiriennes ayant levé en early-stage depuis 2023 🇨🇮 \n\n🚀 10 startups financées\n💶 8,65M€ levés\n📊 3,3M€ de revenus générés\n📈 +300% de croissance YoY\n👥 200+ emplois\n\nMais derrière les chiffres, il y a une ligne claire :\nmoderniser le secteur informel à travers des startups solides — de l’Agritech 🌾 à la Fintech 💳 en passant par la mobilité 🚗.\n\nNous cherchons l’équilibre, pas la croissance à tout prix.\n📈 Oui à la traction.\n⚖️ Oui à la discipline.\nPlusieurs startups sont déjà proches de la rentabilité.\n\nL’IA a transformé notre manière de builder. 🤖\nElle est devenue un réflexe méthodologique, un levier d’optimisation permanent, un nouveau standard.\nDésormais, chaque startup est pensée avec elle dès le départ.\n\nEt tout commence par les personnes.\nLe faire ensemble, entre diaspora et talents locaux, crée une densité d’exécution différente.\n\nTrois ans plus tard, ce que nous construisons n’est plus une expérimentation.\nC’est une méthode. 🚀","pid":"7432015146245427201","chars":1003,"hashtags":0,"mentions":1,"link":false,"question":false,"lang":"FR","impressions":13735,"er":2.77,"convRate":4.08,"theme":"Convictions & parcours"},{"date":"2026-03-02","month":"2026-03","weekday":"Lundi","hour":12,"reactions":186,"comments":4,"reposts":8,"eng":198,"media":"video","url":"https://www.linkedin.com/posts/leslieossete_ils-%C3%A9taient-plus-de-200-%C3%A0-candidater-35-activity-7434220685012619264-WrN3?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Ils étaient plus de 200 à candidater. 35 ont rejoint la première cohorte de Diaspora Connect. À Abidjan, ils ont vécu une semaine d’immersion intense : échanges sans filtre sur les","text":"Ils étaient plus de 200 à candidater.\n35 ont rejoint la première cohorte de Diaspora Connect.\n\nÀ Abidjan, ils ont vécu une semaine d’immersion intense : échanges sans filtre sur les réalités du marché ivoirien, rencontres avec des dirigeants, acteurs tech, startups et institutions, discussions concrètes sur l’entrepreneuriat, l’employabilité et les défis du terrain.\n\nMais au-delà du programme, ce qui m’a le plus marquée, c’est leur posture.\nLeur résilience.\nLeur volonté de réapprendre — et parfois de désapprendre.\nLeur capacité à s’adapter aux réalités locales.\nLeur envie sincère d’avoir un impact concret.\n\nCette cohorte confirme une chose : la diaspora africaine veut contribuer, concrètement.\n\n🌍 La Cohorte 2 est ouverte (stages académiques + opportunités en CDD/CDI)\n🗓️ Candidatures jusqu’au 25 mars 2026\n📍 Arrivée à Abidjan : 16 mai\n👉 Pour postuler : https://lnkd.in/dfHSP2vn\n🎥 Webinaire d’information (03/03) : https://luma.com/8grpaq1v","pid":"7434220685012619264","chars":949,"hashtags":0,"mentions":1,"link":true,"question":false,"lang":"FR","impressions":7811,"er":2.53,"convRate":0.51,"theme":"Diaspora Connect"},{"date":"2026-03-12","month":"2026-03","weekday":"Jeudi","hour":9,"reactions":161,"comments":9,"reposts":4,"eng":174,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_desmotsdelles-womenintech-leadershipfaezminin-activity-7437796458726113280-02AZ?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Dans le cadre du mois de mars dédié aux droits des femmes, je participe à la série Des Mots d’Elles, portée par la Fondation Sounga de Danièle Sassou Nguesso. Dans cet épisode, je ","text":"Dans le cadre du mois de mars dédié aux droits des femmes, je participe à la série Des Mots d’Elles, portée par la Fondation Sounga de Danièle Sassou Nguesso.\n\nDans cet épisode, je parle d’un sujet qui me tient particulièrement à cœur :\nla place des femmes dans la technologie et l’innovation.\n\nParce que les outils qui façonnent l’avenir ne doivent pas être construits par une seule moitié de la société.\n💡 « L’avenir se code au féminin. »\n\nMerci pour cette initiative qui donne la parole à des femmes aux parcours et aux expériences diverses.\n\n🎬 Les épisodes de Des Mots d’Elles sont à découvrir tout au long du mois de mars.\n\n#DesMotsDElles #WomenInTech #LeadershipFéminin #Innovation","pid":"7437796458726113280","chars":687,"hashtags":4,"mentions":1,"link":false,"question":false,"lang":"FR","impressions":4466,"er":3.9,"convRate":2.02,"theme":"Convictions & parcours"},{"date":"2026-03-19","month":"2026-03","weekday":"Jeudi","hour":11,"reactions":84,"comments":2,"reposts":2,"eng":88,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_entourage-cest-une-communaut%C3%A9-dentrepreneurs-activity-7440364151106895872-_3WF?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"ENTOURAGE, c’est une communauté d’entrepreneurs africains qui veulent bâtir des projets solides — pas juste de belles idées. 🤎 Mais sur le terrain, on voit une réalité : beaucoup d","text":"ENTOURAGE, c’est une communauté d’entrepreneurs africains qui veulent bâtir des projets solides — pas juste de belles idées. 🤎\n\nMais sur le terrain, on voit une réalité :\nbeaucoup de projets veulent lever des fonds… sans être encore prêts.\n👉🏾 Pitch encore flou\n👉🏾 Modèle économique fragile\n👉🏾 Mauvaise cible d’investisseurs\n\nTu veux lever, mais tu sens que ton projet n’est pas encore investor-ready ?\nC’est exactement pour ça que, avec ENTOURAGE, on organise cet atelier.\n\nUn format en petit comité, avec du feedback direct, pour t’aider à:\n✔ clarifier ton pitch\n✔ renforcer ton modèle économique\n✔ mieux cibler les bons investisseurs\n✔ rendre ton projet finançable\n\n🗓 28 mars 2026 | 14h – 17h\n📍 Mstudio, Abidjan\n🔗 https://lnkd.in/e3uJFWMh\nPlaces limitées.","pid":"7440364151106895872","chars":757,"hashtags":0,"mentions":1,"link":true,"question":false,"lang":"FR","impressions":3845,"er":2.29,"convRate":0.52,"theme":"Conseils fondateurs"},{"date":"2026-03-24","month":"2026-03","weekday":"Mardi","hour":12,"reactions":70,"comments":0,"reposts":8,"eng":78,"media":"file","url":"https://www.linkedin.com/posts/leslieossete_diasporaconnectcarrousel-activity-7442185995837460481-A3mW?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🌍 Ces postes vous attendent ! Vous êtes de la diaspora africaine et souhaitez découvrir l’écosystème de l’innovation en Côte d’Ivoire en tant que professionnel(le) ? Plusieurs entr","text":"🌍 Ces postes vous attendent !\n\nVous êtes de la diaspora africaine et souhaitez découvrir l’écosystème de l’innovation en Côte d’Ivoire en tant que professionnel(le) ?\n\nPlusieurs entreprises et startups ivoiriennes participent à notre programme Diaspora Connect, en partenariat avec le MEAE et l'Ambassade de France en Côte d'Ivoire,  pour offrir des opportunités concrètes.\n\nVoici un aperçu des entreprises partenaires qui recrutent :\n🎤 Cyber Africa Forum (CAF) (Relations Publiques)– recherche un(e) Chargé.e de projets\n♻️ COLIBA AFRICA (Cleantech & Economie circulaire) – recherche un(e) Commercial.e confirmé.e\n🎓 DigiFemmes Côte d'Ivoire (ONG) – recherche une Business Development & Partnership Engagement Associate \n\nEt bien d'autres, Artefact, Mstudio, le groupe Yeshi, Asensia, BLOK, CFAO, Djoli, Eccomob, Eranove, Epitech Côte d'Ivoire, Cofina, Flexx Africa, Gaia Nova, Greenpay, Jobo, Kinaya Ventures, Mafa Holding, PFO Immobilier, Women Investment Club (WIC), ...\n\n\n💼 À travers ce programme, vous pourrez :\n- Vous immerger dans les équipes de ces entreprises et découvrir leurs projets de l’intérieur,\n- Mettre vos compétences au service de leurs ambitions,\n- Expérimenter le quotidien professionnel en Afrique dans un cadre structuré et bienveillant.\n\n⏳ Fin des candidatures le 25/03\n👉 Postulez sur : https://lnkd.in/eAxWvD7Q","pid":"7442185995837460481","chars":1335,"hashtags":0,"mentions":1,"link":true,"question":false,"lang":"FR","impressions":8879,"er":0.88,"convRate":0.0,"theme":"Diaspora Connect"},{"date":"2026-04-03","month":"2026-04","weekday":"Vendredi","hour":8,"reactions":128,"comments":1,"reposts":0,"eng":129,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_eu-regional-business-forum-west-africa-activity-7445755669124636672-s3xm?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🌍 EU Regional Business Forum — West Africa Corridors | Abidjan Cette semaine, j'ai eu la chance de modérer une table ronde sur le topic: \"MSMEs & Startups : Drivers of Innovation f","text":"🌍 EU Regional Business Forum — West Africa Corridors | Abidjan\n\nCette semaine, j'ai eu la chance de modérer une table ronde sur le topic: \"MSMEs & Startups : Drivers of Innovation for Competitive Corridors\".\n\nEntrepreneurs, investisseurs et institutions autour de la même table pour une question centrale : comment accélérer l'innovation dans le secteur du transport et de la logistique en Afrique de l'Ouest ?\n\nTrois points qui ont marqué les échanges :\n\n📦 Les startups avancent sans attendre les conditions idéales. ✪ Stane BLEGBO (Djoli) et Zeinabou Sidibe(Afrisends) en sont la preuve directe.\n\n🤝 L'intégration des startups dans les chaînes de valeur des grands groupes est possible. David ALLIALI (Africa Global Logistics) l'a montré concrètement.\n\n💰 Le vrai enjeu du financement, c'est d'une part l'alignement des instruments avec le stade de maturité des startups, et de l'autre, l'importance d'allier l'accompagnement au financement. Dans un secteur aussi capital-intensif que le transport et la logistique, Nouss Bih (I&P), Asari Efiong (EBRD), Tamim El Zein (Seedstars Africa Ventures), et Grégoire de Padirac (Digital Africa) ont chacun posé leur lecture sur la question.\n\nMerci à Nicolas Renard (European Commission) pour l'organisation, et à Jean Van Wetter (Enabel) pour la clôture.","pid":"7445755669124636672","chars":1296,"hashtags":0,"mentions":9,"link":false,"question":false,"lang":"FR","impressions":4397,"er":2.93,"convRate":0.23,"theme":"Événements & écosystème"},{"date":"2026-04-13","month":"2026-04","weekday":"Lundi","hour":9,"reactions":128,"comments":5,"reposts":8,"eng":141,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_tech-africa-vc-activity-7449390555731578880-yOu4?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Before Flutterwave, Olugbenga Agboola studied at the University of Westminster, got his MBA at MIT Sloan, then worked at PayPal and Google. He came back to Nigeria with something m","text":"Before Flutterwave, Olugbenga Agboola studied at the University of Westminster, got his MBA at MIT Sloan, then worked at PayPal and Google.\n\nHe came back to Nigeria with something most local founders didn't have: a deep understanding of how global payment infrastructure worked — and a network that could write the first check. 🎯\n\nFlutterwave didn't just become a $3B company.\nIt created a template. The exits, the operator network — those seeded the next generation of Nigerian founders who built on top of what Olugbenga and his co-founders had proven was possible. 🔁\n\nSame story, different decade.\nBefore Nubank, David Vélez was a Sequoia partner. He saw the Brazilian banking system from the outside — as an investor, not a customer — and that distance gave him the clarity to see what locals had stopped questioning. He raised from Sequoia before writing a single line of code. 💡\n\nThe pattern repeats everywhere. 🌐\n\nDiaspora founders don't just bring talent. They bring translation — the ability to make a local problem legible to international capital.\n\nFrancophone Africa is running this sequence now — from Casablanca to Dakar, passing through Abidjan. 🌍\n\nBetween 2023 and 2025 : \n→ 🏢 194 startups across 14 markets \n→ 💰 $1.58B raised in total \n→ 📊 61.8% captured by diaspora founders\nThat's not a structural flaw. It's exactly where Lagos was in 2014, where Bangalore was in 1998, where São Paulo was in 2012. 📈\n\nFrancophone Africa's first wave is still raising — and that's exciting. The reinvestment chapter is next. 🚀\n\n🔗 Full analysis on my newsletter \"The African Operator\": https://lnkd.in/euCSTHd4\n\n#tech #africa #VC #diaspora","pid":"7449390555731578880","chars":1641,"hashtags":4,"mentions":0,"link":true,"question":false,"lang":"EN","impressions":9002,"er":1.57,"convRate":0.56,"theme":"Data & marché"},{"date":"2026-04-14","month":"2026-04","weekday":"Mardi","hour":10,"reactions":32,"comments":1,"reposts":2,"eng":35,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_tech-africa-vc-activity-7449769732985098240-Iy1O?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Yesterday I talked about the diaspora advantage — why 61.8% of Francophone Africa's startup capital went to founders educated abroad. Today, the other side of that number. Local fo","text":"Yesterday I talked about the diaspora advantage — why 61.8% of Francophone Africa's startup capital went to founders educated abroad.\n\nToday, the other side of that number.\n\nLocal founders: African entrepreneurs, educated in Africa, building in their own markets. \n\nNo foreign degree. No alumni network in Paris or Boston. No warm intro to a VC partner.\n\nThey raised 5.1% of all capital between 2023 and 2025. 💡\n\nNot because they lack talent. Because they lack access.\n\nNo credential that makes an investor pick up the phone📞 \nNo signal that converts a cold email into a meeting 📩\nNo alumni network to get the warm intro that leads to a term sheet 🤝\nAnd yet — they understand these markets better than anyone. They don't theorize about the problem. They've lived it 🎯\n\nThat gap between knowing and theorizing is worth more than any credential.\nHere's what Nigeria tells us about what comes next.\n\nIyin Aboyeji studied at the University of Waterloo. Built Andela, built Flutterwave. Two unicorns — both powered by that diaspora bridge: the international network, the foreign credential, the ability to make African markets legible to global capital. 🌍\nHe didn't stop there.\nHe launched Future Africa — a fund specifically designed to back the next generation of founders. Including those with no international network. The diaspora advantage, reinvested. 🔁\n\nThat's the full cycle. And Francophone Africa is at the very beginning of it.\nInstadeep's $446M exit. Expensya's $100M acquisition. Starting gun. Not finish line. 🚀\n\nThe founders who grew up in Dakar, Abidjan, Casablanca — educated here, rooted here — they are the second wave.\n\nThe question is whether our first wave makes the same choice Iyin did.\n\nFull analysis 👇 🔗 https://lnkd.in/euCSTHd4\n\n#tech #africa #VC #startups #diaspora","pid":"7449769732985098240","chars":1789,"hashtags":5,"mentions":0,"link":true,"question":false,"lang":"EN","impressions":1531,"er":2.29,"convRate":0.65,"theme":"Data & marché"},{"date":"2026-04-24","month":"2026-04","weekday":"Vendredi","hour":12,"reactions":245,"comments":13,"reposts":7,"eng":265,"media":"video","url":"https://www.linkedin.com/posts/leslieossete_womenintech-techivoire-repraezsentation-activity-7453414787948023808-tAMk?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"En mars, j'ai eu la chance de témoigner sur mon parcours de femme dans la tech, dans le cadre des Mots d'Elles, une initiative portée par Danièle Sassou Nguesso et la Foundation So","text":"En mars, j'ai eu la chance de témoigner sur mon parcours de femme dans la tech, dans le cadre des Mots d'Elles, une initiative portée par Danièle Sassou Nguesso et la Foundation Sounga — aux côtés d'autres femmes inspirantes. 🎤\n\nLe week-end dernier, j'ai assisté au lancement du premier Baromètre des Femmes dans la Tech en Côte d'Ivoire, porté par Abidjanaises In Tech 📊\n\nLes deux sont liés. 🔗\n\nParce que les chiffres disent exactement ce qu'on ressent sur le terrain :\n\n🟣 97 femmes interrogées\n🟣 78% ont rencontré au moins un obstacle dans leur parcours\n🟣 33% citent le manque de modèles féminins comme frein principal\n🟣 7% seulement sont entrées dans la tech grâce à un rôle modèle ou un mentor\nEt pourtant — 92% restent optimistes pour l'avenir. 💜\n\nLes femmes ne manquent pas de détermination.\nElles manquent de miroirs. 🪞\n\nC'est pour ça que témoigner compte.\nQue se montrer compte.\nQue prendre la parole — même quand on n'est pas sûre d'être légitime — compte. 💬\n\nCes femmes existent. Elles construisent. Elles avancent malgré les obstacles. ✊🏾\nIl faut juste qu'elles se voient dans celles qui sont déjà là. 🌟\n\nMerci à Danièle Sassou Nguesso, Malika Jean-François et à la Fondation Sounga pour la mise en lumiere. 🙏🏾\nMerci à Longa Andrea MBUYAMBA, Anah Safiratou Coulibaly, CISA, PMP, et toutes les  Abidjanaises in Tech pour ce baromètre. 🙏🏾\n\n#WomenInTech #TechIvoire #Représentation #AbidjanaisesInTech #AfricaTech","pid":"7453414787948023808","chars":1421,"hashtags":5,"mentions":5,"link":false,"question":false,"lang":"FR","impressions":8078,"er":3.28,"convRate":1.61,"theme":"Convictions & parcours"},{"date":"2026-04-27","month":"2026-04","weekday":"Lundi","hour":10,"reactions":109,"comments":8,"reposts":5,"eng":122,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_womenintech-techivoire-leadership-activity-7454470187736678400-aQQr?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"La semaine dernière, je partageais une conviction : les femmes ne manquent pas de détermination. Elles manquent de miroirs. En relisant le baromètre d' Abidjanaises In Tech, un aut","text":"La semaine dernière, je partageais une conviction :\nles femmes ne manquent pas de détermination. Elles manquent de miroirs.\nEn relisant le baromètre d' Abidjanaises In Tech, un autre point m’a marquée.\n\n📊 25% des femmes interrogées occupent déjà des postes senior ou de management \n\nLe sujet n’est donc pas uniquement l’accès à la tech.\nLes femmes sont là, elles évoluent, elles prennent des responsabilités.\nMais à mesure que l’on avance, le parcours devient plus exigeant.\n\n⚠️ 47% des femmes avec plus de 6 ans d’expérience déclarent avoir vécu des formes de discrimination \n\nOn parle beaucoup d’entrée dans la tech.\nBeaucoup moins de progression.\nMoins de ce moment où il faut se rendre visible, prendre sa place, accéder aux espaces de décision.\n\nC’est souvent là que les trajectoires deviennent plus incertaines.\n\nUn retour entendu récemment m’a fait réfléchir :\non ne peut pas seulement évoluer dans des cercles entre femmes.\nCes espaces sont nécessaires 🤝\nMais ils ne suffisent pas.\n\nIl faut aussi être présent là où se prennent les décisions,\ndans les réseaux existants,\ndans des environnements où nous sommes encore minoritaires.\n\nLe véritable enjeu est sans doute là :\npas seulement entrer, mais durer, progresser et peser.\n\n💬 Je serais curieuse d’avoir vos retours :\nselon vous, le principal blocage aujourd’hui se situe-t-il à l’entrée ou dans la progression ?\n\n#WomenInTech #TechIvoire #Leadership #AbidjanaisesInTech #AfricaTech","pid":"7454470187736678400","chars":1442,"hashtags":5,"mentions":1,"link":false,"question":true,"lang":"FR","impressions":4660,"er":2.62,"convRate":1.72,"theme":"Conseils fondateurs"},{"date":"2026-04-28","month":"2026-04","weekday":"Mardi","hour":10,"reactions":158,"comments":18,"reposts":9,"eng":185,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_africatech-mobility-energytransition-activity-7454843104207130624-1rsR?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Electric mobility is no longer a question in Africa — it’s happening ⚡🚘 So far, most of the momentum has been on two-wheelers. Strong unit economics, clear demand, and simpler roll","text":"Electric mobility is no longer a question in Africa — it’s happening ⚡🚘\n\nSo far, most of the momentum has been on two-wheelers.\n\nStrong unit economics, clear demand, and simpler rollout models.\nBut something interesting is emerging.\n\n🇨🇮  Côte d’Ivoire is becoming a real test case for four-wheelers 🔋\n\nAcross the ecosystem, different players are shaping the market — from infrastructure to distribution to operations:\npetroivoire, AUTO24.africa, Arnio, LOXEA New Mobility Solutions, Africharger, EVTech… and many others, each testing what this transition looks like locally.\n\nAt the same time, companies like Moove have shown that these models can scale — across markets, and even beyond the continent 🌍\n\nWhich brings us back to a simple but often overlooked question:\n👉 who creates value — and who captures it?\nBecause behind every vehicle, there’s a structure:\nwho owns the vehicle,\nwho pays for it over time,\nand ultimately — who ends up owning the asset.\n\nAnd today, that structure is still being defined.\n\nAs the ecosystem grows, there’s a real window of opportunity:\n→ not just to deploy vehicles\n→ but to design models where more operators can become owners ⚡\n\nThat’s exactly what we’re exploring with Flot., quietly building within Mstudio.\n\nFlot focuses on:\n🔋 bringing electric vehicles to the Ivorian market\n💳 making them accessible through flexible financing\n📊 linking usage to repayment\n🤖 using data & AI to improve performance and reduce risk\n\nStill early, but a space we’re watching closely.\n\nI unpack this further here:\nhttps://lnkd.in/eiqj2gdx\n\nCurious to hear how others are thinking about this across markets 👇\n#AfricaTech #Mobility #EnergyTransition #VentureBuilding","pid":"7454843104207130624","chars":1685,"hashtags":4,"mentions":8,"link":true,"question":false,"lang":"EN","impressions":10470,"er":1.77,"convRate":1.72,"theme":"Data & marché"},{"date":"2026-05-04","month":"2026-05","weekday":"Lundi","hour":11,"reactions":313,"comments":31,"reposts":9,"eng":353,"media":"video","url":"https://www.linkedin.com/posts/leslieossete_entrepreneuriat-techafrique-startupafrica-activity-7457028805824667649-0vJd?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Ce podcast m'a fait du bien. Repartir 10 ans en arrière sur ma carrière, mes apprentissages à chaque étape — et me rappeler qu'une trajectoire n'est jamais linéaire. Avec Beni Toss","text":"Ce podcast m'a fait du bien. \n\nRepartir 10 ans en arrière sur ma carrière, mes apprentissages à chaque étape — et me rappeler qu'une trajectoire n'est jamais linéaire.\n\nAvec Beni Tossou, CEO du PodLab Studio, on a parlé sans filtre :\n\n💰 Les débuts humbles d'une tech entrepreneure — quand la valo de ta boîte ne se reflète pas dans ton compte en banque 😉 \n🚀 La réalité d'une levée de fonds : ce qu'on raconte vs ce qu'on vit vraiment\n🙏🏾 La foi, quand tout vacille\n💪🏾 Rebondir après les échecs (et il y en a eu)\n⚖️ Early-stage vs scale-up : deux métiers complètement différents\n👥 Rester proche du terrain, toujours\n\nCe genre de podcast est essentiel. Il contribue à faire grandir la jeunesse africaine, à montrer que nos parcours valent la peine d'être racontés — pour que d'autres osent à leur tour.\n\n🎧 https://lnkd.in/dAm_P-xA\n\nBonne écoute!\n\n#Entrepreneuriat #TechAfrique #StartupAfrica #Mstudio #PodlabStudio","pid":"7457028805824667649","chars":911,"hashtags":5,"mentions":2,"link":true,"question":false,"lang":"FR","impressions":11179,"er":3.16,"convRate":2.77,"theme":"Convictions & parcours"},{"date":"2026-05-06","month":"2026-05","weekday":"Mercredi","hour":9,"reactions":308,"comments":6,"reposts":4,"eng":318,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_africaforwardic-activity-7457715824347287552-axJD?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🇰🇪 Plus que quelques jours avant Africa Forward | Inspire & Connect ! Je modérerai le panel « Passer de la fascination pour l'IA à des gains réels de productivité » lors de cet évé","text":"🇰🇪 Plus que quelques jours avant Africa Forward | Inspire & Connect !\n\nJe modérerai le panel « Passer de la fascination pour l'IA à des gains réels de productivité » lors de cet événement.\n\nUn forum d'affaires de haut niveau reliant l'Afrique et la France pour avancer ensemble sur la co-industrialisation, le co-investissement et la co-innovation.\n\nCo-organisé par Bpifrance, Business France et Proparco, sous le Haut Patronage de S.E. Emmanuel Macron et S.E. William Ruto, le forum se tiendra le 11 mai 2026 à l'Université de Nairobi (UoN), Kenya.\n\nPourquoi participer à Africa Forward | Inspire & Connect ?\n✔ Rencontrer 2 000+ décideurs africains, français et européens\n✔ Participer à des échanges de haut niveau sur l'énergie, l'agro-industrie, l'IA, la santé\n✔ Accéder à un dispositif de matchmaking ciblé et à des opportunités business\n✔ Découvrir des innovations africaines et françaises à fort impact\n\nRavie d'y représenter Mstudio.\n\n#AfricaForwardIC","pid":"7457715824347287552","chars":958,"hashtags":1,"mentions":4,"link":false,"question":false,"lang":"FR","impressions":11657,"er":2.73,"convRate":0.51,"theme":"Événements & écosystème"},{"date":"2026-05-08","month":"2026-05","weekday":"Vendredi","hour":10,"reactions":84,"comments":2,"reposts":2,"eng":88,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_mobility-financialinclusion-startupafrica-activity-7458455699157606400-lTCv?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🗺️ Last week I shared a non-exhaustive map of Côte d'Ivoire's EV ecosystem — chargers, operators, OEMs, financiers. But here's what no map can show: the bottleneck isn't on the map","text":"🗺️ Last week I shared a non-exhaustive map of Côte d'Ivoire's EV ecosystem — chargers, operators, OEMs, financiers. But here's what no map can show: the bottleneck isn't on the map.\n\n💳 It's the driver's financial identity.\n\nUntil you can prove a driver is creditworthy, no vehicle financing product holds. No electric transition, no shift from renting to owning, no scale.\n\n📊 And the data for that scoring is already there: mobile money flows, trip history on ride-hailing platforms, tracked fuel expenses. The job isn't collecting it — it's connecting it.\n\n🌍 During my years at Bolt across several African markets, I saw firsthand how powerful those signals become when you aggregate them properly.\n\n🚀 The next mobility unicorn in Africa won't be a vehicle brand. It'll be the scoring layer that turns a renting driver into a driver-owner.\n\n🚗 That's exactly the conviction we're building behind Flot., one of our startups at Mstudio. Their baseline says it better than I can: « Chauffeur, deviens patron ! » — Driver, become the boss.\n\n💡 \"Financial identity is a moat\" — pin this on every African mobility pitch deck.\n\n📖 Read the full piece 👉 https://lnkd.in/eiqj2gdx\n\n📸 Photo credit to Flot.\n\n#Mobility #FinancialInclusion #StartupAfrica #EVAfrica #AfricanOperator","pid":"7458455699157606400","chars":1266,"hashtags":5,"mentions":2,"link":true,"question":false,"lang":"EN","impressions":5612,"er":1.57,"convRate":0.36,"theme":"Data & marché"},{"date":"2026-05-09","month":"2026-05","weekday":"Samedi","hour":11,"reactions":148,"comments":1,"reposts":7,"eng":156,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_entourage-mstudio-entrepreneuriat-activity-7458833268797317121-gtOB?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🇧🇯 Bénin · 🇨🇲 Cameroun · 🇨🇮 Côte d'Ivoire · 🇫🇷 France Voilà la liste des nationalités représentées à la dernière édition de mon atelier ENTOURAGE 🤎 6 fondateurs. 4 pays. 1 ambition","text":"🇧🇯 Bénin · 🇨🇲 Cameroun · 🇨🇮 Côte d'Ivoire · 🇫🇷 France\n\nVoilà la liste des nationalités représentées à la dernière édition de mon atelier   ENTOURAGE 🤎\n\n6 fondateurs. 4 pays. 1 ambition commune : sortir avec un pitch investor-ready.\n\nSi tu l'as raté — voici ta deuxième chance.\n\nCe n'est ni un bootcamp ni un cours magistral. C'est l'atelier où des fondateurs sérieux posent leur projet sur la table et acceptent un feedback direct, structuré, sans complaisance.\n\nStartup tech, PME en croissance, ou ta propre boîte de consulting — on travaille la même chose :\n\n✔ Clarifier ton pitch\n✔ Renforcer ton modèle économique\n✔ Comprendre ce que cherche vraiment un investisseur\n✔ Repartir avec un projet investor-ready\n\nLa session se conclut par une visite privée du Mstudio. Voir, sentir, comprendre ce qu'on construit ici.\n\n🗓 Samedi 30 mai 2026 | 14h – 17h\n📍 Mstudio, Abidjan + en ligne pour la diaspora\n👥 6 places. Pas une de plus.\n\n🎟️ Réserve ta place 👉 https://lnkd.in/dMVvPpPg\n\n📩 Pitchs à transmettre 48h avant.\n\n#Entourage #Mstudio #Entrepreneuriat #StartupAfrica #PitchDeck","pid":"7458833268797317121","chars":1073,"hashtags":5,"mentions":1,"link":true,"question":false,"lang":"FR","impressions":8190,"er":1.9,"convRate":0.12,"theme":"Conseils fondateurs"},{"date":"2026-05-11","month":"2026-05","weekday":"Lundi","hour":11,"reactions":194,"comments":7,"reposts":5,"eng":206,"media":"video","url":"https://www.linkedin.com/posts/leslieossete_entrepreneuriat-carriaeyre-startupafrica-activity-7459565490387058688-RJG9?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🎙️ Dans mon récent échange avec Beni Tossou pour PodLab Studio, on a abordé un sujet qu'on traite rarement : le passage de l'entrepreneuriat au salariat. On célèbre le saut du sala","text":"🎙️ Dans mon récent échange avec Beni Tossou pour PodLab Studio, on a abordé un sujet qu'on traite rarement : le passage de l'entrepreneuriat au salariat.\n\nOn célèbre le saut du salariat vers l'entrepreneuriat. On commente moins souvent le mouvement inverse — comme s'il était synonyme d'échec ou de renoncement.\n\nMon parcours dit autre chose.\n\n🚀 À 22 ans, j'ai co-fondé une startup dans la mobilité au Kenya. On a gagné le Hult Prize, on a vécu l'aventure à fond.\n💼 Puis j'ai rejoint Bolt au Kenya comme Regional Ops Manager. Ensuite Wave Mobile Money pour lancer plusieurs pays.\n🌍 Avant de revenir à l'entrepreneuriat aujourd'hui, chez Mstudio.\n\nCes années en tant qu'opératrice n'ont pas été un détour. Elles sont devenues le socle de ce que je construis maintenant.\n\nChez Bolt, j'ai appris à scaler dans plusieurs marchés en parallèle, à composer avec les exigences d'un HQ international, à manager des équipes multiculturelles à distance.\n\nChez Wave, j'ai appris ce que voulait dire mettre le client au centre — pour de vrai. Et comment construire un produit financier qui parle aux non-bancarisés.\n\nAucun de ces apprentissages n'aurait été aussi rapide ou aussi profond en restant founder solo en early-stage.\n\n💡 Aux jeunes entrepreneurs qui m'écrivent : si l'opportunité d'aller bosser dans une startup en hyper-croissance se présente, n'y voyez pas un \"pas en arrière\". Voyez-y une école. Le retour à l'entrepreneuriat viendra — avec des armes que vous n'auriez pas eues autrement.\n\n🎧 J'en parle plus en détail dans l'épisode complet 👉 https://lnkd.in/dAm_P-xA\n\n#Entrepreneuriat #Carrière #StartupAfrica #TechAfrique #PodlabStudio","pid":"7459565490387058688","chars":1637,"hashtags":5,"mentions":2,"link":true,"question":false,"lang":"FR","impressions":8551,"er":2.41,"convRate":0.82,"theme":"Convictions & parcours"},{"date":"2026-05-14","month":"2026-05","weekday":"Jeudi","hour":10,"reactions":272,"comments":5,"reposts":2,"eng":279,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_africaforwardic-mstudio-activity-7460640016902418438-nRAL?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🌍 De retour de Nairobi. Et franchement, quelle énergie! J'ai été impressionnée par la jeunesse des profils croisés à Africa Forward — des CEOs, des founders, des investisseurs, des","text":"🌍 De retour de Nairobi. Et franchement, quelle énergie!\n\nJ'ai été impressionnée par la jeunesse des profils croisés à Africa Forward — des CEOs, des founders, des investisseurs, des équipes de DFI, tous très jeunes, africains pour la plupart. Une génération de double culture, qui regarde le monde et qui choisit l'Afrique. Une génération qui n'observe pas : elle pilote. Et elle pilote ensemble.\n\nSur le panel IA 🤖, j'ai eu l'honneur de partager la scène avec Meissa TALL (KPMG), Eng. Ian Minjire(Melanin Kapital), Mohamed Zouari (Mistral AI) et Charles Krzentowski (KYX AI). Tous voient l'IA non pas comme une option, mais comme le pied d'attaque du développement africain. \n\nNotre conviction commune : l'IA va nous permettre d'imaginer une Afrique qui ne forme pas chaque année des milliers de médecins pour poser des diagnostics que la machine sait poser — mais qui libère ses médecins pour le soin réel. Une Afrique qui ne court plus derrière des ratios profs/élèves impossibles — mais qui porte le savoir avec des outils intelligents jusque dans les écoles les plus reculées. Une Afrique qui multiplie son GDP sur une décennie, parce qu'elle saute les étapes au lieu d'essayer de les rattraper.\n\nMais cela exige une bascule, maintenant : investir dans notre compute, dans nos données, dans nos talents. Le retard pris ici se paiera pendant trente ans. Parce que les pays gagnants de la prochaine décennie ne seront pas ceux qui consomment de l'IA — ce seront ceux qui en produisent. C'est cette frontière qui définira le terrain de jeu des nations fortes de demain.\n\nRavie aussi d'avoir retrouvé tant de visages familiers à Nairobi — celles et ceux avec qui on co-construit cet écosystème tech, jour après jour.\n\nEt ravie d'avoir partagé ce moment aux côtés de quatre de nos entrepreneurs du Mstudio :\n• ✪ Stane BLEGBO — de Djoli (agritech)\n• Yohann Behi et Waly K. N'Diaye — de BLOK (contech)\n• Pierre-Alexandre Assou — de Flot. (mobilité électrique VTC)\n\nCe que je retiens de ce sommet : nous sommes entrés dans une ère de co-construction. Une ère où l'Afrique ne se fait plus dicter son agenda — elle prend position pour son futur. ✨\n\nMention spéciale à Nairobi 🇰🇪 — cette ville a une énergie qui se prend en pleine figure, et une hospitalité sans faille. \n\nMerci à Bpifrance, Business France et Proparco pour la co-organisation.\n\n#AfricaforwardIC #Mstudio","pid":"7460640016902418438","chars":2365,"hashtags":2,"mentions":13,"link":false,"question":false,"lang":"FR","impressions":8575,"er":3.25,"convRate":0.58,"theme":"Événements & écosystème"},{"date":"2026-05-15","month":"2026-05","weekday":"Vendredi","hour":11,"reactions":26,"comments":7,"reposts":2,"eng":35,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_africaforward2026-ai-africaai-activity-7461013684170174464-bv85?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"10 leçons autour de l'IA pour une Afrique souveraine 🌐 J'ai eu la chance de modérer le panel \"Moving from fascination with AI to tangible productivity gains\" à Africa Forward 🇰🇪 en","text":"10 leçons autour de l'IA pour une Afrique souveraine 🌐\n\nJ'ai eu la chance de modérer le panel \"Moving from fascination with AI to tangible productivity gains\" à Africa Forward 🇰🇪 en début de semaine. Voici ce qu'il faut retenir 👇\n\n1️⃣ L'IA est une arme stratégique pour les gouvernements africains. C'est l'opportunité de démultiplier le GDP et de faire un vrai leapfrog — pas dans 20 ans, dans les 5 prochaines années.\n\n2️⃣ Chaque pays africain a besoin d'un Ministre de l'IA. Préparer l'infra, le cadre, la data, la gouvernance et le cadre légal — c'est un métier en soi, qui demande son propre portefeuille.\n\n3️⃣ L'adoption se joue top-down. Government-led d'abord pour poser le cadre. Puis CEO-led pour pousser l'usage à l'intérieur de chaque organisation. C'est dans cet ordre que ça scale.\n\n4️⃣ Les LLMs sont une commodité. Ils changent tous les 6 mois. Ce qui compte, c'est l'infra, le cadre, la data. Le LLM peut être swappé demain — votre setup reste.\n\n5️⃣ La vraie question n'est plus quel LLM. C'est comment on les rend locaux, sur nos use cases et nos langues, avec des labos africains. Et ça passe par former massivement notre talent IA sur le continent — chercheurs, builders, data scientists.\n\n6️⃣ Les entreprises ne font pas le travail de préparation. Identifier les workflows à fort gain IA, structurer la donnée, accompagner les équipes — c'est un process, pas un outil qu'on plug.\n\n7️⃣ L'IA ne remplace pas les jobs. Elle libère les gens du chronophage pour qu'ils se concentrent sur ce qui a vraiment de la valeur.\n\n8️⃣ Un bon chef d'entreprise mesure l'usage de l'IA dans ses équipes et incentive ceux qui l'utilisent. Ce sont eux les plus performants.\n\n9️⃣ La data africaine doit créer de la valeur en Afrique. Aujourd'hui, nos données s'entraînent dans le Nord et reviennent comme produits finis. Il faut inverser le flux.\n\n🔟 Le vrai risque de l'IA en Afrique, ce n'est pas qu'elle remplace l'humain. C'est qu'elle creuse l'écart entre ceux qui l'utilisent et ceux qui ne l'utilisent pas — pays comme entreprises.\n\nL'IA souveraine en Afrique, ça ne se discute plus. Ça se construit. Qu'en pensez vous? 🤔 \n\n🇨🇮 Par ailleurs, pour ceux à Abidjan, le Mstudio accueille Yves Maitre ce 19 Mai à 18h00 pour découvrir son livre \"Arrêtez de dire bonjour à votre IA\" et discuter autour du thème :“L’intelligence artificielle au cœur de nos sociétés actuelles.”\n\nNous aurons une séance de dédicace à la fin de la rencontre.\n\n⚠️ L’inscription est obligatoire, ici: https://luma.com/mvt13juq\n\n#AfricaForward2026 #AI #AfricaAI #Mstudio","pid":"7461013684170174464","chars":2544,"hashtags":4,"mentions":2,"link":true,"question":false,"lang":"FR","impressions":1558,"er":2.25,"convRate":4.49,"theme":"IA & souveraineté"},{"date":"2026-05-18","month":"2026-05","weekday":"Lundi","hour":12,"reactions":145,"comments":4,"reposts":9,"eng":158,"media":"texte","url":"https://www.linkedin.com/posts/leslieossete_startupstudio-africa-mstudio-activity-7462109843504603136-s-Zy?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Le pire moment de mes 3 ans à Mstudio n'a pas été une levée qui foire 💸 Pas un produit qu'on a dû tuer 🪦 C'était deux cofondateurs assis face à moi, qui ne se parlaient plus vraime","text":"Le pire moment de mes 3 ans à Mstudio n'a pas été une levée qui foire 💸\n\nPas un produit qu'on a dû tuer 🪦\n\nC'était deux cofondateurs assis face à moi, qui ne se parlaient plus vraiment depuis 6 mois.\n\nL'un voulait foncer 🏃 L'autre voulait sécuriser 🛡️\n\nL'un sortait d'un grand groupe. L'autre n'avait connu que la rue de la débrouille.\n\nL'un trouvait que la répartition du capital ne reflétait plus le travail réel.\n\nL'autre n'avait jamais osé en reparler 🔇\n\nAucun de ces sujets n'était sur la table d'un board meeting. Tous étaient en train de tuer la boîte.\n\nVoilà la réalité d'un studio.\n\nOn gère du go-to-market. Du fundraising. Du recrutement.\n\nMais le plus consommateur d'attention — celui que personne n'écrit dans un memo — c'est de s'assurer que le binôme de cofondateurs tient la route 🤝\n\nParce que nous, dans le studio, on n'est pas extérieurs à la startup.\n\nOn en est le troisième cofondateur 🔺 Avec notre part du capital, notre vision, nos propres intérêts.\n\n📉 80% des startups ne meurent pas du marché ou du produit. Elles meurent de la relation entre cofondateurs — qu'on n'a jamais clarifiée.\n\nChez Mstudio, on a un rôle absurde. Pas leurs amis, ni thérapeutes, ni supérieurs. Mais responsables de ne pas laisser leur silence devenir leur tombe.\n\nLa compétence la plus dure que j'ai dû développer en 3 ans, ce n'est pas la stratégie.\n\nC'est savoir poser LA question que personne ne veut poser. Et me taire pendant 5 minutes très inconfortables 🤐\n\n📌 Mercredi, je partage les outils qu'on utilise pour construire cette relation à trois — avant la crise, pas pendant.\n\nJ'ai écrit ce que personne ne dit sur le quotidien d'un cofondateur de studio.\n\n👇Lien vers l'article: https://lnkd.in/dN_DTTru\n\n#StartupStudio #Africa #Mstudio #Leadership","pid":"7462109843504603136","chars":1753,"hashtags":4,"mentions":1,"link":true,"question":false,"lang":"FR","impressions":10675,"er":1.48,"convRate":0.37,"theme":"Convictions & parcours"},{"date":"2026-05-21","month":"2026-05","weekday":"Jeudi","hour":10,"reactions":62,"comments":14,"reposts":4,"eng":80,"media":"texte","url":"https://www.linkedin.com/posts/leslieossete_startupstudio-founders-cofounderrelationship-activity-7463166787996672000-TAdI?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Construire un produit, ça s'apprend. Construire un binôme de cofondateurs, ça se prépare. Lundi, j'écrivais que 80% des startups ne meurent pas du marché. Elles meurent du silence ","text":"Construire un produit, ça s'apprend. Construire un binôme de cofondateurs, ça se prépare.\n\nLundi, j'écrivais que 80% des startups ne meurent pas du marché. Elles meurent du silence entre cofondateurs.\n\nVoici les 4 outils qu'on installe chez Mstudio pour que ce silence ne s'installe jamais 👇\n\n1️⃣ Le contrat de cofondateurs — c'est un package, pas un papier\nOn installe 4 couches dès J0 :\n• Le rôle de chacun — ce qu'il fait, et surtout ce qu'il n'a pas à faire\n• La propriété intellectuelle — tout ce qu'on crée appartient à la société, pas à l'individu\n• L'equity — les actions, leur prix, leur vesting\n• La side letter + un RACI clair — qui décide quoi au quotidien : recrutements, GTM, investisseurs, produit\nLa cap table dit le pouvoir. La side letter dit le quotidien.\n\n2️⃣ Le vesting, la clause de buyout et le bad leaver\nPersonne n'aime en parler à J0. C'est exactement pour ça qu'il faut le faire. 4 ans de vesting + 1 an de cliff. Une clause de buyout claire pour le jour où l'un veut partir. Une clause bad leaver qui protège la boîte si le départ se passe mal.\n\n3️⃣ L'espace où le binôme se parle vraiment — sans nous\nUn 1:1 mensuel d'une heure, juste eux deux. Pas de roadmap. Juste : \"qu'est-ce qui te pèse en ce moment ? qu'est-ce que tu n'as pas osé me dire ?\"\nEt autour : du temps en dehors du pro. Aller boire un verre, manger ensemble sans agenda. Affronter les conversations difficiles dès qu'elles émergent — pas dans 6 mois.\n\n4️⃣ Les board advisors neutres\nPas des amis. Pas des investisseurs avec des intérêts. Des opérateurs seniors, indépendants, qui ouvrent les conversations qu'on ne peut pas porter en interne. Un binôme entouré de 2-3 advisors neutres, c'est un binôme qui ne s'enferme pas dans sa propre bulle.\n\nL'idée commune derrière ces 4 outils : ❤️ rendre la conversation difficile possible avant qu'elle devienne nécessaire.\n\nParce que le silence, lui, ne fait que composer.\n\nLequel de ces 4 outils vous paraît le plus sous-utilisé dans votre écosystème ? 👇\n\n#StartupStudio #Founders #CofounderRelationship #Mstudio","pid":"7463166787996672000","chars":2051,"hashtags":4,"mentions":0,"link":false,"question":true,"lang":"FR","impressions":3490,"er":2.29,"convRate":4.01,"theme":"Conseils fondateurs"},{"date":"2026-05-23","month":"2026-05","weekday":"Samedi","hour":9,"reactions":149,"comments":1,"reposts":7,"eng":157,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_startupafrica-pitchdeck-fundraising-activity-7463877746084147200-KkHF?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"6 entrepreneurs. 3 heures. Ton pitch passé au crible comme devant un vrai investisseur. Samedi prochain, j'anime un atelier stratégique chez Mstudio à Abidjan, en collaboration ave","text":"6 entrepreneurs. 3 heures. Ton pitch passé au crible comme devant un vrai investisseur.\n\nSamedi prochain, j'anime un atelier stratégique chez Mstudio à Abidjan, en collaboration avec ENTOURAGE.\n\nLe format est volontairement petit — 6 participants maximum — pour une raison simple : un pitch ne se travaille pas dans une masterclass à 100. Il se travaille dans une salle où chaque deck est analysé en profondeur, où chaque modèle est challengé, et où on repart avec un plan d'amélioration concret.\n\nConcrètement, voilà ce qu'on fait pendant 3 heures :\n\n✦ Tu présentes ton pitch comme tu le ferais devant un investisseur\n✦ On déconstruit ton deck slide par slide\n✦ On identifie les failles de ton modèle (celles que les VCs verront avant toi)\n✦ Tu repars avec un plan d'amélioration actionnable\n✦ Et on termine par une visite privée de Mstudio\n\nC'est pour les founders qui se préparent à lever, ou qui veulent affiner leur narratif avant un comité.\n\n📅 Samedi 30 mai · 14h-17h\n📍 Mstudio, Abidjan ou en ligne\n👥 6 places — places limitées\n\n🔗 Inscription : https://lnkd.in/dmcStFKR\n\n#StartupAfrica #PitchDeck #Fundraising #Founders #Mstudio","pid":"7463877746084147200","chars":1134,"hashtags":5,"mentions":1,"link":true,"question":false,"lang":"FR","impressions":6753,"er":2.32,"convRate":0.15,"theme":"Conseils fondateurs"},{"date":"2026-05-25","month":"2026-05","weekday":"Lundi","hour":11,"reactions":32,"comments":0,"reposts":1,"eng":33,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_startupafrica-fundraising-cotedivoire-activity-7464642687477121024-NodN?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚀 Si tu prépares une levée de fonds dans les 6 prochains mois, lis ceci. Avec Smart Africa, nous lançons le SAVR Bootcamp à Abidjan du 22 au 26 juin — 5 jours intensifs pour passer","text":"🚀 Si tu prépares une levée de fonds dans les 6 prochains mois, lis ceci.\n\nAvec Smart Africa, nous lançons le SAVR Bootcamp à Abidjan du 22 au 26 juin — 5 jours intensifs pour passer de \"j'ai un produit qui marche\" à \"je tiens un récit que des investisseurs early-stage achètent\".\n\nCe que je vois bloquer la majorité des founders ouest-africains à ce stade : pas le produit. Pas la traction. Mais la narrative, la cohérence du modèle financier, et la posture en pitch room. Résultat — des process de levée qui s'étirent 9-12 mois quand ils devraient en prendre 3-6.\n\nPendant 5 jours, on travaille :\n✦ Stratégie de levée (qui solliciter, dans quel ordre, à quel ticket)\n✦ Modèle économique et projection financière qui tient devant un comité\n✦ Storytelling investisseur — pas joli, mais investable\n✦ Deck stress-testé et pitch live devant investisseurs\n\n📍 Abidjan · 22-26 juin 2026\n👥 15 places · early-stage · digital ou greentech basée en CI\n⌛ Candidatures jusqu'au 31 mai 2026 — 23h59\n\nProgramme porté par Smart Africa × Mstudio, dans le cadre d'AEDIB 2.0 financé par l'Union européenne.\n\n🔗 Postule ici : https://lnkd.in/d5uBpqsn\n\nSi tu connais un·e founder qui devrait être dans cette cohorte, partage. Les places sont limitées et le timing est serré.\n\n#StartupAfrica #Fundraising #CoteDivoire #Mstudio","pid":"7464642687477121024","chars":1303,"hashtags":4,"mentions":1,"link":true,"question":false,"lang":"FR","impressions":2371,"er":1.39,"convRate":0.0,"theme":"Conseils fondateurs"},{"date":"2026-06-01","month":"2026-06","weekday":"Lundi","hour":11,"reactions":115,"comments":3,"reposts":3,"eng":121,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_diasporaconnect-cotedivoire-repats-activity-7467175666115821568-3GYR?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Devant les 60 talents des cohortes 1 et 2 de Diaspora Connect, j'ai dit ce que je crois vraiment : choisir l'Afrique aujourd'hui n'est pas un acte sentimental, c'est un pari économ","text":"Devant les 60 talents des cohortes 1 et 2 de Diaspora Connect, j'ai dit ce que je crois vraiment : choisir l'Afrique aujourd'hui n'est pas un acte sentimental, c'est un pari économique 🎯\n\nLe continent bouge dans nos bureaux à Cocody, dans nos boutiques à Treichville, dans nos administrations au Plateau.\n\nEt j'étais surtout impressionnée par les parcours de mes co-panélistes 👇\n\n🇲🇱 Mahamane Sow, qui aurait pu choisir l'Amérique latine — un marché qui sur papier semblait plus dynamique. Il a choisi l'Afrique.\n\n🇸🇳 Penda Sow, qui est rentrée sans avoir trouvé un job. Un pari risqué. Elle est d'abord revenue dans son pays natal, puis a fait le pas vers la Côte d'Ivoire 🇨🇮.\n\n🇨🇮 Souhony BRAGBO, qui savait dès le départ qu'il devait revenir en entrepreneur — pas en salarié. Parce qu'en Afrique francophone, la désillusion du salariat coûte plus cher que le risque d'entreprendre.\n\n💬 On a aussi parlé de la pression sociale qui vient quand on est repatrié, et de la nécessité d'adapter ses réalités salariales, sociales, économiques. C'est ce qu'on demande à toute génération qui choisit de construire ici.\n\n🙏🏾 Merci à Diaspora Connect d'avoir créé ce cadre, à Charm Matuba pour l'animation, à Mme Nathalie Dupont et à l'Ambassade de France en Côte d'Ivoire 🇫🇷 et à toute l'équipe.\n\n🎙️ Et un clin d'œil à Malick Diabaté pour avoir reçu cet échange sur son talk show.\n\nÀ celles et ceux qui hésitent : la place est là. Elle ne s'offre pas, elle se prend ✨\n\ncc Longa Andrea MBUYAMBA Ornella-Ashley Sangronio Kirane Yassine\n\n#diasporaconnect #cotedivoire #repats","pid":"7467175666115821568","chars":1559,"hashtags":3,"mentions":9,"link":false,"question":false,"lang":"FR","impressions":5473,"er":2.21,"convRate":0.55,"theme":"Diaspora Connect"},{"date":"2026-06-04","month":"2026-06","weekday":"Jeudi","hour":9,"reactions":70,"comments":4,"reposts":1,"eng":75,"media":"texte","url":"https://www.linkedin.com/posts/leslieossete_djoli-mstudio-tech4impact-activity-7468226995215216640-10OA?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"L'Afrique n'a pas un problème d'impact. Elle a un problème de preuve. On finance, on déploie, on annonce des milliards. Mais qui mesure vraiment ce qui change sur le terrain ? C'es","text":"L'Afrique n'a pas un problème d'impact. Elle a un problème de preuve.\n\nOn finance, on déploie, on annonce des milliards. Mais qui mesure vraiment ce qui change sur le terrain ?\n\nC'est ce qu'a fait Djoli avec Tech4Impact, un projet mené pour la Banque Africaine de Développement : mesurer l'impact réel d'un programme déployé dans la région. Avec de la data, de la data science et de l'IA.\n\n📊 Collecter la donnée là où elle se vit.\n🤖 La transformer en indicateurs fiables et lisibles.\n🌍 Montrer aux décideurs ce qui marche, et ce qui ne marche pas.\n\nLe résultat ? Aux Assemblées annuelles de la BAD à Brazzaville, le Président Dr Sidi Ould Tah s'est levé pour saluer ce travail. 🇨🇬\n\nEt Djoli ne l'a pas fait seul : le projet est né avec Epitech Afrique, partenaire de Mstudio, qui forme les talents tech capables de cette exécution.\n\nVoilà la tech africaine en laquelle je crois. Pas une vitrine. Une preuve.\n\nEt vous, dans vos projets : vous mesurez l'impact, ou vous l'estimez ? 👇🏾\n\n#Djoli #Mstudio #Tech4Impact #Epitech","pid":"7468226995215216640","chars":1021,"hashtags":4,"mentions":2,"link":false,"question":true,"lang":"FR","impressions":3632,"er":2.06,"convRate":1.1,"theme":"Convictions & parcours"},{"date":"2026-06-12","month":"2026-06","weekday":"Vendredi","hour":11,"reactions":79,"comments":6,"reposts":4,"eng":89,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_abidjanaisesintech-womenintech-pitch-activity-7471159565108285441-j0oM?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚫 Le deck, c'est la partie la moins importante de votre pitch. J'ai vu des founders avec des slides parfaites repartir sans term sheet. Et d'autres, avec un deck moyen, convaincre ","text":"🚫 Le deck, c'est la partie la moins importante de votre pitch.\n\nJ'ai vu des founders avec des slides parfaites repartir sans term sheet. Et d'autres, avec un deck moyen, convaincre en 20 minutes.\n\nLa différence ? L'histoire.\n\nEt c'est souvent là que les femmes entrepreneures se sous-vendent. Pas par manque d'ambition, par excès de modestie : on déroule les chiffres, on minimise le parcours.\n\nPourtant, ce qui fait signer un investisseur :\n🌍 d'où vous venez, et ce que vous avez déjà traversé\n🎯 pourquoi vous, et pas quelqu'un d'autre sur ce problème\n⚡ pourquoi maintenant, et pas dans 2 ans\n\nLes slides ne font que porter ce récit. Jamais le remplacer.\n\nC'est ce qu'on va travailler le 18 juin avec la communauté Abidjanaises In Tech 🇨🇮\n\nAux femmes qui construisent dans la tech à Abidjan : venez avec votre histoire, on en fera votre meilleur argument.\n\n🗓 Jeudi 18 juin 2026 | 18h00\n📍 Royal Work Club (Plateau), Immeuble Arc-en-Ciel\n🎟️ Réservez votre place 👉🏾 https://lnkd.in/eDaN9FS3\n\n#AbidjanaisesInTech #WomenInTech #Pitch #AfriqueFrancophone\n\ncc Anah Safiratou Coulibaly, CISA, PMP Longa Andrea MBUYAMBA","pid":"7471159565108285441","chars":1111,"hashtags":4,"mentions":3,"link":true,"question":false,"lang":"FR","impressions":3175,"er":2.8,"convRate":1.89,"theme":"Conseils fondateurs"},{"date":"2026-06-30","month":"2026-06","weekday":"Mardi","hour":8,"reactions":123,"comments":10,"reposts":1,"eng":134,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_rencontreseconomiques-souverainetaez-ia-activity-7477632070505275392-g0E8?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🇫🇷 Vendredi 3 juillet à 17h, je serai à Aix-en-Provence pour débattre de qui contrôlera le cœur numérique du monde. 🎤 Les Rencontres Économiques ( Le Cercle des économistes) m'invi","text":"🇫🇷  Vendredi 3 juillet à 17h, je serai à Aix-en-Provence pour débattre de qui contrôlera le cœur numérique du monde.\n\n🎤 Les Rencontres Économiques  ( Le Cercle des économistes) m'invitent sur la table ronde dédiée aux semi-conducteurs, aux côtés de Young-Sun Park (ancienne Ministre des PME et des Startups de Corée du Sud), Eric Labaye (Eutelsat), Nicolas Dubourg (Isalt) et David Dupont-Noël (Deloitte).  Cette table ronde sera modéree par Emmanuel Lechypre.\n\nLa chaîne de valeur des puces n'a jamais semblé aussi verrouillée, entre les États-Unis et la Chine. Et l'Afrique, dans tout ça ?\n\nJ'y porte une conviction :\n\n⛏️ Nos minerais font tourner le monde numérique (cobalt, coltan, manganèse), mais on les exporte bruts. Producteur, jamais transformateur.\n📊 Nos données sont l'un des plus grands marchés de l'IA, et l'un des grands absents de ce qui l'entraîne.\n⚡ Notre énergie (soleil, eau, géothermie) est la carte que personne ne joue, pendant que les réseaux du Nord saturent.\n\nLe vrai sujet n'est pas de savoir si l'Afrique peut entrer dans cette chaîne. C'est par où, et avec qui.\n\nL'Afrique n'est pas condamnée à être la mine du monde numérique. Elle peut en devenir un architecte, si elle joue ses cartes ensemble.\n\nEt si vous êtes plutôt sur Paris, avec ENTOURAGE, j'organise un diner privé pour échanger autour de la tech Africaine le lundi 6 juillet. \n\n🎟️ Réservez dès maintenant votre place : https://lnkd.in/eM869zNH\n\n#RencontresEconomiques #Souveraineté #IA #Afrique #SemiConducteurs","pid":"7477632070505275392","chars":1501,"hashtags":5,"mentions":2,"link":true,"question":false,"lang":"FR","impressions":5031,"er":2.66,"convRate":1.99,"theme":"Événements & écosystème"},{"date":"2026-07-04","month":"2026-07","weekday":"Samedi","hour":10,"reactions":76,"comments":2,"reposts":3,"eng":81,"media":"img","url":"https://www.linkedin.com/posts/leslieossete_frenchtechabidjan-entourage-entrepreneuriat-activity-7479114405998202880-3pjP?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"La semaine dernière, j'étais sur scène pour les 10 ans de la French Tech Abidjan, à l'Institut français, sur un sujet qui me tient à cœur : la tech au service des communautés. Avan","text":"La semaine dernière, j'étais sur scène pour les 10 ans de la French Tech Abidjan, à l'Institut français, sur un sujet qui me tient à cœur : la tech au service des communautés.\n\nAvant tout, félicitations à La French Tech Abidjan pour ces 10 ans 🎉\n\nCette communauté compt
