aspora","label":"Diaspora Connect","short":"Diaspora","kind":"page","desc":"de la page de Diaspora Connect, le programme de retour des talents","reposts":31,"posts":[{"date":"2026-01-13","month":"2026-01","weekday":"Mardi","hour":8,"reactions":58,"comments":1,"reposts":3,"eng":62,"media":"file","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_akwaba-cohorte-diaspora-connect-activity-7416750878545797120-_Q5Q?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Akwaba 🇨🇮 | Bonne année 2026 La cohorte Diaspora Connect 2026 démarre officiellement son expérience à Abidjan le 10 janvier. Après 200 candidatures reçues, 👉 35 talents ont été sél","text":"Akwaba 🇨🇮 | Bonne année 2026\n\nLa cohorte Diaspora Connect 2026 démarre officiellement son expérience à Abidjan le 10 janvier.\n\nAprès 200 candidatures reçues,\n 👉 35 talents ont été sélectionnés pour le parcours professionnel. \n 👉 2 talents ont été sélectionnés pour la première vague du parcours entrepreneur.\n\nDes profils engagés, aux parcours variés – professionnels et entrepreneuriaux – prêts à s’investir concrètement au sein des organisations partenaires et à contribuer à l’écosystème ivoirien.\n\nCette nouvelle année s’ouvre avec :\n- des missions à fort impact, alignées avec les besoins réels des organisations,\n- une diversité de compétences, de métiers et de trajectoires,\n- un écosystème de partenaires mobilisés, en Côte d’Ivoire et à l’international.\n\n📍 Prochaine étape : la semaine d’immersion de la cohorte à Abidjan.\nMerci à toutes les personnes candidates, aux entreprises partenaires et à l’ensemble des soutiens du programme.\n Très belle année 2026 à toutes et à tous.","pid":"7416750878545797120","chars":986,"hashtags":0,"mentions":0,"link":false,"question":false,"lang":"FR","theme":"Cohorte & immersion"},{"date":"2026-01-15","month":"2026-01","weekday":"Jeudi","hour":16,"reactions":57,"comments":0,"reposts":1,"eng":58,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_focus-repatpreneurs-r%C3%A9pondre-%C3%A0-lappel-activity-7417609825888591873-U8-a?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"📆Focus Repat’preneurs : Répondre à l’appel 🌍✨ Dans le cadre de la semaine d’immersion de la cohorte n°1 de Diaspora Connect, nous aurons le plaisir d’organiser un afterwork au Mstu","text":"📆Focus Repat’preneurs : Répondre à l’appel 🌍✨\n\nDans le cadre de la semaine d’immersion de la cohorte n°1 de Diaspora Connect, nous aurons le plaisir d’organiser un afterwork au Mstudio  réunissant quatre entrepreneurs répatriés, aux parcours complémentaires, qui entreprennent aujourd’hui dans des secteurs clés : la construction 🏗️, la santé 🩺, l’e-commerce 🛒 et la logistique 🚚.\n\nIls partageront leur expérience du retour sur le continent 🔄, la réalité de la création et du développement d’une startup en Afrique ⚙️, ainsi que les opportunités et défis rencontrés sur le terrain.\n\nIntervenants 🎤\nWaly K. N'Diaye , co-fondateur de BLOK 🏗️\nSophie Tall , co-fondatrice de La Ruche Health 🩺\nMoulaye TABOURÉ , co-fondateur de Anka 🛒\nZeinabou Sidibe  , fondatrice de Afrisends 🚚\n\nUn moment d’échanges 🤝, de retours d’expérience 💬 et de networking 🍸.\n📌 Inscriptions : https://luma.com/1lrj412x","pid":"7417609825888591873","chars":888,"hashtags":0,"mentions":5,"link":true,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-01-23","month":"2026-01","weekday":"Vendredi","hour":9,"reactions":206,"comments":5,"reposts":5,"eng":216,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diasporaconnect-mtalk-activity-7420404053874049024-7QVT?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Dans le cadre de la semaine d’immersion de la cohorte n°1 de Diaspora Connect, Mstudio a accueilli notre afterwork \"MTALK\" sous la thématique : Focus Repat’preneurs : Répondre à l’","text":"Dans le cadre de la semaine d’immersion de la cohorte n°1 de Diaspora Connect, Mstudio a accueilli notre afterwork \"MTALK\" sous la thématique :  Focus Repat’preneurs : Répondre à l’appel.\n\nUn soirée réunissant quatre entrepreneurs répatriés, qui ont fait le choix d’entreprendre depuis Abidjan dans des secteurs structurants de l’économie :\n la construction 🏗️, la santé 🩺, l’e-commerce 🛒 et la logistique 🚚.\n\nAutour de la table :\nWaly K. N'Diaye K. , co-fondateur de BLOK (construction)\nSophie Tall, co-fondatrice de La Ruche Health (e-santé)\nMoulaye TABOURÉ, co-fondateur de ANKA (e-commerce)\nZeinabou Sidibe , fondatrice de Afrisends (logistique)\n🎤  Dro Kieu DÉLI et Irène AMEDJI ✮, membre de la cohorte, ont assuré leur première modération.\n\nNos intervenants ont partagé, sans filtre, ce que signifie répondre à l’appel du retour : ce qu’il a fallu désapprendre, les écarts entre attentes et réalité, les ajustements de modèles, le rôle clé des équipes locales, et cette question centrale :\n 👉 le retour est-il une condition de réussite ou un accélérateur ?\n\nAu-delà des parcours, ce MTALK a ouvert un espace de dialogue sincère sur les réalités de l’entrepreneuriat en Afrique de l’Ouest : des défis bien réels, mais aussi des opportunités concrètes pour celles et ceux qui choisissent de construire depuis le continent, avec une ambition locale et internationale.\n\nUn moment d’échanges, de transmission et de networking, fidèle à l’esprit de Diaspora Connect : comprendre le terrain, partager l’expérience, et créer des trajectoires d’impact durables.\n\n📍 Mstudio – Ivoire Trade Center\n 🍸 Afterwork – Talk & échanges\n#DiasporaConnect #MTalk","pid":"7420404053874049024","chars":1645,"hashtags":2,"mentions":12,"link":false,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-01-26","month":"2026-01","weekday":"Lundi","hour":12,"reactions":89,"comments":0,"reposts":2,"eng":91,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diasporaconnect-activity-7421524558643539968-pbys?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"[AFTERWORK \"ACT LIKE\"] Dans le cadre de la semaine d’immersion de la cohorte Diaspora Connect, nous avons organisé un Apéro Talk “ACT LIKE” en partenariat avec le Royal Work Club. ","text":"[AFTERWORK \"ACT LIKE\"] Dans le cadre de la semaine d’immersion de la cohorte Diaspora Connect, nous avons organisé un Apéro Talk “ACT LIKE” en partenariat avec le Royal Work Club.\n\nUn afterwork pensé comme un temps de rencontre privilégié, à la fois convivial et structuré, pour permettre aux talents de la diaspora d’échanger directement avec des acteurs engagés de l’écosystème ivoirien : entrepreneurs, dirigeants, mentors et partenaires.\n\nLe principe était simple :\n 👉 des tables d’échanges,\n 👉 deux intervenants par table,\n 👉 des discussions ouvertes autour des parcours, du retour, de l’entrepreneuriat et des réalités du terrain.\n\nNos intervenants ont partagé, sans filtre, leur expérience du retour sur le continent, la réalité de la création et du développement d’un projet en Afrique, mais aussi les opportunités et les défis qu’implique le fait de s’ancrer durablement ici.\n\nMerci à celles et ceux qui ont pris le temps de transmettre et d’échanger avec la cohorte :\nSteven BEDI , CEO Tylimmo Africa et Mentor de notre cohorte \nLina Kacyem, CPCU , Investor et Advisor Launch Africa Ventures\nFranck Kié, COO Genesis Holding Company\nMalick Diabaté , Fondateur de Choose Your Mentor\nAlexia Amichia, Ministère de la transition numérique et de la digitalisation\nAude-Marie INCHOT, DGA ART DEPARTMENT\nLeslie Ossete, COO et Co-fondatrice du Mstudio\nSadibou Sow, Entrepreneur Webber Institute of Technology\n\nMerci également au Royal Work Club et Robin NICOLET  pour l’accueil, et à Marwa Ahmed pour pour son soutien et son message d’encouragement à la cohorte.\nACT LIKE, c’est observer, écouter, comprendre… et agir comme celles et ceux qui construisent.\n\n#DiasporaConnect","pid":"7421524558643539968","chars":1675,"hashtags":1,"mentions":20,"link":false,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-01-27","month":"2026-01","weekday":"Mardi","hour":15,"reactions":58,"comments":3,"reposts":3,"eng":64,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diasporaconnect-activity-7421943469209825280-mbO-?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Retour sur la semaine d’immersion de la cohorte Diaspora Connect, les talents ont été accueillis au Hub Ivoire Tech, un lieu central de la structuration de l’écosystème numérique i","text":"Retour sur la semaine d’immersion de la cohorte Diaspora Connect, les talents ont été accueillis au Hub Ivoire Tech, un lieu central de la structuration de l’écosystème numérique ivoirien.\n\nÀ travers la découverte des espaces, les échanges avec les équipes du Hub et la démonstration au FabLab en collaboration avec Institut National Polytechnique Félix HOUPHOUËT-BOIGNY de Yamoussoukro (INP-HB) Officiel introduit par Monsieur Koré, les participants ont pu appréhender le rôle stratégique du Hub Ivoire Tech dans l’animation, la coordination et l’accélération de l’innovation.\n\nLa matinée s’est poursuivie par une rencontre dédiée avec la Fondation Jeunesse Numérique, en présence de sa Directrice Exécutive Florence TAHIRI epse FADIKA Fadika. Ce temps d’échange a permis de découvrir les missions de la Fondation et son rôle clé dans :\n- l’inclusion des jeunes dans l’écosystème numérique,\n- l’accompagnement de porteurs de projets innovants,\n- le développement de l’employabilité et de l’entrepreneuriat tech en Côte d’Ivoire.\n\nÀ travers ces rencontres, la cohorte a bénéficié d’un éclairage institutionnel et opérationnel sur les enjeux liés aux talents, à la formation, à l’accompagnement des startups et aux politiques publiques en faveur du numérique.\n\nMerci aux équipes du Hub Ivoire Tech, à la Fondation Jeunesse Numérique, à Ama O. et à Florence TAHIRI epse FADIKA  pour la qualité de l’accueil et des échanges, ainsi qu’aux étudiants de Mastercard Foundation Scholars Program at Sciences Po  avec qui cette immersion croisée a été partagée.\n\n#DiasporaConnect","pid":"7421943469209825280","chars":1569,"hashtags":1,"mentions":11,"link":false,"question":false,"lang":"FR","theme":"Cohorte & immersion"},{"date":"2026-01-29","month":"2026-01","weekday":"Jeudi","hour":18,"reactions":26,"comments":0,"reposts":3,"eng":29,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diasporaconnect-activity-7422712281446150144-T9RN?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"[RENCONTRE INSTITUTIONNELLE] Dans le cadre de la semaine d’immersion de la cohorte Diaspora Connect, les talents ont eu l’opportunité d’échanger avec le Ministère de la Transition ","text":"[RENCONTRE INSTITUTIONNELLE] Dans le cadre de la semaine d’immersion de la cohorte Diaspora Connect, les talents ont eu l’opportunité d’échanger avec le Ministère de la Transition Numérique et de la Digitalisation  ,  à travers une rencontre avec Kounandi Stephane Coulibaly   , Directeur de l'Innovation, des start-up et du Secteur Privé & Karen Diallo   , Directrice de la Transformation Digitale de l’Administration.\n\nCe temps d’échange a permis de mieux comprendre le cadre institutionnel du numérique en Côte d’Ivoire, les priorités publiques en matière de transformation digitale, ainsi que les enjeux liés à l’innovation, aux talents et à l’attractivité de l’écosystème des start-ups.\n\nPour la cohorte Diaspora Connect, cette rencontre a apporté une lecture stratégique et concrète du rôle de l’État dans la construction d’un environnement favorable à l’innovation, et a permis de mieux situer leur engagement professionnel ou entrepreneurial dans une vision plus large du développement du numérique en Côte d’Ivoire.\n\nMerci aux équipes du Ministère pour leur disponibilité et la qualité des échanges, qui contribuent pleinement à l’objectif de la semaine d’immersion.\n#DiasporaConnect","pid":"7422712281446150144","chars":1192,"hashtags":1,"mentions":3,"link":false,"question":false,"lang":"FR","theme":"Partenaires & institutions"},{"date":"2026-02-16","month":"2026-02","weekday":"Lundi","hour":8,"reactions":35,"comments":4,"reposts":1,"eng":40,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diasporaconnect-activity-7429075852015030272-EE96?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Le 30 janvier 2026, nous avons eu le plaisir de participer à l’Afterwork Diaspora Experience, organisé par le CEPICI Officiel au Noom Hotel Abidjan Plateau. Cet événement a rassemb","text":"Le 30 janvier 2026, nous avons eu le plaisir de participer à l’Afterwork Diaspora Experience, organisé par le CEPICI Officiel au Noom Hotel Abidjan Plateau.\n\nCet événement a rassemblé acteurs institutionnels, partenaires privés et membres de la diaspora autour d’un objectif commun : renforcer la contribution des talents ivoiriens et afrodescendants au développement économique de la Côte d’Ivoire.\nÀ cette occasion, nous avons présenté notre programme Diaspora Connect en tant que partenaire, aux côtés d’autres structures engagées telles que la DIRECTION GÉNÉRALE DES IVOIRIENS DE L'EXTÉRIEUR ( DGIE), l’ Organisation Internationale pour les Migrations, oim, la BNI,  L'Abidjanaise d'Assurances, Yango , Addoha Côte d'Ivoire , Repat Africa , Grant Thornton , Visa\n\nNous avons partagé :\n- Notre vision du transfert de compétences structuré\n- Les premiers résultats de la cohorte 1 avec les témoignages de nos 3 bénéficiaires Maryama Diomande , Marion Lory FERRAND et Houlematou TANGARA\n- Les perspectives d’élargissement du programme\n\nCe moment d’échange a confirmé un point essentiel : La diaspora ne se limite pas aux flux financiers. Elle représente un levier stratégique de compétences, d’ingénierie et de structuration.\n\nMerci au CEPICI pour cette plateforme de dialogue et pour la mise en lumière des dispositifs d’accompagnement existants.\n#DiasporaConnect Aziz Yao Saran Fofana Solange Amichia","pid":"7429075852015030272","chars":1403,"hashtags":1,"mentions":16,"link":false,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-02-17","month":"2026-02","weekday":"Mardi","hour":16,"reactions":54,"comments":0,"reposts":1,"eng":55,"media":"video","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diasporaconnect-greysearchafrica-activity-7429564868590100480-NLUx?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Retour sur l'immersion de notre première cohorte dans l'écosystème ivoirien. Le mercredi 14 janvier 2026, a pris part à une session carrière animée par Leïla RICHARD - TOUMA, Fonda","text":"Retour sur l'immersion de notre première cohorte dans l'écosystème ivoirien. \n\nLe mercredi 14 janvier 2026, a pris part à une session carrière animée par Leïla RICHARD - TOUMA, Fondatrice-Directrice de Grey Search Africa.\n\n🎯 Objectif de la session\n Apporter des repères concrets afin d’aider les participants à prendre des décisions professionnelles éclairées, notamment en vue d’une installation durable en Côte d’Ivoire.\n\n💡 Axes abordés\n- Lecture claire et objective du marché de l’emploi ivoirien\n- Réalités salariales et logiques de rémunération\n- Identification des métiers en tension\n- Rôle déterminant des soft skills dans l’employabilité\n- Positionnement stratégique des talents de la diaspora\n\nLa session s’est conclue par un atelier pratique, centré sur la présentation du profil professionnel sous l’angle de la création de valeur et de la résolution de problématiques, au-delà du seul parcours académique.\n\nNous remercions notre partenaire Grey Search Africa, pour qui comprendre le marché local est une condition clé pour réussir son projet professionnel et construire une trajectoire durable.\n\n#DiasporaConnect #GreySearchAfrica","pid":"7429564868590100480","chars":1142,"hashtags":2,"mentions":3,"link":false,"question":false,"lang":"FR","theme":"Cohorte & immersion"},{"date":"2026-02-18","month":"2026-02","weekday":"Mercredi","hour":16,"reactions":52,"comments":1,"reposts":7,"eng":60,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_nous-participons-demain-au-forum-des-carri%C3%A8res-activity-7429931971335802880-2g9c?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Nous participons demain au Forum des carrières en Afrique de Sciences Po Carrières & ASPA Paris Campus Sciences Po , qui se tiendra en ligne sur Seekube. 👉 Rendez-vous annuel majeu","text":"Nous participons demain au Forum des carrières en Afrique de Sciences Po Carrières & ASPA Paris Campus Sciences Po , qui se tiendra en ligne sur Seekube.\n\n👉 Rendez-vous annuel majeur pour trouver un stage, un apprentissage ou un premier emploi sur le continent africain.\n\nDans ce cadre, nous aurons :\n💻 Un stand virtuel sur la plateforme du forum pour consulter les informations de notre programme\n🎙️ Un live d’information à 14h (GMT+1 Paris) pour présenter le programme et répondre à vos questions\n📅 Des créneaux individuels avec notre chargée de recrutement Ornella-Ashley Sangronio\n👉 12 créneaux à réserver pour échanger en one-to-one et répondre à vos questions sur votre profil et votre projet.\n\nℹ️ Le programme Diaspora Connect ouvre de nouveau dans quelques jours pour proposer des missions professionnelles en Côte d’Ivoire au sein d’entreprises ivoiriennes dynamiques.\nLe programme inclut :\n✈️ Billet d’avion\n🏠 Logement\n💼 Gratification de mission\nLa prochaine cohorte débute en mai 2026.\n\n📍 Pour accéder au Live Talk à 14h (GMT Paris), cliquez sur le lien quelques minutes avant le début :\n🔗 https://lnkd.in/eh-7bCrM\n\nÀ demain en ligne. 🌍\nEtienne Cazin Valeria Morera Caroline Toussain - de Chastellux Naïlate Msaidie Soraya L. Alice Judell Cynthia Isimbi Julie Maurincomme Kalliopi Valantasi Dr. Kamina Diallo Souleymane Diallo Delphine Loisel","pid":"7429931971335802880","chars":1353,"hashtags":0,"mentions":17,"link":true,"question":false,"lang":"FR","theme":"Partenaires & institutions"},{"date":"2026-02-23","month":"2026-02","weekday":"Lundi","hour":7,"reactions":58,"comments":1,"reposts":7,"eng":66,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diasporaconnect-activity-7431601304809975808-8bgI?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"La première cohorte de Diaspora Connect a mis en évidence la mobilisation grandissante de la diaspora africaine pour contribuer activement à l’économie ivoirienne. À leur arrivée à","text":"La première cohorte de Diaspora Connect a mis en évidence la mobilisation grandissante de la diaspora africaine pour contribuer activement à l’économie ivoirienne.\n\nÀ leur arrivée à Abidjan, les 35 talents de la première cohorte ont vécu une semaine d’immersion stratégique : rencontres avec des dirigeants, des leaders de communautés tech, des structures d’innovation et des acteurs institutionnels. Des échanges transparents sur les réalités du marché, suivis d’une intégration en entreprise en adéquation directe avec les besoins concrets du terrain.\n\n📅 Le 25 février, nous ouvrons l’appel à candidature pour la Cohorte 2.\nAvec un focus renforcé sur le parcours professionnel : mission en entreprise ou opportunité de pré-embauche.\n Une sélection rigoureuse.\n Une adéquation précise entre talents et entreprises partenaires.\n Un accompagnement structuré pour sécuriser la mobilité.\n\n✈️ Billet d’avion aller-retour\n 🏠 Logement pendant 4 mois\n 🛂 Visa pris en charge\n 💰 Allocation mensuelle\n\nSi vous êtes un talent prêt à structurer votre retour, cette nouvelle cohorte est pour vous.\n\n🔗 Soyez les premiers informés 👉 https://tally.so/r/vGejJv\n#DiasporaConnect","pid":"7431601304809975808","chars":1160,"hashtags":1,"mentions":0,"link":true,"question":false,"lang":"FR","theme":"Cohorte & immersion"},{"date":"2026-02-25","month":"2026-02","weekday":"Mercredi","hour":16,"reactions":27,"comments":0,"reposts":2,"eng":29,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_les-candidatures-diaspora-connect-sont-ouvertes-activity-7432458260768702465-M5zy?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Les candidatures Diaspora Connect sont ouvertes. 🌍 Le programme Diaspora Connect, c'est 4 mois à Abidjan dans une startup ou entreprise innovante. Une mission concrète, pour un vra","text":"Les candidatures Diaspora Connect sont ouvertes. 🌍\n\nLe programme Diaspora Connect, c'est 4 mois à Abidjan dans une startup ou entreprise innovante. Une mission concrète, pour un vrai impact. Pour certains, ce sera même le début d'une installation durable en Côte d'Ivoire.\n\nLe programme s'adresse aux talents de la diaspora : étudiants en fin d'études ou en césure, jeunes diplômés, professionnels en transition… qui veulent contribuer à la transformation de l'économie ivoirienne depuis l'intérieur.\n\nCe qui est pris en charge : billet d'avion ✈️, visa 📂, logement 🏠 pendant 4 mois, et une semaine d'immersion à l'arrivée pour intégrer l'écosystème local avant même de commencer.\n\nCe programme est porté par la Fondation MStudio en collaboration avec l’Ambassade de France en Côte d’Ivoire et le Ministère de l’Europe et des Affaires étrangères de France. 🇫🇷🇨🇮\n\n🗓️ Candidatures jusqu'au 25 mars 2026 📍 Arrivée en Côte d'Ivoire : le 16 mai à Abidjan 🔗 https://lnkd.in/eEwqYDvg","pid":"7432458260768702465","chars":976,"hashtags":0,"mentions":0,"link":true,"question":false,"lang":"FR","theme":"Cohorte & immersion"},{"date":"2026-02-26","month":"2026-02","weekday":"Jeudi","hour":7,"reactions":58,"comments":0,"reposts":7,"eng":65,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_l%C3%A9cosyst%C3%A8me-tech-ivoirien-recrute-et-il-activity-7432692149109899264-Jsqd?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"L'écosystème tech ivoirien recrute. Et il cherche des profils comme toi. 🌟 Diaspora Connect ouvre officiellement ses candidatures pour la Cohorte #2, et on lance cela avec un webin","text":"L'écosystème tech ivoirien recrute. Et il cherche des profils comme toi. 🌟\n\n\nDiaspora Connect ouvre officiellement ses candidatures pour la Cohorte #2, et on lance cela avec un webinaire d'information le 03 mars.\n\nSi tu te demandes si ce programme est fait pour toi, c'est le moment de venir poser tes questions.\n\nCe que tu pourras découvrir :\n→ Comment fonctionne le programme (mission, sélection, accompagnement)\n→ Les profils et compétences recherchés par les entreprises ivoiriennes\n→ Pourquoi 2026 est une fenêtre à ne pas rater\n\nDiaspora Connect, c'est une immersion de 4 à 6 mois dans une startup ou entreprise innovante à Abidjan, avec billet d'avion, visa et logement pris en charge. Pour certains, ce sera 4-6 mois d'expérience africaine. Pour d'autres, ce sera le début d'une installation durable à Abidjan.\nLe programme est porté par la Fondation Mstudio avec le soutien de l'Ambassade de France en Côte d'Ivoire 🇫🇷🇨🇮\n\n📅 3 mars 2026\n⏰ 17h (Abidjan) / 18h (Paris)\n🔗 Inscription : https://luma.com/8grpaq1v\n\nLes places sont limitées. Et Abidjan, ça n'attend pas. 🚀","pid":"7432692149109899264","chars":1074,"hashtags":1,"mentions":1,"link":true,"question":false,"lang":"FR","theme":"Candidatures & postes"},{"date":"2026-02-27","month":"2026-02","weekday":"Vendredi","hour":7,"reactions":27,"comments":0,"reposts":1,"eng":28,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_nous-avons-un-invit%C3%A9-de-marque-pour-le-activity-7433050799389175808-NQi6?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🎙️ Nous avons un invité de marque pour le webinaire du 3 mars ! Samba LO est le fondateur de Socium, la plateforme tech qui réinvente les process RH en Afrique. Il sera avec nous p","text":"🎙️ Nous avons un invité de marque pour le webinaire du 3 mars !\n\n\nSamba LO est le fondateur de Socium, la plateforme tech qui réinvente les process RH en Afrique. Il sera avec nous pour partager son parcours : comment on construit une carrière tech entre la France et l'Afrique, et ce que ça implique concrètement de faire le saut.\n\nUne conversation à ne pas rater.\n\nCe sera aussi l’occasion de répondre à toutes vos questions pour la Cohorte #2.\n\nPour rappel, Diaspora Connect c'est : \n→ Une immersion de 4 à 6 mois à Abidjan dans une startup ou entreprise innovante, \n→ Billet d'avion ✈️, visa 📂, logement 🏠 pris en charge \n→ Une allocation mensuelle\n→ 20+ entreprises avec 30+ offres qui n’attendent que toi \n\n📅 3 mars 2026 à 17h Abidjan / 18h Paris \n🔗 Inscription : https://luma.com/8grpaq1v","pid":"7433050799389175808","chars":795,"hashtags":1,"mentions":2,"link":true,"question":false,"lang":"FR","theme":"Portraits & témoignages"},{"date":"2026-02-27","month":"2026-02","weekday":"Vendredi","hour":17,"reactions":32,"comments":1,"reposts":4,"eng":37,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diasporaconnect-aen-activity-7433199561935851521-qNX8?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"[NOUS Y SERONS] Ce soir, nous participons à l’afterwork organisé par AEN-African Engineers Network autour du thème : « Les solutions qui font avancer l’Afrique » 🌍 Un moment d’écha","text":"[NOUS Y SERONS] Ce soir, nous participons à l’afterwork organisé par AEN-African Engineers Network autour du thème :\n « Les solutions qui font avancer l’Afrique » 🌍 Un moment d’échanges concrets et de networking entre talents de la diaspora, entrepreneurs et acteurs engagés pour le développement du continent.\n\n👉 Ornella-Ashley Sangronio, notre experte chargée de recrutement Diaspora Connect, sera présente pour échanger avec vous sur :\n • les opportunités professionnelles en Côte d’Ivoire,\n • la prochaine cohorte du programme,\n • et les modalités pour rejoindre l’aventure Diaspora Connect.\n\n📍 RDV au Café des Dames – Paris\n 🕠 À partir de 17h30\nAu plaisir de vous rencontrer et de continuer à créer des ponts entre la diaspora et les écosystèmes africains.\n\n#DiasporaConnect #AEN Gnabeli Murielle YAO","pid":"7433199561935851521","chars":805,"hashtags":2,"mentions":3,"link":false,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-03-02","month":"2026-03","weekday":"Lundi","hour":10,"reactions":112,"comments":6,"reposts":6,"eng":124,"media":"video","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_apr%C3%A8s-avoir-s%C3%A9lectionn%C3%A9-35-talents-parmi-activity-7434183272001339393-ARAR?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Après avoir sélectionné 35 talents parmi plus de 200 candidatures, la première cohorte de Diaspora Connect a confirmé une mobilisation croissante de la diaspora africaine prête à c","text":"Après avoir sélectionné 35 talents parmi plus de 200 candidatures, la première cohorte de Diaspora Connect a confirmé une mobilisation croissante de la diaspora africaine prête à contribuer activement à l’économie du continent africain.\n\nLeur arrivée à Abidjan a été marquée par une semaine d’immersion intense et structurante : rencontres avec des dirigeants, leaders de communautés tech, structures d’innovation, startups et acteurs institutionnels...\n\nAu programme : \n- Des échanges transparents sur les réalités du marché ivoirien.\n- Des discussions concrètes sur l’entrepreneuriat, l’employabilité, les défis du terrain.\n- Des connexions stratégiques avant leur intégration en entreprise.\n\n🌍 Envie de découvrir aussi l’écosystème de l’innovation en Afrique en tant que professionnel(le) ?\nNous ouvrons l'appel à candidature la Cohorte 2 avec un focus renforcé sur le parcours professionnel en stage académique ou en embauche (CDD ou CDI).\n\nPostulez dès maintenant.\n🗓️ Candidatures jusqu'au 25 mars 2026 \n📍 Arrivée en Côte d'Ivoire : le 16 mai à Abidjan \n🔗 https://lnkd.in/dfHSP2vn\nℹ️ Prochains webinaire le 03/03 https://luma.com/8grpaq1v & le 10/03 https://luma.com/ahxn7j89\n\nAperçu des offres :  Chargé.e de levée de fonds (Djoli) ; CTO ( MAFA HOLDING); Assistant.e IA (Eranove) ; Directeur.trice de programme ( ONG Stop au chat noir) ; Responsable Marketing ( FERILI-Groupe Cofina) ; AI Engineer (Artefact) : Stage Analyste Investissement (W.IC) etc…\n\nRéalisation : Yannick Nsanga (YNK STUDIOS)\nLonga Andrea MBUYAMBA Ornella-Ashley Sangronio Leslie Ossete Kirane Yassine Aissata Madina Sylla Moulaye TABOURÉ Steven BEDI Aude-Marie INCHOT Leïla RICHARD - TOUMA Moustapha Ibrahim Malloum Franck Kié Lina Kacyem, CPCU Alexia Amichia Kounandi Stephane Coulibaly Karen Diallo Ama O. Florence TAHIRI epse FADIKA Felicia O. Sangare Zeinabou Sidibe","pid":"7434183272001339393","chars":1848,"hashtags":0,"mentions":20,"link":true,"question":false,"lang":"FR","theme":"Candidatures & postes"},{"date":"2026-03-03","month":"2026-03","weekday":"Mardi","hour":7,"reactions":20,"comments":0,"reposts":2,"eng":22,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_cest-ce-soir-18h-paris-17h-abidjan-activity-7434504099917627393-k-86?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"📅 C'est ce soir ! 18h Paris / 17h Abidjan. Retrouvons-nous dans quelques heures pour le webinaire d'informations sur le lancement de la Cohorte #2 de Diaspora Connect. Au programme","text":"📅 C'est ce soir !  \n\n\n18h Paris / 17h Abidjan.\n \nRetrouvons-nous dans quelques heures pour le webinaire d'informations sur le lancement de la Cohorte #2 de Diaspora Connect.\n\nAu programme : \n→ Tout savoir sur le programme, les offres et le process de candidature \n→ Des réponses en direct à toutes vos questions \n→ Et un invité de marque : Samba LO, fondateur de Socium, vous parlera de son parcours, du marché de l'emploi pour les profils tech, et de ses conseils pour ceux qui veulent faire le saut.\n\n🔗 Inscription (si ce n'est pas encore fait) : https://luma.com/8grpaq1v\n\nOn vous attend ! 🚀","pid":"7434504099917627393","chars":594,"hashtags":1,"mentions":2,"link":true,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-03-04","month":"2026-03","weekday":"Mercredi","hour":8,"reactions":20,"comments":0,"reposts":2,"eng":22,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_dans-le-cadre-de-la-pr%C3%A9paration-%C3%A0-larriv%C3%A9e-activity-7434870256034238465-aDs5?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Dans le cadre de la préparation à l’arrivée de la cohorte Diaspora Connect en Côte d’Ivoire, nous avons organisé un webinaire dédié à l’intégration professionnelle des talents. Int","text":"Dans le cadre de la préparation à l’arrivée de la cohorte Diaspora Connect en Côte d’Ivoire, nous avons organisé un webinaire dédié à l’intégration professionnelle des talents.\n\nIntitulé « Do’s & Don’ts du monde du travail ivoirien : réussir son intégration », cet échange avait pour objectif de donner des repères concrets sur les codes professionnels locaux, les différences culturelles entre la France et la Côte d’Ivoire, et les clés pratiques pour réussir ses premiers mois en entreprise.\n\nAnimé par notre partenaire Cassandra Gomes Portain , fondatrice de Aller Vivre En Afrique, le webinaire s’est appuyé sur des retours d’expérience précis et des situations vécues par des talents en retour ou en installation en Côte d’Ivoire. \n\nCe temps d’échange a confirmé un point essentiel : réussir son retour ne repose pas uniquement sur les compétences techniques, mais aussi sur la compréhension fine des dynamiques culturelles et relationnelles.\n\nMerci à Cassandra pour la qualité de son intervention et aux participants pour la richesse des échanges.","pid":"7434870256034238465","chars":1053,"hashtags":0,"mentions":3,"link":false,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-03-05","month":"2026-03","weekday":"Jeudi","hour":8,"reactions":83,"comments":1,"reposts":5,"eng":89,"media":"video","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_dans-le-cadre-des-rencontres-mensuelles-rythmant-activity-7435233195790446592-wHqn?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Dans le cadre des rencontres mensuelles rythmant la venue de la première cohorte à Abidjan, nous avons eu le privilège d’accueillir Moustapha Ibrahim Malloum, Deputy Director West ","text":"Dans le cadre des rencontres mensuelles rythmant la venue de la première cohorte à Abidjan, nous avons eu le privilège d’accueillir Moustapha Ibrahim Malloum, Deputy Director West Africa chez Proparco.\n\nUn échange dense, stratégique et sans langue de bois sur un sujet central :\n 👉🏾 le rôle du Venture Capital institutionnel dans la transformation des écosystèmes africains.\n\nAu programme :\n🔎 Sa trajectoire personnelle entre diaspora et continent, et ce que signifie “revenir” ou contribuer depuis différents espaces.\n 💼 La stratégie VC de Proparco en Afrique de l’Ouest : thèses d’investissement, secteurs prioritaires, critères d’analyse.\n 📊 Les attentes vis-à-vis des fondateurs : gouvernance, vision long terme, capacité d’exécution.\n 🤝 Le rôle des investisseurs institutionnels dans le dé-risquage de l’innovation et la structuration des marchés.\n\nUn message fort ressort de cette session : L’écosystème ne se construit pas uniquement avec du capital. Il se construit avec de la discipline, de la gouvernance et une vision d’impact alignée avec les réalités locales.\n\nPour la cohorte Diaspora Connect, ce moment était clé : comprendre les codes du financement, décrypter les attentes des investisseurs et projeter leurs trajectoires dans un cadre concret.\n\nMerci à Moustapha Ibrahim Malloum  pour la qualité de son intervention et sa disponibilité.","pid":"7435233195790446592","chars":1354,"hashtags":0,"mentions":4,"link":false,"question":false,"lang":"FR","theme":"Cohorte & immersion"},{"date":"2026-03-05","month":"2026-03","weekday":"Jeudi","hour":12,"reactions":129,"comments":0,"reposts":14,"eng":143,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diasporaafricaine-retourenafrique-abidjan-activity-7435304365873283073-VuGc?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🎙️ Appel à la diaspora ivoirienne 🇨🇮 Vous avez bénéficié d'une formation d'excellence à l'étranger. Et maintenant ? Diaspora Connect s'associe au RBPCI - Réseau des Boursiers de la","text":"🎙️ Appel à la diaspora ivoirienne 🇨🇮\n\nVous avez bénéficié d'une formation d'excellence à l'étranger. Et maintenant ?\n\nDiaspora Connect s'associe au RBPCI - Réseau des Boursiers de la Présidence de Côte d’Ivoire pour un webinaire dédié : une occasion de découvrir comment transformer votre parcours en impact concret sur le terrain, à Abidjan.\n\nAu programme : \n→ Présentation du programme et de ses objectifs \n→ Les profils et compétences recherchés \n→ Les modalités de candidature \n→ Les perspectives concrètes d'insertion\n\n📅 Rendez-vous demain vendredi 6 mars à 17h Abidjan / 18h Paris\n🔗 https://lnkd.in/ecP8HHSh\n\nSi vous avez été formé(e) pour contribuer au développement de la Côte d'Ivoire : voici une porte d'entrée structurée pour le faire.\n🗳️ Pour postuler : https://lnkd.in/eEwqYDvg \n\nNous vous attendons nombreux !\n\n#diasporaafricaine #retourenafrique #abidjan","pid":"7435304365873283073","chars":869,"hashtags":3,"mentions":1,"link":true,"question":false,"lang":"FR","theme":"Convictions & diaspora"},{"date":"2026-03-06","month":"2026-03","weekday":"Vendredi","hour":10,"reactions":41,"comments":2,"reposts":5,"eng":48,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_envie-de-d%C3%A9couvrir-l%C3%A9cosyst%C3%A8me-de-linnovation-activity-7435627484492226560-z3Ow?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🌍 Envie de découvrir l’écosystème de l’innovation en Afrique en tant que professionnel(le)? 💡 Diaspora Connect permet à des talents de la diaspora africaine de venir réaliser une e","text":"🌍 Envie de découvrir l’écosystème de l’innovation en Afrique en tant que professionnel(le)?\n\n💡 Diaspora Connect permet à des talents de la diaspora africaine de venir réaliser une expérience professionnelle en Côte d’Ivoire \n\nConcrètement, deux parcours sont proposés : \n1️⃣ Le parcours Professionnel – 4 ou 6 mois d’immersion ou de pré-embauche au sein d’une entreprise innovante à Abidjan en stage ou en embauche (CDD et CDI) \n2️⃣ Le parcours Entrepreneur – à venir\n\nLe programme prévoit une prise en charge couvrant l’hébergement, les frais de voyage et documents de voyage.\n\nExemples de postes :  Assistant IA (Eranove) ; CTO (MAFA HOLDING) ; Directeur de programme (ONG Stop au chat noir) ; Responsable Marketing (FERILI-Groupe Cofina) ; AI Engineer (Artefact) etc…\n\n🗓️ Candidatures du 25 février 2026 au 25 mars 2026 \n📍 Arrivée en Côte d'Ivoire : fin mai 2026 \n🔗 Postulez dès maintenant : https://lnkd.in/eEwqYDvg \nℹ️ Prochain webinaire 10/03 https://luma.com/ahxn7j89","pid":"7435627484492226560","chars":974,"hashtags":0,"mentions":0,"link":true,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-03-09","month":"2026-03","weekday":"Lundi","hour":7,"reactions":24,"comments":0,"reposts":2,"eng":26,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_ne-nous-croyez-pas-sur-parole-mardi-activity-7436678466797977600-vdUW?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🎙️ Ne nous croyez pas sur parole. Mardi, des membres de la Cohorte actuelle de Diaspora Connect seront en direct pour vous parler de leur expérience, sans filtre. Ce qu'ils vivent ","text":"🎙️ Ne nous croyez pas sur parole.\n\n\nMardi, des membres de la Cohorte actuelle de Diaspora Connect seront en direct pour vous parler de leur expérience, sans filtre.\n\nCe qu'ils vivent à Abidjan. Ce qu'ils n'avaient pas anticipé. Ce que le programme leur a vraiment apporté jusqu'ici.\n\nCe sera l’occasion de découvrir leurs témoignages et leur poser toutes vos questions.\n\nIl y a quelques mois, ils étaient à votre place.\n\nEt si vous étiez le prochain ?\n\nLa Cohorte #2 démarre en mai, plus que 2 semaines pour candidater !\n\n📅 Mardi 10 mars \n🕕 18h CET (Paris) / 17h GMT (Abidjan) \n🔗 https://luma.com/ahxn7j89","pid":"7436678466797977600","chars":605,"hashtags":1,"mentions":0,"link":true,"question":true,"lang":"FR","theme":"Portraits & témoignages"},{"date":"2026-03-09","month":"2026-03","weekday":"Lundi","hour":12,"reactions":47,"comments":3,"reposts":4,"eng":54,"media":"file","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diaspora-connect-fin-des-candidatures-le-activity-7436750173034328065-kcWT?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🌍 Ces postes vous attendent ! Vous êtes de la diaspora africaine et souhaitez découvrir l’écosystème de l’innovation en Côte d’Ivoire en tant que professionnel(le) ? Plusieurs entr","text":"🌍 Ces postes vous attendent !\n\nVous êtes de la diaspora africaine et souhaitez découvrir l’écosystème de l’innovation en Côte d’Ivoire en tant que professionnel(le) ?\n\nPlusieurs entreprises et startups ivoiriennes participent à notre programme pour offrir des opportunités concrètes.\n\nVoici un aperçu des entreprises partenaires qui recrutent :\n📈 Mafa Holding (Finance & Tech) – recherche un(e) CTO et un(e) CFO\n🚗 Eccomob (Mobilité Electrique) – recherche un(e) Chief of Staff\n🏦 Ferili CI - Groupe Cofina (Finance) – recherche un(e) Responsable Marketing et Communication\n👩‍💻 Artefact (Tech) – recherche un(e) AI Engineer et un(e) Analytics Engineer\n\n💼 À travers ce programme, vous pourrez :\n- Vous immerger dans les équipes de ces entreprises et découvrir leurs projets de l’intérieur,\n- Mettre vos compétences au service de leurs ambitions,\n- Expérimenter le quotidien professionnel en Afrique dans un cadre structuré et bienveillant.\n\n🔗 Candidatures ouvertes jusqu’au 25 mars 2026\n👉 Postulez sur : https://lnkd.in/eQzEhWJx","pid":"7436750173034328065","chars":1025,"hashtags":0,"mentions":0,"link":true,"question":false,"lang":"FR","theme":"Candidatures & postes"},{"date":"2026-03-10","month":"2026-03","weekday":"Mardi","hour":8,"reactions":80,"comments":3,"reposts":6,"eng":89,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_ce-soir-d%C3%A9couvrez-comment-construire-activity-7437044708209561600-atpD?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🌍 Ce soir : découvrez comment construire une expérience professionnelle en Côte d’Ivoire avec Diaspora Connect en stage ou en embauche ! Ils ont fait le choix de tenter l’expérienc","text":"🌍 Ce soir : découvrez comment construire une expérience professionnelle en Côte d’Ivoire avec Diaspora Connect en stage ou en embauche ! \n\nIls ont fait le choix de tenter l’expérience.\nCertains sont venus pour une mission de courte durée afin de découvrir l’écosystème entrepreneurial ivoirien. D’autres ont fait le pari d’un projet professionnel sur le long terme sur le continent.\nL’une d’entre elles a fait le choix de revenir s’installer en tant que jeune maman. Et certains profils très techniques ont décidé de mettre leur expertise au service d’entreprises tech en pleine croissance.\n\nChacun est arrivé avec des objectifs précis, un parcours différent et une vision personnelle de ce que peut être un retour professionnel en Afrique.\n\nCe soir, quatre membres de la première cohorte Diaspora Connect, arrivés en Côte d’Ivoire en janvier 2026, partageront leur expérience :\n👩🏾‍🎓 Maryama Diomande – Venture Capital Analyst chez Kinaya Ventures\n🎨 Michèle-Mégane NTCHAM – Community Manager chez ART DEPARTMENT\n💻 Dro Kieu DÉLI – IA, Machine Learning, Data Scientist chez Daba\n📣 Nawata KARAMOKO – Marketing & Communication chez Afrisends\n\nIls reviendront sur :\n• leur arrivée en Côte d’Ivoire\n• leur mission en entreprise\n• leur intégration dans l’écosystème local\n• et les réalités concrètes du marché ivoirien.\n\n📅 Ce soir – Mardi 10 mars 2026\n⏰ 17h (Abidjan) / 18h (Paris)\n📍 En ligne – inscription sur https://luma.com/ahxn7j89 \n📝 Les candidatures pour la prochaine cohorte sont ouvertes jusqu’au 25 mars 2026.\n👉 https://lnkd.in/eEwqYDvg\n\nSi vous vous posez la question d’un retour professionnel structuré vers le continent, ce webinaire est fait pour vous.\n\nLaïssa Mouen Anaïs Marie-Axelle Allou Zeinabou Sidibe Boum III Jr","pid":"7437044708209561600","chars":1726,"hashtags":0,"mentions":13,"link":true,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-03-11","month":"2026-03","weekday":"Mercredi","hour":8,"reactions":26,"comments":0,"reposts":2,"eng":28,"media":"file","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diaspora-connect-c it exprès. 👀 🎯 100 candidatures. En 15 jours. Aujourd'hui, nous sommes exactement à mi-parcours de notre appe","text":"On ne sait pas si c'est un hasard, mais on soupçonne que vous l'avez fait exprès. 👀\n\n\n🎯 100 candidatures. En 15 jours.\n\nAujourd'hui, nous sommes exactement à mi-parcours de notre appel à candidatures pour la Cohorte d'été de Diaspora Connect, et la barre des 100 vient de tomber.\n\nPour rappel, le programme propose à des talents de la diaspora africaine formés en Europe une immersion professionnelle de 4 à 6 mois à Abidjan, au sein de startups et grandes entreprises innovantes. \n\nLe billet d'avion, le visa et le logement sont pris en charge par le programme.\n\nDes entreprises comme BLOK, CFAO Consumer, Green-Pay, Epitech Côte d'Ivoire et bien d'autres, recrutent en stage, CDD et CDI. \n\nIl reste 14 jours. \n\nSi vous attendiez pour vous lancer : c'est le moment.\n\n👉 Pour postuler : https://lnkd.in/eEwqYDvg\n\n#Abidjan #DiasporaAfricaine #Opportunités","pid":"7437523988119166976","chars":853,"hashtags":3,"mentions":4,"link":true,"question":false,"lang":"FR","theme":"Candidatures & postes"},{"date":"2026-03-13","month":"2026-03","weekday":"Vendredi","hour":8,"reactions":35,"comments":0,"reposts":6,"eng":41,"media":"file","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diaspora-connect-recrutement-jusquau-25-activity-7438132311662981122-rQ8w?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🌍 Ces postes vous attendent ! Vous êtes de la diaspora africaine et souhaitez découvrir l’écosystème de l’innovation en Côte d’Ivoire en tant que professionnel(le) ? Plusieurs entr","text":"🌍 Ces postes vous attendent !\n\nVous êtes de la diaspora africaine et souhaitez découvrir l’écosystème de l’innovation en Côte d’Ivoire en tant que professionnel(le) ?\n\nPlusieurs entreprises et startups ivoiriennes participent à notre programme pour offrir des opportunités concrètes.\ prises partenaires qui recrutent :\n📈 Kinaya Ventures (Finance)– recherche un(e) Investment Associate, un(e) Software Engineer, un(e) AI & Data Associate et un(e) Product Associate\n💳 Green-Pay (Fintech) – recherche un(e) Responsable des Opérations\n🛒 CFAO Consumer (Retail) – recherche un(e) Assistant(e) Manager\n🎓 Epitech Côte d'Ivoire (Formation) – recherche un(e) Adjoint(e) au responsable Pédagogique et Master\n🏠 Gaïa Nova (Matériaux et Décoration) - recherche un(e) Chargé(e) de Marketing & Brand Experience \n\n💼 À travers ce programme, vous pourrez :\n- Vous immerger dans les équipes de ces entreprises et découvrir leurs projets de l’intérieur,\n- Mettre vos compétences au service de leurs ambitions,\n- Expérimenter le quotidien professionnel en Afrique dans un cadre structuré et bienveillant.\n\n🔗 Candidatures ouvertes jusqu’au 25 mars 2026\n👉 Postulez sur : https://lnkd.in/eQzEhWJx","pid":"7439614067469832192","chars":1197,"hashtags":0,"mentions":5,"link":true,"question":false,"lang":"FR","theme":"Candidatures & postes"},{"date":"2026-03-17","month":"2026-03","weekday":"Mardi","hour":15,"reactions":11,"comments":0,"reposts":4,"eng":15,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diasporaconnect-abidjan-caektedivoire-activity-7439698318462582784-8j9_?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🔔 Dernier appel ! Déjà 140 candidatures reçues. Si vous attendiez le bon moment pour postuler, c'est maintenant. Retrouvons-nous jeudi 19 mars pour le dernier de nos webinaires d'i","text":"🔔 Dernier appel !\n\n\nDéjà 140 candidatures reçues. Si vous attendiez le bon moment pour postuler, c'est maintenant.\n\nRetrouvons-nous jeudi 19 mars pour le dernier de nos webinaires d'information. \n\nSi le programme Diaspora Connect vous intéresse mais qu'il vous reste quelques questions avant de postuler, ce webinaire est fait pour vous.\n\nNous vous présenterons le programme en détail, les offres disponibles à Abidjan, et nous répondrons à toutes vos questions en direct. \n\nPour rappel, Diaspora Connect c'est : \n→ Une immersion de 4 à 6 mois à Abidjan dans une startup ou entreprise innovante \n→ Billet d'avion ✈️, visa 📂, logement 🏠 pris en charge \n→ Une allocation mensuelle versée par l'entreprise \n→ 30+ entreprises avec 50+ offres qui n'attendent que vous\n\n📅 Jeudi 19 mars 🕔 17h Abidjan | 18h Paris \n🔗 Inscription : https://luma.com/3ocnc368\n\nLes candidatures ferment le 25 mars. Ne laissez pas passer votre chance !\n\n#DiasporaConnect #Abidjan #CôtedIvoire #Diaspora #Afrique","pid":"7439698318462582784","chars":982,"hashtags":5,"mentions":0,"link":true,"question":false,"lang":"FR","theme":"Candidatures & postes"},{"date":"2026-03-18","month":"2026-03","weekday":"Mercredi","hour":7,"reactions":15,"comments":2,"reposts":0,"eng":17,"media":"video","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_un-jour-ils-ont-fait-un-choix-revenir-activity-7439939928353935361-wtNV?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Un jour ils ont fait un choix. (Re)venir construire en Afrique. Avec ACT LIKE, nous lançons une série de capsules vidéo courtes qui donnent la parole à celles et ceux qui ont franc","text":"Un jour ils ont fait un choix.\n\n(Re)venir construire en Afrique.\n\nAvec ACT LIKE, nous lançons une série de capsules vidéo courtes qui donnent la parole à celles et ceux qui ont franchi le pas.\n\nEntrepreneurs, investisseurs, experts, dirigeants... Tous ont un point commun : avoir choisi de mettre leurs compétences au service de l'écosystème africain.\n\nDans chaque épisode, une question simple : \"Le retour en Afrique m'évoque...\"\n\nEt derrière cette phrase, des trajectoires, des convictions et des expériences concrètes.\n\nAu fil des capsules, vous découvrirez les témoignages de profils engagés comme Élisabeth Moreno, Steven BEDI, Régis Bamba, Sophie Tall et bien d'autres acteurs de la diaspora qui participent à transformer leur ecosystème locaux.\n\nCar le retour peut aussi être une dynamique collective qui crée des ponts entre la diaspora et les économies africaines.\n\n---\n\nACT LIKE, une série de capsules par Diaspora Connect pour montrer les trajectoires qui existent et en inspirer d'autres.","pid":"7439939928353935361","chars":1000,"hashtags":0,"mentions":4,"link":false,"question":false,"lang":"FR","theme":"Portraits & témoignages"},{"date":"2026-03-19","month":"2026-03","weekday":"Jeudi","hour":8,"reactions":100,"comments":3,"reposts":7,"eng":110,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_nous-avons-une-invit%C3%A9e-de-marque-ce-soir-activity-7440310685483520002-8D0C?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🎙️ Nous avons une invitée de marque ce soir ! Elle a commencé data analyst. Aujourd'hui elle est Head of Data Analytics chez Djamo, l'une des fintechs les plus prometteuses d'Afriq","text":"🎙️ Nous avons une invitée de marque ce soir !\n\n\nElle a commencé data analyst. Aujourd'hui elle est Head of Data Analytics chez Djamo, l'une des fintechs les plus prometteuses d'Afrique francophone.\n\nEn moins de 5 ans à Abidjan.\n\nMarie-Laure M'Bahia sera notre invitée pour notre dernier webinaire d'informations. Elle nous parlera de son parcours entre Montréal, Paris et Abidjan.\n\nElle répondra à la question que tout le monde se pose : rentrer « tôt » dans sa carrière ou attendre encore un peu ?\n\nCe sera aussi l’occasion de répondre à vos dernières questions sur le programme, avant la fin de notre appel à candidatures.\n\nPour rappel, Diaspora Connect c'est : \n→ Une immersion de 4 à 6 mois à Abidjan dans une startup ou entreprise innovante, \n→ Billet d'avion ✈️, visa 📂, logement 🏠 pris en charge \n→ Une allocation mensuelle \n→ 30+ entreprises avec 50+ offres qui n’attendent que vous\n\n📅 19 mars 2026 à 17h Abidjan / 18h Paris \n🔗 Inscription : https://luma.com/3ocnc368\n\nLes candidatures ferment le 25 mars. Plus que quelques jours.","pid":"7440310685483520002","chars":1038,"hashtags":0,"mentions":2,"link":true,"question":false,"lang":"FR","theme":"Portraits & témoignages"},{"date":"2026-03-19","month":"2026-03","weekday":"Jeudi","hour":16,"reactions":17,"comments":0,"reposts":2,"eng":19,"media":"file","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_fin-des-candidatures-diaspora-connect-ce-activity-7440426871340797952-RFVD?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🌍 Ces postes vous attendent ! Vous êtes de la diaspora africaine et souhaitez découvrir l’écosystème de l’innovation en Côte d’Ivoire en tant que professionnel(le) ? Plusieurs entr","text":"🌍 Ces postes vous attendent !\n\nVous êtes de la diaspora africaine et souhaitez découvrir l’écosystème de l’innovation en Côte d’Ivoire en tant que professionnel(le) ?\n\nPlusieurs entreprises et startups ivoiriennes participent à notre programme pour offrir des opportunités concrètes.\n\nVoici un aperçu des entreprises partenaires qui recrutent :\nASENSIA AFRICA GROUP (Relations Publiques)– recherche un(e) Digital & Influence Growth Manager\n💳 Djoli (Agritech/Foodtech) – recherche un(e) Chargé.e de Levée de Fonds\n🛒 Dynamiques et Excellentes d'Afrique (ONG) – recherche une Responsable Projet et Levée de Fonds\n🎓 Komian - YESHI GROUP (IA & Data) – recherche un(e) AI & Data Innovation Engineer \n\n\n💼 À travers ce programme, vous pourrez :\n- Vous immerger dans les équipes de ces entreprises et découvrir leurs projets de l’intérieur,\n- Mettre vos compétences au service de leurs ambitions,\n- Expérimenter le quotidien professionnel en Afrique dans un cadre structuré et bienveillant.\n\n⏳ Candidatures ouvertes jusqu’au 25 mars 2026\n👉 Postulez sur : https://lnkd.in/eQzEhWJx","pid":"7440426871340797952","chars": tps://www.linkedin.com/posts/diaspora-connect-cotedivoire_nomm%C3%A9-ambassadeur-de-linnovation-de-la-r%C3%A9publique-activity-7442116333992996865-Lln3?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Nommé Ambassadeur de l’innovation de la République de Côte d’Ivoire, Steven BEDI ne l’est pas devenu par hasard. Entrepreneur, il est derrière PUSH Côte d'Ivoire , qui développe de","text":"Nommé Ambassadeur de l’innovation de la République de Côte d’Ivoire,\nSteven BEDI ne l’est pas devenu par hasard.\n\nEntrepreneur, il est derrière PUSH Côte d'Ivoire , qui développe des services financiers digitaux pour les populations non bancarisées,\net à l’origine de Tylimmo Africa , une plateforme qui modernise l’accès au logement.\n\nMais son impact dépasse ses entreprises :\n\n👉 Contribution à la Startup Act ivoirienne\n👉 Initiateur du Le #Ci20 , le collectif des startups\n👉 Lancement d’initiatives comme Startup4Gouv et Startup Boost Capital etc...\n\nC’est cette capacité à créer des solutions et structurer un écosystème entier qui lui vaut cette reconnaissance.\n\n“Diaspora Connect permet de rentrer utile.”\n\n📺 ACT LIKE – Diaspora Connect\nDes trajectoires qui s’ancrent. Des choix qui transforment.\n\n🎥 Épisode disponible.","pid":"7442116333992996865","chars":824,"hashtags":1,"mentions":4,"link":false,"question":false,"lang":"FR","theme":"Portraits & témoignages"},{"date":"2026-03-24","month":"2026-03","weekday":"Mardi","hour":15,"reactions":12,"comments":5,"reposts":2,"eng":19,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_lappel-%C3%A0-candidatures-dediaspora-connect-activity-7442235698385965056-sElp?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"L’appel à candidatures de Diaspora Connect – Cohorte 2 touche bientôt à sa fin. Demain, nous clôturons une nouvelle phase de sélection pour connecter des talents de la diaspora afr","text":"L’appel à candidatures de Diaspora Connect – Cohorte 2 touche bientôt à sa fin.\n\nDemain, nous clôturons une nouvelle phase de sélection pour connecter des talents de la diaspora africaine à des opportunités concrètes en Côte d’Ivoire : stages, immersions professionnelles, ou pré-embauche.\n\nDepuis la première cohorte, ce sont déjà des profils engagés, qui ont fait le choix de s’ancrer, de contribuer, et d'investir dans leur expérience ici.\n\n👉 Si vous hésitez encore, c’est maintenant.\n👉 Si vous connaissez des profils concernés, c’est le moment de partager.\n\n🔗 Postuler : https://lnkd.in/eEwqYDvg\n\nParce que revenir, ce n’est pas seulement une idée.\nC’est une décision qui se structure.","pid":"7442235698385965056","chars":689,"hashtags":0,"mentions":1,"link":true,"question":false,"lang":"FR","theme":"Candidatures & postes"},{"date":"2026-03-26","month":"2026-03","weekday":"Jeudi","hour":10,"reactions":24,"comments":5,"reposts":4,"eng":33,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_prolongation-exceptionnelle-des-candidatures-activity-7442876947627458563-K9lW?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"🚨 Prolongation exceptionnelle des candidatures Suite à un bug technique rencontré sur notre plateforme de candidature hier, plusieurs d’entre vous n’ont pas pu finaliser leur inscr","text":"🚨 Prolongation exceptionnelle des candidatures\n\nSuite à un bug technique rencontré sur notre plateforme de candidature hier, plusieurs d’entre vous n’ont pas pu finaliser leur inscription.\nNous avons donc pris la décision de prolonger exceptionnellement l’appel à candidatures jusqu’à demain vendredi à 12h (CET).\n\nNous nous excusons sincèrement pour ce désagrément et vous remercions pour votre patience et vos nombreux messages.\n\n👉 Si vous n’avez pas encore pu postuler, vous avez encore quelques heures pour le faire via ce lien.\n🔗 https://tally.so/r/jaLG1R\n\nMerci pour votre engagement et l’intérêt que vous portez au programme.","pid":"7442876947627458563","chars":632,"hashtags":0,"mentions":0,"link":true,"question":false,"lang":"FR","theme":"Candidatures & postes"},{"date":"2026-05-07","month":"2026-05","weekday":"Jeudi","hour":14,"reactions":66,"comments":0,"reposts":2,"eng":68,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_scale-faster-the-african-way-retrouvez-nous-activity-7458164532490874880-wSbL?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Scale Faster, the African Way 🌍 Retrouvez-nous ce soir pour notre M'Talk Diaspora Connect × Epitech Afrique x We.Code sur le growth marketing et l'IA en Afrique de l'Ouest. Nous re","text":"Scale Faster, the African Way 🌍\n\n\nRetrouvez-nous ce soir pour notre M'Talk Diaspora Connect × Epitech Afrique x We.Code sur le growth marketing et l'IA en Afrique de l'Ouest. \n\nNous recevons deux experts qui pilotent la croissance de startups africaines au quotidien : \n→ Gio Maglo, Head of Marketing & Growth chez Djamo\n→ Gaël A., fondateur de Growth marketing AI  & Directeur Marketing & Grotwh chez Ubuntu Tribe \n\n📍 Epitech Côte d'Ivoire \n🕓 À partir de 17h","pid":"7458164532490874880","chars":459,"hashtags":0,"mentions":6,"link":false,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-05-13","month":"2026-05","weekday":"Mercredi","hour":13,"reactions":81,"comments":7,"reposts":9,"eng":97,"media":"file","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_bilan-appel-%C3%A0-candidatures-cohorte-2-diaspora-activity-7460315784825733121-iqjU?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"COUNTDOWN J-3 ! 🥳 Akwaba 🇨🇮 Ce samedi 16 mai, la Cohorte 2 de Diaspora Connect démarre officiellement son aventure à Abidjan ! Avec 300+ candidatures reçues, les 26 talents sélecti","text":"COUNTDOWN J-3 ! 🥳\n\n\nAkwaba 🇨🇮\n\nCe samedi 16 mai, la Cohorte 2 de Diaspora Connect démarre officiellement son aventure à Abidjan !\n\nAvec 300+ candidatures reçues, les 26 talents sélectionnés s’apprêtent à s’investir pleinement dans les missions proposées par nos 20 entreprises partenaires.\n\nEt une belle nouveauté cette année : 2 embauches directes en CDI et CDD sur des postes seniors. Un témoignage concret de la confiance qui grandit pour le programme, aussi bien côté entreprises que côté candidats.\n\nAvec ces 2 appels à candidatures, nous voyons que le programme prendre un peu plus d'ampleur. Nous mesurons à quel point il y a un vrai besoin, une vraie envie, une vraie énergie autour de ces dynamiques de mobilité et de retour vers le continent.\n\nMerci à toutes les personnes candidates qui ont cru au programme. \n\nMerci aux entreprises partenaires qui ouvrent leurs portes. \n\nMerci à tous ceux qui soutiennent Diaspora Connect depuis le début. 🚀\n\nLonga Andrea MBUYAMBA Ornella-Ashley S. Leslie Ossete Mstudio Penda Sow Marwa Ahmed","pid":"7460315784825733121","chars":1038,"hashtags":0,"mentions":6,"link":false,"question":false,"lang":"FR","theme":"Cohorte & immersion"},{"date":"2026-05-18","month":"2026-05","weekday":"Lundi","hour":13,"reactions":83,"comments":3,"reposts":6,"eng":92,"media":"file","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_mentor-cohorte-2-diaspora-connect-activity-7462139697218252800-ATQp?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"La Cohorte 2 de Diaspora Connect a sa mentor de promotion. 🇨🇮 Nous sommes heureux et fiers d'annoncer que Penda Sow accompagnera les 26 talents de cette nouvelle promotion, succéda","text":"La Cohorte 2 de Diaspora Connect a sa mentor de promotion. 🇨🇮\n\n\nNous sommes heureux et fiers d'annoncer que Penda Sow accompagnera les 26 talents de cette nouvelle promotion, succédant ainsi à Steven Bedi, mentor de la Cohorte 1.\n\nDiplômée de l'Institut Mines-Télécom Business School, Penda a construit un parcours d'exception : du conseil stratégique à Dakar, au management de projets complexes chez Thales, jusqu'à près de huit ans chez EY à Paris où elle a accompagné des multinationales comme TotalEnergies et Louis Vuitton sur des missions de gouvernance IT et d'audit. \n\nElle a ensuite choisi de poser ses compétences au service du continent, en tant que Direction Générale de Paps CI & Bénin, puis de CASH DEAL Côte d'Ivoire au sein du Groupe COFINA.\n\nElle mettra à disposition son expérience, son réseau et sa vision pour inspirer les talents de la diaspora et renforcer les ponts entre l'Europe et l'Afrique.\n\nCette collaboration reflète notre volonté d'impliquer des acteurs clés de l'écosystème ivoirien pour inspirer, guider et soutenir les parcours de celles et ceux qui souhaitent contribuer concrètement au développement économique du continent.\n\nLes 26 membres de la Cohorte 2 sont arrivés à Abidjan. Ils la rencontrent demain. 🤝","pid":"7462139697218252800","chars":1245,"hashtags":0,"mentions":3,"link":false,"question":false,"lang":"FR","theme":"Cohorte & immersion"},{"date":"2026-05-19","month":"2026-05","weekday":"Mardi","hour":11,"reactions":81,"comments":0,"reposts":8,"eng":89,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_akwaba-%C3%A0-abidjan-la-cohorte-2-de-diaspora-activity-7462457023163498497-AjZf?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Akwaba à Abidjan. 🇨🇮 La Cohorte 2 de Diaspora Connect démarre officiellement sa semaine d'immersion. 300 candidatures. Un processus de sélection exigeant. Et au bout : une cohorte ","text":"Akwaba à Abidjan. 🇨🇮\nLa Cohorte 2 de Diaspora Connect démarre officiellement sa semaine d'immersion.\n\n300 candidatures. Un processus de sélection exigeant. Et au bout : une cohorte de talents qui ont décidé que c'était le moment — de revenir, de s'ancrer, de contribuer.\n\nCette semaine, ils plongent au cœur de l'écosystème ivoirien. Rencontres avec des entrepreneurs, visites d'entreprises, échanges sans filtre avec des acteurs du terrain. Une immersion pensée pour transformer une intention en trajectoire concrète.\n\nSuivez notre semaine en direct sur notre compte Instagram ! \n\nEt jeudi 21 mai, nous les retrouvons pour Diaspora, Mobilité et Retours 2 — un temps fort pour réunir les deux cohortes, nos entreprises partenaires et les acteurs de l'écosystème autour d'une question centrale : comment faire de la mobilité diasporique un levier structurant pour l'économie africaine ?\n\n📅 Jeudi 21 mai · 14h00 – 21h00 \n🔗 Inscription : https://luma.com/hg3s81sc\n\nDiary Ngam Sokhna Bousso Sakho Audrey Naré Sourayat ISSA Hilaire Kouadio Paul-Marie NTABO Mélaine Sandra DJIKIADJIE Yaba,Anniella Coffie Patricia A. Naomie Ndolethe Wondayi Mayqueen GBEDO Nino Chibuzor Nwachukwu R. Estelle N. Jackye Carole MPECK Tchohodjo  Adjaratou YEO Daouda Selim Traore Grâce-Orianne ALLOU @nouna couli\n\nOrnella-Ashley Sangronio Kirane Yassine Leslie Ossete Fondation Mstudio Marwa Ahmed","pid":"7462457023163498497","chars":1370,"hashtags":0,"mentions":21,"link":true,"question":false,"lang":"FR","theme":"Cohorte & immersion"},{"date":"2026-05-19","month":"2026-05","weekday":"Mardi","hour":17,"reactions":16,"comments":0,"reposts":3,"eng":19,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_diaspora-mobilit%C3%A9-et-retoursnous-organisons-activity-7462552564832788480-vGIS?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"[📆 Diaspora, Mobilité et Retours] Nous organisons ce jeudi 21 mai à Abidjan l’événement « Diaspora, Mobilité et Retours 2 », dans le cadre de notre programme. En moins d’un an, not","text":"[📆 Diaspora, Mobilité et Retours] Nous organisons ce jeudi 21 mai à Abidjan l’événement « Diaspora, Mobilité et Retours 2 », dans le cadre de notre programme.\n\nEn moins d’un an, notre programme a permis de structurer une réponse opérationnelle concrète à une question qui mobilise aujourd’hui gouvernements, institutions et entreprises : comment transformer le potentiel de la diaspora africaine en impact économique réel ? \n\n📊Notre réponse : \n+ de 60 talents insérés dans + de 40 entreprises ivoiriennes\n+ 50 % d’Ivoiriens de la diaspora au sein de nos candidatures pour la Cohorte 2 et + de 12 pays africains et de la Caraïbe représentés \n+ de 20 MoU signés avec des clubs Afrique de Grandes Écoles et réseaux diaspora\n\n📆 Au programme :\n•⁠ ⁠Panel talk-show Choose Your Mentor, avec des speakers dont les parcours incarnent ce que « s’engager autrement » signifie concrètement\n•⁠ ⁠Présentation des résultats de Diaspora Connect et témoignages\n•⁠ ⁠3 ateliers thématiques co-animés par HEC Paris in Africa, Abidjanaises In Tech (Connect IA) , Women's Investment Club (WIC) Côte d'Ivoire , French Tech Abidjan , Réseau Ivoirien des Diplômés de la Diaspora (RIDD) et l’ African Business Club \n•⁠ ⁠Restitution des recommandations en plénière & Prestation artistique \n•⁠ ⁠Cocktail dînatoire & networking\n\n📆 Jeudi 21 mai 2026 — 14h00 – 21h00\n📍 Byblos Hôtel, Abidjan (https://lnkd.in/dD25XqMg) \n\nInscription obligatoire, places limitées :\nhttps://luma.com/hg3s81sc","pid":"7462552564832788480","chars":1457,"hashtags":0,"mentions":8,"link":true,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-05-20","month":"2026-05","weekday":"Mercredi","hour":17,"reactions":13,"comments":0,"reposts":3,"eng":16,"media":"file","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_j-1-diaspora-mobilit%C3%A9-et-retours-activity-7462917371213701120-703e?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"J-1 avant Diaspora, Mobilité et Retours 2 Demain, nous réunissons à Abidjan décideurs publics, entreprises, investisseurs, institutions, réseaux diaspora et talents engagés autour ","text":"J-1 avant Diaspora, Mobilité et Retours 2 \n\nDemain, nous réunissons à Abidjan décideurs publics, entreprises, investisseurs, institutions, réseaux diaspora et talents engagés autour d’une question devenue centrale pour nos économies : Comment transformer les dynamiques de retour et de mobilité en levier concret d’impact économique ?\n\nNous parlerons de circulation des compétences, de transmission, d’opportunités, d’engagement et de la manière dont les talents africains peuvent contribuer durablement au développement du continent.\nNous sommes ravis de vous partager le programme officiel et les speakers de notre Talk-show qui incarnent concrètement ces dynamiques :\n• Penda Sow — Directrice Générale Ferili Groupe Cofina\n• Mahamane Sow — Vice-président EDF Afrique de l’Ouest et Centrale & DG EDF Côte d’Ivoire\n• Jean Yves Bragbo — Entrepreneur & Conférencier\n• Leslie Ossete — COO & Co-founder Mstudio\nModération : Malick Diabaté ( Choose Your Mentor)\n\nAvec également la participation de :\nChoose Your Mentor, HEC Paris - Innovation & Entrepreneurship Institute  Abidjanaises In Tech , Women's Investment Club (WIC) Côte d'Ivoire,   French Tech Abidjan, Réseau Ivoirien des Diplômés de la Diaspora et African Business Club.\nLa modération sera assurée par Charm Matuba. \n\nAu programme : talk-show filmé, ateliers thématiques, recommandations, networking et conversations sans filtre sur les réalités du retour, de l’emploi, de l’investissement et des talents.","pid":"7462917371213701120","chars":1464,"hashtags":0,"mentions":12,"link":false,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-05-20","month":"2026-05","weekday":"Mercredi","hour":18,"reactions":26,"comments":0,"reposts":5,"eng":31,"media":"file","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_communaut%C3%A9s-et-r%C3%A9seaux-activity-7462935855385706501-Pf4U?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"J-1 avant Diaspora, Mobilité et Retours 2 ✨ Cette édition donnera aussi une place centrale aux ateliers collaboratifs, conçus comme de véritables espaces de réflexion et de recomma","text":"J-1 avant Diaspora, Mobilité et Retours 2 ✨\n\nCette édition donnera aussi une place centrale aux ateliers collaboratifs, conçus comme de véritables espaces de réflexion et de recommandations orientées vers l’action.\n\nNous sommes particulièrement heureux de pouvoir compter sur des communautés, réseaux et acteurs engagés qui contribuent au quotidien à structurer les écosystèmes de talents, d’innovation, d’investissement et d’entrepreneuriat entre l’Afrique et ses diasporas.\n\n🔹 Atelier 1 — Structuration et mise en réseau de la diaspora de retour\nCo-animé par :\n• Réseau Ivoirien des Diplômés de la Diaspora (RIDD) (Steve Essis)\n• African Business Club (Yannick Mekwegne)\n🔹 Atelier 2 — S’engager autrement : investir ses compétences, mobiliser ses capitaux\nCo-animé par :\n• Women's Investment Club (WIC) Côte d'Ivoire (Lika DOUKOURE-SZAL)\n• French Tech Abidjan ( Sandra M. )\n🔹 Atelier 3 — Employabilité, coopération éducative et transfert de compétences\nCo-animé par :\n• Abidjanaises In Tech et CONNECT IA (Babel BALSOMI)\n• HEC Paris in Africa (Sophia El Hajaj )\n\nCes ateliers réuniront entreprises, talents, investisseurs, réseaux diaspora, institutions et acteurs de l’innovation autour de discussions concrètes sur les enjeux de mobilité, d’intégration, d’investissement, d’employabilité et de souveraineté économique.\n\n📅 Jeudi 21 mai 2026\n🕑 14h00 – 21h00\n📍 Byblos Hôtel","pid":"7462935855385706501","chars":1374,"hashtags":0,"mentions":11,"link":false,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-05-21","month":"2026-05","weekday":"Jeudi","hour":7,"reactions":10,"comments":0,"reposts":0,"eng":10,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_la-direction-g%C3%A9n%C3%A9rale-des-ivoiriens-de-lext%C3%A9rieur-activity-7463128964669026304-kkii?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"La DIRECTION GÉNÉRALE DES IVOIRIENS DE L'EXTÉRIEUR ( DGIE) et CEPICI Officiel participeront demain à Diaspora, Mobilité et Retours 2 aux côtés d’entreprises, investisseurs, réseaux","text":"La DIRECTION GÉNÉRALE DES IVOIRIENS DE L'EXTÉRIEUR ( DGIE) et  CEPICI Officiel participeront demain à Diaspora, Mobilité et Retours 2 aux côtés d’entreprises, investisseurs, réseaux diaspora et talents engagés.\n\nDans un contexte où les enjeux de circulation des compétences, d’investissement diaspora et de souveraineté économique deviennent de plus en plus stratégiques, leur présence illustre l’importance croissante de ces sujets dans les dynamiques nationales.\n\nCette rencontre sera l’occasion d’échanger autour d’une question centrale :\ncomment transformer les dynamiques de la diaspora africaine en levier concret de développement économique, de transfert de compétences et de création d’opportunités ?\n\nAu programme : talk-show filmé, ateliers thématiques, retours d’expérience terrain, recommandations et networking.\n\n📅 Jeudi 21 mai 2026\n🕑 14h00 – 21h00\n📍 Byblos Hôtel, Abidjan","pid":"7463128964669026304","chars":885,"hashtags":0,"mentions":2,"link":false,"question":true,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-05-21","month":"2026-05","weekday":"Jeudi","hour":11,"reactions":11,"comments":0,"reposts":0,"eng":11,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_nous-sommes-ravis-dannoncer-la-participation-activity-7463191335542513664-n21U?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Nous sommes ravis d’annoncer la participation de NOFERIMA FOFANA à Diaspora, Mobilité et Retours 2, notre événement autour des enjeux de mobilité, de diaspora et d’impact économiqu","text":"Nous sommes ravis d’annoncer la participation de NOFERIMA FOFANA  à Diaspora, Mobilité et Retours 2, notre événement autour des enjeux de mobilité, de diaspora et d’impact économique en Côte d’Ivoire. \n\nSon rôle : apporter une dimension poétique et humaine à cette rencontre qui réunira décideurs, entreprises, investisseurs, réseaux diaspora et talents engagés autour de conversations essentielles pour l’avenir du continent.\n\nNoferima proposera une prestation artistique autour des questions d’identité, de retour, d’engagement et de transmission — des sujets profondément liés aux trajectoires de nombreux talents africains aujourd’hui.\n\n📅 Jeudi 21 mai 2026","pid":"7463191335542513664","chars":660,"hashtags":0,"mentions":1,"link":false,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-05-22","month":"2026-05","weekday":"Vendredi","hour":16,"reactions":31,"comments":0,"reposts":7,"eng":38,"media":"file","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_act-like-diaspora-connect-activity-7463623233599234049-66-a?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Ce soir, Diaspora Connect réunit à Abidjan nos talents issus de la deuxième cohorte avec plusieurs dirigeants, entrepreneurs et experts de l’écosystème ivoirien à l’occasion de ACT","text":"Ce soir, Diaspora Connect réunit à Abidjan nos talents issus de la deuxième cohorte avec plusieurs dirigeants, entrepreneurs et experts de l’écosystème ivoirien à l’occasion de ACT LIKE, un cocktail dînatoire privé sous format “speed table mentoring”.\n\nPensée comme un temps fort pour clôturer notre semaine d’immersion, cette soirée vise à créer des échanges directs, concrets et sans filtre autour :\n du retour,\n des carrières,\n de l’entrepreneuriat,\n du leadership,\n de l’innovation,\n et des réalités du terrain en Afrique.\n\nAu programme : discussions en petits groupes, retours d’expérience, networking et conversations honnêtes avec des profils qui construisent aujourd’hui l’écosystème local.\n\n🎤  Nos intervenants de la soirée :\nSarrah Coulibaly — Conseillère du Directeur Général, ANSUT\nPaul Régis Bessala — Directeur Général, NOVAGO Côte d’Ivoire\nFitzgerald Bony — Directeur Adjoint des Opérations B2B, Orange Côte d’Ivoire\nAlpha LY — Directeur Général, Palabres Consulting & Komian\nAlain Anzara — Entrepreneur & Coach, CEO Ivoir Trips International\nStephanie Kouassi — Consultante & Experte Marketing\nSophie Tall — Experte Healthtech & Fondatrice d’AMANII\nMaimouna Toure CISA, PMP — Vice-President Risk & Assurance, Endeavour Mining\n\nEn partenariat avec le Royal Work Club 🤝 \n#DiasporaConnect","pid":"7463623233599234049","chars":1301,"hashtags":1,"mentions":10,"link":false,"question":false,"lang":"FR","theme":"Cohorte & immersion"},{"date":"2026-05-28","month":"2026-05","weekday":"Jeudi","hour":15,"reactions":191,"comments":3,"reposts":3,"eng":197,"media":"img","url":"https://www.linkedin.com/posts/diaspora-connect-cotedivoire_jeudi-dernier-nous-avons-organis%C3%A9-la-seconde-activity-7465780124588773376-VHOY?utm_source=social_share_send&utm_medium=member_desktop_web&rcm=ACoAAAk79J0B846r8CapUm8iPKkrvMUeXYXiYE0","excerpt":"Jeudi dernier, nous avons organisé la seconde édition de l'événement Diaspora, Mobilité et Retours 🌍 Cette rencontre a été l’occasion de présenter nos résultats en présence des bén","text":"Jeudi dernier, nous avons organisé la seconde édition de l'événement Diaspora, Mobilité et Retours 🌍\n\nCette rencontre a été l’occasion de présenter nos résultats en présence des bénéficiaires des cohortes 1 et 2 : plus de 50 talents issus de la diaspora africaine en France, engagés aujourd’hui en Côte d’Ivoire à travers des stages, emplois et parcours entrepreneuriaux, avec une volonté commune : contribuer concrètement au développement du continent. 🇨🇮\n\nAu programme : talk-show, ateliers thématiques, retours d’expérience terrain, networking et discussions autour des enjeux de mobilité, de circulation des compétences et d’impact économique\n\nUn immense merci à Penda Sow, Mahamane Sow, Jean Yves Bragbo et Leslie Ossete pour la richesse de leurs échanges sur le talk-show co-produit avec Choose Your Mentor par Malick Diabaté 🎙️ \n\nMerci également à nos soutiens institutionnels l’Ambassade de France en Côte d’Ivoire, représentée par Mme Nathalie Dupont , a rappelé avec force le rôle stratégique de Diaspora Connect dans les dynamiques économiques de la Côte d'Ivoire 📈 ; le MTND représenté par Florence TAHIRI epse FADIKA ; la DIRECTION GÉNÉRALE DES IVOIRIENS DE L'EXTÉRIEUR ( DGIE) et le CEPICI Officiel.\n\nNous remercions également l’ensemble de nos participants, partenaires et communautés qui ont contribué à faire de cette édition un moment fort de dialogue et de co-construction, notamment :\nRéseau Ivoirien des Diplômés de la Diaspora (RIDD), HEC Paris in Africa , Abidjanaises In Tech, Women's Investment Club (WIC) Côte d'Ivoire , African Business Club et French Tech Abidjan 🙏🏾\n\nMerci enfin à Charm Matuba pour l’animation remarquable de cette rencontre en tant que MC 🎤\n\nEnfin, bravo à toute l’équipe Diaspora Connect — Longa Andrea MBUYAMBA, Ornella-Ashley Sangronio et Kirane Yassine — pour le travail accompli sur ces deux premières cohortes.\n\nCette édition avec +150 participants confirme une conviction forte : lorsque les bons mécanismes d’accompagnement existent, les talents africains répondent présents. Bravo à nos deux cohortes, ambassadeurs de ces résultats prometteurs pour la suite !\n\nMarwa Ahmed Aziz Yao Solange Amichia Kone Lanzeni Steve Essis Yannick Mekwegne Babel BALSOMI Lika DOUKOURE-SZAL Nanna Sylla-Coulibaly Sandra M. Mathias Léopoldie Sophia El Hajaj NOFERIMA FOFANA","pid":"7465780124588773376","chars":2310,"hashtags":0,"mentions":32,"link":false,"question":false,"lang":"FR","theme":"Événements & rencontres"},{"date":"2026-06-02","month":"2026-06","w
